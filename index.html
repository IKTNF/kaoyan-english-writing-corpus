 another pair stroll nearby, and one of them remarks, 'The new park at our doorstep is really nice.' The chart beside it records the number of parks in a certain city, which rose from 406 in 2020 to 532 in 2021 and 670 in 2022, up by more than sixty percent in three years.\n\nTo begin with, parks within walking distance lower the threshold of exercise, turning fitness from a costly gym membership into a daily pleasure. What is more, the steady growth in park numbers reflects both heavier government investment in public welfare and a philosophy that puts people's wellbeing first. Furthermore, green spaces ease urban stress and bring neighbours together, so they enrich community life while improving health.\n\nIn short, more parks and more joggers point to one trend: a city that cares for its residents' health. It is high time that more such facilities were planned and protected. Only by investing in public space can we build cities that keep their people fit and happy.","zh":"这幅漫画与旁边的柱状图共同指向了更绿、更健康的城市生活。画中，两名年轻人正沿着小路跑步，另有两名市民在附近散步，其中一人感慨道：“家门口新建的公园真不错。”旁边的柱状图记录了某城市公园的数量，从 2020 年的 406 个增至 2021 年的 532 个，2022 年进一步达到 670 个，三年间增长超过六成。\n\n首先，步行可达的公园降低了健身的门槛，把健身从昂贵的健身房年卡变成了日常的乐趣。其次，公园数量的稳步增长，既反映出政府在公共福利上更大的投入，也体现出一种把人民福祉放在首位的理念。此外，绿地能够缓解都市压力、拉近邻里距离，在改善健康的同时也丰富了社区生活。\n\n总之，更多的公园与更多的跑步者指向同一个趋势：一座关心市民健康的城市。我们早该规划和保护更多这样的公共设施。唯有加大对公共空间的投入，我们才能建成让市民健康快乐的城市。","outline":["首段先写公园里跑步散步的漫画场景，再列 406 至 670 走势","主体段分论公园降低健身门槛、政府投入与市民福祉","结尾段总结公园与锻炼同一趋势，呼吁加大公共空间投入"],"words":193,"paras":3}},{"year":2025,"chartType":"图表","titleZh":"居民耐用消费品拥有量变化","topicEn":"Rising Ownership of Durable Consumer Goods","pictureZh":"图表（表格）作文。表格标题为“近年来全国居民平均每百户年末主要耐用消费品拥有量”，列为年份 2014、2017、2020、2023，行为三类家电：空调（台）75.2→96.1→117.7→145.9、洗衣机（台）83.7→91.7→96.7→98.2、电冰箱（台）85.5→93.3→101.8→103.4。三类耐用消费品拥有量十年间均持续上升，其中空调增幅最大；反映居民生活水平与购买力提高。","captions":["近年来全国居民平均每百户年末主要耐用消费品拥有量","空调（台）","洗衣机（台）","电冰箱（台）"],"directionsZh":"基于下面的表格写一篇 160–200 词的短文：1) 简要描述表格；2) 阐释表格（含义/原因）；3) 给出你的评论。写在 ANSWER SHEET 上。","sections":["describe","career","argue"],"tip":"英语一重新回到图表题：首段必须交代数据走势，主体段解释「为什么涨」，结尾段升华到生活水平提升与理性消费。","confidence":"high","note":"","sources":["http://m.tianrenedu.com.cn/bkzl/23604.html","https://noobdream.com/post/408781/","https://jixun.iqihang.com/info/yyzd/2026767902.html"],"model":{"en":"The table presents the average ownership of major durable consumer goods per hundred households nationwide. Between 2014 and 2023, the number of air conditioners climbed sharply from 75.2 to 145.9, nearly doubling; washing machines rose modestly from 83.7 to 98.2, and refrigerators from 85.5 to 103.4. What the figures reveal is unmistakable: all three categories have kept rising, with air conditioners growing fastest, which signals a steady improvement in Chinese families' living standards.\n\nTo begin with, rising household income is the direct driving force behind this trend, for families naturally spend part of their growing earnings on comfort and convenience. What is more, industrial upgrading and fierce market competition have driven prices down while quality has improved, placing once luxurious appliances within ordinary families' reach. Furthermore, such appliances free people, especially women, from heavy housework, thereby improving the quality of daily life.\n\nIn short, the table mirrors a decade of economic progress written into ordinary homes. It is high time that we carried this prosperity further, ensuring that rural families and low-income groups enjoy the same comforts. Only by pursuing shared development can we turn statistics into genuine wellbeing.","zh":"表格呈现的是近年来全国居民平均每百户年末主要耐用消费品的拥有量。2014 年至 2023 年间，空调拥有量从 75.2 台大幅攀升至 145.9 台，几乎翻了一番；洗衣机从 83.7 台温和上升至 98.2 台；电冰箱从 85.5 台增至 103.4 台。数据揭示的趋势十分清楚：三类耐用消费品拥有量持续上升，其中空调增幅最大，表明中国家庭的生活水平稳步提高。\n\n首先，居民收入的增长是这一趋势的直接推动力，人们自然会从不断增加的收入中拿出一部分用于追求舒适与便利。其次，产业升级与激烈的市场竞争使价格下降而质量提升，让曾经昂贵的家电走进了普通家庭。此外，这些家电把人们尤其是女性从繁重的家务中解放出来，从而提升了日常生活质量。\n\n总之，这张表格映射出十年来经济发展写进普通家庭的成果。我们早该把这份富足继续推进，让农村家庭和低收入群体也能享有同样的便利。唯有坚持共享发展，我们才能把统计数字变成实实在在的幸福感。","outline":["首段描述表格三类家电十年间的数据变化，点出空调增幅最大","主体段分论收入提高、产业升级降价、家电解放家务劳动","结尾段总结生活水平提升，呼吁农村与低收入群体共享成果"],"words":189,"paras":3}}],"notes":["命题规律：近 28 年英语一大作文高度集中在五大话题族——① 个人品质与成功素养（2004/2007/2008/2012/2017/2019/2020）② 文化传承与交流（2002/2010/2021/2023）③ 科技与媒介（2009/2015）④ 社会公德与家庭伦理（1998/2001/2003/2005/2006/2011/2014/2016）⑤ 学习与青年选择（2013/2018/2022）。把这五族的语料背熟，基本可以覆盖任意新题。","题型分布：1998—2025 共 28 年，仅 1999 年是真正的图表题，其余全为图画/照片；2002 与 2006 是照片类（picture/photograph），写法与漫画一致。2025 年重回图表题（居民耐用消费品拥有量变化），因此图表描述句必须一起准备。","分值演变：1998—2000 年不少于 150 词、15 分；2001—2004 年约 200 词、20 分；2005 年起增加 Part A 小作文，大作文降为 160—200 词、20 分。现在一律按 160—200 词练。","首段写法固定：描述画面（含图上文字）→ 点出寓意。主体段两到三点理由。结尾段总结 + 建议/呼吁。任何题目都能套这三步。"]},"partA":{"title":"小作文真题索引","subtitle":"Part A · 应用文 约 100 词 · 2005—2025","emoji":"✉️","years":[{"year":2005,"type":"其他","recipient":"上司王先生（Mr. Wang，你任职杂志社的老板）","taskZh":"两个月前你得到《Designs & Fashions》杂志编辑一职，如今发现工作与预期不符，决定辞职。写信给老板王先生，告知辞职决定、说明理由并致歉。","points":["告知辞职的决定","说明辞职的理由","为自己辞职表示歉意"],"directionsEn":"51. Directions: Two months ago you got a job as an editor for the magazine Designs & Fashions. But now you find that the work is not what you expected. You decide to quit. Write a letter to your boss, Mr. Wang, telling him your decision, stating your reason(s), and making an apology. Write your letter with no less than 100 words. Write it neatly on ANSWER SHEET 2. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-apply"],"tip":"辞职信。三段：说明去意 → 给出理由 → 致歉并祝愿。语气要体面，切勿抱怨。","confidence":"high","note":"题型为辞职信（Letter of resignation），不在给定词表中，故归入「其他」；Directions 同时要求道歉，故部分资料也把它描述为「辞职信＋道歉信」。三个来源的英文原文基本一致，仅个别来源把 work 误写成 word。","sources":["https://mtoutiao.xdf.cn/kaoyan/201512/10382574.html","http://m.offcn.com/kaoyan/2016/0930/66848.html","https://yz.chsi.com.cn/kyzx/en/201312/20131218/689327552.html"],"model":{"en":"Dear Mr. Wang,\n\nI am writing to inform you of my decision to resign from my position as an editor of Designs & Fashions, which I took up two months ago.\n\nMuch as I appreciate the opportunity you offered me, the job has turned out to be quite different from what I had anticipated. My daily routine consists largely of routine proofreading, whereas I had hoped to be involved in feature writing and creative planning. As a result, I find it hard to bring my strengths into full play.\n\nI am truly sorry for any inconvenience my departure may cause, and I will gladly stay on until a replacement is found.\n\nYours sincerely,\nLi Ming","zh":"尊敬的王先生：\n\n我写信是为了告知您，我决定辞去两个月前接任的《Designs & Fashions》杂志编辑一职。\n\n尽管我非常感激您给予我的机会，但这份工作与我原先设想的大不相同。我的日常工作主要是例行校对，而我本希望参与专题写作与创意策划。因此，我发现自己难以充分发挥所长。\n\n对于我的离职可能给您带来的任何不便，我深表歉意；在找到接替者之前，我很乐意继续留任。\n\n您诚挚的，\n李明","outline":["首段：开门见山告知辞职决定，点明入职仅两月","主体：说明工作与预期不符，用 whereas 形成对比","补充：用分词短语展开日常工作内容与个人期待","结尾：为不便致歉并主动提出留任至接手者到岗"],"words":115,"paras":5}},{"year":2006,"type":"其他","recipient":"希望工程相关部门（the department concerned，不知具体收信人，通用称呼 To Whom It May Concern）","taskZh":"你想通过希望工程资助一名偏远地区的儿童，写信给相关部门请其帮助寻找合适人选，并说明你想资助什么样的孩子以及打算如何实施资助计划。","points":["说明写信目的：请对方帮助寻找一名可资助的孩子","说明希望资助的孩子类型（如贫困地区、成绩优异者）","说明将如何实施资助计划"],"directionsEn":"51. Directions: You want to contribute to Project Hope by offering financial aid to a child in a remote area. Write a letter to the department concerned, asking them to help find a candidate. You should specify what kind of child you want to help and how you will carry out your plan. Write your letter with no less than 100 words. Write it on ANSWER SHEET 2. Do not sign your name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-apply"],"tip":"申请/求助信。说清\"请求什么\"+\"资助哪类孩子\"+\"如何落实\"，条理是拿分点。","confidence":"high","note":"题型为申请信／请求信（Letter of application），不在给定词表中（词表只有「求职信」「咨询信」，均不等同），故归入「其他」。","sources":["https://mtoutiao.xdf.cn/kaoyan/201512/10382573.html","https://www.offcn.com/kaoyan/2016/1116/69421.html","https://yz.chsi.com.cn/kyzx/en/201312/20131218/689327552.html"],"model":{"en":"Dear Sir or Madam,\n\nI am writing to ask for your assistance in finding a child whom I can support through Project Hope.\n\nIdeally, the candidate should come from a remote mountainous area where schooling is beyond many families' reach. A primary school pupil who is diligent and eager to learn would suit me best, since a modest sum can make a lasting difference at that age. Once you have selected such a child, I intend to send 3,000 yuan annually to cover tuition and textbooks until he or she finishes secondary school. I would also welcome photographs and progress reports, so that we may keep in touch by letter.\n\nI should be grateful for an early reply.\n\nYours faithfully,\nLi Ming","zh":"尊敬的先生/女士：\n\n我写信是想请您帮助我寻找一名可以通过希望工程资助的孩子。\n\n理想的人选最好来自偏远山区，那里的许多家庭难以负担学费。一位勤奋好学的小学生最适合我，因为在这个年纪，一笔不大的资助就能带来长久的改变。一旦您确定了人选，我打算每年寄出三千元，用于支付学费和书本费，直到他（她）读完中学。我也希望能收到照片和学习情况汇报，以便我们保持通信。\n\n若您能早日回复，我将十分感激。\n\n您诚挚的，\n李明","outline":["首段：表明写信目的是请对方帮忙寻找资助对象","主体一：说明希望资助的孩子类型——偏远山区、小学、好学","主体二：说明资助方式，每年汇款并保持书信联系","结尾：用 I should be grateful for... 礼貌请求早日回复"],"words":122,"paras":5}},{"year":2007,"type":"建议信","recipient":"所在大学的图书馆（your university library，收信人姓名不详，用 Dear Sir or Madam / To Whom It May Concern）","taskZh":"给你所在大学的图书馆写信，就如何改进图书馆的服务提出建议，具体建议内容可自由发挥。","points":["开门见山说明写信目的是改进图书馆服务","提出 2-3 条具体的改进建议（如设咨询台、提供最新外文期刊、维持阅览室秩序）","语气委婉，表达希望建议被采纳并期待回复"],"directionsEn":"51. Directions: Write a letter to your university library, making suggestions for improving its service. You should write about 100 words on ANSWER SHEET 2. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"建议信。开篇表明身份与目的，主体 2 条建议要具体可操作，结尾表达感谢与期待。","confidence":"high","note":"","sources":["https://yz.chsi.com.cn/kyzx/jyxd/200701/20070124/748814.html","https://m.hujiang.com/kr/p16359/","https://yz.chsi.com.cn/kyzx/en/201312/20131218/689327552.html"],"model":{"en":"Dear Sir or Madam,\n\nI am a junior student and a frequent visitor to our university library. I am writing to suggest a few ways in which its service might be further improved.\n\nTo begin with, it would be advisable to set up an information desk near the entrance, where students could obtain guidance on locating materials. Another suggestion is that the library subscribe to more up-to-date foreign journals, for many of us rely on them when preparing papers. It would also help if reading-room order could be better maintained during examination weeks.\n\nI hope these proposals will be taken into consideration.\n\nYours faithfully,\nLi Ming","zh":"尊敬的先生/女士：\n\n我是本校一名大三学生，也是图书馆的常客。我写信是想就如何进一步改进图书馆的服务提出几点建议。\n\n首先，建议在入口附近设立咨询台，让学生能够就查找资料得到指导。其次，图书馆宜增订更多最新的外文期刊，我们许多人在写论文时十分依赖它们。此外，若能在考试周更好地维持阅览室秩序，也会很有帮助。\n\n希望这些建议能得到认真考虑。\n\n您诚挚的，\n李明","outline":["首段：自我介绍并点明来信目的是改进图书馆服务","主体：用 it would be advisable 引出设立咨询台的建议","主体：用 Another suggestion is that 引出增订外文期刊","结尾：以委婉语气表达希望建议被采纳"],"words":106,"paras":5}},{"year":2008,"type":"道歉信","recipient":"加拿大的房东 Bob（your landlord there，私人信件）","taskZh":"你刚从加拿大回国，发现行李里有一张忘记归还给加拿大房东 Bob 的音乐 CD。写信给他表示道歉，并提出解决办法。","points":["为忘记归还 CD 表示真诚道歉","提出解决办法（如用快递把 CD 寄回）"],"directionsEn":"Part A 51. Directions: You have just come back from Canada and found a music CD in your luggage that you forgot to return to Bob, your landlord there. Write him a letter to 1) make an apology, and 2) suggest a solution. You should write about 100 words on ANSWER SHEET 2. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-apply"],"tip":"道歉信。先致歉 → 解释原因（不找借口）→ 主动提出补救方案，这是关键得分点。","confidence":"high","note":"题目两条要点为「道歉」＋「提出解决办法」，因此部分资料把它描述为道歉信与建议信的结合；主流归类为道歉信。各来源仅在 forgot/forget 等个别词上有转录差异。","sources":["https://yz.chsi.com.cn/kyzx/en/200812/20081203/11330003.html","https://m.hujiang.com/en/p30983/","https://yz.chsi.com.cn/kyzx/en/201312/20131218/689327552.html"],"model":{"en":"Dear Bob,\n\nI hope this letter finds you well. I am writing to offer my sincere apologies for something I discovered only after returning home.\n\nWhile unpacking my luggage, I came across the music CD you lent me last winter. In the rush of packing and saying goodbye, I completely forgot to return it, and I feel terribly embarrassed about my carelessness.\n\nMay I post it back to you by express delivery this week? If that is inconvenient, I could instead buy you a new copy of the same album, or keep it until my next visit. Please let me know which you would prefer.\n\nYours sincerely,\nLi Ming","zh":"亲爱的鲍勃：\n\n希望你一切都好。我写信是想为一件回国后才发现的疏忽致以诚挚的歉意。\n\n在整理行李时，我翻出了去年冬天你借给我的那张音乐 CD。当时忙着收拾行李、匆匆道别，我完全忘了归还，对自己的粗心深感惭愧。\n\n我能否本周用快递把它寄还给你？如果不方便，也可以买一张同一专辑的新碟给你，或者留到我下次来访时归还。请告诉我你更愿意采用哪种方式。\n\n您诚挚的，\n李明","outline":["首段：为忘记归还 CD 致以诚挚歉意，说明发现时间","主体：用 While unpacking 分词状语交代发现 CD 的经过","结尾：提出快递寄回等两种补救办法并请对方选择"],"words":109,"paras":5}},{"year":2009,"type":"建议信","recipient":"当地报纸的编辑（the editor(s) of your local newspaper）","taskZh":"限塑令在部分地区实施效果不佳，「白色污染」仍在继续。给当地报纸编辑写信，简要阐明你对这一问题的看法，并提出两到三条建议。","points":["简要阐明自己对「白色污染」问题的看法／观点","提出 2-3 条具体建议（如政府加强监管、推广布袋、对塑料袋收费）"],"directionsEn":"51. Directions: Restrictions on the use of plastic bags have not been so successful in some regions. \"White pollution\" is still going on. Write a letter to the editor(s) of your local newspaper to 1) give your opinions briefly and 2) make two or three suggestions. You should write about 100 words. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. You do not need to write the address.","sections":["letter-general","letter-advice"],"tip":"建议信（给编辑）。先简要表态限塑效果不佳，再给 2-3 条建议，注意面向公众的措辞。","confidence":"high","note":"该题参考 2008 年 12 月四级作文「Limiting the Use of Disposable Plastic Bags」（多份辅导资料指出此关联）。","sources":["https://m.koolearn.com/kaoyan/20140709/822968.html","https://yz.chsi.com.cn/kyzx/other/200901/20090119/16727092.html","https://yz.chsi.com.cn/kyzx/en/201312/20131218/689327552.html"],"model":{"en":"Dear Editor,\n\nI am writing to express my concern about the disappointing results of the restrictions on plastic bags in our region, where \"white pollution\" continues unabated.\n\nIn my view, the problem lies less in the policy itself than in its enforcement, and ordinary consumers will not change their habits unless convenient alternatives are available. Therefore I would suggest that the authorities tighten supervision over retailers and impose a modest charge on every plastic bag. At the same time, reusable cloth bags could be distributed free of charge in supermarkets and residential communities.\n\nI hope these suggestions may be of some use.\n\nYours faithfully,\nLi Ming","zh":"尊敬的编辑：\n\n我写信是想表达我对本地区限塑令实施效果不佳的担忧——这里的“白色污染”仍在继续。\n\n在我看来，问题与其说出在政策本身，不如说出在执法环节；如果消费者得不到便利的替代品，他们是不会改变习惯的。因此我建议有关方面加强对商家的监管，并对每个塑料袋收取少量费用。与此同时，可以在超市和居民社区免费发放可重复使用的布袋。\n\n希望这些建议能有所裨益。\n\n您诚挚的，\n李明","outline":["首段：表明对限塑令收效不佳的担忧，点出问题","主体：指出症结在于执法不力，用 unless 句推进论点","主体：提出加强监管收费与免费发放布袋等两条建议","结尾：用一句简洁祝愿式收尾，语气礼貌克制"],"words":106,"paras":5}},{"year":2010,"type":"通知","recipient":"全体研究生（以研究生会 the postgraduate association 名义发布的公开告示，无具体收信人）","taskZh":"以研究生会的名义写一则通知，为即将举办的全球化国际会议招募志愿者，内容须包括申请者的基本资格条件以及你认为相关的其他信息。","points":["说明招募缘由：为全球化国际会议招募志愿者","列明申请者的基本资格／条件（国籍、年龄、语言能力、个人品质等）","补充其他相关信息（报名方式、截止时间、联系人等）"],"directionsEn":"Part A 51. Directions: You are supposed to write for the postgraduate association a notice to recruit volunteers for an international conference on globalization. The notice should include the basic qualification for applicants and the other information which you think is relevant. You should write about 100 words on ANSWER SHEET 2. Do not sign your own name at the end of the notice. Use \"postgraduate association\" instead. (10 points)","sections":["letter-general","notice"],"tip":"通知（研究生会署名）。标题居中大写，正文写清岗位、条件与报名方式，落款是组织不是个人。","confidence":"high","note":"属告示类应用文（notice），中文资料或译作「通知」，或译作「告示」，两者指同一题型，本表统一记为「通知」。注意署名规定为 postgraduate association，而非 Li Ming；该题参考 2006 年 6 月四级写作真题（招募志愿者海报）。","sources":["https://yz.chsi.com.cn/kyzx/en/201001/20100111/61433290.html","https://yz.chsi.com.cn/kyzx/en/201001/20100111/61414662-7.html","https://yz.chsi.com.cn/kyzx/en/201312/20131218/689327552.html"],"model":{"en":"NOTICE\n\nVolunteers are wanted for the International Conference on Globalization, to be held in our university from 15 to 18 May. The Postgraduate Association is now recruiting twenty student volunteers to assist with reception, registration and interpretation.\n\nApplicants should be Chinese citizens aged between eighteen and twenty-five, with a good command of English. Fluency in a second foreign language and previous experience at similar events would be an advantage. Above all, we expect patience, responsibility and a genuine willingness to help.\n\nThose interested are invited to download the application form from our website and send it to volunteer@university.edu.cn before 30 April. Shortlisted candidates will be interviewed on 5 May. Further inquiries are welcome at the same address.\n\nThe Postgraduate Association","zh":"通知\n\n我校将于 5 月 15 日至 18 日举办全球化国际会议，现招募志愿者。研究生会拟招募二十名学生志愿者，协助接待、注册与口译工作。\n\n申请者应为中国公民，年龄在十八至二十五岁之间，英语水平良好。若能流利使用第二外语或有类似活动经验者优先。最重要的是，我们希望申请者耐心、负责，并且真心乐于助人。\n\n有意者请从我们的网站下载报名表，并于 4 月 30 日前发送至 volunteer@university.edu.cn。入围者将于 5 月 5 日参加面试。如需进一步咨询，欢迎通过同一邮箱联系。\n\n研究生会","outline":["标题：居中大写 NOTICE，正文首句说明招募缘由","主体：分条列出资质要求，含国籍、年龄与英语能力","主体：补充个人品质要求，用 Above all 强调重点","结尾：给出报名方式、邮箱、截止日期，落款研究生会"],"words":120,"paras":5}},{"year":2011,"type":"推荐信","recipient":"你的一位朋友（a friend of yours，私人信件）","taskZh":"给你的一位朋友写信，推荐一部你最喜欢的电影，并说明推荐理由。属私人信件，语气可稍随意。","points":["推荐一部自己最喜欢的电影","说明推荐这部电影的理由（剧情、特效、导演、演员等）"],"directionsEn":"51. Directions: Write a letter to a friend of yours to 1) recommend one of your favorite movies and 2) give reasons for your recommendation. You should write about 100 words on ANSWER SHEET 2. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"推荐信。推荐电影 + 给理由；理由分两层（剧情/主题/观感），避免只说\"很好看\"。","confidence":"high","note":"学信网（跨考教育）那份「八年真题汇总」把 2011 年的 Directions 原文复制到了 2012 年条目下，属该来源的编辑错误；2011 年本身的内容由新东方、沪江（跨考版）两个独立来源确认。","sources":["https://mtoutiao.xdf.cn/kaoyan/201512/10382581.html","https://m.hujiang.com/en_xiazai/p136958/","https://yz.chsi.com.cn/kyzx/en/201312/20131218/689327552.html"],"model":{"en":"Dear Jack,\n\nI hear you have been looking for something to watch at the weekend, so I would like to recommend my all-time favourite film, The Pursuit of Happyness.\n\nIt tells the story of a struggling salesman who raises his young son alone while chasing an unpaid internship. What moves me most is its quiet optimism: there are no spectacular effects, yet every setback feels real and every small victory earns its tears. Will Smith gives the performance of his career, and the director keeps the whole film warm and restrained rather than sentimental.\n\nI am sure you will finish it with a lighter heart. Do let me know what you think.\n\nYours sincerely,\nLi Ming","zh":"亲爱的杰克：\n\n听说你一直在找周末可看的片子，所以我想推荐我最喜欢的一部电影——《当幸福来敲门》。\n\n影片讲述一位生活拮据的推销员独自抚养幼子，同时争取一份没有报酬的实习机会。最打动我的是它平静的乐观：没有炫目的特效，可每一次挫折都真实可感，每一个小小的胜利都令人落泪。威尔·史密斯贡献了他职业生涯中最好的表演，导演让整部影片温暖而克制，而不流于煽情。\n\n我相信你看完后心情会轻松起来。请一定告诉我你的感受。\n\n您诚挚的，\n李明","outline":["首段：先说听说对方在找片，自然引出所推荐的电影","主体：用 What moves me most is... 强调句说明推荐理由","主体：补充演员表演与导演手法，说明克制而不煽情","结尾：以私人语气邀请对方反馈，关系亲近自然"],"words":116,"paras":5}},{"year":2012,"type":"建议信","recipient":"即将来校的留学生（some international students），以学生会（Students' Union）名义发出","taskZh":"一些留学生即将来你校学习，以学生会名义给他们写一封电子邮件表示欢迎，并就他们在校的校园生活提出一些建议。","points":["向来校的留学生表示热烈欢迎","就他们在校的校园生活提出建议（如学好中文、参加课外活动等）"],"directionsEn":"51. Directions: Some international students are coming to your university. Write them an email in the name of the Students' Union to 1) extend your welcome and 2) provide some suggestions for their campus life here. You should write about 100 words on ANSWER SHEET 2. Do not sign your name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"欢迎 + 建议信（学生会署名）。先表示欢迎，再给校园生活建议；注意署名是 Students' Union。","confidence":"high","note":"该题兼有「欢迎信」性质（要点一为表示欢迎），但国内主流辅导资料（跨考教育、中公考研、新东方在线等）统一归类为建议信，故按建议信记录。","sources":["https://mtoutiao.xdf.cn/kaoyan/201512/10382794.html","http://m.offcn.com/kaoyan/2016/1201/70556.html","http://news.cntv.cn/20120109/119851.shtml"],"model":{"en":"Dear friends,\n\nOn behalf of the Students' Union, I am writing to extend a warm welcome to all of you who are about to study at our university. We are delighted to have you with us.\n\nTo help you settle in, may I offer a few suggestions? First, do try to learn some Chinese, as it will make daily shopping and chatting far easier. Second, join at least one club or sports team; that is the quickest way to make friends and practise the language. Finally, do not hesitate to turn to us whenever you meet difficulties, whether with accommodation or with study.\n\nWe look forward to meeting you soon.\n\nYours sincerely,\nLi Ming","zh":"亲爱的朋友们：\n\n我谨代表学生会，向即将来我校学习的各位致以热烈的欢迎。你们的到来让我们非常高兴。\n\n为帮助大家尽快适应，请允许我提几点建议。第一，一定要学一些中文，这会让日常购物和聊天方便得多。第二，至少加入一个社团或运动队，这是结交朋友、练习语言最快的方式。最后，遇到困难时，无论是住宿还是学习方面，都请不要犹豫来找我们。\n\n期待与大家早日相见。\n\n您诚挚的，\n李明","outline":["首段：用 On behalf of... 代表学生会向留学生致欢迎","主体：以 may I offer a few suggestions 引出建议","主体：用 First / Second / Finally 逐条给出生活建议","结尾：表达期待见面之意，落款 Li Ming"],"words":114,"paras":5}},{"year":2013,"type":"邀请信","recipient":"你所在学院的一位外教（a foreign teacher in your college）","taskZh":"给你学院的一位外教写一封约 100 词的电子邮件，邀请他/她担任即将举行的英语演讲比赛的评委，并补充你认为必要的细节。","points":["说明写信目的：邀请外教担任英语演讲比赛评委","补充必要细节（比赛时间、地点、参赛者情况、其他评委等）","表达感谢与期待，并提供联系方式"],"directionsEn":"51. Directions: Write an e-mail of about 100 words to a foreign teacher in your college, inviting him/her to be a judge for the upcoming English speech contest. You should include the details you think necessary. You should write neatly on the ANSWER SHEET. Do not sign your own name at the end of the e-mail. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"邀请信。写明活动名称、时间、地点、身份，并礼貌请对方确认出席。","confidence":"high","note":"","sources":["https://mtoutiao.xdf.cn/kaoyan/201512/10382805.html","http://www.offcn.com/kaoyan/2016/1201/70557.html","http://m.offcn.com/kaoyan/2016/0131/47747.html"],"model":{"en":"Dear Professor Smith,\n\nOn behalf of the English Department, I am writing to invite you to serve as a judge for the forthcoming English Speech Contest, which will take place in the Lecture Hall on Saturday, 20 April, from two to five in the afternoon.\n\nTwelve contestants, all second-year students, will speak for five minutes each on the theme \"Youth and Responsibility\". Two other teachers have already agreed to join the panel, so the task should prove neither heavy nor time-consuming. We would be most grateful if you could also offer a brief comment at the closing ceremony.\n\nPlease let me know your decision at 138-0000-0000 by 10 April.\n\nYours sincerely,\nLi Ming","zh":"尊敬的史密斯教授：\n\n我谨代表英语系，邀请您担任即将举行的英语演讲比赛的评委。比赛将于 4 月 20 日（星期六）下午两点至五点在报告厅举行。\n\n十二名选手均为二年级学生，每人将围绕“青年与责任”这一主题演讲五分钟。已有另外两位老师同意担任评委，因此这项工作既不会太繁重，也不会太耗时。若您还能在闭幕环节作简短的点评，我们将不胜感激。\n\n请在 4 月 10 日前拨打 138-0000-0000 告知您的决定。\n\n您诚挚的，\n李明","outline":["首段：说明来意，邀请外教担任英语演讲比赛评委","主体：交代时间、地点、选手人数与主题等必要细节","主体：说明已有两位评委，并用虚拟语气恳请其致辞","结尾：请对方尽早答复并留下联系电话"],"words":113,"paras":5}},{"year":2014,"type":"建议信","recipient":"你所在大学的校长（the president of your university）","taskZh":"给你所在大学的校长写一封约 100 词的信，就如何改善学生们的身体状况提出建议，并包含你认为必要的细节。","points":["就如何改善学生们的身体状况提出建议（如加强体育锻炼、均衡饮食、规律作息）","补充必要的细节／说明理由，语气正式客气"],"directionsEn":"Part A 51. Directions: Write a letter of about 100 words to the president of your university, suggesting how to improve students' physical condition. You should include the details you think necessary. You should write neatly on the ANSWER SHEET. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"建议信（给校长）。语气正式得体，建议要宏观（体育设施、锻炼氛围），不要写成抱怨信。","confidence":"high","note":"国内辅导资料统计：建议信在英语（一）小作文中共考过四次，分别是 2007、2009、2012、2014 年。","sources":["https://kaoyan.koolearn.com/20140211/806817.html","http://www.offcn.com/kaoyan/2016/1201/70558.html","http://www.offcn.com/kaoyan/2016/1121/69819.html"],"model":{"en":"Dear Mr. President,\n\nI am writing on behalf of many fellow students to suggest how students' physical condition might be improved on our campus.\n\nRecent years have seen a worrying decline in fitness: long hours in the library and irregular meals have left quite a few classmates short of breath after a single flight of stairs. It would therefore be advisable to extend the opening hours of the gymnasium and organise weekly jogging or ball games in the East Stadium. Another suggestion is that the canteens offer more low-fat dishes at reasonable prices, since diet matters as much as exercise.\n\nThank you for your time and consideration.\n\nYours sincerely,\nLi Ming","zh":"尊敬的校长：\n\n我谨代表许多同学写信，就如何改善我校学生的身体状况提出建议。\n\n近年来同学们的体质令人担忧地下降：长时间待在图书馆、饮食不规律，使不少同学爬一层楼梯就气喘吁吁。因此，建议延长体育馆的开放时间，并在东操场组织每周的慢跑或球类活动。另一条建议是，食堂应以合理的价格提供更多低脂菜品，因为饮食与锻炼同样重要。\n\n感谢您拨冗考虑。\n\n您诚挚的，\n李明","outline":["首段：代表同学致意，点明改善学生体质这一目的","主体：先摆出体质下降的现象，再提锻炼类建议","主体：用 Another suggestion is that 提食堂与饮食建议","结尾：以感谢语收束，语气正式谦逊"],"words":111,"paras":5}},{"year":2015,"type":"推荐信","recipient":"读书俱乐部的成员（the club members，一对多，称呼用 Dear friends）","taskZh":"你将在读书俱乐部举办一次读书会，给俱乐部成员写一封约 100 词的电子邮件，推荐一本书，并说明推荐理由。","points":["推荐一本书（须给出书名）","说明推荐这本书的理由"],"directionsEn":"Part A 51. Directions: You are going to hold a club reading session. Write an email of about 100 words recommending a book to the club members. You should state reasons for your recommendation. You should write neatly on the ANSWER SHEET. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"推荐信（读书会）。推荐一本书 + 理由；与 2011 推荐电影是同一套句式，可一起背。","confidence":"high","note":"与 2011 年「向朋友推荐一部电影」高度相似，只是把电影换成书（文都教育明确称二者「异曲同工」）。文都、中公两个独立来源均确认为推荐信；上述英文为各来源转录文本，个别版本存在大小写／拼写差异（如把 ANSWER SHEET 误写作 ANWSER SHEET），实质内容一致。","sources":["http://www.offcn.com/kaoyan/2016/1201/70562.html","https://yz.chsi.com.cn/kyzx/en/201412/20141229/1419335105.html","https://m.hujiang.com/kr/p713129/","http://yingyu.xdf.cn/201509/10345657.html"],"model":{"en":"Dear friends,\n\nAs the reading session is drawing near, I would like to recommend a book for our discussion: The Old Man and the Sea by Ernest Hemingway.\n\nIt is short enough to be read in two evenings, yet it leaves a deep impression. Hemingway writes about an old fisherman who battles a giant marlin far out at sea, and about the dignity with which he endures defeat. The language is remarkably plain, almost like the speech of a fisherman, but every sentence carries weight. Few novels say so much about courage and perseverance in so few pages, which makes this one ideal for a club discussion.\n\nI hope you will enjoy it as much as I did.\n\nYours sincerely,\nLi Ming","zh":"亲爱的朋友们：\n\n读书会临近，我想为我们的讨论推荐一本书：海明威的《老人与海》。\n\n它篇幅很短，两个晚上就能读完，却给人留下深刻印象。海明威写一位在远海与大马林鱼搏斗的老渔夫，也写他在失败面前所保持的尊严。语言极为朴素，几乎像渔夫说话，但每一句都很有分量。很少有小说能在如此短的篇幅里讲述如此多关于勇气与坚韧的内容，因此它非常适合我们在俱乐部里讨论。\n\n希望你们和我一样喜欢它。\n\n您诚挚的，\n李明","outline":["首段：交代读书会临近，点出推荐书目《老人与海》","主体：用 yet 转折说明篇幅虽短而印象颇深","主体：概括情节并称赞海明威朴素有力的语言风格","结尾：用 as much as I did 表达希望对方同样喜欢"],"words":122,"paras":5}},{"year":2016,"type":"通知","recipient":"新入学的留学生（全体国际新生）","taskZh":"以本校图书馆员身份写一则约100词的通知，面向新入学的留学生，表示欢迎并告知图书馆的相关信息（如开放时间、借阅方式等），须符合通知格式。","points":["以图书馆员名义向新入学的留学生发布通知","对留学生表示欢迎","提供图书馆的相关信息（开放时间、借阅规则等）"],"directionsEn":"Suppose you are a librarian in your university. Write a notice of about 100 words, providing the newly-enrolled international students with relevant information about the library. You should write neatly on the ANSWER SHEET. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","notice"],"tip":"通知（图书馆员署名）。欢迎新生 + 告知开放时间、借阅规则；注意通知不用书信称呼语。","confidence":"high","note":"","sources":["https://mtoutiao.xdf.cn/kaoyan/201512/10395986.html","https://www.kyzs.com/article/14062.html"],"model":{"en":"NOTICE\n\nTo all newly-enrolled international students, welcome to our university! As a librarian here, I would like to introduce you to the University Library, which will serve as your second classroom in the coming years.\n\nThe main library opens from 8:00 a.m. to 10:00 p.m. on weekdays and from 9:00 a.m. to 5:00 p.m. at weekends. With your student card, you may borrow up to ten books at a time for one month. Kindly note that reference works and current journals are for reading on the spot only. Should you need any assistance in locating materials, feel free to turn to the information desk on the first floor.\n\nWe look forward to seeing you here.\n\nThe University Library\nLi Ming","zh":"通知\n\n各位新入学的留学生，欢迎来到我校！作为本校图书馆员，我想向你们介绍大学图书馆，它将在未来几年成为你们的第二课堂。\n\n主馆开放时间为周一至周五上午8:00至晚上10:00，周末为上午9:00至下午5:00。凭学生卡一次可借阅十本书，借期一个月。请注意，工具书与现刊仅供馆内阅览。若查找资料需要帮助，请随时到一楼咨询台求助。\n\n期待在此与你相见。\n\n校图书馆\nLi Ming","outline":["居中大写标题 NOTICE，正文首句直接向全体新入学留学生致欢迎","以 As a librarian 表明身份，说明写信目的是介绍图书馆","用具体时间与借阅数量说明开放时间、借阅规则及阅览限制","以 Should you need 倒装句提供求助途径，落款署图书馆与 Li Ming"],"words":120,"paras":5}},{"year":2017,"type":"推荐信","recipient":"新到本校的外籍教授 James Cook","taskZh":"给新来的外籍教授 James Cook 写一封约100词的电子邮件，向他推荐你所在城市的一处旅游景点，并说明推荐的理由。","points":["向 James Cook 推荐本市的一处旅游景点","说明推荐该景点的理由"],"directionsEn":"Write an email to James Cook 1) recommend one of the tourist attractions in your city 2) give reasons for your recommendation. You should write about 100 words on ANSWER SHEET. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"推荐信（给外籍教授）。推荐本地景点 + 理由；注意用 email 形式但仍要正式礼貌。","confidence":"high","note":"题目内容（向新来的外籍教授 James Cook 推荐本地旅游景点并说明理由）由两个独立来源一致确认；directionsEn 取自新东方网标注为「考生回忆」的版本，个别措辞（如是否含 Suppose you are... 开头的设定句）与官方原文可能有细微出入。","sources":["https://mtoutiao.xdf.cn/kaoyan/201612/10592153.html","https://mtoutiao.xdf.cn/kaoyan/201612/10592145.html","https://www.kyzs.com/article/14062.html"],"model":{"en":"Dear Professor Cook,\n\nWelcome to our university! I am writing to recommend a tourist attraction in our city, the West Lake, as a pleasant destination for your weekend relaxation.\n\nTwo reasons account for my recommendation. First, the scenery there is truly breathtaking: shaded by willow trees and dotted with ancient pagodas, the lake offers a tranquil escape from the noise of the campus. Second, the site is steeped in history, and countless poems and legends have been composed about it, which will enable you to gain a deeper insight into Chinese culture. Buses No. 5 and 20 run there directly from our campus, and admission is free.\n\nI would be delighted to accompany you there if convenient.\n\nYours sincerely,\nLi Ming","zh":"库克教授：\n\n欢迎来到我校！我写信是想向您推荐我市的一处景点——西湖，作为您周末放松的好去处。\n\n推荐它有两点理由。首先，那里景色确实令人叹为观止：垂柳掩映、古塔点缀，湖水为人们提供了远离校园喧嚣的宁静之所。其次，该地历史底蕴深厚，无数诗篇与传说都因它而生，能助您更深入地了解中国文化。5路和20路公交车从我校直达，且免门票。\n\n若您方便，我很乐意陪您同往。\n\n您诚挚的，\nLi Ming","outline":["Dear Professor Cook 称呼后加逗号，首句欢迎并点明推荐来意","用 Two reasons account for 引出主题句，First/Second 分列两条理由","以分词状语 shaded by… 描写景色，再用定语从句说明文化价值","补充交通与免票信息增强可操作性，虚拟语气表态陪同"],"words":121,"paras":5}},{"year":2018,"type":"邀请信","recipient":"校内全体外国专家（国际专家、外教）","taskZh":"给校内全体外国专家写一封约100词的电子邮件，邀请他们出席毕业典礼，并在邮件中写明典礼的时间、地点及其他相关信息。","points":["邀请校内全体外国专家参加毕业典礼","写明典礼的时间","写明典礼的地点","补充其他相关信息"],"directionsEn":"Write an email to all international experts on campus, inviting them to attend the graduation ceremony. In your email you should include the time, the place and other relevant information about the ceremony. You should write about 100 words neatly on the ANSWER SHEET. Do not use your own name at the end of the email. Use \"Li Ming\" instead. (10 points)","sections":["letter-general","letter-advice"],"tip":"邀请信（全体外国专家）。毕业典礼的时间、地点、其他信息三要素齐全，结尾请对方确认出席。","confidence":"high","note":"","sources":["https://mtoutiao.xdf.cn/kaoyan/201712/10746428.html","https://news.koolearn.com/20171223/1142485.html","https://yz.chsi.com.cn/kyzx/en/201712/20171225/1645244768-1.html"],"model":{"en":"Dear Sir or Madam,\n\nOn behalf of the Graduation Committee of our university, I am writing to invite you to attend this year's graduation ceremony, which we believe would be all the more memorable with your presence.\n\nThe ceremony is scheduled for Saturday, June 22nd, at 9:00 a.m. in the Grand Auditorium on the main campus. It will last approximately two hours, during which the president will confer degrees and outstanding graduates will share their reflections. A reception will follow in the foyer, where you may meet colleagues and students over refreshments. Kindly reply to graduation@university.edu.cn before June 15th so that seats can be reserved for you.\n\nYour presence would be an honour we greatly value.\n\nYours faithfully,\nLi Ming","zh":"尊敬的先生/女士：\n\n我代表我校毕业典礼委员会写信邀请您出席今年的毕业典礼，我们相信有您的到场，典礼将更加令人难忘。\n\n典礼定于6月22日（星期六）上午9:00在主校区大礼堂举行，历时约两小时，届时校长将授予学位，优秀毕业生将分享感想。典礼后将在门厅举行招待会，您可以边用茶点边与同事和学生交流。请于6月15日前回复 graduation@university.edu.cn，以便我们为您预留座位。\n\n您的出席是我们十分珍视的荣幸。\n\n您忠实的，\nLi Ming","outline":["称呼用 Dear Sir or Madam，末句配 Yours faithfully，首段说明邀请缘由","第二段用 be scheduled for 明确典礼时间与地点","用 during which 与 where 从句补充典礼流程及招待会安排","以 so that 引出回复邮箱与截止日期，末段礼节性收尾署名 Li Ming"],"words":120,"paras":5}},{"year":2019,"type":"咨询信","recipient":"来邮件咨询该项目的国际学生志愿者","taskZh":"假设你参与本校「援助农村小学」项目，需给一名来信咨询该项目的国际学生志愿者回邮件，详细说明项目的具体细节（如项目主题、活动安排、对志愿者的要求等）。","points":["回复国际学生志愿者的咨询邮件","具体说明项目的细节","属于回信/答复咨询的性质"],"directionsEn":"Suppose you are working for the \"Aiding Rural Primary Schools\" project of your university. Write an email to answer the inquiring from an international student volunteer. Specify the details of the project. You should write about 100 words on the ANSWER SHEET. Do not use your own name in the e-mail. Use \"Li Ming\" instead. (10 points)","sections":["letter-general","letter-apply"],"tip":"回信（答复咨询）。逐条回答对方的问题，细节要充分；回信要呼应来信的问法。","confidence":"high","note":"本题为「答复咨询的回信」，按题型清单归入咨询信。","sources":["https://www.chsi.com.cn/kyzx/en/201901/20190104/1752710219.html","https://www.kyzs.com/article/14062.html"],"model":{"en":"Dear Sir or Madam,\n\nThank you for your interest in our \"Aiding Rural Primary Schools\" project. I am glad to answer your inquiry in detail.\n\nThe project centres on improving English teaching in rural primary schools. From July 8th to August 2nd, volunteers will live on the school campus in Qinghe County, teaching four morning classes daily and organizing afternoon activities such as reading clubs, painting and sports. As for qualifications, volunteers are expected to be patient, cooperative and fluent in English; a brief online interview and a two-day training session are required. Accommodation and meals are provided free of charge, and a round-trip travel allowance is offered.\n\nShould you have further questions, please write to me.\n\nYours faithfully,\nLi Ming","zh":"尊敬的先生/女士：\n\n感谢您对我校“援助农村小学”项目的关注，我很乐意详细答复您的咨询。\n\n该项目以提升农村小学英语教学为核心。7月8日至8月2日期间，志愿者将住在清河县的学校校内，每天上午上四节课，下午组织阅读俱乐部、绘画、体育等活动。关于条件，志愿者需耐心、善于合作且英语流利，还须通过一次简短的线上面试并参加为期两天的培训。食宿免费提供，另发放往返交通补贴。\n\n如您还有其他问题，请给我写信。\n\n您忠实的，\nLi Ming","outline":["首句致谢对方来信，表明乐意详细答复咨询，体现回信性质","先交代项目主题，再按时间顺序说明地点与每日活动安排","用 As for qualifications 引出对志愿者态度、语言等具体要求","补充食宿与交通补贴等保障，末尾以倒装句欢迎继续来信"],"words":121,"paras":5}},{"year":2020,"type":"通知","recipient":"全体留学生（国际学生）","taskZh":"校学生会指派你写一则约100词的通知，告知留学生即将举办的歌唱比赛，需交代比赛的相关信息（如时间、地点、参赛要求等），并以学生会名义落款。","points":["以校学生会名义发布通知","告知留学生即将举办的歌唱比赛","提供比赛的相关细节（时间、地点、参赛方式/要求等）"],"directionsEn":"The students union of your university has assigned you to inform the international students about an upcoming singing contest. Write a notice in about 100 words. Write your answer on the ANSWER SHEET. Do not use your own name in the notice. (10 points)","sections":["letter-general","notice"],"tip":"通知（面向全体留学生）。主题是历史景点游览，写清活动安排与报名方式。","confidence":"high","note":"来源网页原文把 Write 印作「White a notice」，系排版/录入错误，此处已按 Write 还原。","sources":["https://mtoutiao.xdf.cn/kaoyan/201912/11011226.html","https://mtoutiao.xdf.cn/kaoyan/202001/11017825.html","https://www.kyzs.com/article/14062.html"],"model":{"en":"NOTICE\n\nThe Students' Union is pleased to announce a singing contest to be held for all international students, and your participation would be warmly welcomed.\n\nThe contest will take place in the University Hall from 7:00 to 9:30 p.m. on May 15th. Contestants may sing in any language, either solo or in a group of no more than four; a short piece of no longer than five minutes is preferred. Those who wish to enter should email your name, nationality and the title of your song to union@university.edu.cn before May 8th. Prizes and certificates will be awarded to the top three performers, and everyone present will receive a small gift.\n\nWe look forward to your wonderful performances.\n\nThe Students' Union\nLi Ming","zh":"通知\n\n校学生会欣然宣布将为全体留学生举办歌唱比赛，热诚欢迎你们参加。\n\n比赛将于5月15日晚7:00至9:30在大学礼堂举行。参赛者可用任何语言演唱，可独唱，也可组成不超过四人的小组；曲目以不超过五分钟的短曲为宜。有意参赛者请于5月8日前将姓名、国籍和歌曲名称发送至 union@university.edu.cn。前三名将获得奖品和证书，到场者均可获赠小礼品。\n\n期待你们的精彩演唱。\n\n校学生会\nLi Ming","outline":["居中大写标题 NOTICE，以校学生会为主语宣布即将举办歌唱比赛","第二段用 take place 交代时间地点，并说明演唱语言与形式限制","用 Those who wish to enter 引出报名邮箱与截止日期","补充奖项设置提高吸引力，结尾期待参与，落款署学生会与 Li Ming"],"words":122,"paras":5}},{"year":2021,"type":"建议信","recipient":"一位刚大学毕业、打算在中国找工作的外国朋友","taskZh":"给你的外国朋友写一封约100词的电子邮件：他/她刚大学毕业并打算在中国找工作，请就求职这件事提出一些建议。","points":["写信对象为刚大学毕业、打算在中国找工作的外国朋友","就求职提出具体建议","以电子邮件形式、署名 Li Ming"],"directionsEn":"A foreign friend of yours has recently graduated from college and intends to find a job in China. Write him/her an email to make some suggestions. You should write about 100 words on ANSWER SHEET. Do not sign your own name at the end. Use \"Li Ming\" instead. (10 points)","sections":["letter-general","letter-advice"],"tip":"建议信（给求职的外国朋友）。建议要落地：语言、简历、行业选择、面试准备。","confidence":"high","note":"","sources":["https://mtoutiao.xdf.cn/kaoyan/202101/11140091.html","https://mtoutiao.xdf.cn/kaoyan/202101/11140128.html","https://www.kyzs.com/article/14062.html"],"model":{"en":"Dear friend,\n\nDelighted to learn that you have graduated and intend to seek employment in China, I am writing to offer a few practical suggestions.\n\nTo begin with, update your resume in both Chinese and English, highlighting any internship or volunteer experience relevant to the position. It is also advisable to register with reputable recruitment websites such as 51job and to follow target companies on their official WeChat accounts. Moreover, since many interviews are conducted in Chinese, polishing your spoken Chinese and preparing a concise self-introduction will give you a distinct advantage. Finally, do check whether your visa permits full-time work.\n\nPlease let me know if I can be of further help. I wish you every success.\n\nYours sincerely,\nLi Ming","zh":"亲爱的朋友：\n\n得知你已毕业并打算在中国求职，我很高兴，特此写信给你一些实用建议。\n\n首先，请更新中英文简历，突出与岗位相关的实习或志愿经历。也建议你在 51job 等正规招聘网站注册，并关注目标企业的微信公众号。此外，由于许多面试用中文进行，提高中文口语并准备一段简短的自我介绍会让你更具优势。最后，务必确认你的签证是否允许全职工作。\n\n如还需帮助请告诉我。祝你一切顺利。\n\n你诚挚的，\nLi Ming","outline":["以分词状语 Delighted to learn 开篇，交代背景与建议来意","用 To begin with/It is also advisable/Moreover/Finally 分层给建议","建议涵盖双语简历、招聘网站与公众号、中文口语及签证核查","末段表示愿意继续提供帮助并祝愿求职成功，署名 Li Ming"],"words":121,"paras":5}},{"year":2022,"type":"邀请信","recipient":"英国一所大学的教授（英国大学教授）","taskZh":"给英国某大学的教授写一封约100词的电子邮件，邀请他/她为你校即将举办的国际创新（大赛/活动）组建一支参赛团队。","points":["写信对象为英国大学的教授","邀请对方为你校举办的国际创新活动组建团队"],"directionsEn":"Write an email to a professor at a British university, inviting him/her to organize a team for the international innovation to be held at your university. You should write about 100 words on ANSWER SHEET. Do not sign your own name at the end of the letter. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","letter-advice"],"tip":"邀请信（给英国大学教授）。邀请其组建团队参加国际创新大赛，写清赛事、时间与期待。","confidence":"high","note":"两个独立来源（新东方网「网友回忆版」、新东方在线）的英文题面完全一致（international innovation）。另有汇总类网页（kyzs.com）把 2022 年小作文写成「邀请外教担任英语演讲比赛的评委」，但该来源自身的 2013 年条目与之文字重复，判断为汇总页串行/错位，未采信。","sources":["https://mtoutiao.xdf.cn/kaoyan/202112/11363756.html","https://m.koolearn.com/kaoyan/20211225/1483470.html"],"model":{"en":"Dear Professor,\n\nOn behalf of the Organizing Committee of our university, I am writing to invite you to organize a team for the International Innovation Competition to be held on our campus this autumn.\n\nThe competition aims to encourage students to turn creative ideas into practical solutions, and teams from over thirty universities are expected to take part. As a scholar with wide experience in mentoring young innovators, you would be ideally placed to select and guide a team of five from your own university. We would cover all travel and accommodation expenses, and the deadline for confirmation is June 30th. Detailed rules are attached for your reference.\n\nWe sincerely hope you will accept our invitation.\n\nYours sincerely,\nLi Ming","zh":"尊敬的教授：\n\n我代表我校组委会写信，邀请您为今年秋季在我校举办的国际创新大赛组建一支参赛团队。\n\n该赛事旨在鼓励学生把创意转化为可行方案，预计有三十多所高校的队伍参加。作为在指导青年创新者方面经验丰富的学者，您非常适合从贵校挑选并带领一支五人团队。我们将承担全部交通与住宿费用，确认参赛的截止日期为6月30日。详细规则见附件，供您参考。\n\n我们诚挚希望您能接受邀请。\n\n您诚挚的，\nLi Ming","outline":["以 On behalf of 开篇表明代表组委会，说明邀请对方组建团队","第二段先介绍赛事宗旨与规模，为邀请提供背景","用 As a scholar with… 评价对方资历，说明费用承担与截止日期","末尾表达期待并附规则文件，Yours sincerely 落款"],"words":120,"paras":5}},{"year":2023,"type":"通知","recipient":"全校学生（应征者）；落款可为学生会","taskZh":"写一则约100词的通知，为 Smith 教授关于校园体育活动的研究项目招募一名学生，需说明该岗位的职责和任职要求。","points":["为 Prof. Smith 的校园体育活动研究项目招募一名学生","说明该岗位的职责（duties）","说明任职要求（requirements）"],"directionsEn":"Write a notice to recruit a student for Prof. Smith's research project on campus sports activities. Specify the duties and requirements of the job. You should write about 100 words on ANSWER SHEET. Do not sign your own name at the end of the notice. Use \"Li Ming\" instead. Do not write the address. (10 points)","sections":["letter-general","notice"],"tip":"通知（招 1 名学生参与 Smith 教授项目）。资格要求 + 报名方式 + 截止时间三件套。","confidence":"high","note":"注意常见审题陷阱：招募对象是「为研究项目工作的学生」，而非校园体育活动本身。其中一个来源的英文 Directions 中写作「Do not sign your own name at the end of the letter」（中公版为 notice），属来源差异，题面主体一致。","sources":["https://mtoutiao.xdf.cn/kaoyan/202312/13553027.html","https://m.koolearn.com/kaoyan/20221224/1578639.html","https://www.kaoyan365.cn/yingyu/zhenti/343341.html"],"model":{"en":"NOTICE\n\nProf. Smith's research project on campus sports activities requires one student assistant, and applications are now invited from all students.\n\nThe assistant will collect and organize data on students' weekly exercise habits, distribute and retrieve questionnaires, and help prepare short reports for the project group. Applicants should be second- or third-year students who can devote about six hours a week, and familiarity with Excel or SPSS is preferred. A good command of written English would be an advantage.\n\nThose interested should send a brief resume to sportsproject@university.edu.cn before October 20th, and shortlisted candidates will be interviewed the following week.\n\nOffice of the Research Project\nLi Ming","zh":"通知\n\n史密斯教授关于校园体育活动的研究项目现需一名学生助理，面向全体学生招募。\n\n该助理将收集并整理学生每周锻炼习惯的数据，发放和回收问卷，并协助撰写项目组的简要报告。申请者应为二、三年级学生，每周能投入约六小时，熟悉 Excel 或 SPSS 者优先，有较好的英语书面表达能力者更佳。\n\n有意者请于10月20日前将简短简历发送至 sportsproject@university.edu.cn，入选者将于下周接受面试。\n\n项目办公室\nLi Ming","outline":["NOTICE 大写居中，首句点明为史密斯教授项目招募一名学生助理","用三个并列谓语说明数据收集、问卷发放与报告撰写等职责","用 should be 与 is preferred 分层说明年级、时间投入与技能要求","给出投递邮箱与截止日期及面试安排，落款署项目办公室"],"words":107,"paras":5}},{"year":2024,"type":"建议信","recipient":"留学生同学 Paul（发来求助邮件的国际学生）","taskZh":"阅读留学生 Paul 的来信并写回信：Paul 有一项课堂作业，要做关于一位中国古代科学家的口头报告，不知如何准备，向你求助；你需在约100词的回信中给出建议。","points":["阅读来信并回信给留学生 Paul","就如何准备「关于中国古代科学家的口头报告」提出建议"],"directionsEn":"Read the following email from an international student and write a reply. — Dear Li Ming, I've got a class assignment to make an oral report on an ancient Chinese scientist, but I'm not sure how to prepare for it. Can you give me some advice? Thank you for your help. Yours, Paul — Write your answer in about 100 words on the ANSWER SHEET. Do not use your own name in your email; use \"Li Ming\" instead. (10 points)","sections":["letter-general","letter-advice"],"tip":"读信 + 回信建议。先回应对方的处境，再给具体建议，语气要体贴。","confidence":"high","note":"本题形式为「读信＋回信并提建议」，按题型清单归入建议信。","sources":["https://jixun.iqihang.com/info/yyzd/2023334774.html","http://m.tianrenedu.com.cn/bkzl/18741.html"],"model":{"en":"Dear Paul,\n\nIt is a pleasure to hear from you. Preparing an oral report on an ancient Chinese scientist is easier if you approach it step by step.\n\nFirst, choose a figure with a clear legacy, such as Zhang Heng, who invented the seismograph. Then read two or three reliable sources and note down his life, major achievements and their influence. Rather than reciting facts, build your report around one question: why did his inventions matter to ordinary people? A simple timeline or a picture of his device will make your slides more engaging. Finally, rehearse aloud twice, and be ready to answer one or two questions. I would be glad to listen to your draft and offer feedback.\n\nYours sincerely,\nLi Ming","zh":"亲爱的 Paul：\n\n很高兴收到你的来信。只要按步骤推进，准备关于中国古代科学家的口头报告并不难。\n\n首先，选一位成就明确的科学家，比如发明地动仪的张衡。然后阅读两三份可靠资料，记下他的生平、主要成就及其影响。不要只是罗列事实，而应围绕一个问题展开报告，例如他的发明为何对普通人重要。一张简单的时间轴或他发明的器物图片会让幻灯片更吸引人。最后，朗读练习两遍，并准备好回答一两个问题。我很乐意听你的初稿并给出反馈。\n\n你诚挚的，\nLi Ming","outline":["Dear Paul 称呼加逗号，首句回应来信并表明愿意提供建议","用 First/Then 分步骤建议：选定人物、查阅可靠资料并做笔记","用 Rather than reciting 引出以问题为主线，并提示配图表","最后建议限时演练，末句表示乐于看稿反馈，Yours sincerely 落款"],"words":123,"paras":4}},{"year":2025,"type":"其他","recipient":"同学 Paul（发来邮件的同学）","taskZh":"阅读同学 Paul 的来信并回信：他得知你将邀请年轻手工艺人在校园展示创新工艺制作，想知道他们展示什么，也表示愿帮忙做准备；你在约100词回信中回答这两点。","points":["回答手工艺人将展示什么（what they'll show）","说明 Paul 可以做哪些准备工作（what I can do）"],"directionsEn":"Read the following email from your classmate Paul and write him a reply. — Dear Li Ming, I was really excited to hear that you'd invite some young craftsmen to demonstrate their innovative craft-making on campus. May I know more about what they'll show? Also, I'd like to help with your preparation work. Please let me know what I can do. Yours, Paul — Write your answer in about 100 words on the ANSWER SHEET. Do not use your own name in the email; use \"Li Ming\" instead. (10 points)","sections":["letter-general","letter-apply"],"tip":"回信（答复同学来信的两点）。逐点回应，结构清晰是首要评分点。","confidence":"high","note":"题型为「回信」（答复同学来信并回答其所问两点），不属于题型清单中的固定书信类型，故归入「其他」。","sources":["http://www.offcn.com/kaoyan/2024/1227/280562.html","https://english-exam.lazynote.cn/kaoyan/sections/2025-english-one/section3-part-a/","http://m.tianrenedu.com.cn/bkzl/23604.html"],"model":{"en":"Dear Paul,\n\nThank you for your enthusiasm. I am glad to tell you what the young craftsmen will present.\n\nThey will demonstrate how traditional skills can be renewed. Among them are a bamboo weaver who combines old weaving patterns with modern lighting design, a potter using recycled clay, and a paper-cut artist creating animated short films. Visitors may try these crafts themselves at hands-on tables.\n\nAs for your help, you could design a poster and circulate it through the campus WeChat groups, and reserve the exhibition hall and six long tables for the afternoon of June 10th. Your presence during the setting-up would also be a great support. Let me know what suits you.\n\nYours sincerely,\nLi Ming","zh":"亲爱的 Paul：\n\n谢谢你的热情。我很高兴告诉你这些年轻手工艺人将展示什么。\n\n他们将展示传统技艺如何焕发新意。其中有把古老编织纹样与现代灯具设计结合的竹编艺人，有使用再生陶土的陶艺师，还有创作动画短片的剪纸艺术家。参观者可以在体验台上亲手尝试这些手艺。\n\n至于你的帮忙，你可以设计一张海报并在校园微信群里转发，同时预订6月10日下午的展厅和六张长桌。布置场地时你能到场也是很大的支持。告诉我你方便的安排。\n\n你诚挚的，\nLi Ming","outline":["首句回应 Paul 的热情，说明将回答他提出的两个问题","用 Among them are 倒装句举例说明手工艺人的具体展示内容","用 As for your help 分派海报宣传与场地预订两项准备任务","补充到场支持并请对方回复，Yours sincerely 落款署 Li Ming"],"words":118,"paras":5}}],"notes":["题型频率：建议信最多（2007/2009/2012/2014/2021/2024），其次通知（2010/2016/2020/2023）与邀请信（2013/2018/2022）；推荐信（2011/2015/2017）近十年明显升温。把「建议信 + 通知 + 邀请信 + 推荐信」四类吃透，覆盖面已超七成。","格式分不能丢：英语一统一署名 Li Ming（通知类用组织名，如 the Postgraduate Association / the Students' Union）。署名后不要加点；书信称呼后用逗号；通知要居中大写标题 NOTICE，落款写组织与日期。","近年趋势是「读信 + 回信」：2019、2024、2025 都要求先读懂来信内容再逐条回应。答题时把对方的问题逐点对应回答，比堆砌套话更容易得分。","字数控制：约 100 词，正文 7—9 句足够。宁可少而准，不要为了凑字数写与要点无关的句子。"]},"stats":{"partA":21,"partB":28,"modelA":21,"modelB":28,"wordsA":2447,"wordsB":5348}},"builtAt":"2026-10-07T10:15:03.521Z"}</script>
<script>
"use strict";
const CORPUS = JSON.parse(document.getElementById('corpus-data').textContent);
const SECTIONS = CORPUS.sections;
const INDEX = CORPUS.examIndex;
const SEC_BY_ID = {}; SECTIONS.forEach(s => SEC_BY_ID[s.id] = s);

const TYPE_LABEL = {word:'单词', phrase:'词伙', pattern:'句式', proverb:'金句'};
const LS = 'kaoyan-corpus-v1';
let st = {mastered:{}, starred:{}, recite:false, dark:false, fs:1};
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e){}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e){} };

let view = {kind:'all'};
let query = '';
let onlyStar = false, onlyUn = false, shuffle = false;
let limit = 150;

const $ = s => document.querySelector(/^[#.[]/.test(s) ? s : '#' + s);
/* 掌握/收藏以「表达」为单位（全局），同一表达在多个板块出现时只需标记一次 */
const nk = en => String(en).toLowerCase().trim().replace(/[.\s]+$/, '');
const key = (sid, en) => nk(en);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 同一表达出现在哪些板块 */
const VARIANTS = {};
SECTIONS.forEach(s => s.entries.forEach(e => { const k = nk(e.en); (VARIANTS[k] = VARIANTS[k] || []).push(s.id); }));
const UNIQUE = Object.keys(VARIANTS).length;

/* ---------- boot ---------- */
document.body.classList.toggle('dark', !!st.dark);
document.body.classList.toggle('recite', !!st.recite);
document.documentElement.style.setProperty('--fs', st.fs);
$('themeBtn').classList.toggle('on', !!st.dark);
$('modeBtn').classList.toggle('on', !!st.recite);
$('allN').textContent = SECTIONS.reduce((n,s)=>n+s.entries.length,0);
$('brandSub').textContent = SECTIONS.length + ' 个板块 · ' + $('allN').textContent + ' 条 / ' + UNIQUE + ' 个不重复表达';

function renderNav(){
  const nav = $('#nav'); nav.innerHTML = '';
  const groups = {};
  SECTIONS.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));

  const virt = [
    {id:'__all', emo:'📚', title:'全部语料'},
    {id:'__star', emo:'★', title:'我的收藏'},
    {id:'__un', emo:'🔥', title:'尚未掌握'}
  ];
  const vg = document.createElement('div'); vg.className='grp'; vg.textContent='快速视图'; nav.appendChild(vg);
  virt.forEach(v => {
    const el = document.createElement('div');
    el.className = 'nav-i' + (view.kind==='virt' && view.id===v.id ? ' active':'');
    let n = 0;
    if (v.id==='__all') n = SECTIONS.reduce((a,s)=>a+s.entries.length,0);
    else if (v.id==='__star') n = Object.keys(st.starred).length;
    else n = SECTIONS.reduce((a,s)=>a+s.entries.filter(e=>!st.mastered[key(s.id,e.en)]).length,0);
    el.innerHTML = '<span class="n-emo">'+v.emo+'</span><span class="n-t">'+v.title+'</span><span class="n-count">'+n+'</span>';
    el.onclick = () => { view={kind:'virt',id:v.id}; limit=150; render(); closeNav(); };
    nav.appendChild(el);
  });

  Object.keys(groups).forEach(g => {
    const gh = document.createElement('div'); gh.className='grp'; gh.textContent=g; nav.appendChild(gh);
    groups[g].forEach(s => {
      const done = s.entries.filter(e=>st.mastered[key(s.id,e.en)]).length;
      const el = document.createElement('div');
      el.className = 'nav-i' + (view.kind==='sec' && view.id===s.id ? ' active':'');
      el.innerHTML = '<span class="n-emo">'+s.emoji+'</span><span class="n-t">'+esc(s.title)+
        '</span><span class="n-count">'+done+'/'+s.entries.length+'</span>'+
        '<span class="nav-bar"><i style="width:'+(s.entries.length?done/s.entries.length*100:0)+'%"></i></span>';
      el.onclick = () => { view={kind:'sec',id:s.id}; limit=150; render(); closeNav(); };
      nav.appendChild(el);
    });
  });

  if (INDEX){
    const gh = document.createElement('div'); gh.className='grp'; gh.textContent='真题（原题 + 范文）'; nav.appendChild(gh);
    [['B','🗂'],['A','✉️']].forEach(([part,emo])=>{
      const P = INDEX['part'+part];
      if (!P) return;
      const el = document.createElement('div');
      el.className = 'nav-i' + (view.kind==='index' && view.part===part ? ' active':'');
      el.innerHTML = '<span class="n-emo">'+emo+'</span><span class="n-t">'+esc(P.title)+
        '</span><span class="n-count">'+P.years.length+'</span>';
      el.onclick = () => { view={kind:'index', part}; render(); closeNav(); };
      nav.appendChild(el);
    });
  }
}

/* ---------- data selection ---------- */
function pool(){
  if (view.kind==='sec') return SEC_BY_ID[view.id] ? SEC_BY_ID[view.id].entries.map(e=>({...e, _sid:view.id})) : [];
  const all = [];
  SECTIONS.forEach(s => s.entries.forEach(e => all.push({...e, _sid:s.id})));
  if (view.kind==='index') return all;
  if (view.kind==='virt' && view.id==='__star') return all.filter(e=>st.starred[key(e._sid,e.en)]);
  if (view.kind==='virt' && view.id==='__un') return all.filter(e=>!st.mastered[key(e._sid,e.en)]);
  return all;
}
function filtered(){
  const q = query.trim().toLowerCase();
  let arr = pool();
  if (onlyStar) arr = arr.filter(e=>st.starred[key(e._sid,e.en)]);
  if (onlyUn) arr = arr.filter(e=>!st.mastered[key(e._sid,e.en)]);
  if (q) arr = arr.filter(e =>
    (e.en+' '+(e.basic||'')+' '+e.zh+' '+e.example+' '+e.exampleZh+' '+e.note).toLowerCase().includes(q));
  return arr;
}
function hi(s){
  const t = esc(s);
  if (!query.trim()) return t;
  const q = query.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try { return t.replace(new RegExp('('+q+')','gi'), '<mark>$1</mark>'); } catch(e){ return t; }
}

/* ---------- render ---------- */
function render(){
  renderNav();
  const list = $('#list');
  const isIndex = view.kind==='index';

  if (isIndex){
    const P = INDEX['part'+view.part];
    $('#crumb').textContent = (view.part==='A'?'✉️ ':'🗂 ') + (P ? P.title : '真题索引');
    $('#bar').firstElementChild.style.width = '0%';
    list.innerHTML = renderIndex(view.part);
    list.scrollTop = 0;
    $('#empty').style.display='none';
    $('#meta').innerHTML = P ? '<span>共 <b>'+P.years.length+'</b> 套</span>'+
      '<span>原创范文 <b style="color:var(--ok)">'+P.years.filter(y=>y.model).length+'</b> 篇</span>'+
      '<span class="mhint">'+(view.part==='A'
        ? '点「展开原创范文」看整篇示范；点题型标签可跳到对应书信板块'
        : '点「展开原创范文」看整篇示范；点右侧板块名可跳到对应语料')+'</span>' : '';
    bindIndex();
    return;
  }

  let arr = filtered();
  if (shuffle) arr = arr.slice().sort(()=>Math.random()-0.5);

  const title = view.kind==='sec' ? (SEC_BY_ID[view.id].emoji+' '+SEC_BY_ID[view.id].title)
    : view.kind==='virt' && view.id==='__star' ? '★ 我的收藏'
    : view.kind==='virt' && view.id==='__un' ? '🔥 尚未掌握' : '📚 全部语料';
  $('#crumb').textContent = title;

  const sec = view.kind==='sec' ? SEC_BY_ID[view.id] : null;
  const doneN = arr.filter(e=>st.mastered[key(e._sid,e.en)]).length;
  $('#meta').innerHTML = '<span>共 <b>'+arr.length+'</b> 条</span><span>已掌握 <b style="color:var(--ok)">'+doneN+'</b></span>'+
    (sec ? '<span class="mhint">提示：点 ✓ 标记掌握，点 ★ 收藏，点卡片可发音</span>'
         : '<span class="mhint">提示：按 / 搜索，R 切换背诵模式</span>');
  $('#bar').firstElementChild.style.width = (arr.length? doneN/arr.length*100 : 0)+'%';

  const head = sec ? '<div class="desc"><b>'+esc(sec.title)+'</b> · '+esc(sec.desc)+'</div>' : '';
  const shown = arr.slice(0, limit);
  list.innerHTML = head + shown.map(card).join('') +
    (arr.length > shown.length ? '<button class="loadmore" id="lm">还有 '+(arr.length-shown.length)+' 条，点击加载</button>' : '');
  $('#empty').style.display = arr.length ? 'none' : 'block';
  bindCards(list);
  const lm = $('#lm');
  if (lm) lm.onclick = () => { limit += 200; render(); };
  list.scrollTop = 0;
}

function card(e){
  const k = key(e._sid, e.en);
  const done = !!st.mastered[k], star = !!st.starred[k];
  const others = (VARIANTS[nk(e.en)] || []).filter(id => id !== e._sid);
  const vbadge = others.length
    ? '<span class="b var" title="同一表达也出现在：' + esc(others.map(id => SEC_BY_ID[id] ? SEC_BY_ID[id].title : id).join('、')) + '">＋' + others.length + ' 板块</span>'
    : '';
  return '<article class="card'+(done?' mastered':'')+(star?' starred':'')+'" data-k="'+esc(k)+'" data-en="'+esc(e.en)+'">'+
    '<div class="c-h">'+
      '<span class="en">'+hi(e.en)+'</span>'+
      (e.pos && e.pos!=='—' ? '<span class="b pos">'+esc(e.pos)+'</span>' : '')+
      '<span class="b t-'+esc(e.type)+'">'+(TYPE_LABEL[e.type]||esc(e.type))+'</span>'+
      (e.basic ? '<span class="b basic">替换 '+esc(e.basic)+'</span>' : '')+
      vbadge+
      '<span class="sp"></span>'+
      '<button class="act star'+(star?' on':'')+'" title="收藏">★</button>'+
      '<button class="act done'+(done?' on':'')+'" title="标记已掌握">✓</button>'+
      '<button class="act speak" title="朗读">🔊</button>'+
    '</div>'+
    '<div class="zh">'+hi(e.zh)+'</div>'+
    '<div class="ex"><span class="ex-en">'+hi(e.example)+'</span><span class="ex-zh">'+hi(e.exampleZh)+'</span></div>'+
    '<div class="note">'+hi(e.note)+'</div>'+
  '</article>';
}

/* ---------- 真题索引 ---------- */
const REF_NAME = {
  'yz.chsi.com.cn':'学信网·研招网', 'yzst.chsi.com.cn':'学信网·研招网', 'chsi.com.cn':'学信网',
  'xdf.cn':'新东方', 'mtoutiao.xdf.cn':'新东方网', 'file.xdf.cn':'新东方',
  'koolearn.com':'新东方在线', 'news.koolearn.com':'新东方在线', 'm.koolearn.com':'新东方在线',
  'offcn.com':'中公考研', 'm.offcn.com':'中公考研', 'www.offcn.com':'中公考研',
  'iqihang.com':'启航考研', 'm-jixun.iqihang.com':'启航考研', 'jixun.iqihang.com':'启航考研',
  'kaoyan365.cn':'考研365', 'www.kaoyan365.cn':'考研365', 'sohu.com':'搜狐',
  'tianrenedu.com.cn':'天任考研', 'kyzs.com':'考研芝士', 'hujiang.com':'沪江',
  'wenku.baidu.com':'百度文库', 'kaoyantools.com':'考研工具', 'eduour.cn':'考试吧'
};
function refLabel(u){
  try {
    const h = new URL(u).hostname.replace(/^www\./, '');
    for (const k in REF_NAME) if (h === k || h.endsWith('.' + k)) return REF_NAME[k];
    return h;
  } catch (e) { return u; }
}

function yearCard(y, part){
  const isA = part === 'A';
  const tag = isA ? (y.type || '应用文') : (y.chartType || '图画');
  const title = isA ? (y.recipient || '') : (y.titleZh || '');
  const links = (y.sections||[]).filter(id=>SEC_BY_ID[id])
    .map(id=>'<span class="lnk" data-sec="'+id+'">'+SEC_BY_ID[id].emoji+' '+esc(SEC_BY_ID[id].title)+'</span>').join('');

  let body = '';
  if (isA){
    if (y.directionsEn) body += '<div class="yrsec"><b>原题 Directions</b><p class="qen">'+hi(y.directionsEn)+'</p></div>';
    body += '<div class="yrsec"><b>写作任务</b><p>'+hi(y.taskZh||'')+'</p></div>';
    if (y.points && y.points.length)
      body += '<div class="yrsec"><b>要点</b><p>'+y.points.map(p=>hi(p)).join('；')+'</p></div>';
  } else {
    if (y.directionsEn) body += '<div class="yrsec"><b>原题 Directions</b><p class="qen">'+hi(y.directionsEn)+'</p></div>';
    if (y.topicEn) body += '<div class="yrsec"><b>English</b><p>'+hi(y.topicEn)+'</p></div>';
    if (y.pictureZh) body += '<div class="yrsec"><b>图画/图表</b><p>'+hi(y.pictureZh)+'</p></div>';
    if (y.directionsZh) body += '<div class="yrsec"><b>写作要求</b><p>'+hi(y.directionsZh)+'</p></div>';
    if (y.captions && y.captions.length)
      body += '<div class="yrsec"><b>图上文字</b><p>'+y.captions.map(c=>'「'+hi(c)+'」').join('　')+'</p></div>';
  }
  if (y.tip) body += '<div class="yrtip"><b>可复用角度：</b>'+hi(y.tip)+'</div>';
  if (links) body += '<div class="yrlinks"><span class="lb">对应语料板块</span>'+links+'</div>';
  if (y.sources && y.sources.length){
    const as = y.sources.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" title="'+esc(u)+'">'+esc(refLabel(u))+'</a>').join('');
    body += '<div class="yrrefs"><b>真题解析 / 参考范文出处</b>'+as+'</div>';
  }
  if (y.confidence && y.confidence !== 'high')
    body += '<div class="yrwarn">⚠️ 该年题面置信度：'+esc(y.confidence)+(y.note?'（'+esc(y.note)+'）':'')+'，请以官方真题原文核对</div>';

  const m = y.model;
  let model = '';
  if (m){
    const ol = (m.outline && m.outline.length)
      ? '<div class="mo-outline">'+m.outline.map((x,i)=>'<div><b>'+(['一','二','三','四','五'][i]||(i+1))+'、</b>'+hi(x)+'</div>').join('')+'</div>' : '';
    const paras = String(m.en).trim().split(/\n\s*\n/).map(p=>'<p>'+hi(p.trim())+'</p>').join('');
    model = '<button class="modelbtn" data-myear="'+y.year+'">📄 展开原创范文（'+m.words+' 词 · '+m.paras+' 段）</button>'+
      '<div class="model" data-my="'+y.year+'">'+
        '<div class="mo-meta"><span>原创范文</span><span>'+m.words+' 词</span><span>'+m.paras+' 段</span>'+
          (m.readMin?'<span>约 '+m.readMin+' 分钟</span>':'')+'</div>'+
        ol + '<div class="mo-en">'+paras+'</div>'+
        '<div class="mo-zh">'+hi(m.zh)+'</div>'+
      '</div>';
  }

  return '<article class="yrcard'+(isA?' partA':'')+'" data-year="'+y.year+'">'+
    '<div class="yrhead"><span class="yrnum">'+y.year+'</span>'+
      '<span class="yrtag">'+esc(tag)+'</span>'+
      '<span class="yrtitle">'+hi(title)+'</span>'+
      (isA ? '' : '<span class="yrsub">'+hi(y.topicEn||'')+'</span>')+
    '</div><div class="yrbody">'+body+model+'</div></article>';
}

/* 真题索引的搜索字段：刻意不含 sources / note，避免用 URL 和考据说明匹配出无关年份 */
function idxHay(y){
  return [y.year, y.titleZh, y.topicEn, y.type, y.recipient, y.chartType,
    y.pictureZh, y.directionsZh, y.directionsEn, y.taskZh,
    (y.points||[]).join(' '), (y.captions||[]).join(' '), y.tip,
    y.model ? (y.model.en + ' ' + y.model.zh) : ''].filter(Boolean).join(' ').toLowerCase();
}

function renderIndex(part){
  const P = INDEX['part'+part];
  if (!P) return '<div class="yrfilter-note">该部分暂无索引数据。</div>';
  const q = query.trim().toLowerCase();
  let years = P.years.slice().sort((a,b)=>b.year-a.year);
  const total = years.length;
  if (q) years = years.filter(y => idxHay(y).includes(q));

  const notes = (P.notes || INDEX.notes || []);
  const notesHtml = notes.length
    ? '<div class="idxnotes"><h4>命题规律 · 备考提示</h4><ul>'+notes.map(n=>'<li>'+hi(n)+'</li>').join('')+'</ul></div>'
    : '';

  const withModel = P.years.filter(y=>y.model).length;
  const ctl = '<div class="idxctl">'+
      '<button data-act="expand">展开全部范文</button>'+
      '<button data-act="collapse">全部收起</button>'+
      '<button data-act="recite">只看原题（隐藏范文）</button>'+
    '</div>';

  const cards = years.length
    ? years.map(y=>yearCard(y, part)).join('')
    : '<div class="yrfilter-note">没有匹配的年份，试试别的关键词（年份、题型、主题词）。</div>';

  return '<div class="desc"><b>'+esc(P.title)+'</b> · '+esc(P.subtitle)+
    '<br>共 '+total+' 套 · 原创范文 '+withModel+' 篇'+
    (q ? ' · 已按「'+esc(query.trim())+'」筛出 '+years.length+' 套' : '')+'</div>'+
    ctl + cards + notesHtml;
}

function bindIndex(){
  const list = $('#list');
  list.querySelectorAll('.lnk[data-sec]').forEach(a=>{
    a.onclick = () => { view={kind:'sec', id:a.dataset.sec}; limit=150; render(); };
  });
  const openModel = (card, on) => {
    const box = card.querySelector('.model');
    const btn = card.querySelector('.modelbtn');
    if (!box || !btn) return;
    box.classList.toggle('open', on);
    btn.textContent = on ? '📄 收起范文' : btn.dataset.label;
  };
  list.querySelectorAll('.yrcard').forEach(card=>{
    const btn = card.querySelector('.modelbtn');
    if (btn) btn.dataset.label = btn.textContent;
    if (btn) btn.onclick = e => { e.stopPropagation(); openModel(card, !card.querySelector('.model').classList.contains('open')); };
    const box = card.querySelector('.model');
    if (box) box.onclick = () => { if (st.recite) box.classList.toggle('revealed'); };
  });
  list.querySelectorAll('.idxctl button').forEach(b=>{
    b.onclick = () => {
      const act = b.dataset.act;
      list.querySelectorAll('.yrcard').forEach(card=>{
        const box = card.querySelector('.model');
        if (!box) return;
        if (act==='expand') { box.classList.add('open'); const t=card.querySelector('.modelbtn'); if(t) t.textContent='📄 收起范文'; }
        if (act==='collapse') { box.classList.remove('open'); const t=card.querySelector('.modelbtn'); if(t) t.textContent=t.dataset.label; }
        if (act==='recite') { box.classList.remove('open'); const t=card.querySelector('.modelbtn'); if(t) t.textContent=t.dataset.label; }
      });
    };
  });
}

function bindCards(root){
  /* 同一表达可能同时出现在多个板块，标记后让当前视图里所有同表达卡片同步 */
  const sync = k => {
    document.querySelectorAll('#list .card').forEach(o => {
      if (o.dataset.k !== k) return;
      const done = !!st.mastered[k], star = !!st.starred[k];
      o.classList.toggle('mastered', done);
      o.classList.toggle('starred', star);
      const d = o.querySelector('.done'), s = o.querySelector('.star');
      if (d) d.classList.toggle('on', done);
      if (s) s.classList.toggle('on', star);
    });
    const view0 = pool();
    const dv = view0.filter(x => st.mastered[key(x._sid, x.en)]).length;
    $('#bar').firstElementChild.style.width = (view0.length ? dv / view0.length * 100 : 0) + '%';
  };
  root.querySelectorAll('.card').forEach(el=>{
    const k = el.dataset.k, en = el.dataset.en;
    el.querySelector('.star').onclick = ev => {
      ev.stopPropagation();
      st.starred[k] ? delete st.starred[k] : st.starred[k] = 1;
      save(); sync(k); renderNav();
      if (onlyStar) render();
    };
    el.querySelector('.done').onclick = ev => {
      ev.stopPropagation();
      st.mastered[k] ? delete st.mastered[k] : st.mastered[k] = 1;
      save(); sync(k); updateFooter(); renderNav();
      if (onlyUn) render();
    };
    el.querySelector('.speak').onclick = ev => { ev.stopPropagation(); speak(en); };
    el.onclick = () => { if (st.recite) el.classList.toggle('revealed'); };
  });
}
function updateFooter(){
  const done = Object.keys(st.mastered).length;
  $('#doneN').textContent = done;
  $('#pctN').textContent = (UNIQUE ? Math.round(done / UNIQUE * 100) : 0) + '%';
}
function speak(t){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=.88; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- controls ---------- */
$('#search').oninput = e => { query = e.target.value; limit = 150; render(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#search')){ e.preventDefault(); $('#search').focus(); }
  if (e.key === 'Escape'){ $('#search').value=''; query=''; $('#search').blur(); render(); }
  if (e.key === 'r' && document.activeElement !== $('#search') && !e.metaKey && !e.ctrlKey) toggleRecite();
});
function toggleRecite(){
  st.recite = !st.recite; save();
  document.body.classList.toggle('recite', st.recite);
  $('#modeBtn').classList.toggle('on', st.recite);
  $('#modeBtn').textContent = st.recite ? '👁 已隐藏中文' : '👁 背诵模式';
}
$('#modeBtn').onclick = toggleRecite;
$('#onlyStar').onclick = () => { onlyStar = !onlyStar; $('#onlyStar').classList.toggle('on', onlyStar); limit=150; render(); };
$('#onlyUn').onclick = () => { onlyUn = !onlyUn; $('#onlyUn').classList.toggle('on', onlyUn); limit=150; render(); };
$('#shuffleBtn').onclick = () => { shuffle = !shuffle; $('#shuffleBtn').classList.toggle('on', shuffle); render(); };
$('#themeBtn').onclick = () => {
  st.dark = !st.dark; save();
  document.body.classList.toggle('dark', st.dark);
  $('#themeBtn').classList.toggle('on', st.dark);
  $('#themeBtn').textContent = st.dark ? '☀' : '🌙';
};
$('#fsUp').onclick = () => { st.fs = Math.min(1.5, +(st.fs+0.1).toFixed(2)); save(); document.documentElement.style.setProperty('--fs', st.fs); };
$('#fsDown').onclick = () => { st.fs = Math.max(0.8, +(st.fs-0.1).toFixed(2)); save(); document.documentElement.style.setProperty('--fs', st.fs); };
$('#printBtn').onclick = () => window.print();
$('#menuBtn').onclick = () => document.body.classList.toggle('navopen');
function closeNav(){ document.body.classList.remove('navopen'); }
document.addEventListener('click', e => {
  if (window.innerWidth<=900 && document.body.classList.contains('navopen')
      && !e.target.closest('aside') && !e.target.closest('#menuBtn')) closeNav();
});
$('#expBtn').onclick = () => {
  const dl = (text, name) => {
    const b = new Blob([text], {type:'text/markdown;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.click(); URL.revokeObjectURL(a.href);
  };

  if (view.kind === 'index'){
    const P = INDEX['part'+view.part];
    if (!P) return;
    const isA = view.part === 'A';
    let out = '# '+P.title+'\n\n> '+P.subtitle+'\n\n共 '+P.years.length+' 套\n\n---\n';
    P.years.slice().sort((a,b)=>b.year-a.year).forEach(y=>{
      out += '\n## '+y.year+' 年 · '+(isA ? (y.type||'')+' · '+(y.recipient||'') : (y.chartType||'')+' · '+(y.titleZh||''))+'\n\n';
      if (isA){
        out += '- **写作任务**：'+(y.taskZh||'')+'\n';
        if (y.points && y.points.length) out += '- **要点**：'+y.points.join('；')+'\n';
      } else {
        if (y.topicEn) out += '- **English topic**：'+y.topicEn+'\n';
        if (y.pictureZh) out += '- **图画/图表**：'+y.pictureZh+'\n';
        if (y.directionsZh) out += '- **写作要求**：'+y.directionsZh+'\n';
      }
      if (y.tip) out += '- **可复用角度**：'+y.tip+'\n';
      if (y.sources && y.sources.length)
        out += '- **真题解析 / 参考范文出处**：'+y.sources.map(u=>'<'+u+'>').join(' ')+'\n';
      if (y.model){
        out += '\n### 原创范文（'+y.model.words+' 词）\n\n';
        if (y.model.outline && y.model.outline.length)
          out += y.model.outline.map((x,i)=>'**'+(['一','二','三','四'][i]||(i+1))+'、'+x+'**').join('  \n')+'\n\n';
        out += y.model.en.trim()+'\n\n> 译文：'+y.model.zh+'\n';
      }
      out += '\n---\n';
    });
    dl(out, '考研英语一真题索引_'+(isA?'小作文':'大作文')+'.md');
    return;
  }

  const arr = filtered();
  const t = view.kind==='sec' ? SEC_BY_ID[view.id].title : '语料';
  let out = '# 考研英语一作文语料库 · ' + t + '\n\n共 ' + arr.length + ' 条\n\n';
  arr.forEach((e,i)=>{
    out += '### ' + (i+1) + '. ' + e.en + (e.pos&&e.pos!=='—' ? '  _'+e.pos+'_' : '') + (e.basic?'  (替换 '+e.basic+')':'') + '\n';
    out += '- **释义**：' + e.zh + '\n';
    out += '- **例句**：' + e.example + '\n';
    out += '- **译文**：' + e.exampleZh + '\n';
    out += '- **用法**：' + e.note + '\n\n';
  });
  dl(out, '考研英语一作文语料_' + t + '.md');
};

$('#themeBtn').textContent = st.dark ? '☀' : '🌙';
$('#modeBtn').classList.toggle('on', st.recite);
$('#modeBtn').textContent = st.recite ? '👁 已隐藏中文' : '👁 背诵模式';
updateFooter();
render();
</script>
