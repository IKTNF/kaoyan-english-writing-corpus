法各不相同。","pos":"—","type":"pattern","example":"When it comes to online learning, opinions vary from person to person.","exampleZh":"谈到在线学习，人们看法各异。","note":"引出有争议的话题，to 后接名词或动名词，不要接完整句子。"},{"en":"As is vividly depicted in the picture, ___","basic":"","zh":"正如图画中生动描绘的那样，……","pos":"—","type":"pattern","example":"As is vividly depicted in the picture, a young man is absorbed in his smartphone while his parents wait silently.","exampleZh":"正如图画中生动描绘的那样，一个年轻人专注于手机，而父母在一旁默默等待。","note":"图画作文首段画面描述句，depicted 后可换 shown，注意状语从句前用逗号隔开。"},{"en":"arouse widespread concern","basic":"","zh":"引起广泛关注","pos":"phr.","type":"phrase","example":"The declining birth rate has aroused widespread concern among demographers and policymakers.","exampleZh":"出生率下降已引起人口学家和政策制定者的广泛关注。","note":"首段点出现象影响，主语通常是现象，concern 可换 debate 或 attention。"},{"en":"This phenomenon can be attributed to several factors.","basic":"","zh":"这一现象可归因于若干因素。","pos":"—","type":"pattern","example":"This phenomenon can be attributed to several factors, among which economic pressure ranks first.","exampleZh":"这一现象可归因于若干因素，其中经济压力居于首位。","note":"第二段原因分析段的主题句，后可接定语从句具体展开首要原因。"},{"en":"Among the contributing factors, ___ ranks first.","basic":"","zh":"在诸多促成因素中，……居于首位。","pos":"—","type":"pattern","example":"Among the contributing factors, the excessive use of electronic devices ranks first.","exampleZh":"在诸多促成因素中，过度使用电子设备居于首位。","note":"承上启下点出首要原因，空格处填名词短语，谓语用单数 ranks。"},{"en":"It largely stems from ___","basic":"","zh":"这很大程度上源于……","pos":"—","type":"pattern","example":"It largely stems from the fact that parents place unrealistic expectations on their children.","exampleZh":"这在很大程度上源于父母对孩子抱有不切实际的期望。","note":"用于原因分析段，后可接 the fact that 从句，主语 it 指代上文现象。"},{"en":"be rooted in","basic":"","zh":"根源于……","pos":"phr.","type":"phrase","example":"Many social conflicts are rooted in the unequal distribution of resources.","exampleZh":"许多社会冲突根源于资源分配的不平等。","note":"表深层原因，常用 be deeply rooted in，主语多为复数名词。"},{"en":"account for","basic":"","zh":"占（比例）；解释……的原因","pos":"phr.","type":"phrase","example":"Careless driving accounts for a considerable proportion of traffic accidents every year.","exampleZh":"粗心驾驶在每年的交通事故中占相当大的比例。","note":"表占比或成因，主语单数时用 accounts for，勿与 count for 混淆。"},{"en":"give rise to","basic":"","zh":"引起，导致","pos":"phr.","type":"phrase","example":"The rapid development of artificial intelligence has given rise to widespread debate about employment.","exampleZh":"人工智能的迅速发展引发了关于就业的广泛争论。","note":"后接名词或名词短语，不接句子，结果多为中性或消极，时态随语境变化。"},{"en":"trigger","basic":"","zh":"引发，触发","pos":"vt.","type":"word","example":"Excessive pressure from examinations can trigger anxiety and even depression among adolescents.","exampleZh":"考试带来的过度压力会引发青少年的焦虑甚至抑郁。","note":"及物动词，后直接接名词，语气强于 cause，多用于消极后果。"},{"en":"engender","basic":"","zh":"产生，引起（某种情绪或局面）","pos":"vt.","type":"word","example":"Mutual trust engenders cooperation, whereas suspicion breeds conflict.","exampleZh":"相互信任催生合作，而猜疑滋生冲突。","note":"高级及物动词，后接抽象名词，不加介词，多用于第二段因果论证。"},{"en":"be conducive to","basic":"","zh":"有助于……，有益于……","pos":"phr.","type":"phrase","example":"A quiet study environment is conducive to deep concentration and sustained intellectual effort.","exampleZh":"安静的学习环境有助于深度专注与持续的智力投入。","note":"后接名词或动名词，不接句子，反义表达为 be detrimental to。"},{"en":"be detrimental to","basic":"","zh":"对……有害","pos":"phr.","type":"phrase","example":"Staying up late to play video games is detrimental to both eyesight and academic performance.","exampleZh":"熬夜打电子游戏对视力与学业表现都有害。","note":"常用于危害分析段，后接名词，勿接 that 从句，可替换为 be harmful to。"},{"en":"A case in point is ___","basic":"","zh":"一个恰当的例子是……","pos":"—","type":"pattern","example":"A case in point is the growing number of young people who choose to work from home.","exampleZh":"一个恰当的例子就是越来越多的年轻人选择居家办公。","note":"第二段举例论证，后接名词短语，勿写成 A case in point is that。"},{"en":"This is well exemplified by ___","basic":"","zh":"……就是很好的例证。","pos":"—","type":"pattern","example":"This is well exemplified by the widespread use of mobile payment in rural areas.","exampleZh":"农村地区移动支付的广泛使用就是很好的例证。","note":"被动语态举例句，后接名词短语，多紧跟在原因分析之后。"},{"en":"take ___ as a prime example","basic":"","zh":"以……为典型例子","pos":"phr.","type":"phrase","example":"We can take the bicycle-sharing boom as a prime example of green consumption.","exampleZh":"我们可以把共享单车的兴起作为绿色消费的典型例子。","note":"结构为 take A as a prime example of B，A 为具体事例，B 为抽象论点。"},{"en":"History abounds with such examples.","basic":"","zh":"历史上此类例子比比皆是。","pos":"—","type":"pattern","example":"History abounds with such examples, from the Wright brothers to today's space explorers.","exampleZh":"历史上此类例子比比皆是，从莱特兄弟到今天的太空探索者。","note":"可独立成句收束例证，abound 后固定搭配 with，不可换成 in。"},{"en":"Admittedly, ___. Nevertheless, ___","basic":"","zh":"诚然，……。然而，……","pos":"—","type":"pattern","example":"Admittedly, online courses save time and money; nevertheless, they cannot replace face-to-face interaction.","exampleZh":"诚然，网络课程省时省钱；然而，它们无法取代面对面交流。","note":"让步转折段核心句式，前半句承认对立面，后半句转回自己的主论点。"},{"en":"While it is true that ___, it does not follow that ___","basic":"","zh":"尽管……属实，但这并不意味着……","pos":"—","type":"pattern","example":"While it is true that technology boosts efficiency, it does not follow that it always improves our lives.","exampleZh":"尽管技术确实提高了效率，但这并不意味着它总能改善我们的生活。","note":"两个空格都须接完整从句，it does not follow that 意为并不能由此推出。"},{"en":"Granted that ___","basic":"","zh":"就算……，诚然……","pos":"—","type":"pattern","example":"Granted that the policy has certain flaws, its overall benefits should not be overlooked.","exampleZh":"就算该政策存在某些缺陷，其总体益处也不应被忽视。","note":"后接完整句子，先承认让步再转折，多用于第二段利弊分析。"},{"en":"albeit","basic":"","zh":"尽管，虽然（后接形容词或副词）","pos":"—","type":"word","example":"The reform has produced tangible results, albeit slowly and unevenly.","exampleZh":"这项改革已产生切实成效，尽管缓慢且不均衡。","note":"连词，后接形容词、副词或短语，不能接完整句子，语气正式。"},{"en":"notwithstanding","basic":"","zh":"尽管，虽然","pos":"—","type":"word","example":"Notwithstanding these obstacles, the team eventually fulfilled its ambitious goal.","exampleZh":"尽管有这些障碍，团队最终实现了其雄心勃勃的目标。","note":"可作介词接名词，也可置于名词后构成倒装，如 obstacles notwithstanding。"},{"en":"In stark contrast","basic":"","zh":"与之形成鲜明对比的是","pos":"phr.","type":"phrase","example":"City dwellers enjoy easy access to libraries; in stark contrast, villagers often have none.","exampleZh":"城市居民享有便利的图书馆资源；相比之下，村民往往一无所有。","note":"表强烈对比，前后须为并列的两类对象，多用在分号后另起分句。"},{"en":"Moreover","basic":"","zh":"此外，而且","pos":"adv.","type":"word","example":"Moreover, voluntary work helps students develop a sense of social responsibility.","exampleZh":"此外，志愿工作有助于培养学生的社会责任感。","note":"递进段首词，后加逗号，用于接续第二个并列理由，勿与 therefore 混用。"},{"en":"In addition to","basic":"","zh":"除……之外（还）","pos":"phr.","type":"phrase","example":"In addition to saving energy, cycling also keeps commuters physically fit.","exampleZh":"除了节省能源，骑行还能让通勤者保持身体健康。","note":"后接名词或动名词，常置句首，不可写成 In addition to do。"},{"en":"not merely ___ but also ___","basic":"","zh":"不仅……而且……","pos":"—","type":"pattern","example":"Reading not merely broadens our horizons but also cultivates our capacity for independent thought.","exampleZh":"阅读不仅拓宽我们的视野，还培养我们独立思考的能力。","note":"并列递进句式，前后两部分语法形式须一致，比 not only 更书面。"},{"en":"In light of the above analysis","basic":"","zh":"基于以上分析","pos":"phr.","type":"phrase","example":"In light of the above analysis, it is reasonable to advocate a balanced approach to online learning.","exampleZh":"基于以上分析，倡导一种均衡的在线学习方式是合理的。","note":"末段开头的过渡短语，后加逗号，承接上文并引出结论。"},{"en":"To sum up","basic":"","zh":"总而言之","pos":"phr.","type":"phrase","example":"To sum up, the picture reminds us that genuine communication deserves our serious attention.","exampleZh":"总之，这幅图画提醒我们，真正的交流值得我们认真关注。","note":"结论段首短语，后加逗号，比 in a word 正式，同一篇中不宜重复使用。"},{"en":"It is safe to conclude that ___","basic":"","zh":"可以有把握地得出结论：……","pos":"—","type":"pattern","example":"It is safe to conclude that persistence rather than talent determines one's final achievement.","exampleZh":"可以有把握地得出结论：决定一个人最终成就的是坚持而非天赋。","note":"末段总结句，后接完整从句，语气稳妥，适合图画与图表作文收尾。"},{"en":"All things considered","basic":"","zh":"综合考虑，总体而言","pos":"phr.","type":"phrase","example":"All things considered, the advantages of remote work outweigh its disadvantages.","exampleZh":"综合来看，远程工作的利大于弊。","note":"独立成分，后加逗号接主句，常用于利弊分析类题目的结论。"},{"en":"It is high time that we took concrete measures to ___","basic":"","zh":"该是我们采取具体措施去做……的时候了。","pos":"—","type":"pattern","example":"It is high time that we took concrete measures to curb food waste on campus.","exampleZh":"该是我们采取具体措施遏制校园食物浪费的时候了。","note":"建议段核心句型，that 从句谓语须用过去时，measure 常用复数形式。"},{"en":"Only by ___ can we ___","basic":"","zh":"只有通过……，我们才能……","pos":"—","type":"pattern","example":"Only by combining individual effort with government regulation can we achieve a low-carbon society.","exampleZh":"只有把个人努力与政府监管结合起来，我们才能建成低碳社会。","note":"部分倒装句，by 后接动名词，主句必须倒装，用于措施段收束。"},{"en":"The authorities concerned should ___","basic":"","zh":"有关当局应当……","pos":"—","type":"pattern","example":"The authorities concerned should enact stricter regulations to penalize illegal waste discharge.","exampleZh":"有关当局应制定更严格的法规，惩处非法排放废弃物的行为。","note":"措施段主语，形容词 concerned 后置，谓语用 should 加动词原形。"},{"en":"raise public awareness of","basic":"","zh":"提高公众对……的认识","pos":"phr.","type":"phrase","example":"Campaigns should be launched to raise public awareness of the importance of garbage sorting.","exampleZh":"应发起宣传活动，提高公众对垃圾分类重要性的认识。","note":"措施段高频表达，后接名词或动名词，宾语常用 importance 或 need。"},{"en":"enact stricter regulations","basic":"","zh":"制定更严格的法规","pos":"phr.","type":"phrase","example":"Governments ought to enact stricter regulations on the emission of industrial waste water.","exampleZh":"政府应对工业废水的排放制定更严格的法规。","note":"政策层面措施，主语多为 government 等机构，对象用 on 引出。"},{"en":"cultivate a favorable atmosphere","basic":"","zh":"营造良好氛围","pos":"phr.","type":"phrase","example":"Schools and families should join hands to cultivate a favorable atmosphere for honest behavior.","exampleZh":"学校与家庭应携手为诚信行为营造良好氛围。","note":"措施段收束表达，atmosphere 后用 for 引出所针对的行为或对象。"},{"en":"It is ___ that ___","basic":"","zh":"正是……（强调句型）","pos":"—","type":"pattern","example":"It is persistent effort that turns an ordinary learner into an accomplished master.","exampleZh":"正是持续的努力，把一个普通学习者变成技艺精湛的大师。","note":"强调句型，被强调成分放在 It is 之后，that 后接剩余句子成分。"},{"en":"What matters most is ___","basic":"","zh":"最重要的是……","pos":"—","type":"pattern","example":"What matters most is not how fast we progress but whether we keep moving forward.","exampleZh":"最重要的不是我们前进得多快，而是我们是否持续向前。","note":"主语从句表强调，后接名词或从句，常用于结尾段立意升华。"},{"en":"It is not ___ but ___ that ___","basic":"","zh":"不是……而是……（才）……","pos":"—","type":"pattern","example":"It is not material wealth but a sense of belonging that makes a family truly warm.","exampleZh":"使一个家庭真正温暖的并非物质财富，而是归属感。","note":"强调不是A而是B，两个空格须为同类结构，多用于论点深化处。"},{"en":"Not only does it ___, but it also ___","basic":"","zh":"它不仅……，而且还……","pos":"—","type":"pattern","example":"Not only does regular reading enrich our knowledge, but it also refines our character.","exampleZh":"经常阅读不仅丰富我们的知识，而且陶冶我们的品格。","note":"前一分句用助动词倒装，后一分句正常语序，前后时态保持一致。"},{"en":"So significant is ___ that ___","basic":"","zh":"……如此重要，以至于……","pos":"—","type":"pattern","example":"So significant is the role of education that no country can afford to neglect it.","exampleZh":"教育的作用如此重要，以至于任何国家都承担不起忽视它的代价。","note":"so 加形容词置于句首引起倒装，that 后接结果从句，用于强调重要性。"},{"en":"Never before have we ___","basic":"","zh":"我们从未像现在这样……","pos":"—","type":"pattern","example":"Never before have we been so dependent on digital devices in daily communication.","exampleZh":"我们从未像现在这样在日常交流中如此依赖数字设备。","note":"否定词提前引起完全倒装，后接过去分词，多用于现象评述段。"},{"en":"Were it not for ___, we would ___","basic":"","zh":"要不是……，我们就会……","pos":"—","type":"pattern","example":"Were it not for mutual cooperation, we would hardly overcome the difficulties we now face.","exampleZh":"要不是相互合作，我们几乎无法克服当前面对的困难。","note":"虚拟条件句省略 if 的倒装式，for 后接名词，主句用 would 加动词原形。"},{"en":"Should ___, ___","basic":"","zh":"如果……，就……","pos":"—","type":"pattern","example":"Should the government invest more in rural education, the urban-rural gap would gradually narrow.","exampleZh":"如果政府在农村教育上投入更多，城乡差距将逐渐缩小。","note":"省略 if 的虚拟条件倒装，主句用 would 加动词原形，常用于建议句。"},{"en":"Provided that","basic":"","zh":"只要……，在……条件下","pos":"—","type":"phrase","example":"Provided that both sides make concessions, the dispute can be settled peacefully.","exampleZh":"只要双方都做出让步，争端就可以和平解决。","note":"连词短语，后接完整句子，可替换为 on condition that 或 as long as。"},{"en":"to some extent","basic":"","zh":"在某种程度上","pos":"phr.","type":"phrase","example":"To some extent, the popularity of short videos reflects the impatience of modern life.","exampleZh":"在某种程度上，短视频的流行反映了现代生活的浮躁。","note":"表程度限制，可置句首加逗号或句末，使论断更严谨，避免绝对化。"},{"en":"more often than not","basic":"","zh":"往往，多半","pos":"phr.","type":"phrase","example":"More often than not, students who plan their time wisely outperform those who do not.","exampleZh":"通常情况下，善于规划时间的学生比不善于规划的学生表现更出色。","note":"作状语使用，可替换 frequently 以避免重复，增强语言变化。"},{"en":"by and large","basic":"","zh":"总的来说，大体上","pos":"phr.","type":"phrase","example":"By and large, the benefits of urbanization outweigh the problems it has brought about.","exampleZh":"总的来说，城市化的益处超过它所带来的问题。","note":"置于句首并加逗号，用于总体评价句，语气比 in general 更地道。"},{"en":"Faced with ___, we should ___","basic":"","zh":"面对……，我们应当……","pos":"—","type":"pattern","example":"Faced with fierce competition in the job market, we should sharpen our professional skills.","exampleZh":"面对就业市场的激烈竞争，我们应当磨砺专业技能。","note":"过去分词短语作状语，其逻辑主语须与主句主语一致，常用于措施段。"},{"en":"Given that ___","basic":"","zh":"鉴于……，考虑到……","pos":"—","type":"pattern","example":"Given that natural resources are limited, it is urgent that we conserve energy.","exampleZh":"鉴于自然资源有限，我们迫切需要节约能源。","note":"后接完整从句表前提，可置于句首引出背景，后接主句提出主张。"},{"en":"Judging from ___","basic":"","zh":"从……来看","pos":"—","type":"pattern","example":"Judging from the chart, the number of private cars rose steadily over the past decade.","exampleZh":"从图表来看，过去十年私家车数量稳步上升。","note":"图表作文首段描述数据，from 后接 the chart 或 the figures，不必加主语。"}],"file":"11-argue.json"},{"id":"proverb","title":"名言谚语金句库","emoji":"✨","group":"大作文·通用工具箱","desc":"收录考研英语一大作文高频引用的英语谚语与名家名言，附示范嵌入句与适用主题。","entries":[{"en":"Where there is a will, there is a way.","basic":"","zh":"有志者事竟成。","pos":"—","type":"proverb","example":"As the saying goes, where there is a will there is a way, and persistence always pays off.","exampleZh":"常言道，有志者事竟成，坚持终会有回报。","note":"①英语谚语；②个人品质——论证毅力与坚持，置于第二段例证引入处。"},{"en":"Rome was not built in a day.","basic":"","zh":"罗马不是一天建成的。","pos":"—","type":"proverb","example":"Rome was not built in a day, so lasting progress in language learning calls for patience.","exampleZh":"罗马不是一天建成的，因此语言学习上的持久进步需要耐心。","note":"①英语谚语；②学习与教育——论证循序渐进，用于分析段收束。"},{"en":"Constant dripping wears away a stone.","basic":"","zh":"水滴石穿。","pos":"—","type":"proverb","example":"Constant dripping wears away a stone; a few pages of reading every day will finally pay off.","exampleZh":"水滴石穿；每天读几页书终会有回报。","note":"①英语谚语；②个人品质——强调日积月累的效应，宜置于第二段论证。"},{"en":"Genius is one percent inspiration and ninety-nine percent perspiration.","basic":"","zh":"天才是百分之一的灵感加百分之九十九的汗水。","pos":"—","type":"proverb","example":"Thomas Edison reminded us that genius is one percent inspiration and ninety-nine percent perspiration.","exampleZh":"托马斯·爱迪生提醒我们，天才是百分之一的灵感加百分之九十九的汗水。","note":"①Thomas Edison；②个人品质——论证勤奋胜过天资，用于第二段论证。"},{"en":"Actions speak louder than words.","basic":"","zh":"行动胜于言辞。","pos":"—","type":"proverb","example":"Actions speak louder than words, which is why volunteers deserve our genuine respect.","exampleZh":"行动胜于言辞，正因如此志愿者值得我们真诚的尊敬。","note":"①英语谚语；②社会公德——论证实践与奉献，可用于第二段或结尾段。"},{"en":"A journey of a thousand miles begins with a single step.","basic":"","zh":"千里之行，始于足下。","pos":"—","type":"proverb","example":"As Lao Tzu said, a journey of a thousand miles begins with a single step.","exampleZh":"正如老子所言，千里之行，始于足下。","note":"①Lao Tzu（老子）；②个人品质——号召迈出第一步，适合结尾段收束。"},{"en":"Well begun is half done.","basic":"","zh":"好的开始是成功的一半。","pos":"—","type":"proverb","example":"Well begun is half done, so a clear plan often saves us half the effort.","exampleZh":"好的开始等于成功的一半，因此清晰的计划常能省下一半力气。","note":"①英语谚语；②学习与教育——论证规划的重要性，宜用于建议段。"},{"en":"Strike while the iron is hot.","basic":"","zh":"趁热打铁。","pos":"—","type":"proverb","example":"We should strike while the iron is hot and seize the chance to improve ourselves.","exampleZh":"我们应当趁热打铁，抓住提升自我的机会。","note":"①英语谚语；②经济职业——论证把握时机，用于建议或结论段。"},{"en":"Knowledge is power.","basic":"","zh":"知识就是力量。","pos":"—","type":"proverb","example":"Francis Bacon was right that knowledge is power in an era of fierce competition.","exampleZh":"在竞争激烈的时代，弗朗西斯·培根说知识就是力量是没错的。","note":"①Francis Bacon；②学习与教育——点明知识价值，首段或末段皆可使用。"},{"en":"Live and learn.","basic":"","zh":"活到老，学到老。","pos":"—","type":"proverb","example":"Live and learn, for every new experience teaches us something we did not know.","exampleZh":"活到老学到老，因为每一次新经历都会教给我们未知的东西。","note":"①英语谚语；②学习与教育——论证终身学习，多用于第二段论证。"},{"en":"Practice makes perfect.","basic":"","zh":"熟能生巧。","pos":"—","type":"proverb","example":"Practice makes perfect, which explains why top athletes train for hours every day.","exampleZh":"熟能生巧，这就解释了为什么顶尖运动员每天训练数小时。","note":"①英语谚语；②学习与教育——论证反复练习的必要性，后接例证。"},{"en":"Education is the most powerful weapon which you can use to change the world.","basic":"","zh":"教育是你用来改变世界的最强大武器。","pos":"—","type":"proverb","example":"Nelson Mandela once said that education is the most powerful weapon which you can use to change the world.","exampleZh":"纳尔逊·曼德拉曾说，教育是你用来改变世界的最强大武器。","note":"①Nelson Mandela；②学习与教育——立意升华句，宜置于结尾段。"},{"en":"Reading makes a full man.","basic":"","zh":"读书使人充实。","pos":"—","type":"proverb","example":"As Bacon put it, reading makes a full man, and our campus library proves it.","exampleZh":"正如培根所言，读书使人充实，我们校园的图书馆就是明证。","note":"①Francis Bacon；②学习与教育——论证阅读的价值，可用于第二段。"},{"en":"United we stand, divided we fall.","basic":"","zh":"团结则存，分裂则亡。","pos":"—","type":"proverb","example":"United we stand, divided we fall, and this truth applies to every team on campus.","exampleZh":"团结则存，分裂则亡，这条真理适用于校园里的每个团队。","note":"①英语谚语；②社会公德——论证团结协作，可作第二段主旨句。"},{"en":"Many hands make light work.","basic":"","zh":"人多好办事。","pos":"—","type":"proverb","example":"Many hands make light work, so the whole class finished the project ahead of schedule.","exampleZh":"人多好办事，因此全班提前完成了项目。","note":"①英语谚语；②社会公德——论证合作效率，多作例证句使用。"},{"en":"Two heads are better than one.","basic":"","zh":"三个臭皮匠，顶个诸葛亮。","pos":"—","type":"proverb","example":"Two heads are better than one, which is why group discussion often sparks fresh ideas.","exampleZh":"三个臭皮匠顶个诸葛亮，正因如此小组讨论常能激发新想法。","note":"①英语谚语；②学习与教育——论证讨论式学习，用于第二段。"},{"en":"No man is an island.","basic":"","zh":"没有人是一座孤岛。","pos":"—","type":"proverb","example":"As John Donne wrote, no man is an island, and mutual help keeps society alive.","exampleZh":"正如约翰·多恩所写，没有人是一座孤岛，相互帮助让社会充满生机。","note":"①John Donne；②家庭情感——论证人与人的联结，适合第二段或末段。"},{"en":"Honesty is the best policy.","basic":"","zh":"诚实为上策。","pos":"—","type":"proverb","example":"Honesty is the best policy, for a single lie may destroy years of trust.","exampleZh":"诚实为上策，因为一次谎言可能毁掉多年的信任。","note":"①英语谚语；②社会公德——论证诚信价值，宜作论证段首句。"},{"en":"A friend in need is a friend indeed.","basic":"","zh":"患难之交才是真朋友。","pos":"—","type":"proverb","example":"A friend in need is a friend indeed, and true friendship shows itself in hard times.","exampleZh":"患难之交才是真朋友，真正的友谊在艰难时刻显现。","note":"①英语谚语；②家庭情感——论证真挚友谊，用于第二段例证。"},{"en":"Haste makes waste.","basic":"","zh":"欲速则不达。","pos":"—","type":"proverb","example":"Haste makes waste, so we had better weigh every option before making a decision.","exampleZh":"欲速则不达，因此做决定前我们最好权衡每一个选项。","note":"①英语谚语；②经济职业——论证谨慎决策，宜用于建议段。"},{"en":"Failure is the mother of success.","basic":"","zh":"失败是成功之母。","pos":"—","type":"proverb","example":"Failure is the mother of success, and every failed experiment taught the team something.","exampleZh":"失败是成功之母，每一次失败的实验都教会了团队一些东西。","note":"①英语谚语；②个人品质——论证挫折的价值，用于第二段论证。"},{"en":"Every cloud has a silver lining.","basic":"","zh":"黑暗中总有一线光明。","pos":"—","type":"proverb","example":"Every cloud has a silver lining, and the pandemic pushed us to master online tools.","exampleZh":"黑暗中总有一线光明，疫情促使我们掌握了在线工具。","note":"①英语谚语；②健康生活——论证危机中的转机，可用于结尾段。"},{"en":"Adversity makes a man wise.","basic":"","zh":"逆境使人明智。","pos":"—","type":"proverb","example":"Adversity makes a man wise, and those who survived hardship often value life more.","exampleZh":"逆境使人明智，经历过苦难的人往往更珍惜生活。","note":"①英语谚语；②个人品质——论证逆境的磨炼作用，用于第二段。"},{"en":"What does not kill me makes me stronger.","basic":"","zh":"凡杀不死我的，必使我更强大。","pos":"—","type":"proverb","example":"Nietzsche claimed that what does not kill me makes me stronger, and setbacks prove it.","exampleZh":"尼采声称，凡杀不死我的必使我更强大，挫折就是证明。","note":"①Friedrich Nietzsche；②个人品质——论证挫折教育，宜放在论证段。"},{"en":"Time and tide wait for no man.","basic":"","zh":"时光如流水，不等人。","pos":"—","type":"proverb","example":"Time and tide wait for no man, so we should seize the day and act at once.","exampleZh":"时光不等人，因此我们应当抓住当下立即行动。","note":"①英语谚语；②学习与教育——论证珍惜时间，用于建议或结论段。"},{"en":"An hour in the morning is worth two in the evening.","basic":"","zh":"清晨一小时抵得上晚上两小时。","pos":"—","type":"proverb","example":"An hour in the morning is worth two in the evening, so early risers often learn faster.","exampleZh":"清晨一小时抵得上晚上两小时，因此早起的人往往学得更快。","note":"①英语谚语；②健康生活——论证规律作息与效率，可用于建议段。"},{"en":"We do not inherit the earth from our ancestors; we borrow it from our children.","basic":"","zh":"我们不是从祖先那里继承地球，而是从子孙那里借用它。","pos":"—","type":"proverb","example":"We do not inherit the earth from our ancestors; we borrow it from our children, so green living is a duty.","exampleZh":"我们不是从祖先那里继承地球，而是从子孙那里借用它，因此绿色生活是一种责任。","note":"①美洲原住民谚语；②生态环保——升华环保立意，宜置于结尾段。"},{"en":"The best time to plant a tree was twenty years ago; the second best time is now.","basic":"","zh":"种树最好的时间是二十年前，其次是现在。","pos":"—","type":"proverb","example":"The best time to plant a tree was twenty years ago; the second best time is now, so start today.","exampleZh":"种树最好的时间是二十年前，其次是现在，所以从今天就开始吧。","note":"①常引作中国谚语（佚名）；②生态环保——号召立即行动，适合结尾段。"},{"en":"Every coin has two sides.","basic":"","zh":"凡事都有两面性。","pos":"—","type":"proverb","example":"Every coin has two sides, and artificial intelligence is no exception to this rule.","exampleZh":"凡事都有两面性，人工智能也不例外。","note":"①英语谚语；②科技与互联网——引出利弊分析，宜作第二段首句。"},{"en":"Science is a good servant but a bad master.","basic":"","zh":"科学是好仆人，却是坏主人。","pos":"—","type":"proverb","example":"Science is a good servant but a bad master, so we must guide its use with ethics.","exampleZh":"科学是好仆人却是坏主人，因此我们必须用伦理引导它的使用。","note":"①英语谚语；②科技与互联网——论证科技双刃剑，用于论证段。"},{"en":"The Internet is becoming the town square for the global village of tomorrow.","basic":"","zh":"互联网正成为明日地球村的城镇广场。","pos":"—","type":"proverb","example":"Bill Gates predicted that the Internet is becoming the town square for the global village of tomorrow.","exampleZh":"比尔·盖茨预言，互联网正成为明日地球村的城镇广场。","note":"①Bill Gates；②科技与互联网——论证网络的社会功能，用于第二段。"},{"en":"A nation's culture resides in the hearts and souls of its people.","basic":"","zh":"一个民族的文化存在于其人民的心灵与灵魂之中。","pos":"—","type":"proverb","example":"Gandhi believed that a nation's culture resides in the hearts and souls of its people.","exampleZh":"甘地认为，一个民族的文化存在于其人民的心灵与灵魂之中。","note":"①Mahatma Gandhi；②文化传承——升华文化立意，宜用于结尾段。"},{"en":"A sound mind in a sound body.","basic":"","zh":"健全的精神寓于健康的身体。","pos":"—","type":"proverb","example":"A sound mind in a sound body, so daily exercise benefits both body and mind.","exampleZh":"健全的精神寓于健康的身体，因此每天锻炼身心皆受益。","note":"①古罗马谚语（源出尤维纳利斯）；②健康生活——论证身心关系，用于第二段。"},{"en":"Health is not valued till sickness comes.","basic":"","zh":"人只有在生病时才珍惜健康。","pos":"—","type":"proverb","example":"Health is not valued till sickness comes, so young people should not stay up late.","exampleZh":"人只有在生病时才珍惜健康，因此年轻人不应熬夜。","note":"①英语谚语；②健康生活——论证健康意识，用于分析或建议段。"},{"en":"The future belongs to those who believe in the beauty of their dreams.","basic":"","zh":"未来属于那些相信梦想之美的人。","pos":"—","type":"proverb","example":"Eleanor Roosevelt insisted that the future belongs to those who believe in the beauty of their dreams.","exampleZh":"埃莉诺·罗斯福坚信，未来属于那些相信梦想之美的人。","note":"①Eleanor Roosevelt；②个人品质——梦想类结尾升华句，适合末段收束。"},{"en":"The best way to predict the future is to create it.","basic":"","zh":"预测未来的最好方式就是创造未来。","pos":"—","type":"proverb","example":"As Peter Drucker observed, the best way to predict the future is to create it.","exampleZh":"正如彼得·德鲁克所言，预测未来的最好方式就是创造未来。","note":"①常引作Peter Drucker；②经济职业——号召主动作为，宜用于结尾段。"},{"en":"Be the change you wish to see in the world.","basic":"","zh":"成为你希望在这个世界上看到的改变。","pos":"—","type":"proverb","example":"Gandhi urged us to be the change we wish to see in the world.","exampleZh":"甘地呼吁我们成为我们希望在这个世界上看到的改变。","note":"①Mahatma Gandhi；②社会公德——结尾段行动号召，可与措施句连用。"},{"en":"Diligence is the mother of good fortune.","basic":"","zh":"勤奋是好运之母。","pos":"—","type":"proverb","example":"Cervantes declared that diligence is the mother of good fortune, and effort never betrays us.","exampleZh":"塞万提斯宣称，勤奋是好运之母，努力从不会辜负我们。","note":"①Miguel de Cervantes；②经济职业——论证勤奋与机遇，用于论证段。"},{"en":"Lost time is never found again.","basic":"","zh":"失去的时间再也找不回来。","pos":"—","type":"proverb","example":"Benjamin Franklin warned that lost time is never found again, so we must treasure it.","exampleZh":"本杰明·富兰克林告诫说，失去的时间再也找不回来，因此我们必须珍惜它。","note":"①Benjamin Franklin；②学习与教育——论证珍惜时间，用于建议或结论段。"},{"en":"Charity begins at home.","basic":"","zh":"仁爱始于家庭。","pos":"—","type":"proverb","example":"Charity begins at home, so caring for our parents comes before helping strangers.","exampleZh":"仁爱始于家庭，因此关爱父母先于帮助陌生人。","note":"①英语谚语；②家庭情感——论证孝亲与家庭责任，用于第二段。"},{"en":"Little strokes fell great oaks.","basic":"","zh":"一斧一斧砍下去，巨橡也会倒。","pos":"—","type":"proverb","example":"Little strokes fell great oaks, and small daily efforts finally reshape a person.","exampleZh":"一斧一斧砍下去巨橡也会倒，每天微小的努力终能重塑一个人。","note":"①Benjamin Franklin；②个人品质——论证积少成多，用于第二段论证。"},{"en":"Smooth seas do not make skillful sailors.","basic":"","zh":"平静的海面练不出熟练的水手。","pos":"—","type":"proverb","example":"Smooth seas do not make skillful sailors, so hardship often builds real competence.","exampleZh":"平静的海面练不出熟练的水手，因此艰难往往造就真正的能力。","note":"①African proverb（非洲谚语）；②个人品质——论证磨砺与成长，用于第二段。"},{"en":"Early to bed and early to rise makes a man healthy, wealthy and wise.","basic":"","zh":"早睡早起使人健康、富有而明智。","pos":"—","type":"proverb","example":"As Franklin said, early to bed and early to rise makes a man healthy, wealthy and wise.","exampleZh":"正如富兰克林所说，早睡早起使人健康、富有而明智。","note":"①Benjamin Franklin；②健康生活——论证规律作息，用于第二段或建议段。"},{"en":"The secret of getting ahead is getting started.","basic":"","zh":"取得进展的秘诀在于开始行动。","pos":"—","type":"proverb","example":"Mark Twain believed that the secret of getting ahead is getting started, not perfect planning.","exampleZh":"马克·吐温认为，取得进展的秘诀在于开始行动，而非完美的计划。","note":"①Mark Twain；②经济职业——鼓励立即行动，宜用于结尾段号召。"},{"en":"Coming together is a beginning, staying together is progress, and working together is success.","basic":"","zh":"相聚是开始，相守是进步，合作才是成功。","pos":"—","type":"proverb","example":"Henry Ford once remarked that coming together is a beginning, staying together is progress, and working together is success.","exampleZh":"亨利·福特曾说，相聚是开始，相守是进步，合作才是成功。","note":"①Henry Ford；②经济职业——论证团队合作，可作第二段主旨句。"}],"file":"12-proverb.json"},{"id":"upgrade","title":"高级替换词表","emoji":"⬆️","group":"大作文·通用工具箱","desc":"把作文里的初级词升级为中高级表达，覆盖四十组高频替换对，直接提升语言得分档次。","entries":[{"en":"crucial","basic":"important","zh":"至关重要的","pos":"adj.","type":"word","example":"It is crucial that college students strike a proper balance between study and social practice.","exampleZh":"大学生在学业与社会实践之间取得恰当平衡至关重要。","note":"常用于 It is crucial that… 结构，从句谓语用(should) do。"},{"en":"indispensable","basic":"important","zh":"不可或缺的","pos":"adj.","type":"word","example":"The Internet has become an indispensable part of our daily life and work.","exampleZh":"互联网已成为我们日常生活和工作中不可或缺的一部分。","note":"多修饰事物，搭配 be indispensable to/for sth。"},{"en":"play a pivotal role in","basic":"important","zh":"在……中起关键作用","pos":"phr.","type":"phrase","example":"Parents play a pivotal role in shaping their children's character and values.","exampleZh":"父母在塑造孩子的性格与价值观方面起着关键作用。","note":"后接名词或动名词，主语多为事物或群体。"},{"en":"beneficial","basic":"good","zh":"有益的","pos":"adj.","type":"word","example":"Reading classic literature is beneficial to the development of independent thinking.","exampleZh":"阅读经典文学有助于培养独立思考能力。","note":"固定搭配 be beneficial to sb/sth，介词只用 to。"},{"en":"rewarding","basic":"good","zh":"有收获的，值得的","pos":"adj.","type":"word","example":"Volunteering in rural schools proved to be a rewarding experience for college students.","exampleZh":"到乡村学校支教对大学生来说是一段有收获的经历。","note":"多修饰 experience、job 等，强调付出后有回报。"},{"en":"commendable","basic":"good","zh":"值得称赞的","pos":"adj.","type":"word","example":"Their efforts to help the elderly in the community are highly commendable.","exampleZh":"他们帮助社区老人的努力非常值得称赞。","note":"修饰行为、举措，常与 highly 连用。"},{"en":"detrimental","basic":"bad","zh":"有害的","pos":"adj.","type":"word","example":"Excessive reliance on smartphones is detrimental to students' eyesight and concentration.","exampleZh":"过度依赖智能手机有害于学生的视力和注意力。","note":"固定搭配 be detrimental to sth，比 harmful 更正式。"},{"en":"adverse","basic":"bad","zh":"不利的，负面的","pos":"adj.","type":"word","example":"Staying up late has an adverse effect on both health and academic performance.","exampleZh":"熬夜对健康和学业表现都有不利影响。","note":"高频搭配 adverse effect/impact on sth。"},{"en":"counterproductive","basic":"bad","zh":"适得其反的","pos":"adj.","type":"word","example":"Pressing children too hard to excel may prove counterproductive in the long run.","exampleZh":"过度施压让孩子出类拔萃，从长远看可能适得其反。","note":"多作表语，指手段与目的相违背。"},{"en":"a multitude of","basic":"many","zh":"众多的","pos":"phr.","type":"phrase","example":"A multitude of graduates are competing for a limited number of well-paid positions.","exampleZh":"众多毕业生正在竞争数量有限的高薪岗位。","note":"后接可数名词复数，谓语动词用复数。"},{"en":"a host of","basic":"many","zh":"大量的，许多","pos":"phr.","type":"phrase","example":"Global warming has brought a host of challenges to coastal cities.","exampleZh":"全球变暖给沿海城市带来了诸多挑战。","note":"a host of problems/challenges 为高频搭配。"},{"en":"an increasing number of","basic":"more and more","zh":"越来越多的","pos":"phr.","type":"phrase","example":"An increasing number of young people choose to work in big cities after graduation.","exampleZh":"越来越多的年轻人毕业后选择在大城市工作。","note":"只接可数名词复数，谓语动词用复数。"},{"en":"increasingly","basic":"more and more","zh":"越来越","pos":"adv.","type":"word","example":"Online education is increasingly popular among working adults.","exampleZh":"在线教育在在职成年人中越来越受欢迎。","note":"修饰形容词或副词，不能直接修饰名词。"},{"en":"hold the view that","basic":"think","zh":"持……的观点","pos":"phr.","type":"pattern","example":"Many educators hold the view that creativity matters more than mere memorization.","exampleZh":"许多教育工作者认为创造力比单纯记忆更重要。","note":"后接完整句子，适合引出他人观点。"},{"en":"contend","basic":"think","zh":"主张，认为","pos":"v.","type":"word","example":"Some critics contend that standardized tests fail to measure real ability.","exampleZh":"一些批评者认为标准化考试无法衡量真正的能力。","note":"及物动词，后接 that 从句，语气较强。"},{"en":"From my perspective","basic":"I think","zh":"在我看来","pos":"phr.","type":"phrase","example":"From my perspective, the advantages of online learning far outweigh its drawbacks.","exampleZh":"在我看来，在线学习的优点远大于缺点。","note":"逗号后接完整句子，适合段首引出观点。"},{"en":"I am firmly convinced that","basic":"I think","zh":"我坚信","pos":"phr.","type":"pattern","example":"I am firmly convinced that diligence is the key to academic success.","exampleZh":"我坚信勤奋是学业成功的关键。","note":"语气坚定，适合结尾段表明立场。"},{"en":"exceedingly","basic":"very","zh":"极其","pos":"adv.","type":"word","example":"Competition for jobs has become exceedingly fierce in recent years.","exampleZh":"近年来求职竞争变得极其激烈。","note":"修饰形容词或副词，属正式书面语。"},{"en":"remarkably","basic":"very","zh":"显著地，非常","pos":"adv.","type":"word","example":"The city has changed remarkably over the past two decades.","exampleZh":"过去二十年里，这座城市发生了显著变化。","note":"可修饰动词与形容词，强调程度引人注目。"},{"en":"enormous","basic":"big","zh":"巨大的","pos":"adj.","type":"word","example":"The project requires an enormous amount of time and money.","exampleZh":"这个项目需要投入大量的时间和金钱。","note":"常搭 an enormous amount of + 不可数名词。"},{"en":"considerable","basic":"big","zh":"相当大的","pos":"adj.","type":"word","example":"A considerable number of parents are worried about their children's screen time.","exampleZh":"相当多的家长担心孩子的屏幕使用时间。","note":"高频搭配 a considerable number/amount of。"},{"en":"slight","basic":"small","zh":"轻微的","pos":"adj.","type":"word","example":"There has been a slight decline in the number of traffic accidents this year.","exampleZh":"今年交通事故的数量略有下降。","note":"常修饰 decline、increase、difference 等。"},{"en":"marginal","basic":"small","zh":"微小的，边缘的","pos":"adj.","type":"word","example":"The new policy had only a marginal effect on housing prices.","exampleZh":"新政策对房价只有微小的影响。","note":"修饰 effect/change，指几乎可忽略不计。"},{"en":"obtain","basic":"get","zh":"获得","pos":"v.","type":"word","example":"Students can obtain valuable experience through part-time jobs.","exampleZh":"学生可以通过兼职获得宝贵的经验。","note":"及物动词，后直接接具体事物，不接双宾语。"},{"en":"acquire","basic":"get","zh":"获得，习得","pos":"v.","type":"word","example":"Children acquire language skills most effectively through daily communication.","exampleZh":"儿童通过日常交流最有效地习得语言技能。","note":"多指经努力获得知识、技能或习惯。"},{"en":"generate","basic":"make","zh":"产生，创造","pos":"v.","type":"word","example":"Renewable energy can generate huge economic benefits for the whole society.","exampleZh":"可再生能源能为全社会创造巨大的经济效益。","note":"及物动词，常接 benefits、income、interest。"},{"en":"produce","basic":"make","zh":"产生，造成","pos":"v.","type":"word","example":"The excessive use of disposable products has produced undesirable consequences.","exampleZh":"一次性产品的过度使用已造成不良后果。","note":"及物动词，多接结果、影响类名词。"},{"en":"facilitate","basic":"help","zh":"促进，使便利","pos":"v.","type":"word","example":"The new subway line will facilitate communication between the two districts.","exampleZh":"新地铁线路将便利两个城区之间的往来。","note":"及物动词，后接名词或动名词，不接 to do。"},{"en":"contribute to","basic":"help","zh":"有助于，促成","pos":"phr.","type":"phrase","example":"Regular exercise contributes to both physical health and mental well-being.","exampleZh":"规律锻炼有助于身体健康和心理健康。","note":"后接名词或动名词；也可表导致某种结果。"},{"en":"utilize","basic":"use","zh":"利用","pos":"v.","type":"word","example":"We should fully utilize digital resources to improve our learning efficiency.","exampleZh":"我们应充分利用数字资源来提高学习效率。","note":"及物动词，比 use 正式，多接资源、时间。"},{"en":"capitalize on","basic":"use","zh":"利用（机会、优势）","pos":"phr.","type":"phrase","example":"Graduates should capitalize on every opportunity to gain practical experience.","exampleZh":"毕业生应利用每一个机会获取实践经验。","note":"后接机会、优势类名词，介词只能用 on。"},{"en":"demonstrate","basic":"show","zh":"表明，证明","pos":"v.","type":"word","example":"The chart demonstrates a steady rise in the number of online shoppers.","exampleZh":"该图表表明网购人数持续上升。","note":"及物动词，接名词或 that 从句，图表作文常用。"},{"en":"illustrate","basic":"show","zh":"说明，阐明","pos":"v.","type":"word","example":"This case clearly illustrates the importance of teamwork in modern society.","exampleZh":"这一案例清楚说明了团队合作在现代社会的重要性。","note":"及物动词，常接观点、道理，也可指配图。"},{"en":"give rise to","basic":"cause","zh":"引起，导致","pos":"phr.","type":"phrase","example":"The overuse of chemical fertilizers has given rise to serious soil pollution.","exampleZh":"化肥的过度使用已导致严重的土壤污染。","note":"后接名词，多指不良后果。"},{"en":"result in","basic":"cause","zh":"导致","pos":"phr.","type":"phrase","example":"Careless driving often results in serious traffic accidents.","exampleZh":"粗心驾驶常常导致严重的交通事故。","note":"主语是原因，宾语是结果；勿与 result from 混淆。"},{"en":"tackle","basic":"solve","zh":"着手解决","pos":"v.","type":"word","example":"The government should take effective measures to tackle urban traffic congestion.","exampleZh":"政府应采取有效措施解决城市交通拥堵问题。","note":"及物动词，直接接 problem、issue 等名词。"},{"en":"address","basic":"solve","zh":"应对，处理","pos":"v.","type":"word","example":"Universities must address the growing mental health needs of students.","exampleZh":"高校必须应对学生日益增长的心理健康需求。","note":"及物动词，此处意为着手处理，非致辞。"},{"en":"enhance","basic":"improve","zh":"提高，增强","pos":"v.","type":"word","example":"Reading widely can enhance our ability to think critically.","exampleZh":"广泛阅读能增强我们的批判性思维能力。","note":"及物动词，多接 ability、quality、efficiency。"},{"en":"optimize","basic":"improve","zh":"优化","pos":"v.","type":"word","example":"The company optimized its management system to raise working efficiency.","exampleZh":"该公司优化了管理体系以提高工作效率。","note":"及物动词，多接结构、流程、配置类名词。"},{"en":"necessitate","basic":"need","zh":"使……成为必要","pos":"v.","type":"word","example":"The rapid growth of cities necessitates large investment in public transport.","exampleZh":"城市的快速扩张使公共交通的大量投入成为必要。","note":"及物动词，主语多为客观情况，不用于人。"},{"en":"call for","basic":"need","zh":"需要，要求","pos":"phr.","type":"phrase","example":"The serious situation calls for immediate action from all sides.","exampleZh":"严峻的形势需要各方立即采取行动。","note":"主语为事物时表示需要，后接名词或动名词。"},{"en":"individuals","basic":"people","zh":"个人","pos":"n.","type":"word","example":"Individuals should take responsibility for reducing plastic waste in daily life.","exampleZh":"个人应为减少日常生活中的塑料垃圾承担责任。","note":"可数名词，泛指人们时须用复数形式。"},{"en":"the general public","basic":"people","zh":"公众","pos":"n.","type":"phrase","example":"The general public should be encouraged to adopt a low-carbon lifestyle.","exampleZh":"应鼓励公众采取低碳的生活方式。","note":"固定搭配须加定冠词 the，作主语时谓语用单数。"},{"en":"matter","basic":"thing","zh":"事情","pos":"n.","type":"word","example":"Whether to work or study abroad is a matter of personal choice.","exampleZh":"工作还是出国深造是个人选择的问题。","note":"a matter of… 为高频结构，后接抽象名词。"},{"en":"aspect","basic":"thing","zh":"方面","pos":"n.","type":"word","example":"We should consider the issue from every aspect before making a decision.","exampleZh":"做决定之前，我们应从各个方面考虑这一问题。","note":"常搭配 from the… aspect、in this aspect。"},{"en":"approach","basic":"way","zh":"方法，途径","pos":"n.","type":"word","example":"A flexible approach to learning is more effective than rigid memorization.","exampleZh":"灵活的学习方法比死记硬背更有效。","note":"搭配 an approach to doing sth，to 后接动名词。"},{"en":"means","basic":"way","zh":"手段，方式","pos":"n.","type":"word","example":"Public transport is an effective means of easing traffic pressure.","exampleZh":"公共交通是缓解交通压力的有效手段。","note":"单复数同形，常搭 a means of doing sth。"},{"en":"dilemma","basic":"problem","zh":"两难困境","pos":"n.","type":"word","example":"Many graduates face the dilemma of choosing between stability and opportunity.","exampleZh":"许多毕业生面临在稳定与机遇之间选择的两难困境。","note":"指难以取舍的处境，常搭 face the dilemma of。"},{"en":"obstacle","basic":"problem","zh":"障碍","pos":"n.","type":"word","example":"Lack of confidence is the biggest obstacle to personal growth.","exampleZh":"缺乏自信是个人成长最大的障碍。","note":"固定搭配 an obstacle to sth，介词用 to。"},{"en":"challenging","basic":"difficult","zh":"有挑战性的","pos":"adj.","type":"word","example":"Adapting to a new working environment can be challenging for fresh graduates.","exampleZh":"适应新的工作环境对刚毕业的学生来说颇具挑战。","note":"含积极意味，比 difficult 更委婉得体。"},{"en":"formidable","basic":"difficult","zh":"艰巨的，难以对付的","pos":"adj.","type":"word","example":"Reducing carbon emissions is a formidable task for developing countries.","exampleZh":"减少碳排放对发展中国家来说是一项艰巨的任务。","note":"多修饰 task、challenge、obstacle 等名词。"},{"en":"straightforward","basic":"easy","zh":"简单明了的","pos":"adj.","type":"word","example":"The solution to this problem is actually quite straightforward.","exampleZh":"这个问题的解决办法其实相当简单明了。","note":"指步骤清楚、不复杂，可作表语或定语。"},{"en":"accessible","basic":"easy","zh":"易获得的，易理解的","pos":"adj.","type":"word","example":"Online courses have made higher education accessible to more learners.","exampleZh":"在线课程使更多学习者能够接受高等教育。","note":"搭配 be accessible to sb，介词固定为 to。"},{"en":"delighted","basic":"happy","zh":"高兴的，乐意的","pos":"adj.","type":"word","example":"I would be delighted to share my experience with the new members.","exampleZh":"我很乐意与新成员分享我的经验。","note":"常用 be delighted to do sth，语气礼貌得体。"},{"en":"frustrated","basic":"sad","zh":"沮丧的，受挫的","pos":"adj.","type":"word","example":"Many young people feel frustrated when their efforts bring no immediate results.","exampleZh":"当努力没有立即带来结果时，许多年轻人会感到沮丧。","note":"侧重因受挫而灰心，可作表语或定语。"},{"en":"picturesque","basic":"beautiful","zh":"风景如画的","pos":"adj.","type":"word","example":"The small village is surrounded by picturesque mountains and clear streams.","exampleZh":"这个小村庄被风景如画的群山和清澈的溪流环绕。","note":"专用于描写景色，不用于形容人物外貌。"},{"en":"a considerable amount of","basic":"a lot of","zh":"大量的","pos":"phr.","type":"phrase","example":"Solving the housing problem requires a considerable amount of public investment.","exampleZh":"解决住房问题需要大量的公共投资。","note":"只接不可数名词，谓语动词用单数。"},{"en":"owing to","basic":"because","zh":"由于","pos":"phr.","type":"phrase","example":"Owing to the rapid development of technology, our lifestyle has changed greatly.","exampleZh":"由于科技的快速发展，我们的生活方式发生了巨大变化。","note":"介词短语，后接名词或动名词，不接句子。"},{"en":"by virtue of","basic":"because","zh":"凭借，由于","pos":"phr.","type":"phrase","example":"He succeeded by virtue of his perseverance and hard work.","exampleZh":"他凭借坚持和努力取得了成功。","note":"后接名词或动名词，含借助某种优势之意。"},{"en":"nevertheless","basic":"but","zh":"然而，尽管如此","pos":"adv.","type":"word","example":"The task is difficult; nevertheless, we must spare no effort to accomplish it.","exampleZh":"这项任务很艰巨，然而我们必须不遗余力地完成它。","note":"连接副词，前用分号或句号，不能直接连接两句。"},{"en":"whereas","basic":"but","zh":"然而，而","pos":"conj.","type":"word","example":"Some people prefer city life, whereas others enjoy the peace of the countryside.","exampleZh":"有些人偏爱城市生活，而另一些人则喜欢乡村的宁静。","note":"从属连词，引导对比从句，须连接两个分句。"},{"en":"consequently","basic":"so","zh":"因此，结果","pos":"adv.","type":"word","example":"Many students lack sleep; consequently, their efficiency in class declines.","exampleZh":"许多学生睡眠不足，因此课堂效率下降。","note":"连接副词，可置于句首，后面加逗号。"},{"en":"as well as","basic":"and","zh":"以及，和","pos":"conj.","type":"phrase","example":"Reading as well as traveling broadens our horizons.","exampleZh":"阅读和旅行都能开阔我们的视野。","note":"连接并列成分；作主语时谓语与前面的成分一致。"},{"en":"moreover","basic":"also","zh":"此外，而且","pos":"adv.","type":"word","example":"Moreover, a healthy diet can improve our ability to concentrate.","exampleZh":"此外，健康的饮食能提高我们的注意力。","note":"句首连接副词，后接逗号，用于递进。"},{"en":"ultimately","basic":"finally","zh":"最终，归根结底","pos":"adv.","type":"word","example":"Ultimately, success depends on persistent effort rather than good luck.","exampleZh":"归根结底，成功取决于持续的努力而非好运。","note":"可置于句首或句中，含最终结论的意味。"},{"en":"in contemporary society","basic":"nowadays","zh":"在当代社会","pos":"phr.","type":"phrase","example":"In contemporary society, lifelong learning has become a necessity rather than a choice.","exampleZh":"在当代社会，终身学习已成为必需而非选择。","note":"作时间状语置于句首，后面加逗号。"},{"en":"ought to","basic":"should","zh":"应当","pos":"phr.","type":"pattern","example":"We ought to take concrete actions to protect the environment.","exampleZh":"我们应当采取具体行动保护环境。","note":"情态动词，后接动词原形，否定式为 ought not to。"},{"en":"invariably","basic":"always","zh":"总是，无一例外地","pos":"adv.","type":"word","example":"Hard work invariably brings progress, though it may take time.","exampleZh":"努力总会带来进步，尽管可能需要时间。","note":"修饰动词或形容词，书面语，比 always 更正式。"},{"en":"more often than not","basic":"often","zh":"往往，多半","pos":"adv.","type":"phrase","example":"More often than not, success comes to those who persist to the end.","exampleZh":"成功往往属于那些坚持到底的人。","note":"固定短语作状语，常置于句首，后接逗号。"},{"en":"occasionally","basic":"sometimes","zh":"偶尔，有时","pos":"adv.","type":"word","example":"Occasionally, taking a break can help us work more efficiently.","exampleZh":"偶尔休息一下能帮助我们更高效地工作。","note":"频率低于 sometimes，位置灵活，可置于句首。"}],"file":"13-upgrade.json"},{"id":"letter-general","title":"书信通用框架与礼貌表达","emoji":"✉️","group":"小作文·应用文语料","desc":"覆盖称呼、开头目的、过渡、礼貌请求、致谢致歉与结尾落款，约100词书信通用框架。","entries":[{"en":"Dear Sir or Madam,","basic":"","zh":"尊敬的先生或女士：","pos":"phr.","type":"phrase","example":"Dear Sir or Madam, I am writing to inquire about the language training programme advertised on your website.","exampleZh":"尊敬的先生或女士：我写信是想咨询贵网站广告中提到的语言培训项目。","note":"称呼段首行顶格写，后接逗号；不知收信人姓名时使用，结束语须配 Yours faithfully。"},{"en":"Dear Mr. Wang,","basic":"","zh":"尊敬的王先生：","pos":"phr.","type":"phrase","example":"Dear Mr. Wang, I am writing to express my sincere gratitude for your generous assistance.","exampleZh":"尊敬的王先生：我写信是为了对您慷慨的帮助表示诚挚的感谢。","note":"已知姓名用姓氏加 Mr./Ms.，后接逗号；结束语须配 Yours sincerely，不可与 faithfully 混用。"},{"en":"Dear Professor Smith,","basic":"","zh":"尊敬的史密斯教授：","pos":"phr.","type":"phrase","example":"Dear Professor Smith, I would like to seek your advice on my application for a research programme.","exampleZh":"尊敬的史密斯教授：我想就我申请研究项目一事向您请教。","note":"学术场景中对导师用 Professor 而非 Mr.；头衔后不加姓名缩写，正式程度高于 Dear Smith。"},{"en":"To Whom It May Concern,","basic":"","zh":"敬启者（致相关人士）：","pos":"phr.","type":"phrase","example":"To Whom It May Concern, I am writing to confirm my attendance at the conference to be held next month.","exampleZh":"敬启者：我写信是为了确认出席下个月举行的会议。","note":"仅用于推荐信、证明信等面向机构的正式信件；称呼词首字母均大写，后接逗号，结尾用 Yours faithfully。"},{"en":"Dear All,","basic":"","zh":"各位好：","pos":"phr.","type":"phrase","example":"Dear All, I am writing to inform you of the revised schedule for our group presentation.","exampleZh":"各位好：我写信是为了告知大家小组展示修订后的时间安排。","note":"通知类群发信件或备忘录可用，属半正式；结尾配 Best regards，不宜再写 Yours faithfully。"},{"en":"I am writing to express my sincere gratitude for ___.","basic":"","zh":"我写信是为了对___表示诚挚的感谢。","pos":"—","type":"pattern","example":"I am writing to express my sincere gratitude for the warm reception you extended to me during my visit.","exampleZh":"我写信是为了对您在我访问期间给予的热情接待表示诚挚的感谢。","note":"首段开门见山点明目的，gratitude 后接 for + 名词或动名词，比 thanks 更书面。"},{"en":"I am writing to inform you that ___.","basic":"","zh":"我写信是为了告知您___。","pos":"—","type":"pattern","example":"I am writing to inform you that the meeting scheduled for Friday has been postponed to next Monday.","exampleZh":"我写信是为了告知您，原定于周五的会议已推迟至下周一。","note":"通知、告知类信件首段核心句；that 后接完整从句，inform 后必须先有宾语 you 再接 that。"},{"en":"I am writing in response to your letter of ___ concerning ___.","basic":"","zh":"兹回复您___日关于___的来信。","pos":"—","type":"pattern","example":"I am writing in response to your letter of May 5 concerning the internship programme.","exampleZh":"兹回复您5月5日关于实习项目的来信。","note":"回信类首段必用；in response to 后接来信，日期用 of + 日期，勿写成 in response of。"},{"en":"I am writing on behalf of ___ to ___.","basic":"","zh":"我代表___写信以___。","pos":"—","type":"pattern","example":"I am writing on behalf of the Student Union to invite you to deliver a lecture on campus.","exampleZh":"我代表学生会写信邀请您来校园做一场讲座。","note":"以集体名义写信时首段使用；on behalf of 后接机构或群体，后接不定式说明目的。"},{"en":"I am writing to lodge a complaint about ___.","basic":"","zh":"我写信是为了就___提出投诉。","pos":"—","type":"pattern","example":"I am writing to lodge a complaint about the poor quality of the laptop I purchased last week.","exampleZh":"我写信是为了就我上周购买的笔记本电脑质量低劣一事提出投诉。","note":"投诉信首段用；lodge a complaint about 比 complain 更正式，about 后接名词性成分。"},{"en":"I would like to take this opportunity to ___.","basic":"","zh":"我想借此机会___。","pos":"—","type":"pattern","example":"I would like to take this opportunity to extend my warmest congratulations on your graduation.","exampleZh":"我想借此机会对您的毕业表示最热烈的祝贺。","note":"适用于祝贺信、感谢信首段；后接动词原形，比 I want to 礼貌，是提分句式。"},{"en":"As you may know, ___.","basic":"","zh":"如您所知，___。","pos":"—","type":"pattern","example":"As you may know, our library will be closed for renovation throughout the coming month.","exampleZh":"如您所知，我们图书馆将在接下来一个月闭馆整修。","note":"第二段引入背景信息；后接完整句，注意区别于 as you know it，勿混用。"},{"en":"To begin with, ___.","basic":"","zh":"首先，___。","pos":"—","type":"pattern","example":"To begin with, it would be advisable to set aside a fixed period for revision every day.","exampleZh":"首先，每天留出固定的时间复习是可取的。","note":"第二段第一条理由或建议的标志语；后接完整句，正式书面，优于 firstly 与 first of all。"},{"en":"In addition, ___.","basic":"","zh":"此外，___。","pos":"—","type":"pattern","example":"In addition, the venue should be equipped with modern facilities for the participants.","exampleZh":"此外，场地应为参会者配备现代化的设施。","note":"衔接并列的第二条信息；后接完整句，后接成分须与上句同类，避免与 what is more 相邻重复。"},{"en":"What is more, ___.","basic":"","zh":"更重要的是，___。","pos":"—","type":"pattern","example":"What is more, such an arrangement would save both time and money for all those involved.","exampleZh":"更重要的是，这样的安排会为所有相关人员节省时间和金钱。","note":"第二条理由的标志语，语气强于 in addition；后接完整句，注意是 what is more 而非 what's more。"},{"en":"As for ___, ___.","basic":"","zh":"至于___，___。","pos":"—","type":"pattern","example":"As for the fee, it can be paid in two instalments if necessary.","exampleZh":"至于费用，如有需要可以分两期支付。","note":"话题转移到具体细节时使用；as for 后接名词或动名词，不接完整从句，多用于第二段末。"},{"en":"With regard to ___, ___.","basic":"","zh":"关于___，___。","pos":"—","type":"pattern","example":"With regard to the deadline, I would suggest that the application be submitted before June 10.","exampleZh":"关于截止日期，我建议在6月10日之前提交申请。","note":"正式引用某一事项，优于 about；后接名词性成分，且注意须用 regard 单数，不用 regards。"},{"en":"I would appreciate it if you could ___.","basic":"","zh":"如果您能___，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate it if you could send me the relevant materials at your earliest convenience.","exampleZh":"如果您能尽早把相关材料寄给我，我将不胜感激。","note":"礼貌请求的黄金句式，用于第三段；it 不可省略，could 后接动词原形，比 please 委婉。"},{"en":"I would be grateful if you could ___.","basic":"","zh":"如果您能___，我将非常感激。","pos":"—","type":"pattern","example":"I would be grateful if you could confirm your attendance before the end of this week.","exampleZh":"如果您能在本周末之前确认出席，我将非常感激。","note":"与 appreciate 句式同义但更直接；用于提出请求段，注意 grateful 后不加 it。"},{"en":"I am wondering if it would be possible for you to ___.","basic":"","zh":"我想知道您是否能___。","pos":"—","type":"pattern","example":"I am wondering if it would be possible for you to give a brief talk at our seminar.","exampleZh":"我想知道您是否能在我们的研讨会上做一次简短发言。","note":"极为客气的间接请求，用于邀请或求助；would be possible for you to 结构完整，勿简写。"},{"en":"Would it be convenient for you to ___?","basic":"","zh":"您___方便吗？","pos":"—","type":"pattern","example":"Would it be convenient for you to meet me at three o'clock on Thursday afternoon?","exampleZh":"您周四下午三点与我见面方便吗？","note":"询问时间安排是否合适，多用于第二段；问句本身是疑问语气，末尾用问号。"},{"en":"Could you please ___?","basic":"","zh":"能否请您___？","pos":"—","type":"pattern","example":"Could you please forward the invitation letter to the other members of the committee?","exampleZh":"能否请您把邀请函转发给委员会其他成员？","note":"简洁礼貌的请求句，用于第三段；could 比 can 委婉，please 置于句中，后接动词原形。"},{"en":"I hope you would not mind ___ ing.","basic":"","zh":"希望您不介意___。","pos":"—","type":"pattern","example":"I hope you would not mind postponing the meeting until the following week.","exampleZh":"希望您不介意把会议推迟到下一周。","note":"委婉提出可能给对方带来不便的请求；mind 后必须接动名词，不可接不定式。"},{"en":"Please accept my sincere apologies for ___.","basic":"","zh":"请接受我对___的诚挚道歉。","pos":"—","type":"pattern","example":"Please accept my sincere apologies for failing to attend the meeting yesterday.","exampleZh":"请接受我对昨天未能出席会议的诚挚道歉。","note":"道歉信首段核心句，apologies 用复数；for 后接名词或动名词，不可接句子。"},{"en":"I must apologize for ___.","basic":"","zh":"我必须为___道歉。","pos":"—","type":"pattern","example":"I must apologize for the delay in replying to your email of last Monday.","exampleZh":"我必须为迟复您上周一的邮件而道歉。","note":"语气直接的致歉句，用于投诉回信或道歉信首段；apologize for 后接名词性成分，不接 that 从句。"},{"en":"Thank you for your generous help.","basic":"","zh":"感谢您的慷慨相助。","pos":"—","type":"pattern","example":"Thank you for your generous help, without which I could never have completed the project on time.","exampleZh":"感谢您的慷慨相助，没有它我绝不可能按时完成这个项目。","note":"致谢信首段或结尾均可；后接名词或动名词，句末用句号，不要用感叹号堆砌。"},{"en":"Your timely assistance means a great deal to me.","basic":"","zh":"您及时的帮助对我意义重大。","pos":"—","type":"pattern","example":"Your timely assistance means a great deal to me and I will always bear it in mind.","exampleZh":"您及时的帮助对我意义重大，我会永远铭记于心。","note":"致谢信结尾升华句；主语为单数 assistance，动词用 means，勿写成 mean。"},{"en":"I am deeply indebted to you for ___.","basic":"","zh":"我对您的___深怀感激。","pos":"—","type":"pattern","example":"I am deeply indebted to you for your patience and encouragement during my hardest days.","exampleZh":"我对您在我最艰难的日子里给予的耐心与鼓励深怀感激。","note":"高级致谢句，用于感谢信第二段；indebted to sb for sth，介词搭配固定，不可换成 with。"},{"en":"I am looking forward to your early reply.","basic":"","zh":"期待您早日回复。","pos":"—","type":"pattern","example":"I am looking forward to your early reply, and I thank you in advance for your assistance.","exampleZh":"期待您早日回复，并提前感谢您的帮助。","note":"末段结束句；to 为介词，后接名词或动名词，写成 look forward to hear 是典型失分错误。"},{"en":"I look forward to hearing from you soon.","basic":"","zh":"期待很快收到您的回音。","pos":"—","type":"pattern","example":"I look forward to hearing from you soon and to discussing the details in person.","exampleZh":"期待很快收到您的回音，并希望能当面商讨细节。","note":"结束语前最后一句；hear from sb 意为收到某人来信，动名词形式为 hearing from。"},{"en":"Your prompt reply would be highly appreciated.","basic":"","zh":"如蒙速复，不胜感激。","pos":"—","type":"pattern","example":"Your prompt reply would be highly appreciated, as the deadline is drawing near.","exampleZh":"由于截止日期临近，如蒙速复，不胜感激。","note":"末段催促回复；prompt 意为及时的，主语为 reply，故用被动 would be appreciated。"},{"en":"Thank you for your time and consideration.","basic":"","zh":"感谢您的时间与考虑。","pos":"—","type":"pattern","example":"Thank you for your time and consideration, and I wish you a pleasant week ahead.","exampleZh":"感谢您的时间与考虑，祝您本周愉快。","note":"末段结束句，通用性极强；句末用句号，考场上务必留出这句作为收束。"},{"en":"Please feel free to contact me if you need any further information.","basic":"","zh":"如需更多信息，请随时与我联系。","pos":"—","type":"pattern","example":"Please feel free to contact me at 12345678 if you need any further information.","exampleZh":"如需更多信息，请随时拨打12345678与我联系。","note":"末段提供进一步联系方式；feel free to 后接动词原形，勿写成 feel free contacting。"},{"en":"I would be more than happy to provide further details.","basic":"","zh":"我很乐意提供更多细节。","pos":"—","type":"pattern","example":"I would be more than happy to provide further details should you require them.","exampleZh":"如果您需要，我很乐意提供更多细节。","note":"结尾表达合作意愿；would be more than happy to 后接动词原形，语气热情而不失正式。"},{"en":"Yours sincerely,","basic":"","zh":"您真诚的（谨启）：","pos":"phr.","type":"phrase","example":"Yours sincerely,\nLi Ming","exampleZh":"您真诚的，\n李明","note":"结束语另起一行、首字母大写、末尾加逗号；仅用于已知收信人姓名的信件。"},{"en":"Yours faithfully,","basic":"","zh":"您忠实的（谨启）：","pos":"phr.","type":"phrase","example":"Yours faithfully,\nLi Ming","exampleZh":"您忠实的，\n李明","note":"与 Dear Sir or Madam / To Whom It May Concern 严格配对；若称呼用了姓名则改 Yours sincerely。"},{"en":"Sincerely yours,","basic":"","zh":"您真诚的：","pos":"phr.","type":"phrase","example":"Sincerely yours,\nLi Ming","exampleZh":"您真诚的，\n李明","note":"美式常用变体，语义等同于 Yours sincerely；与称呼的正式度仍需对应，末尾逗号不可省。"},{"en":"Best regards,","basic":"","zh":"此致问候：","pos":"phr.","type":"phrase","example":"Best regards,\nLi Ming","exampleZh":"此致问候，\n李明","note":"半正式结束语，适合 Dear All 的通知或备忘录；不宜与 Dear Sir or Madam 搭配。"},{"en":"Cordially yours,","basic":"","zh":"谨致问候：","pos":"phr.","type":"phrase","example":"Cordially yours,\nLi Ming","exampleZh":"谨致问候，\n李明","note":"较温暖的正式结束语，用于感谢信或祝贺信；考场上优先选 Yours sincerely，更稳妥。"},{"en":"Li Ming","basic":"","zh":"李明（署名）","pos":"n.","type":"word","example":"Yours sincerely,\nLi Ming","exampleZh":"您真诚的，\n李明","note":"落款另起一行顶格写，只写姓名，不加逗号句号，绝不可写真实姓名或学号。"},{"en":"I am writing to extend my warmest congratulations on ___.","basic":"","zh":"我写信对___致以最热烈的祝贺。","pos":"—","type":"pattern","example":"I am writing to extend my warmest congratulations on your being admitted to Peking University.","exampleZh":"我写信是为了对您被北京大学录取致以最热烈的祝贺。","note":"祝贺信首段核心句；congratulations on 后接名词或动名词，congratulations 必须用复数。"},{"en":"I am writing to apply for the position of ___ advertised in ___.","basic":"","zh":"我写信应聘___上刊登的___一职。","pos":"—","type":"pattern","example":"I am writing to apply for the position of interpreter advertised in yesterday's China Daily.","exampleZh":"我写信应聘昨日《中国日报》上刊登的口译员一职。","note":"求职信首段必用；apply for 后接职位，advertised in 后接媒体名称，勿漏介词 for。"},{"en":"I am writing to seek your assistance with regard to ___.","basic":"","zh":"我写信是想就___寻求您的帮助。","pos":"—","type":"pattern","example":"I am writing to seek your assistance with regard to the accommodation on campus.","exampleZh":"我写信是想就校园住宿一事寻求您的帮助。","note":"求助信首段；seek your assistance 比 ask for help 正式，with regard to 后接名词性成分。"},{"en":"I regret to inform you that ___.","basic":"","zh":"我很遗憾地告知您___。","pos":"—","type":"pattern","example":"I regret to inform you that I will be unable to attend the interview arranged for Friday.","exampleZh":"我很遗憾地告知您，我将无法参加安排在周五的面试。","note":"抱歉信或婉拒信首段；regret to do 表示遗憾地要做，与 regret doing（后悔做过）含义不同。"},{"en":"I am afraid I will have to decline your invitation owing to ___.","basic":"","zh":"由于___，恐怕我不得不谢绝您的邀请。","pos":"—","type":"pattern","example":"I am afraid I will have to decline your invitation owing to a prior engagement on that day.","exampleZh":"由于当天已有约在先，恐怕我不得不谢绝您的邀请。","note":"婉拒信第二段；decline 比 refuse 礼貌，owing to 后接名词性成分，不可接完整句子。"}],"file":"14-letter-general.json"},{"id":"letter-advice","title":"建议信·推荐信·邀请信·感谢信","emoji":"📝","group":"小作文·应用文语料","desc":"分类整理建议、推荐、邀请、感谢四类书信的高分句式，每句可直接套用成段。","entries":[{"en":"I am writing to offer some suggestions regarding ___.","basic":"","zh":"我写信是想就___提出一些建议。","pos":"—","type":"pattern","example":"I am writing to offer some suggestions regarding the forthcoming international conference.","exampleZh":"我写信是想就即将举行的国际会议提出一些建议。","note":"建议信首段点题句；regarding 后接名词性成分，不可换用 regarding to。"},{"en":"I would like to make several recommendations concerning ___.","basic":"","zh":"我想就___提几点建议。","pos":"—","type":"pattern","example":"I would like to make several recommendations concerning the layout of the campus library.","exampleZh":"我想就校园图书馆的布局提几点建议。","note":"建议信首段；make recommendations 比 give advice 正式，concerning 后接名词。"},{"en":"In my humble opinion, it would be advisable for you to ___.","basic":"","zh":"以我浅见，您___是可取的。","pos":"—","type":"pattern","example":"In my humble opinion, it would be advisable for you to set a realistic budget before the trip.","exampleZh":"以我浅见，您在出行前制定一个切合实际的预算是可取的。","note":"建议信第二段第一条建议；it would be advisable for sb to do 结构完整，语气谦和。"},{"en":"It would be beneficial if you could ___.","basic":"","zh":"如果您能___，将会很有益处。","pos":"—","type":"pattern","example":"It would be beneficial if you could arrange a short break in the middle of the session.","exampleZh":"如果您能在会议中间安排一次短暂休息，将会很有益处。","note":"建议信第二段；if 从句用 could，主句用 would，形成虚拟语气，勿写成 will be。"},{"en":"Another suggestion I would like to put forward is that ___.","basic":"","zh":"我还想提出的另一条建议是___。","pos":"—","type":"pattern","example":"Another suggestion I would like to put forward is that the fee should be reduced for students.","exampleZh":"我还想提出的另一条建议是，学生的费用应当降低。","note":"建议信第二段承接第二条建议；put forward 为高级动词短语，that 从句用 should 加原形。"},{"en":"I would suggest that you ___.","basic":"","zh":"我建议您___。","pos":"—","type":"pattern","example":"I would suggest that you consult your tutor before submitting the final draft.","exampleZh":"我建议您在提交终稿之前请教一下导师。","note":"建议信第二段；suggest that 后从句用动词原形或 should 加原形，不可用 suggests you to do。"},{"en":"Perhaps it would be helpful for you to ___.","basic":"","zh":"或许您___会有所帮助。","pos":"—","type":"pattern","example":"Perhaps it would be helpful for you to keep a daily record of your reading progress.","exampleZh":"或许您每天记录阅读进度会有所帮助。","note":"建议信第二段补充建议；Perhaps 开头缓和语气，比 you must 更符合书信礼貌规范。"},{"en":"From my perspective, it is of great importance to ___.","basic":"","zh":"在我看来，___极为重要。","pos":"—","type":"pattern","example":"From my perspective, it is of great importance to promote cultural exchange on campus.","exampleZh":"在我看来，在校园里促进文化交流极为重要。","note":"建议信第二段陈述理由；of great importance 等于 very important，后接动词原形。"},{"en":"I am firmly convinced that it would be wise for you to ___.","basic":"","zh":"我坚信您___是明智的。","pos":"—","type":"pattern","example":"I am firmly convinced that it would be wise for you to seek professional advice first.","exampleZh":"我坚信您先寻求专业建议是明智的。","note":"建议信第二段强调整体建议；be convinced that 后接完整从句，it would be wise for sb to do 固定搭配。"},{"en":"Should you have any questions about these suggestions, please do not hesitate to let me know.","basic":"","zh":"如对这些建议有任何疑问，请务必告知我。","pos":"—","type":"pattern","example":"Should you have any questions about these suggestions, please do not hesitate to let me know.","exampleZh":"如对这些建议有任何疑问，请务必告知我。","note":"建议信第三段收束句；Should 引导的倒装省略 if，do not hesitate to 后接动词原形。"},{"en":"I hope you will find these proposals helpful.","basic":"","zh":"希望您会觉得这些建议有用。","pos":"phr.","type":"phrase","example":"I hope you will find these proposals helpful and that they will contribute to your decision.","exampleZh":"希望您会觉得这些建议有用，并有助于您作出决定。","note":"建议信第三段结尾；proposals 用复数呼应前文，find sth helpful 为主动宾补结构。"},{"en":"Thank you for taking my suggestions into consideration.","basic":"","zh":"感谢您考虑我的建议。","pos":"phr.","type":"phrase","example":"Thank you for taking my suggestions into consideration, and I wish you every success.","exampleZh":"感谢您考虑我的建议，祝您一切顺利。","note":"建议信末段客套收束；take sth into consideration 固定搭配，consideration 前不加 the。"},{"en":"I am writing to recommend ___ for ___.","basic":"","zh":"我写信是为了推荐___担任／参加___。","pos":"—","type":"pattern","example":"I am writing to recommend Li Hua for the position of research assistant in your laboratory.","exampleZh":"我写信是为了推荐李华担任您实验室的研究助理一职。","note":"推荐信首段点题；recommend sb for sth 为固定搭配，不可写成 recommend sb to do the job。"},{"en":"It is my great pleasure to recommend ___ as ___.","basic":"","zh":"我非常荣幸地推荐___为___。","pos":"—","type":"pattern","example":"It is my great pleasure to recommend her as a candidate for the exchange programme.","exampleZh":"我非常荣幸地推荐她作为交换项目的候选人。","note":"推荐信首段正式句；It 为形式主语，真正主语是 to recommend 不定式，as 后接身份。"},{"en":"I have every confidence that ___.","basic":"","zh":"我完全相信___。","pos":"—","type":"pattern","example":"I have every confidence that he will fulfil the duties of the post to your satisfaction.","exampleZh":"我完全相信他会令您满意地履行该岗位的职责。","note":"推荐信第二段评价句；have every confidence that 后接完整从句，语气强于 I think。"},{"en":"He has distinguished himself by ___.","basic":"","zh":"他以___而表现突出。","pos":"—","type":"pattern","example":"He has distinguished himself by his diligence and his willingness to help others.","exampleZh":"他因勤奋和乐于助人而表现突出。","note":"推荐信第二段举实例；distinguish oneself by 后接名词或动名词，是高级提分短语。"},{"en":"I recommend him without reservation.","basic":"","zh":"我毫无保留地推荐他。","pos":"phr.","type":"phrase","example":"I recommend him without reservation and am confident that he will not disappoint you.","exampleZh":"我毫无保留地推荐他，并相信他不会让您失望。","note":"推荐信第三段最有力的表态句；without reservation 意为毫无保留，勿写成 without reservations。"},{"en":"I have known ___ for ___ years, during which time ___.","basic":"","zh":"我认识___已有___年，在此期间___。","pos":"—","type":"pattern","example":"I have known her for four years, during which time she has proved to be a reliable colleague.","exampleZh":"我认识她已有四年，在此期间她已证明自己是一位可靠的同事。","note":"推荐信第二段交代推荐资格；which time 指代前面的时间段，从句用现在完成时更贴切。"},{"en":"In my capacity as ___, I feel fully justified in recommending ___.","basic":"","zh":"作为___，我完全有理由推荐___。","pos":"—","type":"pattern","example":"In my capacity as his academic supervisor, I feel fully justified in recommending him for the award.","exampleZh":"作为他的学业导师，我完全有理由推荐他获得该奖项。","note":"推荐信首段或第二段；in my capacity as 意为以我……的身份，justified in doing 后接动名词。"},{"en":"She is a person of great diligence and integrity.","basic":"","zh":"她是一个非常勤奋且正直的人。","pos":"—","type":"pattern","example":"She is a person of great diligence and integrity, which has won her wide respect.","exampleZh":"她是一个非常勤奋且正直的人，这为她赢得了广泛尊重。","note":"推荐信第二段人物评价；a person of + 抽象名词 是地道书面表达，优于 She is very diligent。"},{"en":"There is no doubt that he is well qualified for ___.","basic":"","zh":"毫无疑问，他完全胜任___。","pos":"—","type":"pattern","example":"There is no doubt that he is well qualified for the demanding post you have advertised.","exampleZh":"毫无疑问，他完全胜任贵方所招聘的这个要求很高的职位。","note":"推荐信第二段结论句；be qualified for 后接职位，若要接动词则用 be qualified to do。"},{"en":"I am sure he would prove to be a valuable asset to ___.","basic":"","zh":"我相信他会成为___的宝贵人才。","pos":"—","type":"pattern","example":"I am sure he would prove to be a valuable asset to your research team.","exampleZh":"我相信他会成为贵研究团队的宝贵人才。","note":"推荐信第三段收束；prove to be 意为证明是，a valuable asset to 后接机构或团队。"},{"en":"I would appreciate it if you could give my recommendation serious consideration.","basic":"","zh":"如果您能认真考虑我的推荐，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate it if you could give my recommendation serious consideration.","exampleZh":"如果您能认真考虑我的推荐，我将不胜感激。","note":"推荐信末段请求句；give sth serious consideration 为固定搭配，it 不可省略。"},{"en":"We would be honored to have you with us at ___.","basic":"","zh":"如您能出席___，我们将深感荣幸。","pos":"—","type":"pattern","example":"We would be honored to have you with us at the opening ceremony next Friday.","exampleZh":"如您能出席下周五的开幕式，我们将深感荣幸。","note":"邀请信首段恭敬句；would be honored to 后接动词原形，honored 拼写为美式，英式可用 honoured。"},{"en":"It is my pleasure to invite you to ___.","basic":"","zh":"我很荣幸地邀请您___。","pos":"—","type":"pattern","example":"It is my pleasure to invite you to deliver a keynote speech at our annual forum.","exampleZh":"我很荣幸地邀请您在我们的年度论坛上做主题演讲。","note":"邀请信首段核心句；It 为形式主语，invite sb to do sth 为固定搭配，勿写成 invite you for doing。"},{"en":"On behalf of ___, I am delighted to invite you to ___.","basic":"","zh":"我代表___，很高兴邀请您___。","pos":"—","type":"pattern","example":"On behalf of the Student Union, I am delighted to invite you to our graduation gala.","exampleZh":"我代表学生会，很高兴邀请您参加我们的毕业晚会。","note":"以集体名义发邀请时用；on behalf of 后接机构或群体，放在句首时其后加逗号。"},{"en":"I am writing to invite you to attend ___.","basic":"","zh":"我写信邀请您参加___。","pos":"—","type":"pattern","example":"I am writing to invite you to attend the seminar on environmental protection.","exampleZh":"我写信邀请您参加关于环境保护的研讨会。","note":"邀请信首段开门见山；attend 后直接接活动名称，不加介词 at 或 in。"},{"en":"The occasion will take place on ___ at ___.","basic":"","zh":"活动将于___在___举行。","pos":"—","type":"pattern","example":"The occasion will take place on June 15 at the International Conference Centre.","exampleZh":"活动将于6月15日在国际会议中心举行。","note":"邀请信第二段交代时间地点；具体到某一天用 on，时刻前用 at，地点前用 at 或 in。"},{"en":"The lecture is scheduled to be held in ___ from ___ to ___.","basic":"","zh":"讲座定于___举行，时间为___至___。","pos":"—","type":"pattern","example":"The lecture is scheduled to be held in Room 305 from two to four in the afternoon.","exampleZh":"讲座定于305室举行，时间为下午两点至四点。","note":"邀请信第二段日程说明；be scheduled to 表示按计划安排，时态用一般现在时即可。"},{"en":"We would be grateful if you could confirm your attendance by ___.","basic":"","zh":"如您能在___前确认出席，我们将不胜感激。","pos":"—","type":"pattern","example":"We would be grateful if you could confirm your attendance by May 20 at the latest.","exampleZh":"如您能最迟在5月20日前确认出席，我们将不胜感激。","note":"邀请信第三段请求确认；confirm your attendance 为固定搭配，by 后接截止时间。"},{"en":"Please let us know at your earliest convenience whether you are able to come.","basic":"","zh":"请尽早告知我们您能否前来。","pos":"—","type":"pattern","example":"Please let us know at your earliest convenience whether you are able to come.","exampleZh":"请尽早告知我们您能否前来。","note":"邀请信第三段；at your earliest convenience 是礼貌的正式表达，后接 whether 引导的宾语从句。"},{"en":"I would be happy to make any arrangements you may require.","basic":"","zh":"我很乐意为您做任何所需的安排。","pos":"—","type":"pattern","example":"I would be happy to make any arrangements you may require during your stay here.","exampleZh":"我很乐意在您逗留期间为您做任何所需的安排。","note":"邀请信第三段体现周到；make arrangements 常用复数，you may require 为省略 that 的定语从句。"},{"en":"We look forward to your presence.","basic":"","zh":"我们期待您的莅临。","pos":"phr.","type":"phrase","example":"We look forward to your presence and to welcoming you on that special day.","exampleZh":"我们期待您的莅临，并期待在那特别的一天迎接您。","note":"邀请信结尾；presence 指莅临，比 coming 庄重，look forward to 后接名词而非动词。"},{"en":"Should you accept our invitation, we will be more than delighted.","basic":"","zh":"若您接受我们的邀请，我们将无比高兴。","pos":"—","type":"pattern","example":"Should you accept our invitation, we will be more than delighted.","exampleZh":"若您接受我们的邀请，我们将无比高兴。","note":"邀请信末段；Should 置于句首构成倒装条件句，主句用 will be 表示将来。"},{"en":"I am writing to express my heartfelt gratitude for ___.","basic":"","zh":"我写信是为了对___表达我由衷的感激。","pos":"—","type":"pattern","example":"I am writing to express my heartfelt gratitude for the generous support you have given me.","exampleZh":"我写信是为了对您给予我的慷慨支持表达我由衷的感激。","note":"感谢信首段点题句；heartfelt 比 sincere 更有温度，for 后接名词或动名词。"},{"en":"I wish to extend my sincere thanks for ___.","basic":"","zh":"我想对___致以诚挚的谢意。","pos":"—","type":"pattern","example":"I wish to extend my sincere thanks for your valuable advice on my career planning.","exampleZh":"我想就您对我职业规划的宝贵建议致以诚挚的谢意。","note":"感谢信首段；extend one's thanks 为正式搭配，thanks 用复数，不可写成 thank。"},{"en":"Your generous help made it possible for me to ___.","basic":"","zh":"您的慷慨帮助使我能___。","pos":"—","type":"pattern","example":"Your generous help made it possible for me to finish the paper ahead of schedule.","exampleZh":"您的慷慨帮助使我能提前完成论文。","note":"感谢信第二段说明受助效果；make it possible for sb to do 中 it 为形式宾语，不可省略。"},{"en":"It was most kind of you to ___.","basic":"","zh":"您___真是太好了。","pos":"—","type":"pattern","example":"It was most kind of you to show me around the campus on such a busy day.","exampleZh":"您在那么忙碌的一天还带我参观校园，真是太好了。","note":"感谢信第二段具体致谢；It was kind of you to do 为固定句型，时态用过去式指已发生的事。"},{"en":"Had it not been for your assistance, I could not have ___.","basic":"","zh":"若不是您的帮助，我就无法___。","pos":"—","type":"pattern","example":"Had it not been for your assistance, I could not have coped with the situation so smoothly.","exampleZh":"若不是您的帮助，我就无法如此顺利地应对当时的局面。","note":"感谢信第二段情感高潮句；虚拟条件倒装省略 if，主句须用 could not have done 形式。"},{"en":"Please accept my sincere thanks for your hospitality.","basic":"","zh":"请接受我对您盛情款待的诚挚谢意。","pos":"—","type":"pattern","example":"Please accept my sincere thanks for your hospitality during my stay in Beijing.","exampleZh":"请接受我对我在北京期间您盛情款待的诚挚谢意。","note":"感谢信首段或第三段；hospitality 意为款待，请接受 + thanks 是典型英文礼貌句式。"},{"en":"Words cannot express how grateful I am.","basic":"","zh":"言语无法表达我有多么感激。","pos":"phr.","type":"phrase","example":"Words cannot express how grateful I am for everything you have done for me.","exampleZh":"言语无法表达我对您为我所做的一切有多么感激。","note":"感谢信中段升华句；how grateful 引导宾语从句，语序为陈述语序，勿写成 how am I grateful。"},{"en":"I am truly grateful for the time and effort you devoted to ___.","basic":"","zh":"我真心感谢您在___上付出的时间与精力。","pos":"—","type":"pattern","example":"I am truly grateful for the time and effort you devoted to revising my manuscript.","exampleZh":"我真心感谢您在修改我的手稿上付出的时间与精力。","note":"感谢信第二段；devote sth to 中 to 为介词，后接名词或动名词，勿接动词原形。"},{"en":"I shall always remember your kindness with gratitude.","basic":"","zh":"我将永远怀着感激铭记您的善意。","pos":"—","type":"pattern","example":"I shall always remember your kindness with gratitude and hope to see you again soon.","exampleZh":"我将永远怀着感激铭记您的善意，并希望不久能再见到您。","note":"感谢信第三段收束；shall 用于第一人称表将来，with gratitude 作状语，语气庄重。"},{"en":"I hope I can repay your kindness some day.","basic":"","zh":"希望有一天我能报答您的善意。","pos":"—","type":"pattern","example":"I hope I can repay your kindness some day, in whatever way I am able to.","exampleZh":"希望有一天我能以力所能及的方式报答您的善意。","note":"感谢信第三段；repay 后直接接宾语，不加 for；some day 写两个词表示将来的某一天。"},{"en":"Thank you again for your warm reception and considerate arrangements.","basic":"","zh":"再次感谢您的热情接待与周到安排。","pos":"—","type":"pattern","example":"Thank you again for your warm reception and considerate arrangements during the conference.","exampleZh":"再次感谢您在会议期间的热情接待与周到安排。","note":"感谢信末段总结句；thank you again 用于收尾，arrangements 用复数，注意统一用名词而非从句。"}],"file":"15-letter-advice.json"},{"id":"letter-apply","title":"求职信·咨询信·投诉信·道歉信·祝贺信","emoji":"📮","group":"小作文·应用文语料","desc":"覆盖求职、咨询、投诉、道歉、祝贺五类书信的正式句式与套语，按信类分段便于直接背诵套用。","entries":[{"en":"I am writing to apply for the position of ___ advertised in ___.","basic":"","zh":"我写信是想申请贵方在___上刊登的___一职。","pos":"—","type":"pattern","example":"I am writing to apply for the position of English editor advertised in China Daily on May 10.","exampleZh":"我写信是想申请贵方5月10日在《中国日报》上刊登的英语编辑一职。","note":"求职信第1段开门见山：职位+信息来源。advertised in后接媒体名，勿写for your company。"},{"en":"I am writing in response to your advertisement for ___.","basic":"","zh":"我写信是想应聘贵方为___发布的招聘广告中的职位。","pos":"—","type":"pattern","example":"I am writing in response to your advertisement for a part-time translator posted on your official website.","exampleZh":"我写信是想应聘贵方在官网上发布的兼职翻译一职。","note":"求职信第1段替代开头。in response to后接名词，勿写成in response of。"},{"en":"I believe my qualifications and experience make me a suitable candidate for ___.","basic":"","zh":"我相信我的资历与经验使我成为___的合适人选。","pos":"—","type":"pattern","example":"I believe my qualifications and experience make me a suitable candidate for this post.","exampleZh":"我相信我的资历与经验使我成为这一职位的合适人选。","note":"求职信第2段自荐主题句。candidate for后接职位，勿用candidate of；qualifications常用复数。"},{"en":"I graduated from ___ with a bachelor's degree in ___.","basic":"","zh":"我毕业于___，获___学士学位。","pos":"—","type":"pattern","example":"I graduated from Peking University with a bachelor's degree in English literature.","exampleZh":"我毕业于北京大学，获英语文学学士学位。","note":"求职信第2段学历介绍。介词with表“以…身份”，degree in接专业，勿漏撇号。"},{"en":"I have a strong command of ___.","basic":"","zh":"我对___有很强的驾驭能力。","pos":"phr.","type":"phrase","example":"I have a strong command of both written and spoken English.","exampleZh":"我对书面英语和英语口语都有很强的驾驭能力。","note":"求职信第2段能力句。command of后接语言或技能，勿中式表达I can use English freely。"},{"en":"I have gained valuable experience in ___ through ___.","basic":"","zh":"通过___，我积累了宝贵的___经验。","pos":"—","type":"pattern","example":"I have gained valuable experience in customer service through two years of part-time work.","exampleZh":"通过两年的兼职工作，我积累了宝贵的客户服务经验。","note":"求职信第2段经历句，用现在完成时；experience作“经验”时不可数，勿加s。"},{"en":"Enclosed please find my résumé.","basic":"","zh":"随信附上我的简历。","pos":"—","type":"pattern","example":"Enclosed please find my résumé and academic transcripts.","exampleZh":"随信附上我的简历和成绩单。","note":"求职信第3段附件说明。Enclosed置句首为固定倒装句，勿写I enclose please find。"},{"en":"I would welcome the opportunity to discuss my application at your convenience.","basic":"","zh":"如您方便，我希望能有机会面谈我的申请。","pos":"—","type":"pattern","example":"I would welcome the opportunity to discuss my application at your convenience.","exampleZh":"如您方便，我希望能有机会面谈我的申请。","note":"求职信末段表达面试意愿。at your convenience比when you are free正式，勿加time。"},{"en":"Thank you for considering my application, and I look forward to hearing from you.","basic":"","zh":"感谢您考虑我的申请，期待收到您的回复。","pos":"—","type":"pattern","example":"Thank you for considering my application, and I look forward to hearing from you at your earliest convenience.","exampleZh":"感谢您考虑我的申请，期待能尽快收到您的回复。","note":"求职信结尾礼貌收束。look forward to后必须接动名词hearing，勿写hear。"},{"en":"I am writing to inquire about ___.","basic":"","zh":"我写信是想咨询___。","pos":"—","type":"pattern","example":"I am writing to inquire about the details of your summer language program.","exampleZh":"我写信是想咨询贵校暑期语言课程的具体情况。","note":"咨询信第1段点题。inquire about为固定搭配，勿写inquire the details。"},{"en":"I would like to obtain some information regarding ___.","basic":"","zh":"我想获取关于___的一些信息。","pos":"—","type":"pattern","example":"I would like to obtain some information regarding the admission requirements of your master's program.","exampleZh":"我想了解贵校硕士项目录取要求方面的一些信息。","note":"咨询信第1段背景句。regarding比about正式，后接名词短语，勿接完整句子。"},{"en":"I would be grateful if you could provide me with the following details.","basic":"","zh":"如您能提供以下详细信息，我将不胜感激。","pos":"—","type":"pattern","example":"I would be grateful if you could provide me with the following details.","exampleZh":"如您能提供以下详细信息，我将不胜感激。","note":"咨询信第2段引出分条提问。provide sb with sth中with不可省，could后接动词原形。"},{"en":"Could you please let me know whether ___ ?","basic":"","zh":"能否请您告知我是否___？","pos":"—","type":"pattern","example":"Could you please let me know whether the course is open to non-native speakers?","exampleZh":"能否请您告知我该课程是否对非母语者开放？","note":"咨询信第2段第一条问题。whether从句用陈述语序，勿写whether is the course。"},{"en":"I would also like to know if ___.","basic":"","zh":"我还想知道是否___。","pos":"—","type":"pattern","example":"I would also like to know if accommodation is included in the tuition fee.","exampleZh":"我还想知道住宿费是否包含在学费中。","note":"咨询信第2段并列追问，用also衔接。if从句同样用陈述语序，勿倒装。"},{"en":"In addition, I wonder if you could clarify ___.","basic":"","zh":"此外，我想请您明确一下___。","pos":"—","type":"pattern","example":"In addition, I wonder if you could clarify the deadline for submitting the application form.","exampleZh":"此外，我想请您明确一下提交申请表的截止日期。","note":"咨询信第2段补充提问。clarify后直接接名词，勿写explain about the deadline。"},{"en":"I would appreciate it if you could reply at your earliest convenience.","basic":"","zh":"如您能尽早回复，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate it if you could reply at your earliest convenience.","exampleZh":"如您能尽早回复，我将不胜感激。","note":"咨询信第3段请求回复。appreciate it if中it不可省，at your earliest convenience为固定搭配。"},{"en":"Any information you could provide would be greatly appreciated.","basic":"","zh":"您能提供的任何信息我都将十分感激。","pos":"—","type":"pattern","example":"Any information you could provide would be greatly appreciated.","exampleZh":"您能提供的任何信息我都将十分感激。","note":"咨询信第3段收束。information不可数，谓语用would be，勿加s或改用are。"},{"en":"I am considering ___ and would appreciate your advice on ___.","basic":"","zh":"我正在考虑___，希望您就___给我一些建议。","pos":"—","type":"pattern","example":"I am considering furthering my studies abroad and would appreciate your advice on the choice of universities.","exampleZh":"我正在考虑出国深造，希望您能在择校方面给我一些建议。","note":"咨询信第1段说明背景。consider后接动名词，advice不可数，勿写advices。"},{"en":"I am writing to complain about ___.","basic":"","zh":"我写信是想投诉___。","pos":"—","type":"pattern","example":"I am writing to complain about the poor quality of the laptop I purchased from your store last week.","exampleZh":"我写信是想投诉上周在贵店购买的笔记本电脑的质量问题。","note":"投诉信第1段点明事由。complain about后接名词，勿写complain the quality。"},{"en":"I am writing to express my dissatisfaction with ___.","basic":"","zh":"我写信是想表达我对___的不满。","pos":"—","type":"pattern","example":"I am writing to express my dissatisfaction with the service I received at your hotel on May 5.","exampleZh":"我写信是想表达我对5月5日在贵酒店所接受服务的不满。","note":"投诉信第1段替代开头。dissatisfaction with为固定搭配，语气比complain更克制。"},{"en":"To my great disappointment, ___ fell far short of my expectations.","basic":"","zh":"令我十分失望的是，___远未达到我的预期。","pos":"—","type":"pattern","example":"To my great disappointment, the product fell far short of my expectations.","exampleZh":"令我十分失望的是，该产品远未达到我的预期。","note":"投诉信第2段陈述问题。fall short of意为“未达到”，主语是物，勿写成I fell short。"},{"en":"Not only was the delivery three days late, but the item was also damaged.","basic":"","zh":"不仅送货迟了三天，而且商品也损坏了。","pos":"—","type":"pattern","example":"Not only was the delivery three days late, but the item was also damaged.","exampleZh":"不仅送货迟了三天，而且商品也损坏了。","note":"投诉信第2段并列列举两条问题。Not only置句首须部分倒装，but also连接并列成分。"},{"en":"I am afraid I must ask you to look into this matter.","basic":"","zh":"恐怕我必须请您调查此事。","pos":"—","type":"pattern","example":"I am afraid I must ask you to look into this matter without further delay.","exampleZh":"恐怕我必须请您尽快调查此事，不要再拖延。","note":"投诉信第2段末提出调查要求。I am afraid使语气委婉，look into意为“调查”。"},{"en":"I would appreciate it if you could either refund my money or replace the item.","basic":"","zh":"如您能退款或更换商品，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate it if you could either refund my money or replace the item.","exampleZh":"如您能退款或更换商品，我将不胜感激。","note":"投诉信第3段提出解决方案。either...or连接两个动词原形，refund与replace均可作动词。"},{"en":"I trust you will give this matter your prompt attention.","basic":"","zh":"相信您会及时处理此事。","pos":"—","type":"pattern","example":"I trust you will give this matter your prompt attention.","exampleZh":"相信您会及时处理此事。","note":"投诉信末段施压收尾。give sth one's attention为固定搭配，prompt意为“及时的”。"},{"en":"I have been a loyal customer of yours for years, and this is the first time I have been disappointed.","basic":"","zh":"我已是贵方多年的老客户，这是我第一次感到失望。","pos":"—","type":"pattern","example":"I have been a loyal customer of yours for five years, and this is the first time I have been disappointed.","exampleZh":"我已是贵方五年的老客户，这是我第一次感到失望。","note":"投诉信第2段铺垫，先扬后抑。this is the first time后从句用现在完成时。"},{"en":"Unless the problem is solved within ___ days, I will have no choice but to ___.","basic":"","
