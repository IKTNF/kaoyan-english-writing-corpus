zh":"如果问题在___天内得不到解决，我将别无选择，只能___。","pos":"—","type":"pattern","example":"Unless the problem is solved within seven days, I will have no choice but to report the matter to the consumer association.","exampleZh":"如果问题在七天内得不到解决，我别无选择，只能向消费者协会反映此事。","note":"投诉信末段施压，考场上慎用。have no choice but to后接动词原形，勿加do。"},{"en":"I am writing to express my sincere apologies for ___.","basic":"","zh":"我写信是想为___致以诚挚的歉意。","pos":"—","type":"pattern","example":"I am writing to express my sincere apologies for my failure to attend your birthday party last Saturday.","exampleZh":"我写信是想为我上周六未能参加你的生日聚会致以诚挚的歉意。","note":"道歉信第1段点明事由。apologies for后接名词或动名词，此处形容词用sincere。"},{"en":"Please accept my heartfelt apology for ___.","basic":"","zh":"请接受我因___而表达的诚挚歉意。","pos":"—","type":"pattern","example":"Please accept my heartfelt apology for not being able to meet you at the airport.","exampleZh":"请接受我未能去机场接你的诚挚歉意。","note":"道歉信第1段替代开头。for后接动名词，heartfelt为形容词修饰apology。"},{"en":"I am terribly sorry that I failed to ___.","basic":"","zh":"非常抱歉，我未能___。","pos":"—","type":"pattern","example":"I am terribly sorry that I failed to return the book you lent me on time.","exampleZh":"非常抱歉，我未能按时归还你借给我的书。","note":"道歉信第1段说明过失。fail to do表示“未能做”，比didn't do更正式。"},{"en":"The reason for my failure is that ___.","basic":"","zh":"我未能做到的原因是___。","pos":"—","type":"pattern","example":"The reason for my failure is that I was suddenly taken ill that morning.","exampleZh":"我未能做到的原因是那天早上我突然生病了。","note":"道歉信第2段解释原因。表语从句用陈述语序，勿写is because of I was ill。"},{"en":"Much to my regret, I was unable to ___ owing to ___.","basic":"","zh":"非常遗憾的是，由于___，我未能___。","pos":"—","type":"pattern","example":"Much to my regret, I was unable to keep the appointment owing to an unexpected emergency.","exampleZh":"非常遗憾的是，由于突发急事，我未能赴约。","note":"道歉信第2段说明客观原因。owing to后接名词，与due to同义，勿接句子。"},{"en":"Had I known earlier, I would have informed you in advance.","basic":"","zh":"如果我早点知道，我就会提前通知你了。","pos":"—","type":"pattern","example":"Had I known earlier, I would have informed you in advance.","exampleZh":"如果我早点知道，我就会提前通知你了。","note":"道歉信第2段表达遗憾。Had I known为省略if的倒装，主句用would have done。"},{"en":"To make up for my fault, I would like to ___.","basic":"","zh":"为弥补我的过失，我想___。","pos":"—","type":"pattern","example":"To make up for my fault, I would like to treat you to dinner this weekend.","exampleZh":"为弥补我的过失，我想这个周末请你吃饭。","note":"道歉信第3段提出补救措施。make up for意为“弥补”，to后接动词原形。"},{"en":"I sincerely hope you can forgive me.","basic":"","zh":"我真诚地希望你能原谅我。","pos":"—","type":"pattern","example":"I sincerely hope you can forgive me for my carelessness.","exampleZh":"我真诚地希望你能原谅我的粗心。","note":"道歉信末段请求原谅。结构为forgive sb for sth，勿写forgive my fault。"},{"en":"I assure you that it will never happen again.","basic":"","zh":"我向你保证这种事绝不会再发生。","pos":"—","type":"pattern","example":"I assure you that it will never happen again.","exampleZh":"我向你保证这种事绝不会再发生。","note":"道歉信末段承诺改正。assure sb that从句用陈述语序，时态取将来时。"},{"en":"I hope this unfortunate incident will not affect our friendship.","basic":"","zh":"希望这件不愉快的事不会影响我们的友谊。","pos":"—","type":"pattern","example":"I hope this unfortunate incident will not affect our friendship.","exampleZh":"希望这件不愉快的事不会影响我们的友谊。","note":"道歉信末段修复关系。affect为动词，勿与名词effect混淆。"},{"en":"I am writing to extend my warmest congratulations on ___.","basic":"","zh":"我写信是想对___致以最热烈的祝贺。","pos":"—","type":"pattern","example":"I am writing to extend my warmest congratulations on your graduation from Peking University.","exampleZh":"我写信是想对你从北京大学毕业致以最热烈的祝贺。","note":"祝贺信第1段开门见山。congratulations on后接名词或动名词，勿用for。"},{"en":"Please accept my sincere congratulations on your ___.","basic":"","zh":"请接受我对你___的诚挚祝贺。","pos":"—","type":"pattern","example":"Please accept my sincere congratulations on your winning the first prize in the national contest.","exampleZh":"请接受我对你在全国比赛中荣获一等奖的诚挚祝贺。","note":"祝贺信第1段替代说法。on后接动名词，congratulations常用复数形式。"},{"en":"I am delighted to learn that ___.","basic":"","zh":"得知___，我非常高兴。","pos":"—","type":"pattern","example":"I am delighted to learn that you have been admitted to Harvard University.","exampleZh":"得知你已被哈佛大学录取，我非常高兴。","note":"祝贺信第1段说明喜讯来源。learn that从句用陈述语序，时态随事实而定。"},{"en":"Your success is the reward for your years of hard work.","basic":"","zh":"你的成功是你多年努力的回报。","pos":"—","type":"pattern","example":"Your success is the reward for your years of hard work.","exampleZh":"你的成功是你多年努力的回报。","note":"祝贺信第2段赞扬对方。reward for后接名词，勿写成the reward of your work。"},{"en":"It comes as no surprise to me that ___.","basic":"","zh":"对我来说，___一点也不令人意外。","pos":"—","type":"pattern","example":"It comes as no surprise to me that you have achieved such an outstanding result.","exampleZh":"你取得如此出色的成绩，我一点也不感到意外。","note":"祝贺信第2段表达“意料之中”的赞扬。it为形式主语，that从句为真正主语。"},{"en":"I wish you continued success in the years ahead.","basic":"","zh":"祝你在未来的岁月里不断取得成功。","pos":"—","type":"pattern","example":"I wish you continued success in the years ahead.","exampleZh":"祝你在未来的岁月里不断取得成功。","note":"祝贺信第3段祝愿。wish sb sth后直接接名词，勿写wish you to succeed more。"},{"en":"May I take this opportunity to wish you every success in your future career.","basic":"","zh":"请允许我借此机会祝你未来事业一切顺利。","pos":"—","type":"pattern","example":"May I take this opportunity to wish you every success in your future career.","exampleZh":"请允许我借此机会祝你未来事业一切顺利。","note":"祝贺信第3段祝愿。May置于句首构成祝愿句式，后接动词原形。"},{"en":"I hope we can get together soon to celebrate your achievement in person.","basic":"","zh":"希望我们能尽快相聚，当面向你道贺。","pos":"—","type":"pattern","example":"I hope we can get together soon to celebrate your achievement in person.","exampleZh":"希望我们能尽快相聚，当面向你道贺。","note":"祝贺信末段收尾兼邀约。in person意为“当面”，勿写in the person。"}],"file":"16-letter-apply.json"},{"id":"notice","title":"通知·告示·备忘录·便条","emoji":"📢","group":"小作文·应用文语料","desc":"通知、告示招募、备忘录与失物招领四大类的正式句式，并含标题居中、四行头、落款等格式要点。","entries":[{"en":"NOTICE","basic":"","zh":"通知（居中大写的标题）","pos":"n.","type":"word","example":"NOTICE\nA Lecture on English Writing Techniques","exampleZh":"通知\n关于英语写作技巧的讲座","note":"通知标题居中大写，可另起一行点题。通知不需要称呼与书信落款，勿加Dear与Yours。"},{"en":"Attention, Please!","basic":"","zh":"请注意！","pos":"phr.","type":"phrase","example":"Attention, Please! All the members of the Students' Union are requested to attend the meeting.","exampleZh":"请注意！学生会全体成员请参加本次会议。","note":"通知正文开头引起注意，多用于张贴或口头通知；更正式公文宜用This is to notify。"},{"en":"This is to notify all the students that ___.","basic":"","zh":"特此通知全体同学，___。","pos":"—","type":"pattern","example":"This is to notify all the students that the library will be closed for renovation from December 1 to December 5.","exampleZh":"特此通知全体同学，图书馆将于12月1日至12月5日闭馆装修。","note":"通知第1句点明事项。notify sb that从句用陈述语序，勿写notify all the students the news。"},{"en":"We are pleased to inform you that ___.","basic":"","zh":"我们很高兴地通知您，___。","pos":"—","type":"pattern","example":"We are pleased to inform you that a welcome party will be held for the freshmen next Friday evening.","exampleZh":"我们很高兴地通知您，下周五晚上将为新生举办欢迎晚会。","note":"通知第1句，用于宣布好消息。inform sb that不可写成inform sb of that。"},{"en":"We regret to inform you that ___.","basic":"","zh":"我们遗憾地通知您，___。","pos":"—","type":"pattern","example":"We regret to inform you that the lecture scheduled for Friday has been cancelled owing to unforeseen circumstances.","exampleZh":"我们遗憾地通知您，原定于周五举行的讲座因突发情况已取消。","note":"通知第1句，用于宣布取消或变更。regret to do意为“遗憾地要做”，与regret doing不同。"},{"en":"A lecture on ___ will be held in ___ at ___ on ___.","basic":"","zh":"一场关于___的讲座将于___（日）___（时刻）在___举行。","pos":"—","type":"pattern","example":"A lecture on Western Culture will be held in the Main Lecture Hall at 2:00 p.m. on November 20, 2025.","exampleZh":"一场关于西方文化的讲座将于2025年11月20日下午2点在主报告厅举行。","note":"通知正文说明活动时间地点。英语顺序为地点由小到大、时间由点到日，勿按中文语序硬译。"},{"en":"All are welcome to attend.","basic":"","zh":"欢迎大家参加。","pos":"—","type":"pattern","example":"The lecture is open to all students, and all are welcome to attend.","exampleZh":"该讲座面向全体学生开放，欢迎大家参加。","note":"通知正文末欢迎语。welcome此处为形容词，attend后直接接活动名，勿加to。"},{"en":"Those who are interested are requested to sign up at ___ before ___.","basic":"","zh":"有兴趣者请于___之前到___报名。","pos":"—","type":"pattern","example":"Those who are interested are requested to sign up at the Students' Union office before November 18.","exampleZh":"有兴趣者请于11月18日之前到学生会办公室报名。","note":"通知正文报名要求。who引导定语从句修饰those，be requested to为礼貌被动表达。"},{"en":"Everyone concerned is requested to attend the meeting on time.","basic":"","zh":"请相关人员准时出席本次会议。","pos":"—","type":"pattern","example":"Everyone concerned is requested to attend the meeting on time.","exampleZh":"请相关人员准时出席本次会议。","note":"通知正文出席要求。concerned作后置定语，on time表“准时”，勿与in time（及时）混淆。"},{"en":"Attendance is compulsory for all members of the Students' Union.","basic":"","zh":"学生会全体成员必须出席。","pos":"—","type":"pattern","example":"Attendance is compulsory for all members of the Students' Union.","exampleZh":"学生会全体成员必须出席。","note":"通知正文纪律要求。compulsory比necessary更强调“必须”，注意拼写勿写成compulsary。"},{"en":"For further information, please contact ___.","basic":"","zh":"欲了解更多信息，请联系___。","pos":"—","type":"pattern","example":"For further information, please contact Li Ming at 12345678 or liming@example.com.","exampleZh":"欲了解更多信息，请拨打12345678或发邮件至liming@example.com联系李明。","note":"通知倒数第2句提供联系方式。contact后直接接人，勿写contact with sb。"},{"en":"The Students' Union","basic":"","zh":"学生会（发布单位落款）","pos":"n.","type":"phrase","example":"The Students' Union\nNovember 15, 2025","exampleZh":"学生会\n2025年11月15日","note":"通知落款：发布单位与日期分列正文右下方，单位在上日期在下；日期写November 15, 2025或15th November, 2025。"},{"en":"Volunteers Wanted","basic":"","zh":"招募志愿者（告示标题）","pos":"n.","type":"phrase","example":"Volunteers Wanted for the International Culture Festival","exampleZh":"国际文化节招募志愿者","note":"告示标题用名词短语，醒目、首字母大写、不加句号，比A Notice about Recruiting Volunteers简洁。"},{"en":"We are now recruiting ___.","basic":"","zh":"我们现招募___。","pos":"—","type":"pattern","example":"We are now recruiting twenty volunteers for the upcoming International Culture Festival.","exampleZh":"我们现为即将举办的文化节招募二十名志愿者。","note":"招募告示第1句。recruit为及物动词，后直接接人或岗位，勿写recruit for volunteers。"},{"en":"Applicants are expected to be ___.","basic":"","zh":"应聘者应具备___。","pos":"—","type":"pattern","example":"Applicants are expected to be fluent in English and willing to work on weekends.","exampleZh":"应聘者应英语流利，并愿意在周末工作。","note":"招募告示列出条件。be expected to语气客观，比must be更委婉，to后接动词原形。"},{"en":"Interested candidates are invited to send their applications to ___.","basic":"","zh":"有意者请将申请材料发送至___。","pos":"—","type":"pattern","example":"Interested candidates are invited to send their applications to the Students' Union office by November 18.","exampleZh":"有意者请于11月18日前将申请材料送至学生会办公室。","note":"招募告示说明申请方式。invite sb to do变被动后to不可省，applications to后接地名或邮箱。"},{"en":"Priority will be given to those with previous experience.","basic":"","zh":"有相关经验者优先。","pos":"—","type":"pattern","example":"Priority will be given to those with previous experience in voluntary work.","exampleZh":"有志愿服务经验者优先。","note":"招募告示补充条件。give priority to意为“优先考虑”，用被动语态更客观正式。"},{"en":"Don't miss this golden opportunity!","basic":"","zh":"不要错过这个绝佳机会！","pos":"—","type":"pattern","example":"Don't miss this golden opportunity to improve your spoken English!","exampleZh":"不要错过这个提高英语口语的绝佳机会！","note":"招募告示末句鼓动语。祈使句适合标题与结尾，但正文主体仍须保持正式书面语。"},{"en":"To: ___ / From: ___ / Date: ___ / Subject: ___","basic":"","zh":"致：___／发件人：___／日期：___／事由：___","pos":"—","type":"pattern","example":"To: All Department Heads\nFrom: Li Ming, General Manager\nDate: November 20, 2025\nSubject: Arrangements for the Annual Meeting","exampleZh":"致：各部门负责人\n发件人：总经理李明\n日期：2025年11月20日\n事由：年会安排","note":"备忘录用To/From/Date/Subject四行头，每行标签后加冒号、左对齐；日期写November 20, 2025或20th November, 2025。"},{"en":"The purpose of this memo is to ___.","basic":"","zh":"本备忘录旨在___。","pos":"—","type":"pattern","example":"The purpose of this memo is to inform you of the change in the meeting time.","exampleZh":"本备忘录旨在通知各位会议时间的变动。","note":"备忘录第1句点明目的。inform sb of sth中of不可省，to后接动词原形。"},{"en":"Please note that ___.","basic":"","zh":"请注意，___。","pos":"—","type":"pattern","example":"Please note that the deadline for submitting the report has been brought forward to November 25.","exampleZh":"请注意，提交报告的截止日期已提前至11月25日。","note":"备忘录正文提醒事项。bring forward意为“提前”，其被动完成式为has been brought forward。"},{"en":"I would appreciate your feedback by ___.","basic":"","zh":"如能在___之前得到您的反馈，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate your feedback by Friday, November 22.","exampleZh":"如能在11月22日周五之前得到您的反馈，我将不胜感激。","note":"备忘录结尾索取回复。appreciate后接名词，by表“不迟于”，勿写before Friday at latest。"},{"en":"Attached please find ___.","basic":"","zh":"随附___，请查收。","pos":"—","type":"pattern","example":"Attached please find the detailed schedule for the annual meeting.","exampleZh":"随附年会的详细日程，请查收。","note":"备忘录随附材料说明。Attached置句首为固定倒装句式，勿写I attached please find。"},{"en":"Should you have any questions, please feel free to contact me.","basic":"","zh":"如有任何疑问，请随时与我联系。","pos":"—","type":"pattern","example":"Should you have any questions, please feel free to contact me.","exampleZh":"如有任何疑问，请随时与我联系。","note":"备忘录结尾礼貌收束。Should引导条件从句倒装，后接动词原形，比If you have更正式。"},{"en":"LOST AND FOUND","basic":"","zh":"失物招领（标题）","pos":"n.","type":"phrase","example":"LOST AND FOUND\nA black wallet was found in the reading room.","exampleZh":"失物招领\n在阅览室捡到一个黑色钱包。","note":"招领启事标题大写居中，正文用被动语态说明物品与拾获地点；寻物启事标题可写Lost。"},{"en":"I happened to find ___.","basic":"","zh":"我碰巧发现了___。","pos":"—","type":"pattern","example":"I happened to find a black leather wallet in the reading room yesterday afternoon.","exampleZh":"昨天下午我在阅览室碰巧捡到一个黑色皮钱包。","note":"招领启事第1句。happen to do表示“碰巧”，叙述过去事件用过去时，勿写happened to found。"},{"en":"Whoever lost it may come to ___ to claim it.","basic":"","zh":"失主可到___认领。","pos":"—","type":"pattern","example":"Whoever lost it may come to Room 305 to claim it with a valid student card.","exampleZh":"失主可携带有效学生证到305室认领。","note":"招领启事正文。whoever引导主语从句，谓语用单数may come；claim意为“认领”。"},{"en":"The owner may claim it at ___ during office hours.","basic":"","zh":"失主可在办公时间到___认领。","pos":"—","type":"pattern","example":"The owner may claim it at the reception desk during office hours.","exampleZh":"失主可在办公时间到前台认领。","note":"招领启事末句。during office hours意为“在办公时间内”，勿写in the office time。"},{"en":"Will the finder please contact me at ___ ?","basic":"","zh":"请拾到者拨___与我联系，好吗？","pos":"—","type":"pattern","example":"Will the finder please contact me at 12345678 or liming@example.com?","exampleZh":"请拾到者拨12345678或发邮件至liming@example.com与我联系，好吗？","note":"寻物启事正文请求句。Will...please为礼貌祈使句式，句末用问号，联系方式用at。"},{"en":"I would be grateful if anyone who has seen it could contact me.","basic":"","zh":"如有人见过，请与我联系，我将不胜感激。","pos":"—","type":"pattern","example":"I would be grateful if anyone who has seen it could contact me at 12345678.","exampleZh":"如有人见过，请拨12345678与我联系，我将不胜感激。","note":"寻物启事末句。who引导定语从句修饰anyone，could使语气委婉，勿改用can。"}],"file":"17-notice.json"}],"examIndex":{"title":"历年真题主题索引","desc":"英语一 1999—2025 大作文逐年题面与主题归类。点击最右列的板块名可直接跳到对应语料背诵。标 ※ 的年份题面表述以官方真题为准。","years":[{"year":2025,"type":"图表","topicZh":"居民耐用消费品拥有量变化","topicEn":"Changes in the Ownership of Durable Consumer Goods","sections":["describe","career","argue"],"tip":"英语一重新回到图表题：首段必须交代数据走势，主体段解释「为什么涨」，结尾段升华到生活水平提升与理性消费。"},{"year":2024,"type":"图画","topicZh":"公园里的体育锻炼","topicEn":"Physical Exercise in the Park","sections":["health","society","describe"],"tip":"国民健康 + 全民健身。可从「个人健康意识提高」「公共设施完善」两条腿展开，结尾呼吁坚持运动。"},{"year":2023,"type":"图画","topicZh":"龙舟赛","topicEn":"Dragon Boat Racing","sections":["culture","quality","describe"],"tip":"传统文化 + 团队协作。两个角度都能写：文化传承与自信；众人划桨体现团结。建议文化为主、协作为辅。"},{"year":2022,"type":"图画","topicZh":"广泛学习 / 博学","topicEn":"Learning Broadly Beyond Textbooks","sections":["education","describe"],"tip":"学习不只限于课本。可写终身学习、跨界知识、实践与理论结合。"},{"year":2021,"type":"图画","topicZh":"文化自信（孩子学戏）","topicEn":"Confidence in Our Own Culture","sections":["culture","describe"],"tip":"传统文化传承 + 家庭鼓励。主体段写「为什么要传承」和「怎么传承」。"},{"year":2020,"type":"图画","topicZh":"习惯与养成教育 ※","topicEn":"The Value of Forming Good Habits","sections":["quality","education","family"],"tip":"习惯类话题年年可套：习惯如何塑造性格、影响效率；家长与学校如何引导。"},{"year":2019,"type":"图画","topicZh":"途中（爬山与坚持）","topicEn":"On the Way — Perseverance","sections":["quality","describe"],"tip":"最典型的「个人品质」题。坚持、毅力、目标、过程比终点更重要。"},{"year":2018,"type":"图画","topicZh":"选课进行时","topicEn":"Choosing Courses","sections":["education","career","describe"],"tip":"如何做选择：兴趣 vs 实用、难度 vs 收获。可引申到理性选择与长远眼光。"},{"year":2017,"type":"图画","topicZh":"「有书」与「读书」","topicEn":"Owning Books vs. Reading Books","sections":["education","describe"],"tip":"行动胜于空谈。与 2019、2004 同属「实践/行动」大类，句式可复用。"},{"year":2016,"type":"图画","topicZh":"与其只提要求，不如做个榜样","topicEn":"Setting an Example Rather Than Giving Orders","sections":["family","education","quality"],"tip":"家庭教育 + 言传身教。结尾可升华到「以身作则」的社会意义。"},{"year":2015,"type":"图画","topicZh":"手机时代的聚会","topicEn":"A Gathering in the Age of Smartphones","sections":["technology","society","describe"],"tip":"科技双刃剑经典题。既要承认便利，也要写人际疏离，最后给出「合理使用」的建议。"},{"year":2014,"type":"图画","topicZh":"相携（陪伴父母）","topicEn":"Accompanying One's Aging Parents","sections":["family","society"],"tip":"孝道与陪伴。注意区分「物质赡养」与「精神陪伴」，后者是高分点。"},{"year":2013,"type":"图画","topicZh":"选择（毕业去向）","topicEn":"Choices After Graduation","sections":["career","quality"],"tip":"考研 / 就业 / 出国。可写「没有标准答案，适合自己的才是最好的」。"},{"year":2012,"type":"图画","topicZh":"乐观与悲观","topicEn":"Optimism and Pessimism","sections":["quality","describe"],"tip":"同一件事两种心态。首段一定要写出「对比」，句式用 whereas / in stark contrast。"},{"year":2011,"type":"图画","topicZh":"旅程之「余」（旅游垃圾）","topicEn":"The Leftovers of a Journey","sections":["environment","society"],"tip":"文明旅游 + 环保意识 + 公德。可写个人素养，也可写景区管理。"},{"year":2010,"type":"图画","topicZh":"文化「火锅」，美味又营养","topicEn":"Cultural Hotpot: Blending Cultures","sections":["culture","describe"],"tip":"文化融合与多元。经典比喻可复用：melting pot / hotpot of cultures。"},{"year":2009,"type":"图画","topicZh":"网络的「近」与「远」","topicEn":"The Internet: Close Yet Distant","sections":["technology","describe"],"tip":"与 2015 同源。写「物理距离拉近、心理距离拉远」的悖论最有分。"},{"year":2008,"type":"图画","topicZh":"合作（两人三条腿）","topicEn":"Cooperation","sections":["quality","describe"],"tip":"合作共赢。可用 synergy / complement each other / join hands。"},{"year":2007,"type":"图画","topicZh":"自信（点球时刻）","topicEn":"Self-confidence","sections":["quality","describe"],"tip":"自信与心态。写「自信不是自负」，可加一句让步。"},{"year":2006,"type":"图画","topicZh":"偶像崇拜","topicEn":"Idol Worship","sections":["society","quality","describe"],"tip":"青年现象。建议辩证：适度激励 vs 盲目跟风，落到「理性追星」。"},{"year":2005,"type":"图画","topicZh":"养老（四个儿子推诿）","topicEn":"Supporting the Elderly","sections":["family","society","describe"],"tip":"老龄化 + 孝道 + 社会责任。老题但主题常青，近年仍可能复现。"},{"year":2004,"type":"图画","topicZh":"终点又是新起点","topicEn":"The End Is a New Beginning","sections":["quality","career","describe"],"tip":"永不止步。与 2019、2017 共用「行动/进取」句式，可一起背。"},{"year":2003,"type":"图画","topicZh":"温室花朵经不起风雨","topicEn":"Greenhouse Flowers Cannot Withstand Storms","sections":["family","quality","describe"],"tip":"过度保护与独立。关键词 overprotection / independence / adversity。"},{"year":2002,"type":"图画","topicZh":"民族文化与世界文化","topicEn":"National Culture and World Culture","sections":["culture","describe"],"tip":"与 2010、2021、2023 同属文化大类，是英语一最偏爱的话题族。"},{"year":2001,"type":"图画","topicZh":"爱心是一盏灯，越黑暗的地方越明亮","topicEn":"Love Is a Lamp Brighter in Darkness","sections":["society","quality","describe"],"tip":"爱心与公益。可延伸到志愿服务、互帮互助、社会温度。"},{"year":2000,"type":"图表","topicZh":"世界商业捕鱼简史（1900 vs 1995）","topicEn":"A Brief History of World Commercial Fishing","sections":["environment","describe","argue"],"tip":"早期图表题。图表模板句仍然适用，重点在「数据对比 + 原因 + 对策」。"},{"year":1999,"type":"图表","topicZh":"美国人口增长与物种灭绝","topicEn":"The Ups and Downs of Population Growth","sections":["environment","describe","argue"],"tip":"生态与发展的冲突。可与环保板块一起背。"}],"notes":["命题规律：近 25 年英语一大作文高度集中在四大话题族——① 个人品质与成功素养（2004/2007/2008/2012/2017/2018/2019/2020）② 文化传承与交流（2002/2010/2021/2023）③ 科技与媒介（2009/2015）④ 社会公德与家庭伦理（2001/2003/2005/2006/2011/2014/2016）。把这四族的语料背熟，基本可以覆盖任意新题。","图表题回归：2025 年考「居民耐用消费品拥有量变化」，说明图表描述句（describe 板块后半部分）必须一起准备，不能只练图画。","首段写法固定：描述画面 → 点出寓意。主体段两到三点理由。结尾段总结 + 建议/呼吁。任何题目都能套这三步。"]},"builtAt":"2026-10-07T09:07:43.483Z"}</script>
<script>
"use strict";
const CORPUS = JSON.parse(document.getElementById('corpus-data').textContent);
const SECTIONS = CORPUS.sections;
const INDEX = CORPUS.examIndex;
const SEC_BY_ID = {}; SECTIONS.forEach(s => SEC_BY_ID[s.id] = s);

const TYPE_LABEL = {word:'单词', phrase:'词伙', pattern:'句式', proverb:'金句'};
const LS = 'kaoyan-corpus-v1';
let st = {mastered:{}, starred:{}, recite:false, dark:false, fs:1};
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || '{}')); } catch(e){}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e){} };

let view = {kind:'all'};
let query = '';
let onlyStar = false, onlyUn = false, shuffle = false;
let limit = 150;

const $ = s => document.querySelector(/^[#.[]/.test(s) ? s : '#' + s);
/* 掌握/收藏以「表达」为单位（全局），同一表达在多个板块出现时只需标记一次 */
const nk = en => String(en).toLowerCase().trim().replace(/[.\s]+$/, '');
const key = (sid, en) => nk(en);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 同一表达出现在哪些板块 */
const VARIANTS = {};
SECTIONS.forEach(s => s.entries.forEach(e => { const k = nk(e.en); (VARIANTS[k] = VARIANTS[k] || []).push(s.id); }));
const UNIQUE = Object.keys(VARIANTS).length;

/* ---------- boot ---------- */
document.body.classList.toggle('dark', !!st.dark);
document.body.classList.toggle('recite', !!st.recite);
document.documentElement.style.setProperty('--fs', st.fs);
$('themeBtn').classList.toggle('on', !!st.dark);
$('modeBtn').classList.toggle('on', !!st.recite);
$('allN').textContent = SECTIONS.reduce((n,s)=>n+s.entries.length,0);
$('brandSub').textContent = SECTIONS.length + ' 个板块 · ' + $('allN').textContent + ' 条 / ' + UNIQUE + ' 个不重复表达';

function renderNav(){
  const nav = $('#nav'); nav.innerHTML = '';
  const groups = {};
  SECTIONS.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));

  const virt = [
    {id:'__all', emo:'📚', title:'全部语料'},
    {id:'__star', emo:'★', title:'我的收藏'},
    {id:'__un', emo:'🔥', title:'尚未掌握'}
  ];
  const vg = document.createElement('div'); vg.className='grp'; vg.textContent='快速视图'; nav.appendChild(vg);
  virt.forEach(v => {
    const el = document.createElement('div');
    el.className = 'nav-i' + (view.kind==='virt' && view.id===v.id ? ' active':'');
    let n = 0;
    if (v.id==='__all') n = SECTIONS.reduce((a,s)=>a+s.entries.length,0);
    else if (v.id==='__star') n = Object.keys(st.starred).length;
    else n = SECTIONS.reduce((a,s)=>a+s.entries.filter(e=>!st.mastered[key(s.id,e.en)]).length,0);
    el.innerHTML = '<span class="n-emo">'+v.emo+'</span><span class="n-t">'+v.title+'</span><span class="n-count">'+n+'</span>';
    el.onclick = () => { view={kind:'virt',id:v.id}; limit=150; render(); closeNav(); };
    nav.appendChild(el);
  });

  Object.keys(groups).forEach(g => {
    const gh = document.createElement('div'); gh.className='grp'; gh.textContent=g; nav.appendChild(gh);
    groups[g].forEach(s => {
      const done = s.entries.filter(e=>st.mastered[key(s.id,e.en)]).length;
      const el = document.createElement('div');
      el.className = 'nav-i' + (view.kind==='sec' && view.id===s.id ? ' active':'');
      el.innerHTML = '<span class="n-emo">'+s.emoji+'</span><span class="n-t">'+esc(s.title)+
        '</span><span class="n-count">'+done+'/'+s.entries.length+'</span>'+
        '<span class="nav-bar"><i style="width:'+(s.entries.length?done/s.entries.length*100:0)+'%"></i></span>';
      el.onclick = () => { view={kind:'sec',id:s.id}; limit=150; render(); closeNav(); };
      nav.appendChild(el);
    });
  });

  if (INDEX){
    const gh = document.createElement('div'); gh.className='grp'; gh.textContent='真题'; nav.appendChild(gh);
    const el = document.createElement('div');
    el.className = 'nav-i' + (view.kind==='index' ? ' active':'');
    el.innerHTML = '<span class="n-emo">🗂</span><span class="n-t">'+esc(INDEX.title)+'</span><span class="n-count">'+INDEX.years.length+'</span>';
    el.onclick = () => { view={kind:'index'}; render(); closeNav(); };
    nav.appendChild(el);
  }
}

/* ---------- data selection ---------- */
function pool(){
  if (view.kind==='sec') return SEC_BY_ID[view.id] ? SEC_BY_ID[view.id].entries.map(e=>({...e, _sid:view.id})) : [];
  const all = [];
  SECTIONS.forEach(s => s.entries.forEach(e => all.push({...e, _sid:s.id})));
  if (view.kind==='index') return all;
  if (view.kind==='virt' && view.id==='__star') return all.filter(e=>st.starred[key(e._sid,e.en)]);
  if (view.kind==='virt' && view.id==='__un') return all.filter(e=>!st.mastered[key(e._sid,e.en)]);
  return all;
}
function filtered(){
  const q = query.trim().toLowerCase();
  let arr = pool();
  if (onlyStar) arr = arr.filter(e=>st.starred[key(e._sid,e.en)]);
  if (onlyUn) arr = arr.filter(e=>!st.mastered[key(e._sid,e.en)]);
  if (q) arr = arr.filter(e =>
    (e.en+' '+(e.basic||'')+' '+e.zh+' '+e.example+' '+e.exampleZh+' '+e.note).toLowerCase().includes(q));
  return arr;
}
function hi(s){
  const t = esc(s);
  if (!query.trim()) return t;
  const q = query.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try { return t.replace(new RegExp('('+q+')','gi'), '<mark>$1</mark>'); } catch(e){ return t; }
}

/* ---------- render ---------- */
function render(){
  renderNav();
  const list = $('#list');
  const isIndex = view.kind==='index';

  if (isIndex){
    $('#crumb').textContent = INDEX.title;
    $('#meta').innerHTML = '<span>点击主题标签可直接跳到对应语料板块</span>';
    $('#bar').firstElementChild.style.width = '0%';
    list.innerHTML = renderIndex();
    list.scrollTop = 0;
    $('#empty').style.display='none';
    document.querySelectorAll('.idx .lnk[data-sec]').forEach(a=>{
      a.onclick = () => { view={kind:'sec', id:a.dataset.sec}; limit=150; render(); };
    });
    return;
  }

  let arr = filtered();
  if (shuffle) arr = arr.slice().sort(()=>Math.random()-0.5);

  const title = view.kind==='sec' ? (SEC_BY_ID[view.id].emoji+' '+SEC_BY_ID[view.id].title)
    : view.kind==='virt' && view.id==='__star' ? '★ 我的收藏'
    : view.kind==='virt' && view.id==='__un' ? '🔥 尚未掌握' : '📚 全部语料';
  $('#crumb').textContent = title;

  const sec = view.kind==='sec' ? SEC_BY_ID[view.id] : null;
  const doneN = arr.filter(e=>st.mastered[key(e._sid,e.en)]).length;
  $('#meta').innerHTML = '<span>共 <b>'+arr.length+'</b> 条</span><span>已掌握 <b style="color:var(--ok)">'+doneN+'</b></span>'+
    (sec ? '<span class="mhint">提示：点 ✓ 标记掌握，点 ★ 收藏，点卡片可发音</span>'
         : '<span class="mhint">提示：按 / 搜索，R 切换背诵模式</span>');
  $('#bar').firstElementChild.style.width = (arr.length? doneN/arr.length*100 : 0)+'%';

  const head = sec ? '<div class="desc"><b>'+esc(sec.title)+'</b> · '+esc(sec.desc)+'</div>' : '';
  const shown = arr.slice(0, limit);
  list.innerHTML = head + shown.map(card).join('') +
    (arr.length > shown.length ? '<button class="loadmore" id="lm">还有 '+(arr.length-shown.length)+' 条，点击加载</button>' : '');
  $('#empty').style.display = arr.length ? 'none' : 'block';
  bindCards(list);
  const lm = $('#lm');
  if (lm) lm.onclick = () => { limit += 200; render(); };
  list.scrollTop = 0;
}

function card(e){
  const k = key(e._sid, e.en);
  const done = !!st.mastered[k], star = !!st.starred[k];
  const others = (VARIANTS[nk(e.en)] || []).filter(id => id !== e._sid);
  const vbadge = others.length
    ? '<span class="b var" title="同一表达也出现在：' + esc(others.map(id => SEC_BY_ID[id] ? SEC_BY_ID[id].title : id).join('、')) + '">＋' + others.length + ' 板块</span>'
    : '';
  return '<article class="card'+(done?' mastered':'')+(star?' starred':'')+'" data-k="'+esc(k)+'" data-en="'+esc(e.en)+'">'+
    '<div class="c-h">'+
      '<span class="en">'+hi(e.en)+'</span>'+
      (e.pos && e.pos!=='—' ? '<span class="b pos">'+esc(e.pos)+'</span>' : '')+
      '<span class="b t-'+esc(e.type)+'">'+(TYPE_LABEL[e.type]||esc(e.type))+'</span>'+
      (e.basic ? '<span class="b basic">替换 '+esc(e.basic)+'</span>' : '')+
      vbadge+
      '<span class="sp"></span>'+
      '<button class="act star'+(star?' on':'')+'" title="收藏">★</button>'+
      '<button class="act done'+(done?' on':'')+'" title="标记已掌握">✓</button>'+
      '<button class="act speak" title="朗读">🔊</button>'+
    '</div>'+
    '<div class="zh">'+hi(e.zh)+'</div>'+
    '<div class="ex"><span class="ex-en">'+hi(e.example)+'</span><span class="ex-zh">'+hi(e.exampleZh)+'</span></div>'+
    '<div class="note">'+hi(e.note)+'</div>'+
  '</article>';
}

function renderIndex(){
  const rows = INDEX.years.slice().sort((a,b)=>b.year-a.year).map(y=>{
    const links = (y.sections||[]).filter(id=>SEC_BY_ID[id]).map(id=>{
      const s = SEC_BY_ID[id];
      return '<span class="lnk" data-sec="'+id+'">'+s.emoji+' '+esc(s.title)+'</span>';
    }).join(' · ');
    const t = y.type==='图表' ? ' tp-chart' : '';
    return '<tr><td class="yr">'+y.year+'</td>'+
      '<td><div class="tzh">'+esc(y.topicZh)+'</div><div class="tp">'+esc(y.topicEn)+'</div>'+
        (y.tip ? '<div class="tip">'+esc(y.tip)+'</div>' : '')+'</td>'+
      '<td><span class="ttype'+t+'">'+esc(y.type||'图画')+'</span></td>'+
      '<td>'+links+'</td></tr>';
  }).join('');
  const notes = (INDEX.notes||[]).length
    ? '<div class="idxnotes"><h4>命题规律 · 备考提示</h4><ul>'+INDEX.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul></div>'
    : '';
  return '<div class="desc"><b>'+esc(INDEX.title)+'</b> · '+esc(INDEX.desc||'')+'</div>'+
    '<div class="idx"><table><thead><tr><th>年份</th><th>题目 / 主题 · 可复用角度</th><th>题型</th><th>对应语料板块</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+notes;
}

function bindCards(root){
  /* 同一表达可能同时出现在多个板块，标记后让当前视图里所有同表达卡片同步 */
  const sync = k => {
    document.querySelectorAll('#list .card').forEach(o => {
      if (o.dataset.k !== k) return;
      const done = !!st.mastered[k], star = !!st.starred[k];
      o.classList.toggle('mastered', done);
      o.classList.toggle('starred', star);
      const d = o.querySelector('.done'), s = o.querySelector('.star');
      if (d) d.classList.toggle('on', done);
      if (s) s.classList.toggle('on', star);
    });
    const view0 = pool();
    const dv = view0.filter(x => st.mastered[key(x._sid, x.en)]).length;
    $('#bar').firstElementChild.style.width = (view0.length ? dv / view0.length * 100 : 0) + '%';
  };
  root.querySelectorAll('.card').forEach(el=>{
    const k = el.dataset.k, en = el.dataset.en;
    el.querySelector('.star').onclick = ev => {
      ev.stopPropagation();
      st.starred[k] ? delete st.starred[k] : st.starred[k] = 1;
      save(); sync(k); renderNav();
      if (onlyStar) render();
    };
    el.querySelector('.done').onclick = ev => {
      ev.stopPropagation();
      st.mastered[k] ? delete st.mastered[k] : st.mastered[k] = 1;
      save(); sync(k); updateFooter(); renderNav();
      if (onlyUn) render();
    };
    el.querySelector('.speak').onclick = ev => { ev.stopPropagation(); speak(en); };
    el.onclick = () => { if (st.recite) el.classList.toggle('revealed'); };
  });
}
function updateFooter(){
  const done = Object.keys(st.mastered).length;
  $('#doneN').textContent = done;
  $('#pctN').textContent = (UNIQUE ? Math.round(done / UNIQUE * 100) : 0) + '%';
}
function speak(t){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=.88; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- controls ---------- */
$('#search').oninput = e => { query = e.target.value; limit = 150; render(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#search')){ e.preventDefault(); $('#search').focus(); }
  if (e.key === 'Escape'){ $('#search').value=''; query=''; $('#search').blur(); render(); }
  if (e.key === 'r' && document.activeElement !== $('#search') && !e.metaKey && !e.ctrlKey) toggleRecite();
});
function toggleRecite(){
  st.recite = !st.recite; save();
  document.body.classList.toggle('recite', st.recite);
  $('#modeBtn').classList.toggle('on', st.recite);
  $('#modeBtn').textContent = st.recite ? '👁 已隐藏中文' : '👁 背诵模式';
}
$('#modeBtn').onclick = toggleRecite;
$('#onlyStar').onclick = () => { onlyStar = !onlyStar; $('#onlyStar').classList.toggle('on', onlyStar); limit=150; render(); };
$('#onlyUn').onclick = () => { onlyUn = !onlyUn; $('#onlyUn').classList.toggle('on', onlyUn); limit=150; render(); };
$('#shuffleBtn').onclick = () => { shuffle = !shuffle; $('#shuffleBtn').classList.toggle('on', shuffle); render(); };
$('#themeBtn').onclick = () => {
  st.dark = !st.dark; save();
  document.body.classList.toggle('dark', st.dark);
  $('#themeBtn').classList.toggle('on', st.dark);
  $('#themeBtn').textContent = st.dark ? '☀' : '🌙';
};
$('#fsUp').onclick = () => { st.fs = Math.min(1.5, +(st.fs+0.1).toFixed(2)); save(); document.documentElement.style.setProperty('--fs', st.fs); };
$('#fsDown').onclick = () => { st.fs = Math.max(0.8, +(st.fs-0.1).toFixed(2)); save(); document.documentElement.style.setProperty('--fs', st.fs); };
$('#printBtn').onclick = () => window.print();
$('#menuBtn').onclick = () => document.body.classList.toggle('navopen');
function closeNav(){ document.body.classList.remove('navopen'); }
document.addEventListener('click', e => {
  if (window.innerWidth<=900 && document.body.classList.contains('navopen')
      && !e.target.closest('aside') && !e.target.closest('#menuBtn')) closeNav();
});
$('#expBtn').onclick = () => {
  const arr = filtered();
  const t = view.kind==='sec' ? SEC_BY_ID[view.id].title : '语料';
  let out = '# 考研英语一作文语料库 · ' + t + '\n\n共 ' + arr.length + ' 条\n\n';
  arr.forEach((e,i)=>{
    out += '### ' + (i+1) + '. ' + e.en + (e.pos&&e.pos!=='—' ? '  _'+e.pos+'_' : '') + (e.basic?'  (替换 '+e.basic+')':'') + '\n';
    out += '- **释义**：' + e.zh + '\n';
    out += '- **例句**：' + e.example + '\n';
    out += '- **译文**：' + e.exampleZh + '\n';
    out += '- **用法**：' + e.note + '\n\n';
  });
  const b = new Blob([out], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = '考研英语一作文语料_' + t + '.md';
  a.click(); URL.revokeObjectURL(a.href);
};

$('#themeBtn').textContent = st.dark ? '☀' : '🌙';
$('#modeBtn').classList.toggle('on', st.recite);
$('#modeBtn').textContent = st.recite ? '👁 已隐藏中文' : '👁 背诵模式';
updateFooter();
render();
</script>
</body>
