you could clarify ___.","basic":"","zh":"此外，我想请您明确一下___。","pos":"—","type":"pattern","example":"In addition, I wonder if you could clarify the deadline for submitting the application form.","exampleZh":"此外，我想请您明确一下提交申请表的截止日期。","note":"咨询信第2段补充提问。clarify后直接接名词，勿写explain about the deadline。"},{"en":"I would appreciate it if you could reply at your earliest convenience.","basic":"","zh":"如您能尽早回复，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate it if you could reply at your earliest convenience.","exampleZh":"如您能尽早回复，我将不胜感激。","note":"咨询信第3段请求回复。appreciate it if中it不可省，at your earliest convenience为固定搭配。"},{"en":"Any information you could provide would be greatly appreciated.","basic":"","zh":"您能提供的任何信息我都将十分感激。","pos":"—","type":"pattern","example":"Any information you could provide would be greatly appreciated.","exampleZh":"您能提供的任何信息我都将十分感激。","note":"咨询信第3段收束。information不可数，谓语用would be，勿加s或改用are。"},{"en":"I am considering ___ and would appreciate your advice on ___.","basic":"","zh":"我正在考虑___，希望您就___给我一些建议。","pos":"—","type":"pattern","example":"I am considering furthering my studies abroad and would appreciate your advice on the choice of universities.","exampleZh":"我正在考虑出国深造，希望您能在择校方面给我一些建议。","note":"咨询信第1段说明背景。consider后接动名词，advice不可数，勿写advices。"},{"en":"I am writing to complain about ___.","basic":"","zh":"我写信是想投诉___。","pos":"—","type":"pattern","example":"I am writing to complain about the poor quality of the laptop I purchased from your store last week.","exampleZh":"我写信是想投诉上周在贵店购买的笔记本电脑的质量问题。","note":"投诉信第1段点明事由。complain about后接名词，勿写complain the quality。"},{"en":"I am writing to express my dissatisfaction with ___.","basic":"","zh":"我写信是想表达我对___的不满。","pos":"—","type":"pattern","example":"I am writing to express my dissatisfaction with the service I received at your hotel on May 5.","exampleZh":"我写信是想表达我对5月5日在贵酒店所接受服务的不满。","note":"投诉信第1段替代开头。dissatisfaction with为固定搭配，语气比complain更克制。"},{"en":"To my great disappointment, ___ fell far short of my expectations.","basic":"","zh":"令我十分失望的是，___远未达到我的预期。","pos":"—","type":"pattern","example":"To my great disappointment, the product fell far short of my expectations.","exampleZh":"令我十分失望的是，该产品远未达到我的预期。","note":"投诉信第2段陈述问题。fall short of意为“未达到”，主语是物，勿写成I fell short。"},{"en":"Not only was the delivery three days late, but the item was also damaged.","basic":"","zh":"不仅送货迟了三天，而且商品也损坏了。","pos":"—","type":"pattern","example":"Not only was the delivery three days late, but the item was also damaged.","exampleZh":"不仅送货迟了三天，而且商品也损坏了。","note":"投诉信第2段并列列举两条问题。Not only置句首须部分倒装，but also连接并列成分。"},{"en":"I am afraid I must ask you to look into this matter.","basic":"","zh":"恐怕我必须请您调查此事。","pos":"—","type":"pattern","example":"I am afraid I must ask you to look into this matter without further delay.","exampleZh":"恐怕我必须请您尽快调查此事，不要再拖延。","note":"投诉信第2段末提出调查要求。I am afraid使语气委婉，look into意为“调查”。"},{"en":"I would appreciate it if you could either refund my money or replace the item.","basic":"","zh":"如您能退款或更换商品，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate it if you could either refund my money or replace the item.","exampleZh":"如您能退款或更换商品，我将不胜感激。","note":"投诉信第3段提出解决方案。either...or连接两个动词原形，refund与replace均可作动词。"},{"en":"I trust you will give this matter your prompt attention.","basic":"","zh":"相信您会及时处理此事。","pos":"—","type":"pattern","example":"I trust you will give this matter your prompt attention.","exampleZh":"相信您会及时处理此事。","note":"投诉信末段施压收尾。give sth one's attention为固定搭配，prompt意为“及时的”。"},{"en":"I have been a loyal customer of yours for years, and this is the first time I have been disappointed.","basic":"","zh":"我已是贵方多年的老客户，这是我第一次感到失望。","pos":"—","type":"pattern","example":"I have been a loyal customer of yours for five years, and this is the first time I have been disappointed.","exampleZh":"我已是贵方五年的老客户，这是我第一次感到失望。","note":"投诉信第2段铺垫，先扬后抑。this is the first time后从句用现在完成时。"},{"en":"Unless the problem is solved within ___ days, I will have no choice but to ___.","basic":"","zh":"如果问题在___天内得不到解决，我将别无选择，只能___。","pos":"—","type":"pattern","example":"Unless the problem is solved within seven days, I will have no choice but to report the matter to the consumer association.","exampleZh":"如果问题在七天内得不到解决，我别无选择，只能向消费者协会反映此事。","note":"投诉信末段施压，考场上慎用。have no choice but to后接动词原形，勿加do。"},{"en":"I am writing to express my sincere apologies for ___.","basic":"","zh":"我写信是想为___致以诚挚的歉意。","pos":"—","type":"pattern","example":"I am writing to express my sincere apologies for my failure to attend your birthday party last Saturday.","exampleZh":"我写信是想为我上周六未能参加你的生日聚会致以诚挚的歉意。","note":"道歉信第1段点明事由。apologies for后接名词或动名词，此处形容词用sincere。"},{"en":"Please accept my heartfelt apology for ___.","basic":"","zh":"请接受我因___而表达的诚挚歉意。","pos":"—","type":"pattern","example":"Please accept my heartfelt apology for not being able to meet you at the airport.","exampleZh":"请接受我未能去机场接你的诚挚歉意。","note":"道歉信第1段替代开头。for后接动名词，heartfelt为形容词修饰apology。"},{"en":"I am terribly sorry that I failed to ___.","basic":"","zh":"非常抱歉，我未能___。","pos":"—","type":"pattern","example":"I am terribly sorry that I failed to return the book you lent me on time.","exampleZh":"非常抱歉，我未能按时归还你借给我的书。","note":"道歉信第1段说明过失。fail to do表示“未能做”，比didn't do更正式。"},{"en":"The reason for my failure is that ___.","basic":"","zh":"我未能做到的原因是___。","pos":"—","type":"pattern","example":"The reason for my failure is that I was suddenly taken ill that morning.","exampleZh":"我未能做到的原因是那天早上我突然生病了。","note":"道歉信第2段解释原因。表语从句用陈述语序，勿写is because of I was ill。"},{"en":"Much to my regret, I was unable to ___ owing to ___.","basic":"","zh":"非常遗憾的是，由于___，我未能___。","pos":"—","type":"pattern","example":"Much to my regret, I was unable to keep the appointment owing to an unexpected emergency.","exampleZh":"非常遗憾的是，由于突发急事，我未能赴约。","note":"道歉信第2段说明客观原因。owing to后接名词，与due to同义，勿接句子。"},{"en":"Had I known earlier, I would have informed you in advance.","basic":"","zh":"如果我早点知道，我就会提前通知你了。","pos":"—","type":"pattern","example":"Had I known earlier, I would have informed you in advance.","exampleZh":"如果我早点知道，我就会提前通知你了。","note":"道歉信第2段表达遗憾。Had I known为省略if的倒装，主句用would have done。"},{"en":"To make up for my fault, I would like to ___.","basic":"","zh":"为弥补我的过失，我想___。","pos":"—","type":"pattern","example":"To make up for my fault, I would like to treat you to dinner this weekend.","exampleZh":"为弥补我的过失，我想这个周末请你吃饭。","note":"道歉信第3段提出补救措施。make up for意为“弥补”，to后接动词原形。"},{"en":"I sincerely hope you can forgive me.","basic":"","zh":"我真诚地希望你能原谅我。","pos":"—","type":"pattern","example":"I sincerely hope you can forgive me for my carelessness.","exampleZh":"我真诚地希望你能原谅我的粗心。","note":"道歉信末段请求原谅。结构为forgive sb for sth，勿写forgive my fault。"},{"en":"I assure you that it will never happen again.","basic":"","zh":"我向你保证这种事绝不会再发生。","pos":"—","type":"pattern","example":"I assure you that it will never happen again.","exampleZh":"我向你保证这种事绝不会再发生。","note":"道歉信末段承诺改正。assure sb that从句用陈述语序，时态取将来时。"},{"en":"I hope this unfortunate incident will not affect our friendship.","basic":"","zh":"希望这件不愉快的事不会影响我们的友谊。","pos":"—","type":"pattern","example":"I hope this unfortunate incident will not affect our friendship.","exampleZh":"希望这件不愉快的事不会影响我们的友谊。","note":"道歉信末段修复关系。affect为动词，勿与名词effect混淆。"},{"en":"I am writing to extend my warmest congratulations on ___.","basic":"","zh":"我写信是想对___致以最热烈的祝贺。","pos":"—","type":"pattern","example":"I am writing to extend my warmest congratulations on your graduation from Peking University.","exampleZh":"我写信是想对你从北京大学毕业致以最热烈的祝贺。","note":"祝贺信第1段开门见山。congratulations on后接名词或动名词，勿用for。"},{"en":"Please accept my sincere congratulations on your ___.","basic":"","zh":"请接受我对你___的诚挚祝贺。","pos":"—","type":"pattern","example":"Please accept my sincere congratulations on your winning the first prize in the national contest.","exampleZh":"请接受我对你在全国比赛中荣获一等奖的诚挚祝贺。","note":"祝贺信第1段替代说法。on后接动名词，congratulations常用复数形式。"},{"en":"I am delighted to learn that ___.","basic":"","zh":"得知___，我非常高兴。","pos":"—","type":"pattern","example":"I am delighted to learn that you have been admitted to Harvard University.","exampleZh":"得知你已被哈佛大学录取，我非常高兴。","note":"祝贺信第1段说明喜讯来源。learn that从句用陈述语序，时态随事实而定。"},{"en":"Your success is the reward for your years of hard work.","basic":"","zh":"你的成功是你多年努力的回报。","pos":"—","type":"pattern","example":"Your success is the reward for your years of hard work.","exampleZh":"你的成功是你多年努力的回报。","note":"祝贺信第2段赞扬对方。reward for后接名词，勿写成the reward of your work。"},{"en":"It comes as no surprise to me that ___.","basic":"","zh":"对我来说，___一点也不令人意外。","pos":"—","type":"pattern","example":"It comes as no surprise to me that you have achieved such an outstanding result.","exampleZh":"你取得如此出色的成绩，我一点也不感到意外。","note":"祝贺信第2段表达“意料之中”的赞扬。it为形式主语，that从句为真正主语。"},{"en":"I wish you continued success in the years ahead.","basic":"","zh":"祝你在未来的岁月里不断取得成功。","pos":"—","type":"pattern","example":"I wish you continued success in the years ahead.","exampleZh":"祝你在未来的岁月里不断取得成功。","note":"祝贺信第3段祝愿。wish sb sth后直接接名词，勿写wish you to succeed more。"},{"en":"May I take this opportunity to wish you every success in your future career.","basic":"","zh":"请允许我借此机会祝你未来事业一切顺利。","pos":"—","type":"pattern","example":"May I take this opportunity to wish you every success in your future career.","exampleZh":"请允许我借此机会祝你未来事业一切顺利。","note":"祝贺信第3段祝愿。May置于句首构成祝愿句式，后接动词原形。"},{"en":"I hope we can get together soon to celebrate your achievement in person.","basic":"","zh":"希望我们能尽快相聚，当面向你道贺。","pos":"—","type":"pattern","example":"I hope we can get together soon to celebrate your achievement in person.","exampleZh":"希望我们能尽快相聚，当面向你道贺。","note":"祝贺信末段收尾兼邀约。in person意为“当面”，勿写in the person。"}],"file":"16-letter-apply.json"},{"id":"notice","title":"通知·告示·备忘录·便条","emoji":"📢","group":"小作文·应用文语料","desc":"通知、告示招募、备忘录与失物招领四大类的正式句式，并含标题居中、四行头、落款等格式要点。","entries":[{"en":"NOTICE","basic":"","zh":"通知（居中大写的标题）","pos":"n.","type":"word","example":"NOTICE\nA Lecture on English Writing Techniques","exampleZh":"通知\n关于英语写作技巧的讲座","note":"通知标题居中大写，可另起一行点题。通知不需要称呼与书信落款，勿加Dear与Yours。"},{"en":"Attention, Please!","basic":"","zh":"请注意！","pos":"phr.","type":"phrase","example":"Attention, Please! All the members of the Students' Union are requested to attend the meeting.","exampleZh":"请注意！学生会全体成员请参加本次会议。","note":"通知正文开头引起注意，多用于张贴或口头通知；更正式公文宜用This is to notify。"},{"en":"This is to notify all the students that ___.","basic":"","zh":"特此通知全体同学，___。","pos":"—","type":"pattern","example":"This is to notify all the students that the library will be closed for renovation from December 1 to December 5.","exampleZh":"特此通知全体同学，图书馆将于12月1日至12月5日闭馆装修。","note":"通知第1句点明事项。notify sb that从句用陈述语序，勿写notify all the students the news。"},{"en":"We are pleased to inform you that ___.","basic":"","zh":"我们很高兴地通知您，___。","pos":"—","type":"pattern","example":"We are pleased to inform you that a welcome party will be held for the freshmen next Friday evening.","exampleZh":"我们很高兴地通知您，下周五晚上将为新生举办欢迎晚会。","note":"通知第1句，用于宣布好消息。inform sb that不可写成inform sb of that。"},{"en":"We regret to inform you that ___.","basic":"","zh":"我们遗憾地通知您，___。","pos":"—","type":"pattern","example":"We regret to inform you that the lecture scheduled for Friday has been cancelled owing to unforeseen circumstances.","exampleZh":"我们遗憾地通知您，原定于周五举行的讲座因突发情况已取消。","note":"通知第1句，用于宣布取消或变更。regret to do意为“遗憾地要做”，与regret doing不同。"},{"en":"A lecture on ___ will be held in ___ at ___ on ___.","basic":"","zh":"一场关于___的讲座将于___（日）___（时刻）在___举行。","pos":"—","type":"pattern","example":"A lecture on Western Culture will be held in the Main Lecture Hall at 2:00 p.m. on November 20, 2025.","exampleZh":"一场关于西方文化的讲座将于2025年11月20日下午2点在主报告厅举行。","note":"通知正文说明活动时间地点。英语顺序为地点由小到大、时间由点到日，勿按中文语序硬译。"},{"en":"All are welcome to attend.","basic":"","zh":"欢迎大家参加。","pos":"—","type":"pattern","example":"The lecture is open to all students, and all are welcome to attend.","exampleZh":"该讲座面向全体学生开放，欢迎大家参加。","note":"通知正文末欢迎语。welcome此处为形容词，attend后直接接活动名，勿加to。"},{"en":"Those who are interested are requested to sign up at ___ before ___.","basic":"","zh":"有兴趣者请于___之前到___报名。","pos":"—","type":"pattern","example":"Those who are interested are requested to sign up at the Students' Union office before November 18.","exampleZh":"有兴趣者请于11月18日之前到学生会办公室报名。","note":"通知正文报名要求。who引导定语从句修饰those，be requested to为礼貌被动表达。"},{"en":"Everyone concerned is requested to attend the meeting on time.","basic":"","zh":"请相关人员准时出席本次会议。","pos":"—","type":"pattern","example":"Everyone concerned is requested to attend the meeting on time.","exampleZh":"请相关人员准时出席本次会议。","note":"通知正文出席要求。concerned作后置定语，on time表“准时”，勿与in time（及时）混淆。"},{"en":"Attendance is compulsory for all members of the Students' Union.","basic":"","zh":"学生会全体成员必须出席。","pos":"—","type":"pattern","example":"Attendance is compulsory for all members of the Students' Union.","exampleZh":"学生会全体成员必须出席。","note":"通知正文纪律要求。compulsory比necessary更强调“必须”，注意拼写勿写成compulsary。"},{"en":"For further information, please contact ___.","basic":"","zh":"欲了解更多信息，请联系___。","pos":"—","type":"pattern","example":"For further information, please contact Li Ming at 12345678 or liming@example.com.","exampleZh":"欲了解更多信息，请拨打12345678或发邮件至liming@example.com联系李明。","note":"通知倒数第2句提供联系方式。contact后直接接人，勿写contact with sb。"},{"en":"The Students' Union","basic":"","zh":"学生会（发布单位落款）","pos":"n.","type":"phrase","example":"The Students' Union\nNovember 15, 2025","exampleZh":"学生会\n2025年11月15日","note":"通知落款：发布单位与日期分列正文右下方，单位在上日期在下；日期写November 15, 2025或15th November, 2025。"},{"en":"Volunteers Wanted","basic":"","zh":"招募志愿者（告示标题）","pos":"n.","type":"phrase","example":"Volunteers Wanted for the International Culture Festival","exampleZh":"国际文化节招募志愿者","note":"告示标题用名词短语，醒目、首字母大写、不加句号，比A Notice about Recruiting Volunteers简洁。"},{"en":"We are now recruiting ___.","basic":"","zh":"我们现招募___。","pos":"—","type":"pattern","example":"We are now recruiting twenty volunteers for the upcoming International Culture Festival.","exampleZh":"我们现为即将举办的文化节招募二十名志愿者。","note":"招募告示第1句。recruit为及物动词，后直接接人或岗位，勿写recruit for volunteers。"},{"en":"Applicants are expected to be ___.","basic":"","zh":"应聘者应具备___。","pos":"—","type":"pattern","example":"Applicants are expected to be fluent in English and willing to work on weekends.","exampleZh":"应聘者应英语流利，并愿意在周末工作。","note":"招募告示列出条件。be expected to语气客观，比must be更委婉，to后接动词原形。"},{"en":"Interested candidates are invited to send their applications to ___.","basic":"","zh":"有意者请将申请材料发送至___。","pos":"—","type":"pattern","example":"Interested candidates are invited to send their applications to the Students' Union office by November 18.","exampleZh":"有意者请于11月18日前将申请材料送至学生会办公室。","note":"招募告示说明申请方式。invite sb to do变被动后to不可省，applications to后接地名或邮箱。"},{"en":"Priority will be given to those with previous experience.","basic":"","zh":"有相关经验者优先。","pos":"—","type":"pattern","example":"Priority will be given to those with previous experience in voluntary work.","exampleZh":"有志愿服务经验者优先。","note":"招募告示补充条件。give priority to意为“优先考虑”，用被动语态更客观正式。"},{"en":"Don't miss this golden opportunity!","basic":"","zh":"不要错过这个绝佳机会！","pos":"—","type":"pattern","example":"Don't miss this golden opportunity to improve your spoken English!","exampleZh":"不要错过这个提高英语口语的绝佳机会！","note":"招募告示末句鼓动语。祈使句适合标题与结尾，但正文主体仍须保持正式书面语。"},{"en":"To: ___ / From: ___ / Date: ___ / Subject: ___","basic":"","zh":"致：___／发件人：___／日期：___／事由：___","pos":"—","type":"pattern","example":"To: All Department Heads\nFrom: Li Ming, General Manager\nDate: November 20, 2025\nSubject: Arrangements for the Annual Meeting","exampleZh":"致：各部门负责人\n发件人：总经理李明\n日期：2025年11月20日\n事由：年会安排","note":"备忘录用To/From/Date/Subject四行头，每行标签后加冒号、左对齐；日期写November 20, 2025或20th November, 2025。"},{"en":"The purpose of this memo is to ___.","basic":"","zh":"本备忘录旨在___。","pos":"—","type":"pattern","example":"The purpose of this memo is to inform you of the change in the meeting time.","exampleZh":"本备忘录旨在通知各位会议时间的变动。","note":"备忘录第1句点明目的。inform sb of sth中of不可省，to后接动词原形。"},{"en":"Please note that ___.","basic":"","zh":"请注意，___。","pos":"—","type":"pattern","example":"Please note that the deadline for submitting the report has been brought forward to November 25.","exampleZh":"请注意，提交报告的截止日期已提前至11月25日。","note":"备忘录正文提醒事项。bring forward意为“提前”，其被动完成式为has been brought forward。"},{"en":"I would appreciate your feedback by ___.","basic":"","zh":"如能在___之前得到您的反馈，我将不胜感激。","pos":"—","type":"pattern","example":"I would appreciate your feedback by Friday, November 22.","exampleZh":"如能在11月22日周五之前得到您的反馈，我将不胜感激。","note":"备忘录结尾索取回复。appreciate后接名词，by表“不迟于”，勿写before Friday at latest。"},{"en":"Attached please find ___.","basic":"","zh":"随附___，请查收。","pos":"—","type":"pattern","example":"Attached please find the detailed schedule for the annual meeting.","exampleZh":"随附年会的详细日程，请查收。","note":"备忘录随附材料说明。Attached置句首为固定倒装句式，勿写I attached please find。"},{"en":"Should you have any questions, please feel free to contact me.","basic":"","zh":"如有任何疑问，请随时与我联系。","pos":"—","type":"pattern","example":"Should you have any questions, please feel free to contact me.","exampleZh":"如有任何疑问，请随时与我联系。","note":"备忘录结尾礼貌收束。Should引导条件从句倒装，后接动词原形，比If you have更正式。"},{"en":"LOST AND FOUND","basic":"","zh":"失物招领（标题）","pos":"n.","type":"phrase","example":"LOST AND FOUND\nA black wallet was found in the reading room.","exampleZh":"失物招领\n在阅览室捡到一个黑色钱包。","note":"招领启事标题大写居中，正文用被动语态说明物品与拾获地点；寻物启事标题可写Lost。"},{"en":"I happened to find ___.","basic":"","zh":"我碰巧发现了___。","pos":"—","type":"pattern","example":"I happened to find a black leather wallet in the reading room yesterday afternoon.","exampleZh":"昨天下午我在阅览室碰巧捡到一个黑色皮钱包。","note":"招领启事第1句。happen to do表示“碰巧”，叙述过去事件用过去时，勿写happened to found。"},{"en":"Whoever lost it may come to ___ to claim it.","basic":"","zh":"失主可到___认领。","pos":"—","type":"pattern","example":"Whoever lost it may come to Room 305 to claim it with a valid student card.","exampleZh":"失主可携带有效学生证到305室认领。","note":"招领启事正文。whoever引导主语从句，谓语用单数may come；claim意为“认领”。"},{"en":"The owner may claim it at ___ during office hours.","basic":"","zh":"失主可在办公时间到___认领。","pos":"—","type":"pattern","example":"The owner may claim it at the reception desk during office hours.","exampleZh":"失主可在办公时间到前台认领。","note":"招领启事末句。during office hours意为“在办公时间内”，勿写in the office time。"},{"en":"Will the finder please contact me at ___ ?","basic":"","zh":"请拾到者拨___与我联系，好吗？","pos":"—","type":"pattern","example":"Will the finder please contact me at 12345678 or liming@example.com?","exampleZh":"请拾到者拨12345678或发邮件至liming@example.com与我联系，好吗？","note":"寻物启事正文请求句。Will...please为礼貌祈使句式，句末用问号，联系方式用at。"},{"en":"I would be grateful if anyone who has seen it could contact me.","basic":"","zh":"如有人见过，请与我联系，我将不胜感激。","pos":"—","type":"pattern","example":"I would be grateful if anyone who has seen it could contact me at 12345678.","exampleZh":"如有人见过，请拨12345678与我联系，我将不胜感激。","note":"寻物启事末句。who引导定语从句修饰anyone，could使语气委婉，勿改用can。"}],"file":"17-notice.json"}],"examIndex":{"title":"历年真题索引","desc":"考研英语一 Section III 写作真题逐年题面与原创范文。原题部分为考据结果，标注来源与置信度；范文为本书原创，非官方答案。","partB":{"title":"大作文真题索引","subtitle":"Part B · 图画/图表作文 160—200 词 · 1998—2025","emoji":"🗂","years":[{"year":1998,"chartType":"图画","titleZh":"如此承诺（母鸡的承诺）","topicEn":"So-Called Promises","pictureZh":"一幅讽刺漫画：一只母鸡手持一份“承诺书”，旁边配一首题为《如此承诺》的诗。图上文字为“本母鸡承诺：①本鸡下蛋不见棱不见角 ②保证有蛋皮，蛋黄和蛋清”。讽刺把分内之事当成了不起的承诺来宣扬的现象。","captions":[],"directionsZh":"写出漫画所传达的信息（母鸡的“承诺”），并给出自己的评论。不少于150词，15分；本年为考研史上第一次图画作文，当年无小作文。","sections":["society","quality","describe"],"tip":"诚信与承诺。漫画讽刺\"只承诺最保险的事\"，可写职业操守、社会责任、言行一致。","confidence":"high","note":"原文：未知 → 实际：1998年为图画（漫画）作文《如此承诺》：母鸡手拿承诺书，承诺自己下的蛋“不见棱不见角、有蛋皮蛋黄蛋清”，即把本职当恩惠；要求写出漫画寓意并评论。","sources":["https://www.offcn.com/kaoyan/2016/1129/70350.html","https://yzst.chsi.com.cn/kyzx/other/200710/20071016/1397852.html"],"model":{"en":"In the cartoon, a hen proudly holds up a written \"promise\" for all to see. The sheet reads: \"I promise that my eggs will have neither edges nor corners, and that each will contain a shell, a yolk and a white.\" Absurd as it sounds, the picture ridicules those who advertise their plain duty as a great favour.\n\nTo begin with, such boasting betrays a distorted sense of responsibility. What a hen ought to do is lay sound eggs, and nothing about it deserves applause. What is more, the habit spread far beyond the cartoon. Some officials trumpet routine services, and some merchants describe ordinary quality as a bonus granted to customers. Furthermore, empty promises erode public trust, for people soon discover that no extra effort was ever made.\n\nTherefore, instead of bragging about what is merely expected, we should quietly do our own job well. It is high time that we replaced self-congratulation with solid performance. Only by fulfilling our duties honestly can we win the respect we crave.","zh":"漫画中，一只母鸡得意地举着一张“承诺书”向众人展示。承诺书上写着：“本母鸡承诺：①本鸡下蛋不见棱不见角；②保证有蛋皮、蛋黄和蛋清。”尽管听上去荒谬，这幅画讽刺的正是那些把分内之事当作天大的恩惠来宣扬的人。\n\n首先，这种自我吹嘘暴露出一种扭曲的责任观。母鸡本该做的就是下好蛋，这毫无值得喝彩之处。其次，这种习气远不止于漫画之中。有些官员大肆宣扬本属日常的服务，有些商家把正常的质量说成是额外赐予顾客的好处。再者，空洞的承诺会侵蚀公众信任，因为人们很快就会发现，对方从未多付出过一分努力。\n\n因此，与其夸耀本就该做的事，不如安安静静地把自己的本职工作做好。我们早该用实实在在的成绩取代自我贴金。唯有诚实地履行自己的职责，我们才能赢得所渴求的尊重。","outline":["首段描述母鸡手持承诺书的画面，引用其承诺内容，点出讽刺寓意","主体段分层论证：责任观扭曲、社会上同类风气、公众信任受损","结尾段以 It is high time that 与倒装句提出做好本职、诚实尽责"],"words":170,"paras":3}},{"year":1999,"chartType":"图表","titleZh":"人口增长的沉浮（美国人口增长与物种灭绝）","topicEn":"The Ups and Downs of Population Growth","pictureZh":"两幅线形图：一幅显示1800—1980年美国人口急剧增长（约250倍），另一幅显示1700—1900年美国野生动物灭绝种类快速增加（约70倍）。两条曲线同向上升，暗示人口增长与物种灭绝相关。来源未提及图上有标题文字；“The Ups and Downs of Population Growth”是通行（范文）标题。","captions":[],"directionsZh":"覆盖图表全部信息，写三点：①人口增长对野生动物的影响 ②造成这种影响可能的原因 ③自己对保护野生动物的建议。不少于150词。","sections":["environment","describe","argue"],"tip":"生态与发展的冲突。可与环保板块一起背。","confidence":"high","note":"","sources":["https://yzst.chsi.com.cn/kyzx/other/200710/20071016/1397837.html","https://yz.chsi.com.cn/kyzx/en/200710/20071009/1378334.html"],"model":{"en":"As is shown in the two charts, the period from 1800 to 1980 witnessed a dramatic rise in the American population, which grew roughly 250 times. In the meantime, the number of wildlife species that became extinct climbed about 70 times between 1700 and 1900. The two curves move upward almost in step, unmistakably suggesting a close link between population growth and the extinction of other creatures.\n\nTo begin with, a growing population demands more land, food and timber, so forests, wetlands and grasslands are converted into farms and cities, leaving wild animals homeless. What is more, industrial expansion accompanying human numbers pollutes rivers and air, while hunting and trade wipe out species at a rate nature can hardly repair. Furthermore, every lost species is a link pulled out of the chain on which our own survival depends.\n\nIn my view, governments should set aside more nature reserves and enforce anti-poaching laws strictly, and ordinary citizens can contribute by consuming less and recycling more. It is high time that we realized we are not masters of the earth but one member of it. Only by protecting wildlife can we protect ourselves.","zh":"两幅图表显示：1800年至1980年间，美国人口急剧增长，增幅约为250倍；与此同时，1700年至1900年间，美国灭绝的野生动物种类增加了约70倍。两条曲线几乎同步上扬，清楚地暗示出人口增长与其他物种灭绝之间的密切关联。\n\n首先，人口的膨胀需要更多土地、粮食和木材，森林、湿地与草原被改造成农田和城市，野生动物因此失去家园。其次，伴随人口增长而来的工业扩张污染了河流与空气，而捕猎和贸易又使物种以自然几乎无法弥补的速度消失。再者，每一个消失的物种，都是从我们自身赖以生存的链条上抽走的一环。\n\n我认为，政府应划定更多自然保护区并严格执法反盗猎，普通公民也可以通过减少消费、加强回收来出一份力。我们早该意识到，人类不是地球的主宰，而只是其中一员。唯有保护野生动物，我们才能保护自己。","outline":["首段用两幅曲线图的数据说明人口增250倍与物种灭绝70倍的同向走势","主体段分层论证：人口占地、工业污染与猎捕贸易、食物链断裂的危害","结尾提出政府建保护区、个人少消费的建议，用倒装句收束全文"],"words":191,"paras":3}},{"year":2000,"chartType":"图画","titleZh":"世界商业捕鱼简史","topicEn":"A Brief History of World Commercial Fishing","pictureZh":"两幅对比图片：1900年辽阔海面上鱼群众多，却只有一艘渔船；1995年海面上渔船成群，却只剩一条鱼。图片配有英文标题“A Brief History of World Commercial Fishing”。","captions":[],"directionsZh":"描述两幅图片、推断作画者的意图，并提出应对措施（解决办法）。不少于150词。","sections":["environment","describe","argue"],"tip":"两图对比（1900 鱼多船少 / 1995 船多鱼少）。首段必须写出对比，主体段解释过度捕捞的成因，结尾落到可持续发展。","confidence":"high","note":"原文：图表 → 实际：图画（两幅对比图画）。2000年是“真正意义上的图画作文考查的开始”（继1998年后第二次图画作文），并非图表作文；1900年鱼多船少、1995年船多鱼少这一对应关系与原整理一致。","sources":["https://yz.chsi.com.cn/kyzx/other/200710/20071016/1397829.html","https://m.hujiang.com/en/p479038/"],"model":{"en":"The two pictures offer a brief history of world commercial fishing. In 1900, the vast sea was crowded with shoals of fish, whereas only a single fishing boat drifted on the water. In stark contrast, by 1995 the same sea was packed with fishing vessels of every size, yet merely one lonely fish was left swimming beneath them. This reversal warns us that uncontrolled exploitation will eventually empty the ocean that feeds us.\n\nTo begin with, the root cause lies in the greed for immediate profit; fishermen use finer nets and larger fleets to catch more than the sea can regenerate. What is more, weak international regulation leaves the high seas open to whoever arrives first, so no country feels obliged to hold back. Furthermore, whole marine food chains collapse, ruining the livelihood of coastal communities.\n\nAccordingly, governments should fix catch quotas and close fishing grounds during breeding seasons, while consumers can help by choosing seafood from sustainable sources. It is high time that we treated the ocean as a treasure to be shared rather than a mine to be emptied. Only by fishing with restraint can we leave our children a living sea.","zh":"两幅图画勾勒出世界商业捕鱼的简史。1900年，辽阔的海面上鱼群密集，而水上只有一艘渔船漂荡。形成鲜明对比的是，到了1995年，同一片海面挤满了大大小小的渔船，水下却只剩下一条孤独的鱼。这一反转警示我们：毫无节制的索取终将掏空养育我们的海洋。\n\n首先，根源在于贪图眼前利益的贪婪：渔民使用更细密的渔网和更大的船队，捕捞量超过了海洋的再生能力。其次，国际监管乏力，使公海对“先到者”敞开，没有哪个国家觉得自己有义务收手。再者，整条海洋食物链随之崩塌，使沿海社区的生计遭到破坏。\n\n因此，政府应设定捕捞配额并在繁殖季节休渔，消费者则可以通过选择可持续来源的海产品来帮忙。我们早该把海洋当作需要共同分享的宝藏，而不是可以挖空的矿藏。唯有有所克制地捕捞，我们才能给子孙后代留下一片有生命的海洋。","outline":["首段用对比句式写出1900年鱼多船少与1995年船多鱼少的强烈反差","主体段分层论证：逐利滥捕、国际监管薄弱、渔业崩溃的连锁后果","结尾建议设定捕捞配额与休渔期，呼吁克制捕捞，用倒装句收束"],"words":194,"paras":3}},{"year":2001,"chartType":"图画","titleZh":"爱心是一盏灯","topicEn":"Love Is a Lamp","pictureZh":"黑暗背景中一盏油灯发出明亮的火焰，火焰的形状像一个孩子纯真、灿烂的笑脸；灯旁有一句提示语：“爱心是一盏灯，在越黑暗的地方越明亮。”","captions":[],"directionsZh":"①描述图画并解释其象征意义 ②举出一个具体事例 ③就表达爱心的最好方式提出建议。约200词，20分（本年字数由150增至200，分值由15分增至20分）。","sections":["society","quality","describe"],"tip":"爱心与公益。可延伸到志愿服务、互帮互助、社会温度。","confidence":"high","note":"","sources":["https://yz.chsi.com.cn/kyzx/other/200710/20071016/1397800.html"],"model":{"en":"In the darkness of the picture, an oil lamp burns with a bright, steady flame, whose shape resembles the innocent, radiant smile of a child. Beside it runs a line of Chinese: \"Love is a lamp, which shines brightest where it is darkest.\" The message is plain: kindness is most precious precisely where suffering is deepest.\n\nA case in point is the volunteers who rushed to disaster-stricken areas. To begin with, they carried food and medicine into villages cut off by floods, so that despairing families saw hope again. What is more, their warmth proved contagious, for neighbours who had lost everything began to share what little remained. Furthermore, such giving costs hardly anything yet changes everything, since a small act of care can restore a person's faith in the world.\n\nAs for the best way to express love, I suggest we start with those around us: a phone call to ageing parents, a helping hand to a classmate in trouble, a donation to a worthy cause. It is high time that we stopped waiting for grand occasions. Only by lighting one small lamp can we drive away the darkness around us.","zh":"在画面的黑暗中，一盏油灯燃着明亮而平稳的火焰，其形状宛如孩童纯真灿烂的笑脸。灯旁写着一行中文：“爱心是一盏灯，在越黑暗的地方越明亮。”寓意十分清楚：善意恰恰在苦难最深的地方最为珍贵。\n\n一个恰当的例证是那些奔赴灾区的志愿者。首先，他们把食物和药品送进被洪水围困的村庄，让绝望的家庭重新看到希望。其次，他们的温暖具有感染力：失去了一切的邻里也开始分享手头仅存的东西。再者，这种给予几乎不花什么代价，却能改变一切，因为一次小小的关怀就足以让人重拾对世界的信心。\n\n至于表达爱心的最好方式，我认为应从身边人做起：给年迈的父母打个电话，帮有困难的同学一把，为值得的公益项目捐一点款。我们早该不再等待什么重大时机。唯有点亮一盏小灯，我们才能驱散身边的黑暗。","outline":["首段描述黑暗中油灯与孩童笑脸状的火焰，点出越黑暗越明亮的寓意","主体段举抗灾志愿者为例，进而说明爱心可以感染他人、重树信心","结尾就表达爱心的方式提出建议，以 Only by 倒装句作结"],"words":192,"paras":3}},{"year":2002,"chartType":"图画","titleZh":"民族文化与世界文化（美国女孩穿中国民族服装）","topicEn":"Cultures — National and International","pictureZh":"一张照片：一位笑容灿烂的美国姑娘身穿中国传统民族服饰（配有发带、耳环、项链等），照片注释为“An American girl in traditional Chinese costume”，题面给出标题“Cultures — National and International”。","captions":[],"directionsZh":"①描述照片并解释其含义 ②对这一现象（民族文化可成为世界的）给出自己的评论。约200词，20分。","sections":["culture","describe"],"tip":"照片题。文化多元与融合，可写\"民族的即世界的\"。","confidence":"high","note":"","sources":["https://yz.chsi.com.cn/kyzx/other/200710/20071016/1397791.html"],"model":{"en":"The photograph presents a young American woman smiling broadly, dressed in a traditional Chinese costume: an embroidered silk jacket, a matching headband, earrings and a necklace. The caption below reads \"An American girl in traditional Chinese costume\", and the title given is \"Cultures: National and International\". The picture is striking precisely because the girl is obviously not Chinese, which shows that culture crosses borders more easily than we assume.\n\nTo begin with, this photograph proves that national culture can become international property. What is more, such borrowing enriches both sides, for a foreign admirer brings fresh eyes to Chinese craft while her own culture gains a new colour. Furthermore, the exchange works against narrow prejudice, reminding us that beauty belongs to humanity rather than to a single nation.\n\nIn my view, we should welcome this trend with confidence. National traditions need not fear being shared; the more widely they travel, the more vital they become. It is high time that we presented our heritage to the world instead of keeping it locked away. Only by opening our culture to others can we make it truly international.","zh":"照片中，一位年轻的美国女性笑容灿烂，身穿中国传统民族服装：绣花丝绸上衣、相配的发带、耳环和项链。照片下方的说明写着“一位身穿中国传统服装的美国姑娘”，题面给出的标题是“Cultures: National and International”。这幅照片之所以引人注目，恰恰因为这位姑娘显然不是中国人，它说明文化的跨界远比我们想象的容易。\n\n首先，这张照片证明民族文化可以成为世界的财富。其次，这种借鉴使双方都受益：外国欣赏者以新鲜的眼光看待中国工艺，而她本国的文化也获得新的色彩。再者，这种交流有助于破除狭隘的偏见，提醒我们美属于全人类，而不只属于某一个民族。\n\n在我看来，我们应当自信地欢迎这一趋势。民族文化不必害怕被分享；传播得越广，它就越是充满活力。我们早该把我们的文化呈现给世界，而不是把它锁起来。唯有向他人开放我们的文化，才能使它真正成为世界的文化。","outline":["首段描述照片中美国姑娘的中国传统服饰与灿烂笑容，点明文化跨界","主体段分层论证：民族文化可成世界财富、交流双向获益、破除偏见","结尾表明应自信开放地展示本民族文化，用倒装句收束全文"],"words":186,"paras":3}},{"year":2003,"chartType":"图画","titleZh":"温室花朵经不起风雨","topicEn":"Greenhouse Flowers Cannot Withstand Storms","pictureZh":"一组两幅对比图画：第一幅中，尽管外面狂风暴雨、电闪雷鸣，温室（花房）里的花依然怒放；第二幅中，同一朵花被搬出温室、暴露在风雨之中，立即凋谢枯萎，花瓣散落一地。题面指其含义为“温室中的花朵经不起风雨”。","captions":[],"directionsZh":"①描述这组图画并解释其含义 ②指出其中暗含的、在我们生活中的寓意（implications）。约200词，20分。","sections":["family","quality","describe"],"tip":"过度保护与独立。关键词 overprotection / independence / adversity。","confidence":"high","note":"","sources":["https://yzst.chsi.com.cn/kyzx/other/200710/20071016/1397786.html","https://m.hujiang.com/en_music/p479446/"],"model":{"en":"The first picture shows a flower blooming splendidly inside a greenhouse, whereas outside the glass a violent storm rages with lightning and pouring rain. In stark contrast, the second picture reveals the same flower carried out into the wind and rain, where it withers at once, its petals scattered on the ground. The lesson is unmistakable: a sheltered life produces a bloom that cannot survive reality.\n\nTo begin with, the metaphor applies directly to young people who are overprotected by their families. Denied hardship at home, many of them break down at the first difficulty of college or work. What is more, the same logic governs education: pupils who are drilled only for tests seldom learn to think independently. Furthermore, a society that removes every risk from childhood eventually raises a generation of fragile adults.\n\nTherefore, parents should let children face manageable difficulties and learn from failure, and schools should cultivate resilience as earnestly as they pursue high marks. It is high time that we stopped mistaking comfort for love. Only by braving the storm can a young plant grow into a sturdy tree.","zh":"第一幅图画中，温室里的花朵开得灿烂，而玻璃房外却是电闪雷鸣、狂风暴雨。形成鲜明对比的是，第二幅图里，同一朵花被搬到风雨之中，立刻枯萎凋谢，花瓣散落一地。寓意再清楚不过：被庇护的生活养出的花朵经不起现实的考验。\n\n首先，这一比喻直接适用于那些被家庭过度保护的年轻人。在家里未曾经历困难，许多人一遇到大学或工作中的第一个挫折就崩溃。其次，同样的道理也适用于教育：只为考试而被反复训练的学生，很少学会独立思考。再者，一个替童年扫清一切风险的社会，最终培养出的是一代脆弱的成年人。\n\n因此，父母应让孩子面对力所能及的困难并从失败中学习，学校也应像追求高分一样认真地培养抗挫力。我们早该不再把舒适误当成爱。唯有经历风雨，幼苗才能长成挺拔的大树。","outline":["首段用 whereas 写出温室内盛开与出温室即凋谢的强烈对比","主体段由花及人，谈家庭过度保护、应试教育与脆弱一代的后果","结尾建议家庭放手、学校培养抗挫力，用虚拟语气和倒装句收尾"],"words":184,"paras":3}},{"year":2004,"chartType":"图画","titleZh":"终点又是新起点","topicEn":"The Finishing Line Is Also a Starting Point","pictureZh":"一名满头大汗、嘴角带笑的男孩（赛跑者）正冲向终点线；地上有一个箭头标着“终点”，紧接着另一个箭头标着“起点”，图下一行字写着“终点又是新起点”。","captions":[],"directionsZh":"①描述图画 ②解释其含义 ③用若干例子支持自己的观点。约200词，20分。","sections":["quality","career","describe"],"tip":"永不止步。与 2019、2017 共用「行动/进取」句式，可一起背。","confidence":"high","note":"","sources":["https://yz.chsi.com.cn/kyzx/en/200710/20071016/1397781.html"],"model":{"en":"The cartoon depicts a young runner, sweat streaming down his face, smiling as he dashes towards the finishing line. On the ground before him an arrow is marked \"finish\", and immediately beyond it another arrow is marked \"start\". Below the drawing runs the sentence \"The finishing line is also a starting point.\" The picture tells us that every achievement opens, rather than closes, a new journey.\n\nTo begin with, success is dangerous when it breeds complacency. Numerous athletes, having won one championship, train less and soon disappear from the arena. What is more, progress in any field is endless: a scientist who solves one puzzle merely uncovers a dozen new ones. Furthermore, examples surround us. After landing on the moon, humanity did not stop but aimed at Mars; after each medical breakthrough, researchers set out against the next disease.\n\nIn my opinion, we should treat each triumph as a checkpoint rather than a destination, drawing lessons from it and setting a fresh goal at once. It is high time that we replaced the question \"Have I arrived?\" with \"Where do I go next?\" Only by starting anew after every finish can we keep moving forward.","zh":"漫画描绘了一位年轻的赛跑者，脸上汗水直流，带着笑容向终点线冲刺。他前面的地上标着一个箭头“终点”，紧挨着它后面另一个箭头标着“起点”。图下方写着：“终点又是新起点。”这幅画告诉我们，每一次成就开启的是一段新的旅程，而不是把旅程关闭。\n\n首先，成功一旦滋长自满便十分危险。许多运动员夺得一次冠军后训练松懈，很快便从赛场上消失。其次，任何领域的进步都是无止境的：解决了一个难题的科学家，往往只是揭开了一打新的难题。再者，这样的例子比比皆是。登上月球之后，人类并未止步，而是把目标指向火星；每一次医学突破之后，研究者又投入到下一种疾病的攻坚中。\n\n我认为，我们应把每一次胜利当作一个检查点，而非终点站，从中吸取经验并立刻设定新的目标。我们早该把“我到了吗？”换成“我下一步去哪儿？”唯有在每一次抵达之后重新出发，我们才能不断前行。","outline":["首段描述冲向终点的男孩、地面上终点与起点两个箭头及图下文字","主体段论证成功易生自满、学问无止境，并举登月与医学突破为例","结尾提出把每次成功当作新起点，用 It is high time that 与倒装句"],"words":195,"paras":3}},{"year":2005,"chartType":"图画","titleZh":"养老“足球赛”","topicEn":"Supporting the Elderly","pictureZh":"一个足球场的四个角各有一个球门，守门的是同一位老人的四个子女——大儿子、二儿子、小儿子和小女儿；球场中间是一个蜷缩成一团、呈球形的老人，被子女们当成足球踢来踢去，无人愿意接住、赡养。来源未提及图上有文字说明。","captions":[],"directionsZh":"先描述图画，再解释其含义，并对其作出评论。160-200词，20分（2005年起增加应用文小作文，大作文降为160-200词）。","sections":["family","society","describe"],"tip":"老龄化 + 孝道 + 社会责任。老题但主题常青，近年仍可能复现。","confidence":"high","note":"原文：四个儿子把老人当球踢 → 实际：是三子一女共四个子女，分别守住球场四角的四个球门，把蜷缩成球形的老人踢来踢去；“儿女”而非“四个儿子”，且是四个球门分守四角。","sources":["http://www.kaoyan365.cn/yingyu/ziliao/12660.html","https://m.hujiang.com/en_ppt/p479451/","http://www.yuloo.com/news/2005-02-01/44539.html"],"model":{"en":"The picture shows a football field with four goals, one at each corner, guarded respectively by an elderly man's three sons and one daughter. In the middle of the pitch lies the old man himself, curled up into a ball, being kicked from one goal to another. Nobody wants to catch him; each child simply passes the burden on. The cartoon satirizes those who shirk the duty of supporting their aged parents.\n\nTo begin with, such behaviour betrays a shameful ingratitude, since these children were once fed, clothed and educated by the very man they now reject. What is more, the phenomenon is worsening as society ages and the pressure of work grows, yet poverty of time can never justify poverty of conscience. Furthermore, abandoning parents harms more than the old: children who watch such scenes will treat their own parents the same way.\n\nTherefore, the family should remain the first provider of care, while the state must improve pensions and community services. It is high time that we honoured the old instead of passing them like a ball. Only by respecting our elders can we expect respect when we grow old.","zh":"图画显示一个足球场，四角各有一个球门，分别由一位老人的三个儿子和一个女儿把守。球场正中躺着的正是这位老人，他蜷缩成一团，被从一个球门踢向另一个球门。没有人愿意接住他；每个子女只是把负担传出去。这幅漫画讽刺的正是那些逃避赡养父母责任的人。\n\n首先，这种行为暴露出令人羞愧的忘恩负义，因为这些子女当年正是被他们如今拒之门外的这个人喂养、穿衣、供读。其次，随着社会老龄化和工作压力加大，这一现象还在加剧，然而时间的匮乏绝不能成为良心匮乏的借口。再者，抛弃父母伤害的不只是老人：目睹这种场面的孩子将来也会以同样的方式对待自己的父母。\n\n因此，家庭仍应是照料老人的第一责任人，而国家必须完善养老金与社区服务。我们早该敬重老人，而不是把他们像球一样踢来踢去。唯有尊重长辈，我们年老时才能指望得到尊重。","outline":["首段描述四个球门分守四角、老人蜷缩成球被子女踢来踢去的画面","主体段批评忘恩负义，指出老龄社会压力与身教对下一代的影响","结尾呼吁家庭尽责与政府完善养老保障，用倒装句作结"],"words":192,"paras":3}},{"year":2006,"chartType":"图画","titleZh":"偶像崇拜","topicEn":"Idol Worship","pictureZh":"两幅照片：图1中一名年轻男子把足球明星的名字“Beckham”写在脸上，配文“把崇拜写在脸上”；图2中另一名男子在理发店花300元做“小贝头”，模仿贝克汉姆的发型。图注说明Beckham是英国足球明星。","captions":[],"directionsZh":"①简述两幅照片 ②解释其所反映的社会现象 ③给出自己的观点。160-200词，20分。","sections":["society","quality","describe"],"tip":"照片题。辩证看待追星：适度激励 vs 盲目模仿，落点\"理性追星、崇尚内在\"。","confidence":"high","note":"原文：图画——偶像崇拜（贝克汉姆发型） → 实际：为两幅照片（照片类图画，与2002年同为照片），图1“把崇拜写在脸上”（脸上写Beckham），图2“花300元做小贝头”；要求简述照片、解释社会现象并给出观点。原整理要点不错，但漏了“两幅照片、2006年为照片而非漫画”这一信息。","sources":["http://www.offcn.com/kaoyan/2016/1130/70411.html","https://yz.chsi.com.cn/kyzx/other/200811/20081126/10545552-1.html"],"model":{"en":"The two photographs show how far idol worship can go. In the first, a young man has the name \"Beckham\" written across his face, and the caption reads \"Writing the admiration on his face\". In the second, another young man is having his hair cut in the style of the British football star, which, as the caption notes, cost him 300 yuan. Devotion of this kind says less about Beckham than about the emptiness of the fans' own lives.\n\nTo begin with, moderate admiration is harmless; it is blind imitation that worries us. What is more, thousands of young people spend money and energy copying a stranger's appearance, whereas they seldom imitate his discipline or perseverance. Furthermore, such enthusiasm is often exploited by advertisers, who turn teenage passion into profit. In stark contrast to genuine self-improvement, this worship leaves fans with nothing but a fashionable surface.\n\nIn my view, hot pursuit of idols should give way to calm appreciation of what they represent. It is high time that we learned to admire virtues rather than haircuts. Only by building our own strengths can we become someone worth worshipping.","zh":"这两幅照片显示出偶像崇拜可以走得多远。第一幅中，一名年轻男子把“Beckham”这个名字写在脸上，图注写着“把崇拜写在脸上”。第二幅中，另一名年轻男子正在剪那位英国足球明星的发型，图注说明这花了他300元。这样的狂热与其说说明了贝克汉姆的魅力，不如说暴露了追星者自身生活的空虚。\n\n首先，适度的崇拜无害，令人担忧的是盲目模仿。其次，成千上万的年轻人为模仿一个陌生人的外表花费金钱和精力，却很少模仿他的自律与坚持。再者，这种热情常常被商家利用，他们青少年的激情变成了利润。与真正意义上的自我提升相比，这种崇拜只给追星者留下一层时髦的外壳。\n\n在我看来，对偶像的热烈追逐应让位于对其所代表品质的冷静欣赏。我们早该学会欣赏品格而不是发型。唯有打造自己的长处，我们才能成为值得他人崇拜的人。","outline":["首段描述脸上写 Beckham 与花300元做小贝头的两幅照片及图注文字","主体段分层论证：适度崇拜无妨、盲目模仿成风、热情被商家利用","结尾主张欣赏偶像的品质而非外表，用倒装句收束全文"],"words":188,"paras":3}},{"year":2007,"chartType":"图画","titleZh":"自信","topicEn":"Self-Confidence","pictureZh":"足球场上的点球决战：一名射手正准备射门，一名守门员把守球门。两人想法恰好相反——守门员觉得球门如此之大，自己如此渺小；射手却觉得球门如此之小，门将如此神武。双方都因低估自己而缺乏自信。来源未提及图画上的文字说明。","captions":[],"directionsZh":"①简述图画 ②解释其引申含义 ③用一个或几个例子支持自己的观点。160-200词，20分。","sections":["quality","describe"],"tip":"自信与心态。写「自信不是自负」，可加一句让步。","confidence":"high","note":"","sources":["https://yzst.chsi.com.cn/kyzx/jyxd/200701/20070124/748807.html","https://m.hujiang.com/en/p551998/"],"model":{"en":"In the cartoon, two footballers are frozen in a penalty shoot-out. Facing the same goal, the goalkeeper feels hopelessly small beside an enormous net, while the shooter finds the goal tiny and its keeper invincible. Before the ball is kicked, both have already been beaten by one enemy: self-doubt.\n\nTo begin with, self-doubt distorts our perception of reality. The goal never changes size; only the lens through which each man sees himself does, and that lens can turn ordinary challenges into insurmountable walls. What is more, confidence largely decides performance: a player who expects to fail hesitates at the crucial moment, whereas one who trusts his ability strikes with composure. Furthermore, countless achievers rose on self-belief rather than superior talent. Deng Yaping, once dismissed as too short for table tennis, trained relentlessly and became a world champion.\n\nIn short, our fiercest opponent is often our own insecurity. It is high time that we judged ourselves fairly, magnifying neither difficulties nor defeats. Only by believing in ourselves can we take the shot that decides the game.","zh":"画中，两名球员定格在点球大战的瞬间。面对同一个球门，守门员觉得自己在偌大的球门旁渺小得可怜，而射手却觉得球门小得可怜、把守它的门将神勇无比。球还没踢出，两人就已经被同一个敌人打败——那就是不自信。\n\n首先，自我怀疑会扭曲我们对现实的认知。球门的大小从未改变，改变的只是每个人看待自己的那副镜片，而这副镜片能把普通的挑战放大成无法逾越的高墙。其次，信心在很大程度上决定发挥：预感失败的球员会在关键时刻犹豫不决，而相信自己实力的球员则沉着起脚。再者，无数成功者靠的是自信而非过人的天赋：邓亚萍曾因个子太矮被人断言不适合打乒乓球，她苦练不辍，最终成为世界冠军。\n\n总而言之，我们最凶悍的对手往往就是自己的不安全感。是时候公正地评价自己了，既不要放大困难，也不要贬低自己的力量。唯有相信自己，我们才能踢出那决定胜负的一球。","outline":["首段写点球场景：守门员自感渺小、射手视门将神勇，点出寓意。","主体分三层：自我怀疑扭曲认知、信心决定发挥、邓亚萍佐证。","结尾呼吁公正评价自己，用 Only by 倒装句收束。"],"words":175,"paras":3}},{"year":2008,"chartType":"图画","titleZh":"合作","topicEn":"Cooperation","pictureZh":"两名残疾人把拐杖扔在身后，互相用有力的手搀扶着、一起大步向前走去。图画文字说明为：“你一条腿，我一条腿；你我一起，走南闯北。”","captions":[],"directionsZh":"①简述图画 ②解释其寓意 ③给出自己的评论。160-200词，20分。","sections":["quality","describe"],"tip":"合作共赢。可用 synergy / complement each other / join hands。","confidence":"high","note":"原文：两个残疾人各缺一条腿，合起来奔跑 → 实际：两人丢掉（扔掉）拐杖、互相搀扶并排大步前行，并非“奔跑”；且图上有文字说明“你一条腿，我一条腿；你我一起，走南闯北”。","sources":["https://yz.chsi.com.cn/kyzx/en/200812/20081203/11329940.html"],"model":{"en":"In the picture, two disabled men have thrown their crutches away and are striding forward side by side, each supporting the other with a firm arm. A caption beneath them reads, “You have one leg, I have one leg; together we can travel north and south.” The message is unmistakable: cooperation enables the weak to achieve what neither could alone.\n\nTo begin with, cooperation pools individual strengths and compensates for individual weaknesses. Each man lacks a leg, yet together they walk steadily, while either alone could only limp. What is more, cooperation breeds trust and mutual respect, which no amount of solitary brilliance can create. Furthermore, in an age of fierce competition, few significant goals can be reached single-handedly. China's space programme, whose spacecraft were produced by thousands of scientists and engineers working in concert, shows how powerfully joint effort can turn limitations into achievements.\n\nTherefore, the crutches lying on the ground teach us a simple truth: no one is strong enough to walk every road alone. It is high time that we abandoned the illusion of self-sufficiency and learned to give and receive support. Only by joining hands can we go further than either of us ever could.","zh":"画中，两名残疾人把拐杖扔在身后，并肩大步向前，各自用有力的手臂扶着对方。他们身下的一行文字写道：“你一条腿，我一条腿；你我一起，走南闯北。”这幅画传递的信息再清楚不过：合作能让弱者做到任何一方单独都无法做到的事。\n\n首先，合作能汇聚个体之长、弥补个体之短。两人各缺一条腿，可携手便能稳步前行，而任何一方单独走只能一瘸一拐。其次，合作孕育信任与相互尊重，这是任何孤军奋战的天才都无法造就的。再者，在竞争激烈的年代，极少有重大目标可以靠一己之力达成。中国航天工程中，飞船由成千上万名科学家与工程师协同制造，它有力地说明：合力能把局限转化为成就。\n\n因此，扔在地上的拐杖教会我们一个简单的道理：没有人强大到可以独自走完每一条路。是时候抛弃自给自足的幻想，学会既给予支持、也接受支持。唯有携手，我们才能走得比任何一方独自前行都远。","outline":["首段写两人扔掉拐杖、互相搀扶前行并引图上文字，点出合作。","主体分三层：合作互补短长、孕育信任、中国航天协作事例。","结尾以拐杖作结，呼吁既给也受支持，用 Only by 收束。"],"words":199,"paras":3}},{"year":2009,"chartType":"图画","titleZh":"网络的“近”与“远”","topicEn":"The Internet: Near and Far","pictureZh":"一幅漫画：一张巨大的蜘蛛网（象征互联网）把各方节点连接起来，而人们各自坐在狭小的“格子间”里面对电脑、通过上网与人交流——网络让远的人变近，却让身边的人缺少面对面的真实交流。来源未提及图上文字说明。","captions":[],"directionsZh":"①简述图画 ②解释其含义 ③给出自己的观点/评论。160-200词，20分。","sections":["technology","describe"],"tip":"与 2015 同源。写「物理距离拉近、心理距离拉远」的悖论最有分。","confidence":"high","note":"","sources":["https://yz.chsi.com.cn/kyzx/other/200901/20090119/16727092.html","http://www.offcn.com/kaoyan/2016/1123/69982.html","https://m.hujiang.com/en/p552054/"],"model":{"en":"In the cartoon, a huge spider's web stretches across the picture, linking every corner of the world, while people sit isolated in tiny cubicles, each staring at a computer screen. The web draws distant strangers close, yet pushes neighbours apart. Here lies a paradox: the Internet connects us online only to disconnect us in person.\n\nTo begin with, the convenience the Internet offers is undeniable. Messages once taking weeks now arrive in seconds, and a student in a remote village can attend lectures delivered by famous professors. What is more, this convenience carries a hidden cost. Sitting side by side, colleagues email each other instead of turning their heads; families at dinner immerse themselves in screens rather than in conversation. Furthermore, the more time we spend in virtual space, the less we invest in real relationships, for warmth, eye contact and shared silence cannot be downloaded.\n\nTo sum up, the Internet is a tool, not a substitute for human contact. It is high time that we used it as a bridge rather than a shelter. Only by stepping out of our cubicles and looking up can we enjoy the nearness it was meant to serve.","zh":"画中，一张巨大的蛛网横贯画面，把世界的各个角落连接起来；而人们却各自困在狭小的格子间里，盯着电脑屏幕。蛛网把远方的陌生人拉近，却把近在身边的人推开。这里面隐藏着数字时代的一个悖论：互联网在线上把我们连在一起，恰恰又在现实中把我们分开。\n\n首先，网络带来的便利无可否认。曾经要花数周才能送达的消息，如今几秒即至；偏远山村的学生也能听到名师的授课。其次，这份便利也暗含代价：并肩而坐的同事互相发邮件而不愿扭头说话，共进晚餐的家人沉溺于屏幕而不是交谈。再者，我们在虚拟空间里花的时间越多，投入到真实关系中的就越少，因为温度、眼神和共处的沉默都无法下载。\n\n总之，互联网是工具，而不是人际交往的替代品。是时候把它当作桥梁而不是避难所。唯有走出格子间、抬起头来，我们才能真正享受它本应带来的那份亲近。","outline":["首段写蛛网与格子间，点出网络把远人拉近、近人推远。","主体分层：网络便利、隐藏代价、虚拟时间挤占真实关系。","结尾以桥与避难所作比，呼吁做网络的主人。"],"words":195,"paras":3}},{"year":2010,"chartType":"图画","titleZh":"文化“火锅”","topicEn":"Cultural Hot Pot (Cultural Blending)","pictureZh":"一幅热气腾腾的“火锅”图，锅内写满各种中外文化元素：毕昇、老舍、莎士比亚、爱因斯坦等中外名人，佛、道、儒、仁、礼、人本、启蒙、后现代、解构等哲学概念，以及京剧、功夫、《天鹅湖》等表演艺术。图下文字说明：“文化‘火锅’，既美味又营养。”","captions":[],"directionsZh":"①简述图画 ②解释其内在含义（文化融合） ③给出自己的评论。160-200词，20分。","sections":["culture","describe"],"tip":"文化融合与多元。经典比喻可复用：melting pot / hotpot of cultures。","confidence":"high","note":"","sources":["https://mtoutiao.xdf.cn/kaoyan/201512/10382595.html","https://yz.chsi.com.cn/kyzx/en/201001/20100115/61845653.html","https://m.hujiang.com/en_kaoyanzuowen/p479742/"],"model":{"en":"In the picture, a steaming hot pot is boiling on the table, but what simmers inside is far from ordinary: names such as Bi Sheng, Lao She, Shakespeare and Einstein, concepts like Confucianism and the Enlightenment, and arts from Peking Opera to Swan Lake. The caption reads, “Cultural hot pot: both delicious and nutritious.” The metaphor is clear: a culture grows richer when it welcomes ingredients from every tradition.\n\nTo begin with, cultural blending enriches a nation's creativity. Just as one dish absorbs the flavours of many spices, a civilisation that borrows freely from others renews its vitality. What is more, exchange dissolves prejudice. Only when we read foreign literature, watch foreign films or taste foreign food do we discover that people everywhere share the same hopes and fears. Furthermore, history confirms the value of openness: the Tang Dynasty, with its cosmopolitan capital, produced poetry and art we still admire, whereas closed societies have repeatedly withered.\n\nIn conclusion, the hot pot teaches us to welcome what is different instead of fearing it. It is high time that we treated other cultures as ingredients, not threats. Only by keeping the pot boiling can we serve a feast that nourishes everyone.","zh":"画中，一只热腾腾的火锅正在桌上沸腾，锅里煮的却远非寻常之物：毕昇、老舍、莎士比亚、爱因斯坦等中外名人，儒家与启蒙等思想概念，以及从京剧到《天鹅湖》的各种表演艺术。图下文字写着：“文化‘火锅’，既美味又营养。”其寓意十分清楚：一种文化越是欢迎来自各传统的“食材”，就越加丰盛。\n\n首先，文化交融能激发一个民族的创造力。正如一道菜吸纳各种香料的滋味，一个乐于借鉴他人的文明才能焕发自身的活力。其次，交流能消解偏见。只有读外国文学、看外国电影、尝外国食物，我们才会发现各地的人有着同样的希望与恐惧。再者，历史反复印证开放的价值：唐代长安荟萃四方，孕育出至今令人赞叹的诗歌与艺术，而封闭的社会则一再凋敝。\n\n总之，这口火锅教我们欢迎差异而不是畏惧差异。是时候把其他文化视为食材而非威胁。唯有让锅一直沸腾，我们才能端出一桌滋养所有人的盛宴。","outline":["首段写锅里煮着中外名人、思想与艺术，并译图下文字。","主体三层：交融激发创造力、交流消解偏见、唐朝对比。","结尾把其他文化比作食材，呼吁保持开放与包容。"],"words":199,"paras":3}},{"year":2011,"chartType":"图画","titleZh":"旅程之“余”","topicEn":"The “Leftovers” of a Journey","pictureZh":"一艘小船行驶在湖面上，船上两名年轻人把各种垃圾随手扔进湖里，湖面漂满瓶子等各类垃圾。图画标题（文字说明）为“旅程之‘余’”。","captions":[],"directionsZh":"①简述图画 ②解释其内在含义 ③给出自己的评论。160-200词，20分。","sections":["environment","society"],"tip":"文明旅游 + 环保意识 + 公德。可写个人素养，也可写景区管理。","confidence":"high","note":"","sources":["https://m.hujiang.com/en/p136975/"],"model":{"en":"In the cartoon, two young people are relaxing on a boat drifting across a lake, carelessly tossing bottles, cans and plastic bags into the water. Beneath them, the lake is already covered with floating rubbish. The title “The Leftovers of a Journey” says everything: what these tourists leave behind is not only waste, but also a damaged environment and a tarnished conscience.\n\nTo begin with, such behaviour betrays a selfish indifference to the public good. Those who litter assume that one bottle makes no difference, forgetting that thousands of similar gestures turn a scenic lake into a rubbish dump. What is more, environmental damage is rarely reversible: the plastic they throw away today may outlive them by centuries. Furthermore, tourists are guests of nature, and guests ought to leave a place no worse than they found it. How would they feel if, next summer, they found the shore of their picnic buried under their own litter?\n\nIn short, the leftovers of a journey reveal the character of the traveller. It is high time that we carried our rubbish away along with our memories. Only by protecting the scenery we enjoy can we ensure that others may enjoy it too.","zh":"画中，两名年轻人悠然坐在湖面漂荡的小船上，随手把瓶子、易拉罐和塑料袋扔进水里。在他们身下，湖面早已漂满垃圾。标题“旅程之‘余’”道出了一切：这些游客留下的不只是垃圾，还有一个受污染的环境和一颗蒙尘的良心。\n\n首先，这种行为暴露了对公共利益的冷漠自私。乱丢垃圾的人总以为多一个瓶子无关紧要，却忘了千百个同样的举动会把一片秀美的湖泊变成垃圾场。其次，环境破坏往往不可逆转：他们今天扔掉的塑料，可能比他们多活上几百年。再者，游客是大自然的客人，客人理应让一个地方保持原样、不使之更糟。试想，若他们明年夏天重游旧地，发现当年野餐的湖岸被自己的垃圾覆盖，又会作何感受？\n\n总之，旅程之“余”映照出旅行者的品行。是时候让我们把垃圾连同回忆一起带走了。唯有保护我们所欣赏的风景，才能保证别人也能欣赏它。","outline":["首段写游客向湖中扔垃圾、湖面漂满垃圾，并译出标题。","主体分层：冷漠自私、破坏不可逆、客人应保持原样。","结尾以旅程之余映照品行收束，呼吁保护风景。"],"words":199,"paras":3}},{"year":2012,"chartType":"图画","titleZh":"乐观与悲观","topicEn":"Optimism and Pessimism","pictureZh":"一个瓶子倒在地上，瓶中的液体洒出大半；面对同样情形，两人反应截然相反——左边的人抱头掩面、表情痛苦，认为“完了”；右边的人面带笑容、弯腰去捡瓶子，庆幸“幸好还剩一点儿”。","captions":[],"directionsZh":"①简述图画 ②解释其内在含义 ③给出自己的评论。160-200词，20分。","sections":["quality","describe"],"tip":"同一件事两种心态。首段一定要写出「对比」，句式用 whereas / in stark contrast。","confidence":"high","note":"","sources":["https://m.koolearn.com/kaoyan/20141112/844540.html","http://m.offcn.com/kaoyan/2016/1122/69898.html","https://mtoutiao.xdf.cn/kaoyan/201611/10570913.html"],"model":{"en":"In the picture, a bottle lies overturned on the ground, half of its contents already spilled. Faced with the very same scene, the two men react in stark contrast: one clasps his head and wails, “It's all over!”, whereas the other smiles, bends down to pick up the bottle and says, “Luckily, there's still a little left.” Same bottle, opposite attitudes: that is the point.\n\nTo begin with, optimism is not blind wishful thinking but a practical way of managing misfortune. The spilled liquid cannot be recovered; what remains can still be used. What is more, attitude shapes outcome. A student who fails an exam may either drown in self-pity or analyse his mistakes and try again; it is the second response that produces success. Furthermore, a positive outlook is contagious. Optimists reassure the people around them, turning a shared setback into a shared task, while pessimists spread despair that helps nobody.\n\nIn conclusion, the half-empty bottle mirrors our habits of mind. It is high time that we trained ourselves to notice what is left instead of lamenting what is lost. Only by facing setbacks with a smile can we turn a small remainder into a fresh start.","zh":"画中，一只瓶子倒在地上，里面的液体已洒出大半。面对完全相同的情形，两个人的反应形成鲜明对比：一个人抱头哀叹“完了”，另一个人却微笑着弯腰捡起瓶子，说“幸好还剩一点儿”。同样的瓶子，相反的态度，这正是这幅画的要害。\n\n首先，乐观并非盲目的空想，而是应对不幸的务实方式。洒出去的液体无法收回，剩下的却还可以用。其次，态度会影响结果。考砸了的学生要么沉溺于自怨自艾，要么分析错因、重新再战，而最终带来成功的正是后一种反应。再者，积极心态具有感染力：乐观者能安定身边的人，把共同的挫折变成共同的任务，而悲观者散播的绝望对任何人都没有帮助。\n\n总之，那只剩半瓶的瓶子是一面镜子，照出我们各自的思维习惯。是时候训练自己去注意“还剩什么”，而不是一味哀叹“失去了什么”。唯有微笑着面对挫折，我们才能把所剩不多的一点，变成新的开始。","outline":["首段用 whereas 对比两人一悲一喜的反应。","主体三层：乐观是务实应对、态度决定结果、心态会传染。","结尾以瓶子喻镜子，呼吁微笑着面对挫折与失去。"],"words":198,"paras":3}},{"year":2013,"chartType":"图画","titleZh":"选择","topicEn":"Choices after Graduation","pictureZh":"一群大学毕业生驻足在人生的岔路口前，面前延伸出多条通路，通向不同的未来（普遍解读为求职、考研、出国、创业），众人犹豫彷徨、不知该选哪一条。来源未确认图中岔路是否配有文字标注。","captions":[],"directionsZh":"①简述图画 ②解释其内在含义 ③给出自己的评论。160-200词，20分。","sections":["career","quality"],"tip":"考研 / 就业 / 出国。可写「没有标准答案，适合自己的才是最好的」。","confidence":"medium","note":"","sources":["https://yz.chsi.com.cn/kyzx/en/201301/20130106/381844463.html","https://www.offcn.com/kaoyan/2016/1116/69420.html","http://www.offcn.com/kaoyan/2018/1127/133212.html","https://jixun.iqihang.com/info/yyzd/2026793504.html"],"model":{"en":"In the picture, a group of graduates stand hesitating at a crossroads in their lives. Several paths stretch out before them in different directions, and the young people gaze at the diverging roads, uncertain which one to take. The drawing vividly captures the bewilderment nearly every graduate feels as campus life ends and an unpredictable future begins.\n\nTo begin with, choice is a privilege that demands responsibility, for nobody can walk several roads at once; a graduate must weigh his interests, abilities and circumstances before setting off. What is more, indecision itself is a choice, and usually the worst one, since those who postpone every decision often watch their best opportunities slip away. Furthermore, a chosen path is seldom final. Many successful people changed direction more than once, treating early missteps as tuition rather than failure. What matters is not finding the perfect road but walking the chosen one with commitment.\n\nIn short, a crossroads is not a misfortune but proof that we are free to shape our own lives. It is high time that we stopped dreading the burden of choice and began to choose deliberately. Only by taking one road seriously can we discover where it leads.","zh":"画中，一群毕业生在人生的岔路口驻足犹豫。他们面前延伸出好几条通往不同方向的道路，这些年轻人望着分岔的路，不知道该如何选择。这幅画生动地刻画出几乎每位毕业生都会有的茫然：熟悉的校园生活结束了，一个不可预知的未来就此开始。\n\n首先，选择是一种权利，也意味着责任，因为没有人能同时走几条路；毕业生在上路之前必须权衡自己的兴趣、能力与处境。其次，犹豫本身就是一种选择，而且往往是最糟的一种：那些把每个决定都往后拖的人，常常眼睁睁看着最好的机会溜走。再者，选定的路很少是终点。许多成功者不止一次改变方向，他们把早年的失手当作学费而非失败。重要的不是找到那条完美的路，而是选定一条后坚定地走下去。\n\n总之，站在岔路口并非不幸，它恰恰证明我们有塑造自己人生的自由。是时候不再畏惧选择的重负，开始有主见地作出选择。唯有认真走好一条路，我们才能知道它通向何方。","outline":["首段写毕业生在岔路口迟疑，只写多种选择，不杜撰文字。","主体三层：选择即责任、犹豫最糟、所选之路并非终点。","结尾指出岔路口意味着自由，呼吁认真走好一条路。"],"words":199,"paras":3}},{"year":2014,"chartType":"图画","titleZh":"相携","topicEn":"Walking Hand in Hand (Mutual Support between Parent and Child)","pictureZh":"一幅图分左右两半：左边是三十年前，年轻的母亲紧紧牵着幼女的手一同走路（女孩戴着红领巾）；右边是如今，长大的女儿搀扶着年迈的母亲缓步同行。图画下方写着“相携”二字。","captions":[],"directionsZh":"①简述图画 ②解释其内在含义 ③给出自己的评论与建议。160-200词，20分。","sections":["family","society"],"tip":"孝道与陪伴。注意区分「物质赡养」与「精神陪伴」，后者是高分点。","confidence":"high","note":"","sources":["http://edu.people.com.cn/kaoyan/n/2014/0105/c112975-24026440.html","https://m.offcn.com/kaoyan/2016/1118/69708.html","https://m.koolearn.com/kaoyan/20161118/967160.html"],"model":{"en":"As is vividly shown, the picture is divided into two halves. On the left, thirty years ago, a young mother held her little daughter tightly by the hand, the girl wearing a red scarf. In stark contrast, the grown-up daughter now supports her aged mother by the arm as they walk slowly forward. Below the drawing are two characters meaning 'walking hand in hand', implying that parental care deserves filial love in return.\n\nTo begin with, looking after their parents is a noble duty for grown-up children, since parents have sacrificed so much for them. What is more, a family bound by mutual support is warm and harmonious, and such an atmosphere quietly shapes a child's sense of duty. Furthermore, the way we treat our elders today will be imitated by our children tomorrow, as example teaches more than words.\n\nIn conclusion, mutual care, not one-sided giving, is what holds a family together. It is high time that we called our parents more often, visited them whenever we can, and shared their burdens patiently. Only by cherishing the old can we pass warmth on to the next generation.","zh":"正如图画所生动展示的，这幅图被分为左右两半。左半边是三十年前，一位年轻的母亲紧紧牵着幼女的手，女孩戴着红领巾。与之形成鲜明对比的是，右半边中已经长大的女儿正搀扶着年迈的母亲，一步一步缓缓前行。图下方是两个字——“相携”，其寓意是：父母给予我们的关爱，理应得到子女孝心的回报。\n\n首先，对成年子女而言，照顾父母是一份高尚的责任，因为父母为他们牺牲了太多。其次，一个由相互扶持维系起来的家庭是温暖而和睦的，这种氛围会悄然塑造孩子的责任感。再者，我们今天对待长辈的方式，明天就会被我们的孩子模仿，因为榜样的力量胜过千言万语。\n\n总之，维系一个家庭的是相互关爱，而不是单向的付出。我们早该更经常地给父母打电话，一有机会就去看望他们，并耐心地分担他们的负担。只有珍惜老人，我们才能把温暖一代代传递下去。","outline":["首段先总说图画分为左右两半，左半写三十年前母亲紧牵幼女的手、女孩戴红领巾。","首段用 In stark contrast 引出右半：长大成人的女儿搀扶年迈母亲缓行，末句点出图下“相携”二字的寓意。","主体段以 To begin with / What is more / Furthermore 分层，从责任、家庭氛围、身教三个角度展开论证。","结尾段用 It is high time that 提建议，并以 Only by...can we 倒装句收束全文。"],"words":188,"paras":3}},{"year":2015,"chartType":"图画","titleZh":"手机时代的“聚会”","topicEn":"Gathering in the Era of Mobile Phones","pictureZh":"饭桌旁坐着四个年轻人，面对满桌丰盛的菜肴却无人动筷，每人都低头盯着手中的手机屏幕，彼此不说一句话。图画文字说明为“手机时代的‘聚会’”。","captions":[],"directionsZh":"①简述图画 ②解释其内在含义 ③给出自己的评论。160-200词，20分。","sections":["technology","society","describe"],"tip":"科技双刃剑经典题。既要承认便利，也要写人际疏离，最后给出「合理使用」的建议。","confidence":"high","note":"","sources":["https://www.sohu.com/a/643318_100428","https://cq.xdf.cn/dxks/kaoyan/201812/118485523.html"],"model":{"en":"In the cartoon, four young people sit around a table covered with a lavish dinner, yet nobody picks up the chopsticks. Each of them lowers his head, fixing his eyes on a glowing smartphone screen, completely lost in the online world. The caption 'Gathering in the era of mobile phones' makes the irony unmistakable: the device that is supposed to connect us is now separating those who sit closest to us.\n\nTo begin with, the smartphone has become so entertaining that it easily occupies every spare minute, leaving little room for genuine conversation. What is more, when everyone at a table stares at a screen, the warmth of a shared meal evaporates, and relationships gradually turn shallow. Furthermore, such behaviour may set a poor example for the young, who learn from what adults do far more than from what adults say.\n\nIn short, technology should serve communication instead of replacing it. It is high time that we put down our phones at the dinner table, raised our heads, and listened to the people we love. Only by doing so can we restore the true meaning of a gathering.","zh":"图画中，四个年轻人围坐在一张摆满丰盛菜肴的桌旁，却没有一个人拿起筷子。他们每人都低着头，眼睛紧盯着发亮的手机屏幕，完全沉溺于网络世界之中。图片文字“手机时代的‘聚会’”让其中的讽刺意味一目了然：本该把我们连接起来的设备，如今却正在疏远那些坐得离我们最近的人。\n\n首先，智能手机已经变得如此好玩，以致它轻易占据了每一分钟闲暇，使真正的交谈几乎没有立足之地。其次，当饭桌上的每个人都盯着屏幕时，共餐的温情便消散无形，人际关系也渐渐变得浅薄。再者，这种行为还可能给年轻人树立坏榜样，因为年轻人从大人做什么中学到的，远多于从大人说什么中学到的。\n\n简而言之，技术应当服务于交流，而不是取代交流。我们早该在饭桌上放下手机，抬起头来，倾听我们所爱的人说话。只有这样，我们才能找回聚会真正的意义。","outline":["首段描写四个年轻人围坐饭桌、菜肴满桌却无人动筷，人人低头看手机。","首段引用图下文字“手机时代的‘聚会’”，用冒号引出讽刺寓意：手机正在疏远身边最近的人。","主体段用 To begin with / What is more / Furthermore 从占用时间、冲淡情感、影响晚辈三方面展开。","结尾段总结技术应服务于交流，用 It is high time that 提建议，并以 Only by doing so can we 倒装收尾。"],"words":188,"paras":3}},{"year":2016,"chartType":"图画","titleZh":"与其只提要求，不如做个榜样（言传身教）","topicEn":"Setting an Example (Practice What You Preach)","pictureZh":"两幅对比图画。左图：一位父亲叼着香烟、舒服地坐在沙发上看电视里的足球比赛，却回头要求站在一旁、表情沮丧的儿子好好学习（说“儿子，快给我好好学习！”）；右图：晚上九点，这位父亲和儿子各占一张书桌，两人都在伏案认真学习、伏案疾书。图下方有一行文字：“与其只提要求，不如做个榜样”。寓意：父母教育子女要以身作则、言传身教。","captions":["与其只提要求，不如做个榜样","儿子，快给我好好学习！"],"directionsZh":"基于所给图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。答案写在 ANSWER SHEET 上（20 分）。","sections":["family","education","quality"],"tip":"家庭教育 + 言传身教。结尾可升华到「以身作则」的社会意义。","confidence":"high","note":"","sources":["https://www.chsi.com.cn/kyzx/en/201512/20151227/1515310261.html","https://m.koolearn.com/kaoyan/20151229/884248.html"],"model":{"en":"Two scenes are set side by side. In the first one, a father lounges on the sofa with a cigarette in his mouth, enjoying a football match on television, yet he turns his head and orders his dejected son to study hard. In the second, at nine o'clock in the evening, the same father and son sit at separate desks, both bending over their books. The caption reads: 'Setting a good example matters more than merely giving orders.'\n\nTo begin with, children are far more sensitive to what their parents do than to what they demand, so a command that contradicts daily behaviour soon loses its power. What is more, studying alongside a child creates an atmosphere of companionship, which makes hard work enjoyable rather than oppressive. Furthermore, parents who keep improving themselves cultivate in their children the habit of lifelong learning.\n\nIn brief, education begins at home and example speaks louder than instruction. Parents should therefore be what they wish their children to become, and it is high time that they turned off the television and picked up a book. Only by setting an example themselves can they truly lead the young forward.","zh":"两幅画面被并排放在一起。第一幅中，父亲嘴里叼着香烟，懒散地靠在沙发上看电视里的足球比赛，却回过头去命令神情沮丧的儿子好好学习。第二幅中，晚上九点，这对父子各占一张书桌，两人都伏案读书。图下文字写道：“与其只提要求，不如做个榜样。”\n\n首先，孩子对父母做什么远比父母要求什么更敏感，因此与日常行为相矛盾的命令很快就会失去效力。其次，与孩子一起学习会营造出一种陪伴的氛围，使辛苦的学习变得愉快而非压抑。再者，不断提升自己的父母，会在孩子身上培养出终身学习的习惯。\n\n简言之，教育始于家庭，榜样比说教更有力。因此，父母应当先成为自己希望孩子成为的那种人；他们早该关掉电视、拿起书本。只有自己做出榜样，他们才能真正引领年轻人前行。","outline":["首段用 In the first one / In the second 分写两幅对比图：左图父亲叼烟看电视却要求儿子用功，右图晚九点父子同桌伏案学习。","首段末引用图下文字“与其只提要求，不如做个榜样”，以该句作为寓意句收束。","主体段以 To begin with / What is more / Furthermore 从孩子重行为、陪伴氛围、父母自我提升三角度论证言传身教。","结尾段总结教育始于家庭，用 It is high time that 与 Only by setting an example 倒装句收尾。"],"words":194,"paras":3}},{"year":2017,"chartType":"图画","titleZh":"“有书”与“读书”","topicEn":"Possessing Books vs. Reading Books","pictureZh":"两幅对比图画。左图：一名男子慵懒地靠在扶手椅（椅背）上，指着面前塞满书的书架，自得地说“我搜集的书真多！”，满足于藏书的数量却一本也不读；右图：另一名男子坐在书桌前，面前摊开一本书、旁边还放着几本书，给自己定下“今年读完20本书”的目标。图下（副标题）文字：“有书”与“读书”。寓意：藏书不等于读书，行动胜过空谈。","captions":["有书","读书","我搜集的书真多！"],"directionsZh":"基于所给图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["education","describe"],"tip":"行动胜于空谈。与 2019、2004 同属「实践/行动」大类，句式可复用。","confidence":"high","note":"我认为：只有一幅图、人翘着腿说“我有这么多书” → 实际：是两幅对比图——左图藏书者靠在椅背上自得地说“我搜集的书真多！”却不读书，右图为另一人坐在书桌前读书、计划今年读完20本书；图题/副标题为“有书”与“读书”（I have books / I read books）。","sources":["https://mtoutiao.xdf.cn/kaoyan/201612/10592307.html","http://www.offcn.com/kaoyan/2017/0909/94805.html","https://mtoutiao.xdf.cn/kaoyan/201612/10592351.html"],"model":{"en":"The two pictures offer a sharp contrast between possessing books and reading them. On the left, a man lounges in an armchair, pointing at a bookshelf crammed with volumes and declaring, 'How many books I have collected!' Yet he never opens one. In stark contrast, on the right, another man sits at his desk reading an open book, aiming to finish twenty books this year. The caption 'Having books and reading books' drives the message home.\n\nTo begin with, collecting books is easy, whereas digesting them requires patience and curiosity; a shelf of unread volumes is little more than decoration. What is more, the value of reading lies not in pages turned but in the thoughts it provokes and the horizons it broadens. Furthermore, amid endless digital distractions, the ability to concentrate on a book has become a rare competence.\n\nIn conclusion, books are meant to be read rather than merely displayed. It is high time that we set realistic reading plans, set aside time for reading every day, and reflected on what we absorb. Only by turning possession into practice can knowledge truly change us.","zh":"这两幅图画在“藏书”与“读书”之间构成了鲜明对比。左图中，一名男子懒洋洋地靠在扶手椅上，指着塞满书的书架得意地说：“我搜集的书真多！”可他却一本也不读。与之形成鲜明对比的是，右图中另一位男子坐在书桌前读着一本摊开的书，目标是今年读完二十本书。图题“有书”与“读书”把这一寓意说得一语中的。\n\n首先，藏书容易，而消化书中内容却需要耐心与好奇心；一架子从未被翻开的书，不过是一种装饰罢了。其次，读书的价值不在于翻过多少页，而在于它引发的思考与拓展的视野。再者，在数字干扰无处不在的今天，能够静下心来专注读一本书，已经成为一种稀缺的能力。\n\n总之，书是用来读的，而不是用来陈列的。我们早该制定切实可行的读书计划，每天留出阅读时间，并反思自己吸收了什么。只有把“拥有”变成“实践”，知识才能真正改变我们。","outline":["首段用 On the left / In stark contrast, on the right 搭建对比结构：左图藏书者自夸藏书多却一本不读，右图读书者开卷并计划一年读二十本。","首段末引用图题“有书”与“读书”，点明藏书不等于读书、行动胜于空谈的寓意。","主体段以 To begin with / What is more / Furthermore 从藏书易读书难、读书的真正价值、专注力稀缺三个角度论证。","结尾段总结书应被阅读，用 It is high time that 提建议，并以 Only by turning possession into practice 倒装收束。"],"words":186,"paras":3}},{"year":2018,"chartType":"图画","titleZh":"选课进行时","topicEn":"Selecting Courses (Deliberate Course Choice)","pictureZh":"一幅图画。一名学生（面部画成“囧”字表情）坐在电脑前浏览选课系统，屏幕上/头侧引出两类课程信息：一类标注“知识新，重创新，有难度”，另一类标注“给分高，易通过，作业少”。图下方文字：“选课进行时”。寓意：选课（做事）不应只图轻松高分，而应重视知识创新、勇于迎难而上、全面权衡。","captions":["选课进行时","知识新，重创新，有难度","给分高，易通过，作业少"],"directionsZh":"基于所给图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["education","career","describe"],"tip":"如何做选择：兴趣 vs 实用、难度 vs 收获。可引申到理性选择与长远眼光。","confidence":"high","note":"","sources":["https://yz.chsi.com.cn/kyzx/en/201712/20171225/1645244738.html","http://ky.newdu.com/forum.php?mod=viewthread&action=printable&tid=391584","https://cq.xdf.cn/dxks/kaoyan/201812/118485512.html"],"model":{"en":"In the cartoon, a student sits before a computer, choosing his courses. His face is drawn with a bewildered expression, for two kinds of courses are competing for his attention. One is labelled 'new knowledge, innovative and demanding'; the other promises 'generous grades, easy passes and little homework'. The caption below reads 'Choosing courses in progress'. His hesitation mirrors a choice we all face: comfort now or growth in the long run.\n\nTo begin with, courses that promise high marks with little effort often waste our time, for knowledge obtained without challenge is soon forgotten. What is more, choosing whatever is easiest weakens our ability to face difficulties, so that we lose the courage to explore unfamiliar fields. Furthermore, employers value candidates trained by demanding tasks rather than those who have merely collected easy credits.\n\nTo sum up, when convenience and challenge stand before us, we should weigh them with our long-term interest in mind. It is high time that we chose courses for what they teach us rather than for how easily they reward us. Only by welcoming difficulty can we turn four years of study into genuine growth.","zh":"图画中，一名学生坐在电脑前选课。他的脸被画成一副茫然纠结的表情，因为两类课程正在争夺他的注意力：一类标着“知识新，重创新，有难度”，另一类则承诺“给分高，易通过，作业少”。图下方写着“选课进行时”。他的犹豫正映照出我们所有人都会面临的抉择：是现在图轻松，还是着眼长远求成长。\n\n首先，那些承诺轻松拿高分的课程往往只是浪费时间，因为未经挑战而获得的知识很快就会忘掉。其次，总挑最容易的课会削弱我们面对困难的能力，使我们失去探索陌生领域的勇气。再者，用人单位看重的是经受过高要求任务训练的人，而不是只攒了一堆容易拿学分的人。\n\n总之，当轻松与挑战同时摆在面前时，我们应当着眼于长远利益来权衡取舍。我们早该根据课程能教给我们什么来选课，而不是根据它给分多容易。只有乐于迎接困难，我们才能把四年大学时光变成真正的成长。","outline":["首段描述学生坐在电脑前选课、面部表情发懵，并列出两组课程标签“知识新，重创新，有难度”与“给分高，易通过，作业少”。","首段末引用图下文字“选课进行时”，用冒号句点出“图轻松还是求成长”的寓意。","主体段以 To begin with / What is more / Furthermore 从易课无益、削弱抗压能力、外界更看重真本事三方面论证。","结尾段总结应着眼长远，用 It is high time that 提建议，并以 Only by welcoming difficulty 倒装句收尾。"],"words":190,"paras":3}},{"year":2019,"chartType":"图画","titleZh":"途中","topicEn":"Persistence on the Way (Never Give Up)","pictureZh":"一幅图画。两名背着背包的人在登山：右边一人垂头丧气地坐在台阶上，抱怨“累了，不想爬”，打算放弃；左边那位同伴手里拿着一瓶水递给他，鼓励说“别，休息一下接着爬”。图下方有两个字：“途中”。寓意：做事贵在坚持，累时可以歇一歇但要继续前行。","captions":["途中","累了，不想爬","别，休息一下接着爬"],"directionsZh":"基于所给图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["quality","describe"],"tip":"最典型的「个人品质」题。坚持、毅力、目标、过程比终点更重要。","confidence":"high","note":"","sources":["https://kaoyan.koolearn.com/20181222/1032094.html","http://h.chinakaoyan.com:8080/info/article/id/263417.shtml","https://mtoutiao.xdf.cn/kaoyan/201812/10837501.html","https://m-jixun.iqihang.com/info/yyzd/2026767887.html"],"model":{"en":"The cartoon shows two backpackers climbing a mountain. One of them slumps on the stone steps, complaining that he is too tired to continue and wants to give up. His companion, however, hands him a bottle of water and urges, 'Take a short break and then keep climbing.' The scene, set on the way up the mountain, tells us that persistence, refreshed by reasonable rest, finally carries us to the summit.\n\nTo begin with, any worthwhile goal demands sustained effort, and those who reach the top usually refuse to quit at the hardest moment. What is more, exhaustion is a signal to slow down rather than a reason to abandon everything, so wise rest and steady progress are compatible. Furthermore, a companion's encouragement often tips the balance, for a timely word of support can revive a flagging spirit.\n\nIn conclusion, the road to any summit is dotted with fatigue and doubt, and the real test lies in our response. It is high time that we learned to rest wisely instead of retreating at the first sign of hardship. Only by pressing on, step by step, can we see the view reserved for those who persevere.","zh":"图画中，两名背着背包的人正在登山。其中一人垂头丧气地瘫坐在石阶上，抱怨自己太累、不想再爬，打算放弃。而他的同伴却递给他一瓶水，催促他：“休息一下接着爬。”这幅取景于登山途中的画面告诉我们：坚持，加上合理的休息，最终才能把我们送上山顶。\n\n首先，任何有价值的目标都需要持续的努力，而能够登顶的人，往往正是在最艰难的时刻拒绝放弃的人。其次，疲惫是放慢脚步的信号，而不是抛弃一切的理由，因此明智的休息与稳步前行并不矛盾。再者，同伴的鼓励常常能扭转局面，因为一句及时的声援足以让疲惫的心重新振作。\n\n总之，通往任何高峰的道路上都布满疲惫与怀疑，真正的考验在于我们如何应对。我们早该学会明智地休息，而不是一遇到困难就退缩。只有一步一步坚持往前，我们才能看到那属于坚韧者的风景。","outline":["首段描述两名背包客登山：一人瘫坐石阶抱怨太累想放弃，同伴递水鼓励“休息一下接着爬”，只写“登山途中”而不对图下文字下断言。","首段末用 tells us that 引出寓意句：坚持加上合理休息才能登顶。","主体段以 To begin with / What is more / Furthermore 从坚持的必要性、休息与前进不矛盾、同伴鼓励的作用三角度论证。","结尾段总结路上必有疲惫与怀疑，用 It is high time that 提建议，并以 Only by pressing on 倒装句收尾。"],"words":195,"paras":3}},{"year":2020,"chartType":"图画","titleZh":"习惯（尽早完成才安心 / 不到最后不动手）","topicEn":"Good Habits vs. Procrastination","pictureZh":"两幅对比图画。左图：一个女孩坐在书桌前认真学习、写作业，桌上/旁边堆着书；图内文字是她的想法——“尽早完成才安心”。右图：一个男孩瘫坐在沙发上，旁边摊着作业（书桌上只有一本摊开的书和一支笔）却不动手；图内文字是他的想法——“不到最后不动手”。两图内容相反，反映习惯（时间管理、勤奋规划）与拖延症的对比。","captions":["尽早完成才安心","不到最后不动手"],"directionsZh":"基于上面两幅图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["quality","education","family"],"tip":"习惯类话题年年可套：习惯如何塑造性格、影响效率；家长与学校如何引导。","confidence":"high","note":"我认为：不确定（怀疑是“习惯”） → 实际：2020 年英语一大作文确为两幅对比图画，主题即“习惯/时间管理（克服拖延）”。左图女生认真写作业，图内文字“尽早完成才安心”；右图男生瘫坐沙发不动手，图内文字“不到最后不动手”。","sources":["http://www.offcn.com/kaoyan/2019/1221/162269.html","http://m.offcn.com/kaoyan/2019/1225/162659.html","https://m.koolearn.com/kaoyan/20191222/1062956.html","https://d.lingnan.edu.cn/txt/info/1098/83433.htm"],"model":{"en":"Depicted in the two drawings is a striking contrast in how students handle assignments. On the left, a girl sits at her desk absorbed in her homework, telling herself that 'only when it is finished early can I feel at ease'. In stark contrast, a boy lolls on the sofa, his exercise book lying open but untouched, convinced that 'there is no need to start until the deadline looms'. Evidently, sound time management brings order and calm, whereas procrastination breeds anxiety.\n\nTo begin with, good habits serve as the invisible engine of academic success, turning limited hours into steady and cumulative progress. What is more, postponing a task never removes it; it merely heaps duties up until the final days turn into an ordeal of sleepless nights. Furthermore, the habit of promptness cultivates self-discipline that reaches far beyond the classroom, shaping how one manages work, health and money in later life.\n\nIn short, it is not talent but the wise use of time that sets achievers apart. It is high time that we replaced 'I will do it tomorrow' with a written schedule. Only by acting today can we spare ourselves tomorrow's regrets.","zh":"两幅画描绘出学生对待作业时截然相反的两种态度。左边，一个女孩坐在书桌前全神贯注地写作业，心里想着“尽早完成才安心”；与之形成鲜明对比的是，一个男孩瘫坐在沙发上，作业本摊开却一动不动，认为“不到最后不动手”。显然，良好的时间管理带来秩序与从容，而拖延只会滋生焦虑。\n\n首先，好习惯是学业成功的无形引擎，它把有限的时间转化为稳步累积的进步。其次，拖延从来不能使任务消失，只会把责任堆积起来，直到最后几天变成一个个不眠之夜。此外，做事及时的习惯所培养出的自律远远超出课堂，影响着一个人日后如何管理工作、健康与金钱。\n\n总之，把成功者与拖拉者区分开的不是天赋，而是对时间的明智利用。我们早该把“明天再做”换成一份写好的时间表。唯有今天就行动，我们才能免去明天的悔恨。","outline":["首段以对比结构写左右两图人物动作与图内文字，末句点出寓意","主体段用 To begin with 等分层，论好习惯、拖延代价与自律","结尾段以强调句总结，再用 It is high time that 提出建议"],"words":193,"paras":3}},{"year":2021,"chartType":"图画","titleZh":"穿戏服的孩子与父亲（兴趣与自信）","topicEn":"Interest and Self-confidence (Sticking to One's Own Interest)","pictureZh":"一幅图画。一个穿着戏曲服装的小男孩（扮《西游记》里的孙悟空）与父亲对话：男孩神情有些沮丧，说“爸爸，好多同学说唱戏不好玩”；父亲面带微笑，鼓励他说“你不是喜欢吗？那就够了”。寓意：坚持自己的兴趣、自信独立，不必因他人评价而动摇；也涉及传统戏曲文化的传承。","captions":["爸爸，好多同学说唱戏不好玩","你不是喜欢吗？那就够了"],"directionsZh":"基于所给图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["culture","describe"],"tip":"传统文化传承 + 家庭鼓励。主体段写「为什么要传承」和「怎么传承」。","confidence":"high","note":"我认为：孩子穿戏服学戏、父亲说“你唱得真好” → 实际：孩子穿戏服扮孙悟空并对父亲说“爸爸，好多同学说唱戏不好玩”，父亲回答“你不是喜欢吗？那就够了”，并非夸他“唱得真好”。","sources":["http://nm.offcn.com/html/2021/01/229879_2.html","https://m.koolearn.com/kaoyan/20210625/1455878.html","https://d.lingnan.edu.cn/txt/info/1098/83433.htm","https://mtoutiao.xdf.cn/kaoyan/202012/11139738.html"],"model":{"en":"The drawing presents a touching conversation between a father and his son. Wearing an opera costume and made up as Sun Wukong, the boy looks discouraged as he tells his father, 'Dad, many of my classmates say singing opera is no fun.' Smiling gently, the father replies, 'But you like it, don't you? That is enough.' Simple as the words are, they point to a truth: one should hold fast to what one loves rather than surrender to others' casual judgements.\n\nTo begin with, sincere interest is the most reliable fuel of lasting effort; what we enjoy, we rehearse willingly until we excel. What is more, popularity is a poor compass, for tastes differ and the crowd's praise is as fleeting as its criticism. Furthermore, the boy's devotion to traditional opera carries cultural weight: every child who learns an old art keeps a fragile heritage alive.\n\nIn conclusion, genuine love, rather than applause, deserves to be the standard by which we choose our pursuits. It is high time that parents and teachers encouraged the young to follow their hearts. Only by doing so can we raise confident individuals and keep our cultural heritage vibrant.","zh":"这幅画呈现了一对父子之间一段动人的对话。男孩穿着戏服、扮成孙悟空，神情有些沮丧地对父亲说：“爸爸，好多同学说唱戏不好玩。”父亲温和地笑着回答：“你不是喜欢吗？那就够了。”话语虽简单，却道出了一个道理：人应当坚持自己所爱，而不应屈从于他人的随口评判。\n\n首先，真诚的兴趣是持久努力最可靠的燃料：凡是我们喜爱的事，我们都愿意一遍遍练习直到精通。其次，人气并不是可靠的指南针，因为各人口味不同，众人的赞誉与其批评一样转瞬即逝。此外，男孩对传统戏曲的热爱还承载着文化分量：每一个学会一门老技艺的孩子，都在为脆弱的传统续命。\n\n总之，真正值得作为选择标准的，是发自内心的热爱，而非掌声。父母和老师早该鼓励年轻人追随自己的心意。唯有如此，我们才能培养出自信的个体，并让我们的文化遗产焕发生机。","outline":["首段描述男孩戏服形象与父子对话，末句点出坚持热爱的寓意","主体段分论兴趣是持久动力、他人评价不可靠、文化传承","结尾段总结热爱胜过掌声，呼吁家庭与学校尊重孩子兴趣"],"words":194,"paras":3}},{"year":2022,"chartType":"图画","titleZh":"校园讲座前的两名学生（广泛学习）","topicEn":"Extensive Learning (Broadening One's Knowledge)","pictureZh":"一幅图画。两名女生（学生）站在一张校园讲座的海报前：其中一个不以为然地说“不是我们专业的，听了也没多大用”，另一个则回答“听听总会有好处”。寓意：不应以“与专业无关”为由拒绝学习，要广泛学习、多方获取知识、拓宽知识面。","captions":["不是我们专业的，听了也没多大用","听听总会有好处"],"directionsZh":"基于所给图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["education","describe"],"tip":"学习不只限于课本。可写终身学习、跨界知识、实践与理论结合。","confidence":"high","note":"","sources":["http://www.offcn.com/zzss/2021/1229/35841.html","http://m.offcn.com/zzss/2021/1227/35830.html","https://mtoutiao.xdf.cn/kaoyan/202112/11363756.html","https://d.lingnan.edu.cn/txt/info/1098/83433.htm"],"model":{"en":"The drawing captures a brief exchange between two college students in front of a poster for a campus lecture. One of them waves it aside, saying dismissively, 'It is not our major, so listening will not help much.' Her companion, however, answers calmly, 'There is always something to gain by listening.' The contrast is telling: a narrow definition of usefulness may close the door on knowledge that lies beyond our own field.\n\nTo begin with, knowledge has never respected departmental borders; a lecture on economics may sharpen a literature student's thinking, and an insight from psychology may one day illuminate an engineer's design. What is more, the habit of listening widely keeps curiosity alive, which is precisely what sustains lifelong learning. Furthermore, those who step outside their specialty are the ones most likely to discover unexpected connections and, ultimately, to innovate.\n\nIn short, usefulness is too narrow a yardstick for learning. It is high time that we treated every lecture as an open window and every unfamiliar subject as a potential gift. Only by embracing knowledge beyond our own field can we become rounded, adaptable and genuinely creative.","zh":"这幅画捕捉了两名大学生在一张校园讲座海报前的一段简短交谈。其中一人不以为然地一挥手说：“不是我们专业的，听了也没多大用。”而她的同伴却平静地回答：“听听总会有好处。”这一对比意味深长：对“有用”的狭隘界定，可能会把门外的知识拒之门外。\n\n首先，知识从不理会学科之间的边界：一场经济学讲座或许能让文学专业的学生思路更敏锐，而心理学的一个洞见也许有一天会点亮工程师的设计。其次，广泛倾听的习惯能让好奇心保持活力，而好奇心恰恰是终身学习的支撑。此外，敢于走出本专业的人，最有可能发现意想不到的关联，并最终有所创新。\n\n总之，用“有用”来衡量学习，尺度实在太窄。我们早该把每一场讲座都当作一扇敞开的窗，把每一门陌生的学科都当作可能的馈赠。唯有拥抱本专业之外的知识，我们才能变得全面、有适应力，并真正富有创造力。","outline":["首段描述两名女生在讲座海报前的对话，末句点出知识无边界","主体段分论学科互通、广泛倾听养好奇心、跨领域易出创新","结尾段指出有用性标准过窄，呼吁把讲座当作打开的窗"],"words":188,"paras":3}},{"year":2023,"chartType":"图画","titleZh":"乡村龙舟赛（传统文化传承）","topicEn":"Inheritance of Traditional Culture (Dragon Boat Racing)","pictureZh":"一幅图画。画面是在乡村举行的一场龙舟比赛：河面上数名年轻人在奋力划龙舟，岸边聚集了大量观看比赛的乡亲；两位老人边看比赛边感叹龙舟赛让村子变得越来越热闹。寓意：以端午龙舟赛为代表的传统文化得到传承、乡村文化生活越来越有活力。","captions":["龙舟赛越来越热闹了"],"directionsZh":"基于所给图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["culture","quality","describe"],"tip":"传统文化 + 团队协作。两个角度都能写：文化传承与自信；众人划桨体现团结。建议文化为主、协作为辅。","confidence":"medium","note":"我认为：龙舟赛 →“传统文化 / 团结协作” → 实际：主题确为传统文化的传承（端午龙舟赛、乡村文化活动越来越热闹），官方及主流解析均未把“团结协作”作为立意点。","sources":["https://m.takefoto.cn/news/2022/12/24/10275621.shtml","https://www.nju.edu.cn/info/3191/242601.htm","https://m.koolearn.com/kaoyan/20221224/1578638.html"],"model":{"en":"Vividly depicted in the drawing is a dragon boat race held in a rural area. On the river, several young men bend over their oars and row forward with all their might, while crowds of villagers throng the banks, cheering them on. Watching from among them, two elderly men marvel at how much livelier the race has made their village. The message is unmistakable: traditional culture is being revived, filling rural life with vigour.\n\nTo begin with, a festival race is far more than a game; it embodies a community's collective memory and gives the young a living link to their roots. What is more, culture survives only when it is practised, and young people straining at the oars prove that this heritage has living heirs rather than museum exhibits. Furthermore, such occasions bring scattered villagers back to a shared stage and strengthen the bonds among them.\n\nIn short, the race shows that tradition, far from fading, can still unite and delight a community. It is high time that we supported such heritage with concrete measures and drew the young into it. Only by passing the flame on can we keep our culture alive.","zh":"图画生动地描绘了乡村里举行的一场龙舟赛。河面上，几名年轻人俯身握桨、奋力划行，岸边则聚满了观看比赛的乡亲，为他们呐喊助威。人群之中，两位老人感叹龙舟赛让村子变得越来越热闹。画面传递的信息十分明确：传统文化正在复兴，为乡村生活注入了活力。\n\n首先，节庆赛事远不只是一场比赛，它承载着一个社区的集体记忆，也让年轻人与自己的根脉建立起活的联结。其次，文化只有在实践中才能延续，年轻人奋力划桨的身影恰恰证明，这份遗产拥有活着的传承者，而非博物馆里的展品。此外，这样的活动把散居各处的村民重新聚到同一个舞台上，增进了彼此之间的情感纽带。\n\n总之，龙舟赛表明：传统远未消退，依然能够凝聚人心、给人欢乐。我们早该以切实的举措保护这样的文化遗产，并把年轻人吸引进来。唯有把火种传递下去，我们的文化才能生生不息。","outline":["首段描写龙舟竞赛场面与岸边观众，末句点出传统文化复兴","主体段论传统节日的集体记忆、活态传承与乡村文化活力","结尾段总结传统并未消退，呼吁支持非遗并吸引年轻人"],"words":194,"paras":3}},{"year":2024,"chartType":"图画+图表","titleZh":"家门口新建的公园与某城市公园数量（公园建设与全民健身）","topicEn":"Public Parks and Citizen Fitness (Cultural Infrastructure)","pictureZh":"本题为“漫画 + 柱状图表”组合。左幅图画：在城市公园的市民健身区里，有人在跑步、有人在散步，一个年轻男子说“家门口新建的公园真不错”。右幅柱状图表：标题为某城市公园数量，横坐标为年份 2020、2021、2022 年，纵坐标数值分别为 406、532、670，呈明显上升趋势。寓意：公共文化设施（公园）建设不断完善，市民健康意识与全民健身氛围增强。","captions":["家门口新建的公园真不错","某个城市公园数量"],"directionsZh":"基于下面图画写一篇 160–200 词的短文：1) 简要描述图画；2) 阐释其含义；3) 给出你的评论。写在 ANSWER SHEET 上（20 分）。","sections":["health","society","describe"],"tip":"国民健康 + 全民健身。可从「个人健康意识提高」「公共设施完善」两条腿展开，结尾呼吁坚持运动。","confidence":"high","note":"我认为：单纯图画（公园里人们锻炼），题型为图画 → 实际：2024 年英语一大作文是“漫画 + 柱状图表”的组合题（新东方官方难度分析明确称“大作文是漫画与柱状图表的结合体，是两种类型的结合”）；左图年轻人说“家门口新建的公园真不错”，右图为某城市公园数量柱状图（2020→2022：406、532、670）。","sources":["https://mtoutiao.xdf.cn/kaoyan/202312/13554851.html","https://www.hqwx.com/kaoyan-kaoshi/news/17034086958837.html","https://jixun.iqihang.com/info/yyzd/2026797273.html"],"model":{"en":"The cartoon and the bar chart both point to greener, healthier city life. In the picture, two young people are jogging along a path while
