<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考研英语一 · 作文语料库</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --panel2:#f1eee6; --line:#e2ddd0;
  --ink:#25231f; --ink2:#57534a; --ink3:#8a8477;
  --acc:#b4472f; --acc-soft:#f7ebe6; --ok:#2f7d54; --ok-soft:#e8f3ec;
  --star:#c9922a; --code:#8a5a2b; --shadow:0 1px 2px rgba(40,35,25,.06),0 6px 18px rgba(40,35,25,.05);
  --r:12px; --fs:1;
}
body.dark{
  --bg:#16181c; --panel:#1e2126; --panel2:#252932; --line:#31363f;
  --ink:#e8e6e1; --ink2:#a9a49b; --ink3:#77726a;
  --acc:#e8825f; --acc-soft:#33231e; --ok:#5fb98a; --ok-soft:#1c2b23;
  --star:#e0b352; --code:#d8a76a; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.on:hover{color:#fff}
#app{display:grid;grid-template-columns:296px 1fr;height:100vh;overflow:hidden}

/* ---------- sidebar ---------- */
aside{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.brand{padding:16px 16px 10px}
.brand-t{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand-s{font-size:12px;color:var(--ink3);margin-top:3px}
.side-search{padding:0 12px 10px}
.side-search input{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel2);outline:none;
}
.side-search input:focus{border-color:var(--acc);background:var(--panel)}
nav{flex:1;overflow-y:auto;padding:4px 8px 20px;min-height:0}
nav::-webkit-scrollbar,#list::-webkit-scrollbar,.idx::-webkit-scrollbar{width:9px}
nav::-webkit-scrollbar-thumb,#list::-webkit-scrollbar-thumb,.idx::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.grp{margin:12px 8px 4px;font-size:11px;font-weight:700;letter-spacing:.9px;color:var(--ink3);text-transform:uppercase}
.nav-i{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  cursor:pointer;font-size:13.5px;line-height:1.35;margin-bottom:1px;position:relative;
}
.nav-i:hover{background:var(--panel2)}
.nav-i.active{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav-i.active .n-count{color:var(--acc)}
.nav-i .n-emo{width:18px;text-align:center;flex:none}
.nav-i .n-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .n-count{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.nav-bar{position:absolute;left:9px;right:9px;bottom:2px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.nav-bar i{display:block;height:100%;background:var(--ok);width:0}
.side-foot{border-top:1px solid var(--line);padding:9px 14px;font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-foot b{color:var(--ok);font-variant-numeric:tabular-nums}

/* ---------- main ---------- */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel);
}
#menuBtn{display:none}
.crumb{font-weight:700;font-size:15px;margin-right:auto}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools button{font-size:12.5px;padding:4px 9px}
.chip{font-size:12.5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#meta{
  padding:10px 18px 0;font-size:12.5px;color:var(--ink3);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
}
#meta .mhint{color:var(--acc)}
#bar{height:3px;background:var(--line);margin:10px 18px 0;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#list{flex:1;overflow-y:auto;padding:14px 18px 90px;min-height:0}
.desc{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13.5px;color:var(--ink2);
}
.desc b{color:var(--ink)}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  border-left:3px solid transparent;transition:.15s;
}
.card:hover{border-color:var(--acc)}
.card.mastered{border-left-color:var(--ok);opacity:.72}
.card.starred{border-left-color:var(--star)}
.card.mastered.starred{border-left-color:var(--ok)}
.c-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.en{
  font-family:Georgia,"Times New Roman",serif;
  font-size:calc(19px * var(--fs));font-weight:600;letter-spacing:.2px;
  color:var(--acc);word-break:break-word;
}
.b{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink3);white-space:nowrap;line-height:1.7}
.b.pos{color:var(--code);border-color:var(--line)}
.b.t-word{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.b.t-phrase{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b.t-pattern{background:#e9eef9;color:#3556a8;border-color:transparent}
.b.t-proverb{background:#f6edda;color:#8a6417;border-color:transparent}
body.dark .b.t-pattern{background:#1e2536;color:#8fa9e8}
body.dark .b.t-proverb{background:#2c2617;color:#d9b45f}
.b.basic{background:var(--panel2);color:var(--ink2)}
.b.var{background:var(--panel2);color:var(--ink3);cursor:help}
.sp{flex:1}
.act{border:none;background:none;padding:2px 4px;font-size:14px;opacity:.32;border-radius:6px;line-height:1}
.act:hover{opacity:1;background:var(--panel2);color:inherit}
.act.star.on{opacity:1;color:var(--star)}
.act.done.on{opacity:1;color:var(--ok)}
.zh{font-size:calc(15px * var(--fs));margin-top:5px;color:var(--ink)}
.ex{margin-top:9px;padding:9px 12px;background:var(--panel2);border-radius:9px;font-size:calc(14px * var(--fs))}
.ex-en{display:block;font-family:Georgia,"Times New Roman",serif;color:var(--ink);line-height:1.6}
.ex-zh{display:block;color:var(--ink2);font-size:calc(13px * var(--fs));margin-top:4px}
.note{margin-top:8px;font-size:12.5px;color:var(--ink3);display:flex;gap:6px}
.note::before{content:"💡";flex:none;font-size:11px}
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 2px}
body.dark mark{background:#5d4a17;color:#ffe9a8}

body.recite .zh,body.recite .ex-zh,body.recite .note{filter:blur(5px);opacity:.45;transition:.18s;cursor:pointer;user-select:none}
body.recite .card.revealed .zh,body.recite .card.revealed .ex-zh,body.recite .card.revealed .note{filter:none;opacity:1}
body.recite .card{cursor:pointer}
body.recite .card .ex-en{font-weight:500}

/* exam index */
.idx{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.idx table{width:100%;border-collapse:collapse;font-size:13.5px}
.idx th{background:var(--panel2);text-align:left;padding:9px 12px;font-size:12px;color:var(--ink3);letter-spacing:.5px;position:sticky;top:0}
.idx td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.idx .yr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.idx .tp{font-size:12px;color:var(--ink2)}
.idx .lnk{color:var(--acc);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.idx .lnk:hover{text-decoration-style:solid}
.idx .tzh{font-weight:600}
.idx .tip{font-size:12.5px;color:var(--ink3);margin-top:5px;padding-left:9px;border-left:2px solid var(--line);line-height:1.55}
.idx .ttype{font-size:12px;padding:1px 8px;border-radius:20px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.idx .ttype.tp-chart{background:#e9eef9;color:#3556a8}
body.dark .idx .ttype.tp-chart{background:#1e2536;color:#8fa9e8}
.idxnotes{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 20px 14px 18px;margin-top:14px}
.idxnotes h4{margin:0 0 8px;font-size:13.5px;color:var(--acc);letter-spacing:.4px}
.idxnotes ul{margin:0;padding-left:20px}
.idxnotes li{font-size:13px;color:var(--ink2);margin-bottom:8px;line-height:1.7}
.idxnotes li:last-child{margin-bottom:0}

/* ---------- 真题索引：逐年卡片 ---------- */
.idxctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.idxctl button{font-size:12.5px;padding:4px 10px}
.yrcard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);border-left:3px solid var(--acc);
}
.yrcard.partA{border-left-color:#3556a8}
body.dark .yrcard.partA{border-left-color:#8fa9e8}
.yrhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 16px;background:var(--panel2)}
.yrnum{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.yrtitle{font-weight:600;font-size:14.5px}
.yrsub{font-size:12.5px;color:var(--ink3)}
.yrtag{font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.yrcard.partA .yrtag{background:#e9eef9;color:#3556a8}
body.dark .yrcard.partA .yrtag{background:#1e2536;color:#8fa9e8}
.yrbody{padding:12px 16px 14px}
.yrsec{margin-bottom:8px;font-size:13.5px;line-height:1.7}
.yrsec:last-child{margin-bottom:0}
.yrsec b{display:inline-block;min-width:66px;color:var(--ink3);font-weight:600;font-size:12px;letter-spacing:.4px}
.yrsec p{display:inline;margin:0}
.yrsec p.qen{
  display:block;margin:4px 0 0;padding:8px 11px;background:var(--panel2);border-radius:8px;
  font-family:Georgia,"Times New Roman",serif;font-size:13px;line-height:1.7;color:var(--ink);
}
.yrtip{margin-top:9px;padding:8px 11px;background:var(--panel2);border-radius:8px;font-size:12.8px;color:var(--ink2);line-height:1.65}
.yrtip b{color:var(--acc)}
.yrlinks{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.yrlinks .lb{color:var(--ink3)}
.yrrefs{margin-top:9px;font-size:12.5px;line-height:1.9;color:var(--ink3);border-top:1px dashed var(--line);padding-top:8px}
.yrrefs b{font-weight:600;font-size:12px;letter-spacing:.4px;margin-right:6px}
.yrrefs a{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc);margin-right:10px;white-space:nowrap}
.yrrefs a:hover{border-bottom-style:solid}
.yrwarn{margin-top:8px;font-size:12px;color:#a3690f;background:#fdf3e0;border-radius:7px;padding:6px 10px}
body.dark .yrwarn{background:#33280f;color:#e0b352}
.modelbtn{
  margin-top:11px;width:100%;padding:8px;border:1px dashed var(--line);
  border-radius:9px;background:transparent;color:var(--ink2);font-size:13px;
}
.modelbtn:hover{border-color:var(--acc);color:var(--acc);border-style:solid}
.model{margin-top:11px;border-top:1px solid var(--line);padding-top:12px;display:none}
.model.open{display:block}
.mo-meta{font-size:11.5px;color:var(--ink3);margin-bottom:9px;display:flex;gap:12px;flex-wrap:wrap}
.mo-outline{font-size:12.5px;color:var(--ink2);background:var(--panel2);border-radius:8px;padding:9px 12px;margin-bottom:11px;line-height:1.6}
.mo-outline div{margin-bottom:3px}
.mo-outline div:last-child{margin-bottom:0}
.mo-en{
  font-family:Georgia,"Times New Roman",serif;font-size:calc(15.5px * var(--fs));
  line-height:1.85;color:var(--ink);white-space:pre-wrap;
}
.mo-en p{margin:0 0 10px;text-indent:1.6em}
.mo-en p:last-child{margin-bottom:0}
.mo-zh{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2);line-height:1.8}
body.recite .mo-zh,body.recite .mo-outline{filter:blur(5px);opacity:.45;transition:.18s;user-select:none}
body.recite .model.revealed .mo-zh,body.recite .model.revealed .mo-outline{filter:none;opacity:1}
.yrfilter-note{padding:40px 20px;text-align:center;color:var(--ink3);font-size:13.5px}
#empty{display:none;padding:60px 20px;text-align:center;color:var(--ink3)}
.loadmore{display:block;width:100%;margin:6px 0 0;padding:10px;border-style:dashed;color:var(--ink3)}

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;z-index:30;width:296px;height:100%;left:-300px;transition:left .22s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  body.navopen aside{left:0}
  #menuBtn{display:block}
}
@media print{
  aside,#topbar,#bar,#meta,.act,.loadmore{display:none!important}
  #app{display:block;height:auto}
  #list{overflow:visible;padding:0}
  .card{break-inside:avoid;box-shadow:none;page-break-inside:avoid}
  body.recite .zh,body.recite .ex-zh,body.recite .note{filter:none;opacity:1}
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <div class="brand-t">考研英语一 · 作文语料库</div>
      <div class="brand-s" id="brandSub">加载中…</div>
    </div>
    <div class="side-search"><input id="search" placeholder="搜索英文 / 中文 / 例句 / 用法…（按 / 聚焦）" autocomplete="off"></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span>已掌握 <b id="doneN">0</b> / <span id="allN">0</span></span>
      <span id="pctN">0%</span>
    </div>
  </aside>
  <main>
    <header id="topbar">
      <button id="menuBtn">☰</button>
      <div class="crumb" id="crumb">全部语料</div>
      <div class="tools">
        <button id="modeBtn">👁 背诵模式</button>
        <button id="onlyStar">★ 收藏</button>
        <button id="onlyUn">✓ 未掌握</button>
        <button id="shuffleBtn">🔀 乱序</button>
        <button id="fsDown">A−</button>
        <button id="fsUp">A+</button>
        <button id="themeBtn">🌙</button>
        <button id="expBtn">⬇ 导出</button>
        <button id="printBtn">🖨 打印</button>
      </div>
    </header>
    <div id="meta"></div>
    <div id="bar"><i></i></div>
    <div id="list"></div>
    <div id="empty">没有匹配的语料，换个关键词或清空筛选试试。</div>
  </main>
</div>

<script id="corpus-data" type="application/json">{"sections":[{"id":"quality","title":"个人品质与成功素养","emoji":"🏆","group":"大作文·主题语料","desc":"围绕毅力、自律、自信、抗挫、专注、协作、创新与诚信等成功素养的高分表达","entries":[{"en":"perseverance","basic":"","zh":"坚持不懈；坚忍不拔（面对困难仍持续努力的品质）","pos":"n.","type":"word","example":"It was perseverance rather than sheer talent that enabled him to turn repeated failures into lasting success.","exampleZh":"正是坚持不懈而非纯粹的天赋，使他将一次次失败转化为持久的成功。","note":"不可数名词，常与 show/demonstrate 搭配；主体段分析成功原因时作主语最合适"},{"en":"persist in","basic":"","zh":"坚持不懈地做（某事）；执意于","pos":"phr.","type":"phrase","example":"Those who persist in pursuing their goals in the face of setbacks are far more likely to succeed.","exampleZh":"那些面对挫折仍坚持不懈追求目标的人，成功的可能性要大得多。","note":"in 是介词，后接名词或动名词，切不可写成 persist to do sth"},{"en":"tenacity","basic":"","zh":"坚韧不拔；顽强（尤指绝不轻易松手）","pos":"n.","type":"word","example":"The tenacity with which she overcame one obstacle after another won her the respect of her colleagues.","exampleZh":"她克服一个又一个障碍时所表现出的坚韧，赢得了同事们的尊敬。","note":"常用 with tenacity、display tenacity；比 persistence 更有力量感，适合描写人物"},{"en":"persevere","basic":"","zh":"坚持不懈，锲而不舍","pos":"v.","type":"word","example":"Only those who persevere through difficulty can taste the genuine sweetness of achievement.","exampleZh":"只有那些在困难中坚持不懈的人，才能品尝到成就带来的真正甘甜。","note":"不及物动词，常接 with sth 或 in doing sth；结尾段呼吁坚持时非常好用"},{"en":"adhere to","basic":"","zh":"恪守，坚持（原则、信念、规则等）","pos":"phr.","type":"phrase","example":"A person of integrity adheres to his principles even when doing so brings him no immediate benefit.","exampleZh":"正直的人即便恪守原则不会带来即时好处，也依然坚持不移。","note":"to 为介词，后接名词或动名词；只用于原则、信念、承诺等抽象对象"},{"en":"unwavering","basic":"","zh":"坚定不移的，始终不渝的","pos":"adj.","type":"word","example":"Her unwavering commitment to the underprivileged has inspired a whole generation of young volunteers.","exampleZh":"她对弱势群体坚定不移的付出激励了整整一代年轻志愿者。","note":"常搭配 unwavering commitment/determination/support；比 firm 更有分量"},{"en":"relentless","basic":"","zh":"不屈不挠的；（努力）持续不断的","pos":"adj.","type":"word","example":"Through relentless practice, the young athlete gradually narrowed the gap between herself and the champion.","exampleZh":"通过不屈不挠的训练，这位年轻运动员逐渐缩小了自己与冠军之间的差距。","note":"可修饰人或 effort/pursuit；注意其另一义为毫不留情的，描写压力时须看语境"},{"en":"diligence","basic":"","zh":"勤奋，勤勉","pos":"n.","type":"word","example":"Diligence may not guarantee success, but it certainly raises the odds of achieving it.","exampleZh":"勤奋未必保证成功，但它必定会提高成功的概率。","note":"不可数名词；常与 perseverance 并列，用于主体段归纳成才要素"},{"en":"painstaking","basic":"","zh":"刻苦的，精心细致的","pos":"adj.","type":"word","example":"Years of painstaking research finally paid off when the team published its groundbreaking findings.","exampleZh":"当团队发表突破性研究成果时，多年的刻苦钻研终于得到了回报。","note":"固定搭配 painstaking efforts/research/work；与 painful 拼写相近但词义完全不同"},{"en":"self-discipline","basic":"","zh":"自律，自我约束","pos":"n.","type":"word","example":"Without self-discipline, even the most gifted students may squander their potential on idle distraction.","exampleZh":"没有自律，即使最有天赋的学生也可能把潜力浪费在无所事事的消遣上。","note":"不可数名词，常与 lack/exercise/develop 连用；分析个人成长原因时极实用"},{"en":"willpower","basic":"","zh":"意志力，毅力","pos":"n.","type":"word","example":"Giving up a lifelong habit requires enormous willpower, yet the reward is well worth the struggle.","exampleZh":"戒掉伴随一生的习惯需要巨大的意志力，但回报完全值得这番挣扎。","note":"不可数名词；可替换 determination，多用于克服诱惑与坏习惯的语境"},{"en":"grit","basic":"","zh":"坚毅，韧劲（已进入正式书面语）","pos":"n.","type":"word","example":"Researchers have found that grit predicts long-term achievement better than intelligence does.","exampleZh":"研究者发现，坚毅对长期成就的预测力比智力更强。","note":"不可数名词，常与 show grit 搭配；表勇气时用 true grit，勿与 grid 混淆"},{"en":"confidence","basic":"","zh":"自信；信心","pos":"n.","type":"word","example":"Building confidence through small victories is far more effective than waiting for a single breakthrough.","exampleZh":"通过一次次小胜利来建立自信，远比等待一次重大突破更为有效。","note":"褒义搭配 build/boost confidence，贬义搭配 dent/undermine confidence"},{"en":"optimism","basic":"","zh":"乐观，乐观态度","pos":"n.","type":"word","example":"Optimism does not mean ignoring difficulties; it means believing that difficulties can be tackled.","exampleZh":"乐观并不意味着忽视困难，而是相信困难可以被克服。","note":"常用 a sense of optimism、cautious optimism；定义式句式适合段落首句破题"},{"en":"look on the bright side","basic":"","zh":"看到事物光明的一面；往好处想","pos":"phr.","type":"phrase","example":"Even when plans fell through, she taught her students to look on the bright side of things.","exampleZh":"即使计划落空，她也教学生们凡事往好处想。","note":"固定用单数 bright side，后接 of sth；口语色彩较强，适合例证句或结尾段"},{"en":"pessimistic","basic":"","zh":"悲观的，悲观主义的","pos":"adj.","type":"word","example":"A pessimistic outlook often discourages people from even attempting what they might accomplish.","exampleZh":"悲观的心态往往使人连尝试本可能完成之事的勇气都没有。","note":"固定搭配 be pessimistic about sth；与 optimistic 成对用于对比论证"},{"en":"adversity","basic":"","zh":"逆境，不幸的处境","pos":"n.","type":"word","example":"It is in adversity that true character is revealed and genuine strength is forged.","exampleZh":"正是在逆境中，真正的品格得以显现，真正的力量得以锻造。","note":"不可数名词，搭配 in the face of adversity、overcome adversity；宜放开头或结尾升华"},{"en":"setback","basic":"","zh":"挫折，倒退","pos":"n.","type":"word","example":"Rather than being defeated by this setback, he treated it as a valuable lesson.","exampleZh":"他并未被这次挫折打败，而是把它当作宝贵的一课。","note":"可数名词，常与 suffer/meet with/overcome 连用；复数 setbacks 泛指一连串挫折"},{"en":"hardship","basic":"","zh":"艰难困苦；艰辛","pos":"n.","type":"word","example":"Growing up in hardship gave him a resilience that no classroom could ever teach.","exampleZh":"在困苦中长大，赋予了他任何课堂都无法教授的抗挫力。","note":"泛指时不可数，指一件件苦难时用 hardships；搭配 endure/experience hardship"},{"en":"obstacle","basic":"","zh":"障碍，阻碍（物）","pos":"n.","type":"word","example":"Financial difficulty is an obstacle, but it is by no means an insurmountable one.","exampleZh":"经济困难是一种障碍，但绝不是无法逾越的障碍。","note":"固定搭配 obstacle to sth，to 为介词；动词搭配 overcome/remove an obstacle"},{"en":"surmount","basic":"","zh":"克服，战胜（困难、障碍）","pos":"vt.","type":"word","example":"Those who surmount formidable barriers often emerge stronger than those who never faced any.","exampleZh":"克服巨大障碍的人，往往比从未遇过障碍的人更为坚强。","note":"及物动词，宾语多为 difficulties/obstacles/barriers；比 overcome 更书面"},{"en":"overcome","basic":"","zh":"克服，战胜；压倒","pos":"vt.","type":"word","example":"She overcame her fear of public speaking by rehearsing in front of a mirror every evening.","exampleZh":"她每晚对着镜子练习，从而克服了当众演讲的恐惧。","note":"常见搭配 overcome difficulties/fear/prejudice；过去式与过去分词均为 overcame/overcome"},{"en":"tide over","basic":"","zh":"帮助渡过（难关、困难时期）","pos":"phr.","type":"phrase","example":"A small loan from a friend tided him over until he found a stable job.","exampleZh":"朋友的一笔小额借款帮他渡过了难关，直到他找到一份稳定的工作。","note":"常用 tide sb over (sth)，宾语置于中间；多指暂时渡过，不用于战胜长期问题"},{"en":"concentration","basic":"","zh":"专注，注意力集中","pos":"n.","type":"word","example":"Constant notifications on smartphones steadily erode our powers of concentration.","exampleZh":"智能手机上不断的通知正在持续侵蚀我们的专注力。","note":"常用 powers of concentration、lose one's concentration；与 undivided 搭配更地道"},{"en":"devote oneself to","basic":"","zh":"致力于，献身于","pos":"phr.","type":"phrase","example":"He devoted himself to scientific research for decades, asking nothing in return but the joy of discovery.","exampleZh":"他数十年致力于科学研究，除发现的乐趣外别无所求。","note":"to 为介词，后接名词或动名词；被动式 be devoted to 同样高频"},{"en":"be immersed in","basic":"","zh":"沉浸于，专心投入于","pos":"phr.","type":"phrase","example":"When students are fully immersed in a task, learning ceases to feel like a burden.","exampleZh":"当学生完全沉浸于一项任务时，学习便不再像一种负担。","note":"亦可用 immerse oneself in；后接 work/study/a book，描写专注状态比 be busy with 生动"},{"en":"distraction","basic":"","zh":"使人分心的事物；注意力分散","pos":"n.","type":"word","example":"Studying in a quiet library removes the distractions that plague work at home.","exampleZh":"在安静的图书馆学习，可以排除那些在家里困扰人的干扰。","note":"指具体诱惑时可数，指分心状态时不可数；常搭配 resist/eliminate distractions"},{"en":"procrastination","basic":"","zh":"拖延，拖拉","pos":"n.","type":"word","example":"Procrastination is not laziness but a habit of trading long-term goals for immediate comfort.","exampleZh":"拖延并非懒惰，而是一种用长远目标换取眼前安逸的习惯。","note":"不可数名词，常作主语；分析效率低下的原因时比 putting things off 更书面"},{"en":"prioritize","basic":"","zh":"优先处理，按轻重缓急安排","pos":"vt.","type":"word","example":"Effective learners prioritize the tasks that matter most instead of reacting to whatever comes first.","exampleZh":"高效的学习者会优先处理最重要的事情，而不是被动应付最先出现的事。","note":"及物动词，宾语为任务或目标；英式拼写 prioritise 亦可，但全文须统一"},{"en":"collaboration","basic":"","zh":"合作，协作（强调共同产出成果）","pos":"n.","type":"word","example":"Close collaboration between universities and enterprises has accelerated the transfer of new technology.","exampleZh":"高校与企业之间的紧密合作加快了新技术的转化。","note":"常搭配 in collaboration with sb；比 cooperation 更强调共同完成，适合团队类话题"},{"en":"teamwork","basic":"","zh":"团队协作，团队精神","pos":"n.","type":"word","example":"Individual brilliance alone cannot replace the synergy that genuine teamwork creates.","exampleZh":"个人的卓越无法取代真正的团队协作所产生的合力。","note":"不可数名词，作主语时谓语用单数；常与 effective/genuine 搭配"},{"en":"synergy","basic":"","zh":"协同效应，合力","pos":"n.","type":"word","example":"The two departments achieved a synergy that neither could have produced on its own.","exampleZh":"两个部门实现了任何一方单独都无法产生的协同效应。","note":"常搭配 create/achieve synergy；用来表达一加一大于二时格外地道"},{"en":"mutual support","basic":"","zh":"相互支持，彼此扶持","pos":"phr.","type":"phrase","example":"Mutual support within a team often matters more than any single member's talent.","exampleZh":"团队中的相互支持往往比任何单个成员的才能都更重要。","note":"mutual 只用于双方或多方之间；同类搭配有 mutual trust/respect，可与 support 并列"},{"en":"coordinate","basic":"","zh":"协调，使相互配合","pos":"v.","type":"word","example":"A capable leader knows how to coordinate the efforts of people with very different strengths.","exampleZh":"一位有能力的领导者懂得如何协调具有不同特长的人的努力。","note":"及物动词，常搭配 coordinate efforts/activities 或 coordinate with sb；名词为 coordination"},{"en":"creativity","basic":"","zh":"创造力，创意","pos":"n.","type":"word","example":"Creativity thrives in an atmosphere where mistakes are tolerated rather than punished.","exampleZh":"创造力在容许犯错而非惩罚错误的环境中蓬勃发展。","note":"不可数名词；常与 foster/nurture/stifle 搭配，讨论创新环境时用于主体段"},{"en":"innovation","basic":"","zh":"创新；革新","pos":"n.","type":"word","example":"Sustained innovation, rather than blind imitation, is what keeps a nation competitive.","exampleZh":"使一个国家保持竞争力的，是持续创新而非盲目模仿。","note":"指一项创新时可数，指创新能力时不可数；常搭配 technological innovation"},{"en":"ingenuity","basic":"","zh":"心灵手巧，独创性，巧思","pos":"n.","type":"word","example":"Faced with scarce resources, the villagers solved the water shortage with remarkable ingenuity.","exampleZh":"面对稀缺的资源，村民们以非凡的巧思解决了缺水问题。","note":"不可数名词，常搭配 with ingenuity、display ingenuity；侧重巧妙而非高深"},{"en":"initiative","basic":"","zh":"主动性，首创精神；（也可指）倡议","pos":"n.","type":"word","example":"Employers value employees who show initiative instead of waiting to be told what to do.","exampleZh":"雇主看重的，是那些主动做事而非等着被安排工作的员工。","note":"show/display initiative 表主动；on one's own initiative 意为主动地，勿与 initial 混淆"},{"en":"take the initiative","basic":"","zh":"采取主动，率先行动","pos":"phr.","type":"phrase","example":"Rather than complain about the problem, she took the initiative to organize a volunteer group.","exampleZh":"她没有抱怨问题，而是主动组织起一个志愿者小组。","note":"后常接不定式 to do sth；定冠词 the 不可省略，用于记叙式例证句最自然"},{"en":"think outside the box","basic":"","zh":"打破常规思考，跳出固有思维","pos":"phr.","type":"phrase","example":"To solve such an unusual problem, we must learn to think outside the box.","exampleZh":"要解决这样一个不寻常的问题，我们必须学会跳出固有思维。","note":"固定用 outside，勿改成 out of；口语色彩较浓，适合放在建议句或结尾句"},{"en":"integrity","basic":"","zh":"正直，诚信","pos":"n.","type":"word","example":"Integrity means doing the right thing even when no one is watching.","exampleZh":"正直意味着即使无人监督也做正确的事。","note":"不可数名词，常搭配 personal/professional integrity；定义式短句适合段落开头破题"},{"en":"honesty","basic":"","zh":"诚实，正直","pos":"n.","type":"word","example":"Honesty is the foundation on which all lasting relationships, personal or commercial, are built.","exampleZh":"诚实是所有人际关系——无论私人还是商业——得以持久建立的基础。","note":"不可数名词；常与 integrity 并列使用，作结尾段的价值升华"},{"en":"accountability","basic":"","zh":"问责，责任（须为自己的行为负责）","pos":"n.","type":"word","example":"Greater accountability in public office is essential if citizens are to trust their government.","exampleZh":"如果公民要信任政府，公职部门加强问责就十分必要。","note":"不可数名词，搭配 accountability for sth；比 responsibility 更强调可被追究"},{"en":"take responsibility for","basic":"","zh":"对……负责，承担……的责任","pos":"phr.","type":"phrase","example":"Instead of shifting the blame onto others, he took responsibility for the failure.","exampleZh":"他没有把责任推给别人，而是为这次失败承担了责任。","note":"for 后接名词或动名词，勿写成 take responsibility of；shift the blame onto 可作反面搭配"},{"en":"conscientious","basic":"","zh":"认真尽责的，勤勉谨慎的","pos":"adj.","type":"word","example":"A conscientious worker checks every detail twice before submitting a report.","exampleZh":"认真尽责的员工在提交报告前会把每个细节核对两遍。","note":"常修饰 student/worker/attitude；与 conscious 拼写相近，切勿混用"},{"en":"down-to-earth","basic":"","zh":"务实的，脚踏实地的","pos":"adj.","type":"word","example":"Despite his fame, the scientist remained refreshingly down-to-earth in his daily life.","exampleZh":"尽管声名显赫，这位科学家在日常生活中依然务实得令人耳目一新。","note":"复合形容词，连字符不可省；多修饰人物品质，可与 humble 连用于人物描写"},{"en":"ambition","basic":"","zh":"抱负，雄心；野心","pos":"n.","type":"word","example":"Her ambition was not to outshine others but to make a difference in rural education.","exampleZh":"她的抱负不是要胜过他人，而是要为乡村教育带来改变。","note":"可数或不可数；实现抱负用 fulfill/realize one's ambition，不可说 reach one's ambition"},{"en":"aspiration","basic":"","zh":"志向，渴望（多指向上的追求）","pos":"n.","type":"word","example":"Many graduates cherish the aspiration to work in a field that serves the public good.","exampleZh":"许多毕业生怀有在公益领域工作的志向。","note":"常搭配 aspiration to do sth 或 for sth；比 ambition 更偏正面，适合表达理想"},{"en":"strive","basic":"","zh":"努力，奋斗（为达到目标而不懈努力）","pos":"v.","type":"word","example":"Every young person should strive to become a better version of himself.","exampleZh":"每个年轻人都应努力成为更好的自己。","note":"常接 to do sth 或 for sth；strive for excellence 为高频搭配，结尾段很实用"},{"en":"endeavor","basic":"","zh":"努力，尽力（动词；亦作名词意为努力）","pos":"v.","type":"word","example":"We should endeavor to balance academic pursuit with physical and mental well-being.","exampleZh":"我们应努力在学业追求与身心健康之间取得平衡。","note":"美式拼写 endeavor、英式 endeavour，全文须统一；作名词时用 in an endeavor to do sth"},{"en":"spare no effort","basic":"","zh":"不遗余力，竭尽全力","pos":"phr.","type":"phrase","example":"The government should spare no effort to narrow the gap between urban and rural schools.","exampleZh":"政府应不遗余力地缩小城乡学校之间的差距。","note":"后接不定式 to do sth；主语常为政府、学校等机构，是结尾段提建议的高分表达"},{"en":"go to great lengths","basic":"","zh":"竭尽全力，不辞辛苦地去做","pos":"phr.","type":"phrase","example":"Some parents go to great lengths to secure the best education for their children.","exampleZh":"有些父母竭尽全力为孩子争取最好的教育。","note":"固定搭配 go to great lengths to do sth；great 亦可换 considerable，语气略弱"},{"en":"seize the opportunity","basic":"","zh":"抓住机会","pos":"phr.","type":"phrase","example":"Students should seize the opportunity to broaden their horizons while they are still young.","exampleZh":"学生应趁年轻抓住机会开阔自己的视野。","note":"后接不定式 to do sth；也可用 grasp/take the opportunity，seize 语气最强"},{"en":"make the most of","basic":"","zh":"充分利用，最大限度地利用","pos":"phr.","type":"phrase","example":"To make the most of university life, one must go far beyond the requirements of the syllabus.","exampleZh":"要充分利用大学生活，就必须远远超越课程大纲的要求。","note":"后接时间、机会、资源等名词；比 make full use of 更自然，适合建议句"},{"en":"a sense of achievement","basic":"","zh":"成就感","pos":"n.","type":"phrase","example":"Nothing gives a learner more of a sense of achievement than mastering a difficult skill.","exampleZh":"对学习者而言，没有什么比掌握一项困难技能更能带来成就感。","note":"固定结构 a sense of achievement/fulfillment/responsibility；作主语或宾语皆可"},{"en":"fulfillment","basic":"","zh":"满足感，成就感；实现（愿望）","pos":"n.","type":"word","example":"Teaching in a remote village brought her a deep sense of fulfillment that no salary could buy.","exampleZh":"在偏远山村教书给她带来了一种薪水买不到的深深的满足感。","note":"英式拼写 fulfilment（单 l），美式 fulfillment；常以 a sense of fulfillment 出现"},{"en":"It is ___ that enables us to ___.","basic":"","zh":"正是___使我们能够___。（强调句式，突出某种品质或因素的决定作用）","pos":"—","type":"pattern","example":"It is perseverance that enables us to convert repeated failure into ultimate success.","exampleZh":"正是坚持不懈使我们能够将反复的失败转化为最终的成功。","note":"强调句，被强调部分置于 It is 之后；主体段分析原因、结尾段点题均适用"},{"en":"Were it not for ___, we would never ___.","basic":"","zh":"若非___，我们就永远不会___。（虚拟条件倒装，强调某因素不可或缺）","pos":"—","type":"pattern","example":"Were it not for self-discipline, we would never accomplish anything worth remembering.","exampleZh":"若非自律，我们就永远不会取得任何值得铭记的成就。","note":"省略 if 的虚拟倒装；与现在事实相反用 Were it not for，与过去相反用 Had it not been for"},{"en":"Only by ___ can we ___.","basic":"","zh":"只有通过___，我们才能___。（only 加状语置于句首引起部分倒装）","pos":"—","type":"pattern","example":"Only by cooperating with others can we accomplish what no individual could achieve alone.","exampleZh":"只有与他人合作，我们才能完成任何个人都无法独力达成的事。","note":"by 后接动名词；主句必须倒装为 can we，结尾段提建议时非常出彩"},{"en":"What sets ___ apart from others is ___.","basic":"","zh":"使___区别于他人之处在于___。（主语从句，用于对比与评价）","pos":"—","type":"pattern","example":"What sets outstanding achievers apart from others is their refusal to give up when others quit.","exampleZh":"杰出成就者与常人不同之处在于，当别人放弃时他们仍然坚持。","note":"what 引导主语从句，谓语一律用单数 is；适合第二段对比论证的开头"},{"en":"The more ___ we are, the more likely we are to ___.","basic":"","zh":"我们越___，就越可能___。（the more…the more 递进比较结构）","pos":"—","type":"pattern","example":"The more resilient we are, the more likely we are to turn setbacks into stepping stones.","exampleZh":"我们的抗挫力越强，就越有可能把挫折变成垫脚石。","note":"两个分句均以 the 起首并接比较级；用于论证品质与结果之间的正向关系"},{"en":"No one can ___ without ___.","basic":"","zh":"没有人能在没有___的情况下___。（双重否定，强调必要条件）","pos":"—","type":"pattern","example":"No one can attain lasting success without perseverance and a clear sense of purpose.","exampleZh":"没有坚持不懈和清晰的目标感，没有人能获得持久的成功。","note":"without 后接名词或动名词；句子简短有力，适合置于段落结论处"},{"en":"It is not ___ but ___ that determines whether ___.","basic":"","zh":"决定___与否的不是___，而是___。（not…but 与强调句合用，用于纠正误解）","pos":"—","type":"pattern","example":"It is not innate talent but sustained effort that determines whether one can excel.","exampleZh":"决定一个人能否出类拔萃的，不是天赋，而是持续的努力。","note":"not A but B 结构中谓语与 B 保持一致；适合驳斥天赋决定论的论证段"},{"en":"Where there is a will, there is a way.","basic":"","zh":"有志者事竟成。","pos":"—","type":"proverb","example":"Where there is a will, there is a way; the only real failure is giving up too soon.","exampleZh":"有志者事竟成；唯一真正的失败是过早放弃。","note":"谚语，可用于开头引入或结尾升华；注意 there 不可写成 their，will 此处意为意志"},{"en":"Rome was not built in a day.","basic":"","zh":"罗马非一日建成（伟业需时）。","pos":"—","type":"proverb","example":"Rome was not built in a day, so we should not expect instant results from steady effort.","exampleZh":"罗马非一日建成，因此我们不应指望持续的努力能立刻见效。","note":"用于劝人耐心与长期坚持的段落；后可接 so/therefore 引出结论"},{"en":"Constant dripping wears away a stone.","basic":"","zh":"滴水穿石。","pos":"—","type":"proverb","example":"Constant dripping wears away a stone, which proves that persistence outweighs momentary intensity.","exampleZh":"滴水穿石，这证明坚持胜过一时的猛烈。","note":"dripping 为动名词作主语，谓语用 wears；与 perseverance 主题高度呼应"},{"en":"Genius is one percent inspiration and ninety-nine percent perspiration.","basic":"","zh":"天才是百分之一的灵感加百分之九十九的汗水。（爱迪生）","pos":"—","type":"proverb","example":"As Edison put it, genius is one percent inspiration and ninety-nine percent perspiration.","exampleZh":"正如爱迪生所说，天才是百分之一的灵感加百分之九十九的汗水。","note":"引用时用 As Edison put it；适合论证勤奋重于天赋的段落"},{"en":"Smooth seas do not make skillful sailors.","basic":"","zh":"平静的海面练不出熟练的水手。","pos":"—","type":"proverb","example":"Smooth seas do not make skillful sailors, so adversity should be welcomed rather than feared.","exampleZh":"平静的海面练不出熟练的水手，因此逆境应被欢迎而非畏惧。","note":"非洲谚语，比喻逆境造就本领；放在挫折类话题的论点句效果极佳"},{"en":"Honesty is the best policy.","basic":"","zh":"诚实为上策。","pos":"—","type":"proverb","example":"Honesty is the best policy, yet it is precisely in difficult moments that it is hardest to keep.","exampleZh":"诚实为上策，然而恰恰在艰难时刻，它最难坚守。","note":"用于诚信与职业道德话题；后接 yet/however 转折可避免结论平淡"},{"en":"United we stand, divided we fall.","basic":"","zh":"团结则存，分裂则亡。","pos":"—","type":"proverb","example":"United we stand, divided we fall, a truth that applies to teams as much as to nations.","exampleZh":"团结则存，分裂则亡，这一道理既适用于国家，也适用于团队。","note":"对仗工整，适合合作与团队精神主题的结尾段，后接同位语补充说明范围"}],"file":"01-quality.json"},{"id":"education","title":"学习与教育","emoji":"🎓","group":"大作文·主题语料","desc":"覆盖终身学习、阅读、在线教育、能力培养、教育体制与师生关系的实用表达","entries":[{"en":"lifelong learning","basic":"","zh":"终身学习","pos":"n.","type":"phrase","example":"In an age of rapid change, lifelong learning has become a necessity rather than a luxury.","exampleZh":"在迅速变化的时代，终身学习已成为必需而非奢侈。","note":"不可数，作主语谓语用单数；常与 a culture of lifelong learning 连用，适合开头点题"},{"en":"keep pace with the times","basic":"","zh":"与时俱进","pos":"phr.","type":"phrase","example":"Only by updating our knowledge constantly can we keep pace with the times.","exampleZh":"只有不断更新知识，我们才能与时俱进。","note":"固定搭配 keep pace with；the times 必用复数，勿写成 the time，适合结尾段总结"},{"en":"knowledge acquisition","basic":"","zh":"知识获取，知识习得","pos":"n.","type":"phrase","example":"The internet has radically changed knowledge acquisition, making information available at a click.","exampleZh":"互联网彻底改变了知识获取的方式，使信息一点即得。","note":"书面名词短语，比 getting knowledge 正式；常作主语或介词宾语"},{"en":"literacy","basic":"","zh":"读写能力；（某领域的）素养","pos":"n.","type":"word","example":"Digital literacy has become as indispensable as the ability to read and write.","exampleZh":"数字素养已变得像读写能力一样不可或缺。","note":"不可数名词，可构成 digital/scientific/financial literacy；勿与 literature 混淆"},{"en":"a thirst for knowledge","basic":"","zh":"求知欲，对知识的渴望","pos":"n.","type":"phrase","example":"A genuine thirst for knowledge is what keeps a learner curious long after exams are over.","exampleZh":"真正的求知欲，能使学习者在考试结束很久之后依然保持好奇。","note":"固定搭配 thirst for sth；同义可用 a hunger for knowledge，作主语时用单数"},{"en":"broaden one's horizons","basic":"","zh":"开阔视野","pos":"phr.","type":"phrase","example":"Studying abroad broadened her horizons in ways no textbook could have done.","exampleZh":"海外求学以教科书无法做到的方式开阔了她的视野。","note":"horizons 必须用复数；也可说 expand one's horizons，用于读书、旅行、留学话题"},{"en":"read classics","basic":"","zh":"阅读经典著作","pos":"phr.","type":"phrase","example":"Reading classics allows us to converse with great minds across the centuries.","exampleZh":"阅读经典让我们得以与跨越数世纪的伟大思想对话。","note":"classics 指经典作品时用复数；泛指阅读行为时以动名词短语 reading classics 作主语"},{"en":"deep reading","basic":"","zh":"深度阅读，沉浸式阅读","pos":"n.","type":"phrase","example":"Deep reading sharpens our thinking, whereas skimming leaves us with mere fragments of information.","exampleZh":"深度阅读磨砺我们的思维，而快速浏览只留给我们零碎的信息。","note":"作主语时谓语用单数；常与 fragmented reading 对照使用，论证读书方法"},{"en":"fragmented reading","basic":"","zh":"碎片化阅读","pos":"n.","type":"phrase","example":"Fragmented reading may be convenient, but it rarely cultivates sustained concentration.","exampleZh":"碎片化阅读也许方便，却很难培养持久的专注力。","note":"用于分析手机阅读、短视频等现象；与 deep reading 并列构成对比论证"},{"en":"be well-read","basic":"","zh":"博览群书的，学识渊博的","pos":"adj.","type":"phrase","example":"Those who are well-read tend to express complex ideas with unusual clarity.","exampleZh":"博览群书的人往往能以非凡的清晰度表达复杂的观点。","note":"复合形容词，可作表语或定语；作定语时写成 a well-read person，勿写 well-reading"},{"en":"enlightening","basic":"","zh":"有启发性的，令人豁然开朗的","pos":"adj.","type":"word","example":"The lecture was so enlightening that it changed the way I viewed my own major.","exampleZh":"那场讲座极具启发性，以至于改变了我对自己专业的看法。","note":"多修饰 book/lecture/experience；与 enlightened（开明的）区分，勿混用"},{"en":"online learning","basic":"","zh":"在线学习","pos":"n.","type":"phrase","example":"Online learning offers remarkable flexibility, but it also demands far greater self-discipline.","exampleZh":"在线学习提供了极大的灵活性，但也要求更强的自律。","note":"不可数，作主语用单数谓语；同义表达 e-learning，可与课堂教学对比论证"},{"en":"MOOC","basic":"","zh":"大型开放式网络课程（Massive Open Online Course）","pos":"n.","type":"word","example":"MOOCs have made courses from top universities accessible to learners worldwide.","exampleZh":"慕课使世界各地的学习者都能获取顶尖大学的课程。","note":"首现时宜写出全称；复数 MOOCs，作主语谓语用复数，勿大小写混排"},{"en":"digital divide","basic":"","zh":"数字鸿沟","pos":"n.","type":"phrase","example":"Without government support, the digital divide may widen the gap in educational opportunity.","exampleZh":"若无政府支持，数字鸿沟可能扩大教育机会上的差距。","note":"固定搭配，常与 bridge/narrow/widen 连用；适合讨论在线教育公平性的主体段"},{"en":"autonomous learning","basic":"","zh":"自主学习","pos":"n.","type":"phrase","example":"Autonomous learning places the responsibility for progress squarely on the learner's own shoulders.","exampleZh":"自主学习把进步的完全责任放在学习者自己肩上。","note":"不可数名词短语，常与 cultivate/foster 搭配；比 self-study 更书面"},{"en":"critical thinking","basic":"","zh":"批判性思维，思辨能力","pos":"n.","type":"phrase","example":"Critical thinking enables students to question what they read rather than accept it blindly.","exampleZh":"批判性思维使学生能够质疑所读内容，而不是盲目接受。","note":"常搭配 develop/cultivate critical thinking；critical 此处意为审慎评判的，非批评的"},{"en":"hands-on ability","basic":"","zh":"动手能力，实践能力","pos":"n.","type":"phrase","example":"Internships give students the hands-on ability that classroom lectures can never provide.","exampleZh":"实习赋予学生课堂讲授永远无法提供的动手能力。","note":"hands-on 为复合形容词；同义可说 practical ability，中国考生使用判分友好"},{"en":"all-round development","basic":"","zh":"全面发展","pos":"n.","type":"phrase","example":"Schools should attach equal importance to academic excellence and all-round development.","exampleZh":"学校应同等重视学业优秀与全面发展。","note":"英式写法 all-round，美式常用 well-rounded；常搭配 promote/facilitate"},{"en":"well-rounded","basic":"","zh":"全面发展的，多才多艺的","pos":"adj.","type":"word","example":"Universities aim to produce well-rounded graduates rather than narrow specialists.","exampleZh":"大学旨在培养全面发展的毕业生，而非狭隘的专才。","note":"作定语修饰 person/graduate/education；与 narrow specialist 对比使用效果最佳"},{"en":"exam-oriented education","basic":"","zh":"应试教育","pos":"n.","type":"phrase","example":"Exam-oriented education often trains students to memorize rather than to think.","exampleZh":"应试教育往往训练学生记忆，而非思考。","note":"亦作 test-oriented；与 quality-oriented education 成对出现，构成对比论证"},{"en":"quality-oriented education","basic":"","zh":"素质教育","pos":"n.","type":"phrase","example":"Shifting from exam-oriented to quality-oriented education requires more than a change of policy.","exampleZh":"从应试教育转向素质教育，需要的不只是一纸政策的改变。","note":"中国语境特有表达，首现后可用 it 指代；quality 前不加定冠词"},{"en":"compulsory education","basic":"","zh":"义务教育","pos":"n.","type":"phrase","example":"Making nine-year compulsory education genuinely free has eased the burden on rural families.","exampleZh":"让九年义务教育真正免费，减轻了农村家庭的负担。","note":"compulsory 意为强制的、义务的；常与 nine-year、free 连用修饰 schools 或 system"},{"en":"vocational training","basic":"","zh":"职业培训","pos":"n.","type":"phrase","example":"Vocational training equips school leavers with skills that the job market urgently needs.","exampleZh":"职业培训使离校者掌握就业市场迫切需要的技能。","note":"不可数；与 academic education 相对，讨论就业与教育结构时常并提"},{"en":"rote learning","basic":"","zh":"死记硬背","pos":"n.","type":"phrase","example":"Rote learning may raise test scores, but it seldom produces genuine understanding.","exampleZh":"死记硬背或许能提高考试成绩，却很少产生真正的理解。","note":"不可数名词，含贬义；动词短语形式为 learn by rote，两者勿混用"},{"en":"postgraduate entrance examination","basic":"","zh":"研究生入学考试（考研）","pos":"n.","type":"phrase","example":"Millions of graduates sit the postgraduate entrance examination each year in search of better prospects.","exampleZh":"每年有数百万毕业生参加研究生入学考试，以求更好的发展前景。","note":"动词用 take/sit the exam；首现写全称，后文可用 the exam 或 it 指代"},{"en":"pursue further education","basic":"","zh":"继续深造，攻读更高学历","pos":"phr.","type":"phrase","example":"Some graduates choose to pursue further education abroad to gain an international perspective.","exampleZh":"一些毕业生选择出国深造，以获得国际化的视野。","note":"pursue 后接名词；也可说 pursue a master's degree，degree 前须加 a"},{"en":"academic performance","basic":"","zh":"学习成绩，学业表现","pos":"n.","type":"phrase","example":"A student's academic performance depends on far more than the hours spent in the library.","exampleZh":"一个学生的学习成绩，取决于远不止在图书馆里待的时长。","note":"不可数；常搭配 improve/poor academic performance，图表作文描述数据时常用"},{"en":"academic pressure","basic":"","zh":"学业压力","pos":"n.","type":"phrase","example":"Excessive academic pressure can undermine the very curiosity that education is meant to inspire.","exampleZh":"过度的学业压力会损害教育本应激发的求知欲。","note":"常搭配 under great academic pressure、relieve pressure on students；心理话题必备"},{"en":"credential","basic":"","zh":"学历证书，资格证明；资历","pos":"n.","type":"word","example":"Employers increasingly value practical skills over paper credentials alone.","exampleZh":"雇主日益看重实际技能，而不仅是纸质文凭。","note":"常用复数 credentials；比 diploma 更强调资历证明，适合学历与能力之争的话题"},{"en":"scholarship","basic":"","zh":"奖学金；（另一义）学术研究","pos":"n.","type":"word","example":"She won a full scholarship that covered both her tuition and living expenses.","exampleZh":"她获得了一份全额奖学金，涵盖学费和生活费。","note":"可数名词，搭配 win/obtain/award a scholarship；另一义为学术研究，须看语境"},{"en":"tuition","basic":"","zh":"学费；讲授","pos":"n.","type":"word","example":"Rising tuition fees have forced many families to reconsider their children's choices.","exampleZh":"不断上涨的学费迫使许多家庭重新考虑孩子的选择。","note":"不可数名词；英式常说 tuition fees，pay one's tuition 意为付学费"},{"en":"mentor","basic":"","zh":"导师，良师益友","pos":"n.","type":"word","example":"A good mentor does not simply pass on knowledge but shows students how to learn.","exampleZh":"好的导师不只是传授知识，而是教会学生如何学习。","note":"可数名词，也可作动词意为指导；常搭配 act as a mentor to sb，比 teacher 更有敬意"},{"en":"instill","basic":"","zh":"逐渐灌输（思想、品质、习惯）","pos":"vt.","type":"word","example":"Parents should instill in their children a respect for honesty and hard work.","exampleZh":"父母应向孩子灌输对诚实与勤勉的尊重。","note":"搭配 instill sth in/into sb，宾语位置勿放错；英式亦可拼作 instil，全文须统一"},{"en":"nurture","basic":"","zh":"培育，滋养（才能、品格）","pos":"vt.","type":"word","example":"Schools should nurture curiosity rather than suppress it with endless examinations.","exampleZh":"学校应培育好奇心，而不是用无尽的考试压制它。","note":"及物动词，宾语多为 talent/curiosity/creativity；与 rather than suppress 对照更有力"},{"en":"foster","basic":"","zh":"培养，促进（某种能力或风气）","pos":"vt.","type":"word","example":"Group projects foster cooperation and teach students to value different perspectives.","exampleZh":"小组项目培养合作精神，并教学生珍视不同的视角。","note":"及物动词，搭配 foster creativity/independence/cooperation；比 develop 更显高级"},{"en":"cultivate","basic":"","zh":"培养，陶冶（习惯、兴趣、能力）","pos":"vt.","type":"word","example":"Reading widely helps students cultivate the habit of thinking independently.","exampleZh":"广泛阅读有助于学生培养独立思考的习惯。","note":"宾语多为 habit/interest/ability；与 foster 可互换，但更强调长期养成"},{"en":"enlighten","basic":"","zh":"启发，开导","pos":"vt.","type":"word","example":"A single question from a teacher may enlighten a student more than a whole lecture.","exampleZh":"老师的一个问题，也许比一整堂课更能启发学生。","note":"宾语通常为人，可用 enlighten sb on sth；派生词 enlightenment、enlightening 勿混用"},{"en":"set an example","basic":"","zh":"树立榜样，作出表率","pos":"phr.","type":"phrase","example":"Teachers who read widely inevitably set an example for their students.","exampleZh":"广泛阅读的教师无形中为学生树立了榜样。","note":"常接 for/to sb；褒义用 set a good example，反面说法是 set a bad example"},{"en":"put theory into practice","basic":"","zh":"把理论付诸实践","pos":"phr.","type":"phrase","example":"Knowledge becomes truly useful only when we put theory into practice.","exampleZh":"只有当我们把理论付诸实践，知识才真正有用。","note":"也可说 put sth into practice 替换中间宾语；论述实习与实践教学的核心句"},{"en":"integrate A with B","basic":"","zh":"把A与B结合起来","pos":"phr.","type":"phrase","example":"Internship programmes integrate classroom learning with real workplace experience.","exampleZh":"实习项目把课堂学习与真实的职场经验结合起来。","note":"A、B 处替换具体对象；注意 integrate A into B 意为把 A 融入 B，介词不可混用"},{"en":"apply what one has learned","basic":"","zh":"学以致用，把所学应用于实践","pos":"phr.","type":"phrase","example":"Graduates who can apply what they have learned to new situations adapt fastest.","exampleZh":"能把所学应用于新情境的毕业生适应得最快。","note":"what 引导宾语从句，人称随主语变化；用于论述实践能力与就业竞争力的段落"},{"en":"As is vividly depicted in the picture, ___.","basic":"","zh":"正如图画所生动描绘的，___。（图画作文首段万能句式）","pos":"—","type":"pattern","example":"As is vividly depicted in the picture, a father and his son are reading side by side.","exampleZh":"正如图画所生动描绘的，一位父亲和他的儿子正并肩阅读。","note":"as 指代整个主句内容，勿改成 It is vividly depicted that；首段描述图画直接套用"},{"en":"It is widely acknowledged that ___ plays an indispensable role in ___.","basic":"","zh":"人们普遍认为，___在___中起着不可或缺的作用。","pos":"—","type":"pattern","example":"It is widely acknowledged that reading plays an indispensable role in shaping one's character.","exampleZh":"人们普遍认为，阅读在塑造人的品格中起着不可或缺的作用。","note":"形式主语句；indispensable 后接 to 或 in 均可，主体段首句引入话题极稳妥"},{"en":"Not only does ___, but it also ___.","basic":"","zh":"___不仅___，而且还___。（not only 置于句首引起部分倒装）","pos":"—","type":"pattern","example":"Not only does online learning save time, but it also makes quality courses accessible to all.","exampleZh":"在线学习不仅节省时间，还使优质课程人人可及。","note":"not only 后必须倒装，but also 后恢复陈述语序；用于列举双重好处"},{"en":"Nothing is more conducive to ___ than ___.","basic":"","zh":"没有什么比___更有利于___。（比较级表最高级，强调最佳途径）","pos":"—","type":"pattern","example":"Nothing is more conducive to genuine learning than an active and curious mind.","exampleZh":"没有什么比一颗主动而好奇的心更有利于真正的学习。","note":"conducive 后固定接 to，不能用 for；句式简短有力，适合置于段落结尾"},{"en":"What matters is not ___, but whether ___.","basic":"","zh":"重要的不是___，而是是否___。","pos":"—","type":"pattern","example":"What matters is not how much we read, but whether we read thoughtfully.","exampleZh":"重要的不是我们读了多少，而是我们是否带着思考去读。","note":"what 引导主语从句，后接 whether 表语从句；论述辩证观点时非常好用"},{"en":"Only when ___ can we ___.","basic":"","zh":"只有当___时，我们才能___。","pos":"—","type":"pattern","example":"Only when knowledge is applied to real problems can we call it true learning.","exampleZh":"只有当知识被用于解决真实问题时，我们才能称之为真正的学习。","note":"only 加状语从句置于句首，主句倒装；与 Only by doing 结构区分，后者接动名词"},{"en":"It is high time that we ___.","basic":"","zh":"该是我们___的时候了。（that 从句用过去式或 should 加动词原形的虚拟语气）","pos":"—","type":"pattern","example":"It is high time that we attached greater importance to quality-oriented education.","exampleZh":"该是我们更加重视素质教育的时候了。","note":"that 从句谓语用过去式或 should do；结尾段提出呼吁，语气强于 we should"},{"en":"Live and learn.","basic":"","zh":"活到老，学到老。","pos":"—","type":"proverb","example":"Live and learn, for the knowledge that served us yesterday may be obsolete tomorrow.","exampleZh":"活到老学到老，因为昨天管用的知识明天可能就已过时。","note":"用于终身学习主题的结尾；两个动词均为原形，勿改成 Living and learning"},{"en":"Knowledge is power.","basic":"","zh":"知识就是力量。（常归于弗朗西斯·培根）","pos":"—","type":"proverb","example":"Knowledge is power, but only when it is translated into action.","exampleZh":"知识就是力量，但唯有在它转化为行动之时才如此。","note":"引用时可就出处写 Francis Bacon；后接 but 转折更显思辨，适合开头或结尾"},{"en":"Reading makes a full man.","basic":"","zh":"读书使人充实。（弗朗西斯·培根《论读书》）","pos":"—","type":"proverb","example":"As Bacon observed, reading makes a full man, whereas discussion makes a ready one.","exampleZh":"正如培根所言，读书使人充实，而讨论使人机敏。","note":"出自《论读书》，原句与讨论、写作三者并列；适合阅读主题的开头段"},{"en":"It is never too late to learn.","basic":"","zh":"学习永远不嫌晚。","pos":"—","type":"proverb","example":"It is never too late to learn, as the growing number of elderly college students suggests.","exampleZh":"学习永远不嫌晚，老年大学生人数不断增加便说明了这一点。","note":"用于终身学习、老年教育话题；形式主语 it 不可换成 you are，后者过于口语"},{"en":"Practice makes perfect.","basic":"","zh":"熟能生巧。","pos":"—","type":"proverb","example":"Practice makes perfect, which is why repeated drills still matter in skill training.","exampleZh":"熟能生巧，这就是为什么反复练习在技能训练中仍然重要。","note":"用于论述实践与技能训练；后可接 which 定语从句或 that is why 结构"},{"en":"There is no royal road to learning.","basic":"","zh":"学无坦途。（相传出自欧几里得对国王的回答）","pos":"—","type":"proverb","example":"There is no royal road to learning, so short cuts are seldom worth taking.","exampleZh":"学无坦途，因此所谓的捷径往往不值得走。","note":"royal road 意为捷径而非御道；可用于劝学与坚持主题的论证句"},{"en":"A little learning is a dangerous thing.","basic":"","zh":"一知半解最危险。（亚历山大·蒲柏《论批评》）","pos":"—","type":"proverb","example":"A little learning is a dangerous thing, which is why superficial knowledge breeds false confidence.","exampleZh":"一知半解最危险，这正是肤浅的知识滋长盲目自信的原因。","note":"出自蒲柏《论批评》；用于批评浮躁学风，注意 learning 前有 a，不可省略"}],"file":"02-education.json"},{"id":"technology","title":"科技与互联网","emoji":"📱","group":"大作文·主题语料","desc":"覆盖互联网普及、人工智能、网络社交、隐私隐患与数字鸿沟的图画作文高频表达","entries":[{"en":"unprecedented","basic":"","zh":"前所未有的；史无前例的","pos":"adj.","type":"word","example":"The past two decades have witnessed unprecedented changes in the way people communicate and work.","exampleZh":"过去二十年见证了人们交流和工作方式前所未有的变化。","note":"常修饰 change/scale/speed；适合开头段。"},{"en":"omnipresent","basic":"","zh":"无处不在的；无所不在的","pos":"adj.","type":"word","example":"Smartphones have become so omnipresent that a single day without them seems unimaginable to urban dwellers.","exampleZh":"智能手机已无处不在，以至于对都市人来说，没有它们的一天简直不可想象。","note":"程度强于 common，只用于描述普遍现象，开头段用。"},{"en":"ubiquitous","basic":"","zh":"无处不在的；普遍存在的","pos":"adj.","type":"word","example":"Mobile payment is now ubiquitous in Chinese cities, from street stalls to luxury shopping malls.","exampleZh":"移动支付如今在中国城市无处不在，从路边摊到奢侈品商场。","note":"常作表语或定语；比 widespread 更书面，勿拼错。"},{"en":"permeate","basic":"","zh":"渗透；弥漫于","pos":"vt.","type":"word","example":"The Internet has permeated every corner of daily life, reshaping how we shop, learn and socialize.","exampleZh":"互联网已渗透到日常生活的每个角落，重塑了我们购物、学习和社交的方式。","note":"及物动词，直接接宾语；常搭配 every corner。"},{"en":"artificial intelligence","basic":"","zh":"人工智能","pos":"n.","type":"word","example":"Artificial intelligence is transforming the workplace at a pace that few workers are prepared for.","exampleZh":"人工智能正以少有劳动者准备好应对的速度改变着职场。","note":"常缩写为 AI；作主语时谓语用单数。"},{"en":"algorithm","basic":"","zh":"算法","pos":"n.","type":"word","example":"Recommendation algorithms decide what we read and buy, quietly shaping our preferences and choices.","exampleZh":"推荐算法决定我们读什么、买什么，悄然塑造着我们的偏好与选择。","note":"可数名词，泛指用复数；常搭配 recommendation。"},{"en":"big data","basic":"","zh":"大数据","pos":"n.","type":"word","example":"Big data enables companies to predict consumer behavior accurately, yet it also raises privacy concerns.","exampleZh":"大数据使企业能准确预测消费者行为，但也引发了隐私担忧。","note":"不可数，谓语用单数；主体段可用 yet also 转折。"},{"en":"automation","basic":"","zh":"自动化","pos":"n.","type":"word","example":"Rising automation has displaced millions of routine jobs, forcing workers to acquire new skills.","exampleZh":"日益提高的自动化取代了数百万常规工作，迫使劳动者掌握新技能。","note":"不可数名词；常搭配 displace jobs，谈就业话题。"},{"en":"cutting-edge","basic":"","zh":"尖端的；最前沿的","pos":"adj.","type":"word","example":"China has invested heavily in cutting-edge technologies such as 5G, quantum computing and new energy.","exampleZh":"中国在5G、量子计算和新能源等尖端技术上投入巨大。","note":"连字符不可省；常修饰 technology，比 advanced 好。"},{"en":"state-of-the-art","basic":"","zh":"最先进的；顶级的","pos":"adj.","type":"word","example":"The hospital is equipped with state-of-the-art devices that help doctors diagnose diseases far earlier.","exampleZh":"这家医院配备了最先进的设备，帮助医生更早地诊断疾病。","note":"多作定语，常修饰 equipment；与 cutting-edge 同义。"},{"en":"cyberspace","basic":"","zh":"网络空间；赛博空间","pos":"n.","type":"word","example":"Rules and ethics in cyberspace should be established as firmly as those in the physical world.","exampleZh":"网络空间中的规则与伦理应像现实世界一样被牢固地建立起来。","note":"不可数，通常加 the；谈网络治理时用。"},{"en":"alienate","basic":"","zh":"使疏远；使离心","pos":"vt.","type":"word","example":"Spending hours on social media may alienate us from family members sitting in the same room.","exampleZh":"花数小时刷社交媒体可能使我们与同处一室的家人疏远。","note":"常用 alienate sb from sb；比 avoid 高级。"},{"en":"isolate","basic":"","zh":"使孤立；使隔离","pos":"vt.","type":"word","example":"An excessive reliance on online contact can isolate young people from real social life.","exampleZh":"过度依赖线上联系会使年轻人与现实社交生活隔离。","note":"及物动词，搭配 isolate sb from sth。"},{"en":"misinformation","basic":"","zh":"错误信息；虚假信息","pos":"n.","type":"word","example":"Misinformation spreads faster online than facts, which is why media literacy matters so much today.","exampleZh":"错误信息在网上的传播快于事实，这正是当今媒介素养如此重要的原因。","note":"不可数，指错误信息；故意造谣用 disinformation。"},{"en":"cyberbullying","basic":"","zh":"网络欺凌；网络霸凌","pos":"n.","type":"word","example":"Cyberbullying can inflict lasting psychological damage on teenagers who dare not speak out.","exampleZh":"网络欺凌会给不敢开口的青少年造成持久的心理伤害。","note":"不可数；常与 suffer from、combat 搭配。"},{"en":"fraud","basic":"","zh":"诈骗；欺诈","pos":"n.","type":"word","example":"Online fraud has grown increasingly sophisticated, targeting the elderly who know little about digital security.","exampleZh":"网络诈骗日益精密，专门针对对数字安全知之甚少的老年人。","note":"不可数，网诈说 online fraud，不用复数。"},{"en":"addiction","basic":"","zh":"瘾；沉迷","pos":"n.","type":"word","example":"Smartphone addiction is quietly eroding students' concentration and sleep quality.","exampleZh":"手机成瘾正在悄然侵蚀学生的专注力和睡眠质量。","note":"常搭配 addiction to sth，如 to social media。"},{"en":"accessibility","basic":"","zh":"可及性；无障碍性","pos":"n.","type":"word","example":"Governments should improve the accessibility of public digital services for the elderly and the disabled.","exampleZh":"政府应提高面向老年人和残疾人的公共数字服务的可及性。","note":"不可数；常与 improve 搭配，谈数字鸿沟时用。"},{"en":"streamline","basic":"","zh":"精简（流程）；使更高效","pos":"vt.","type":"word","example":"Online platforms have streamlined procedures that once required long queues and endless paperwork.","exampleZh":"网络平台精简了曾经需要排长队和填无数表格的流程。","note":"及物动词，宾语多为 process；核心义是提效。"},{"en":"facilitate","basic":"","zh":"促进；使便利","pos":"vt.","type":"word","example":"Video conferencing has greatly facilitated cross-border cooperation between companies and researchers.","exampleZh":"视频会议大大促进了公司和研究人员之间的跨国合作。","note":"及物动词，后接名词或动名词，不接不定式。"},{"en":"harness","basic":"","zh":"利用；驾驭","pos":"vt.","type":"word","example":"Only by harnessing technology wisely can we turn its potential into benefits for everyone.","exampleZh":"只有明智地利用技术，我们才能把它的潜力转化为惠及所有人的利益。","note":"及物动词，常接 technology；比 use 高级。"},{"en":"judicious","basic":"","zh":"明智的；审慎的","pos":"adj.","type":"word","example":"Judicious use of digital devices can boost productivity rather than undermine it.","exampleZh":"明智地使用数字设备能提高而非削弱生产力。","note":"多作定语，常修饰 use；副词 judiciously。"},{"en":"phubber","basic":"","zh":"低头族；只顾看手机的人","pos":"n.","type":"word","example":"Phubbers stare at their screens at dinner tables, ignoring the people sitting right beside them.","exampleZh":"低头族在餐桌上盯着屏幕，无视就坐在身旁的人。","note":"由 phone 与 snub 合成，带贬义，描写图画好用。"},{"en":"digital detox","basic":"","zh":"数字排毒；数码休整期","pos":"n.","type":"word","example":"Many young people now take a weekend digital detox to regain control of their own time.","exampleZh":"如今许多年轻人选择周末数字排毒，以重新掌控自己的时间。","note":"可数名词；常与 take 搭配，结尾段提建议用。"},{"en":"be glued to one's screen","basic":"","zh":"盯着屏幕不放；屏幕不离眼","pos":"phr.","type":"phrase","example":"Teenagers today are glued to their screens for hours, seldom talking with their parents.","exampleZh":"如今的青少年一连数小时盯着屏幕，很少与父母交谈。","note":"固定搭配，强调沉迷；也可作状语修饰主语。"},{"en":"with one's head buried in a phone","basic":"","zh":"埋头看手机；低头刷手机","pos":"phr.","type":"phrase","example":"Walk down any street and you will see pedestrians with their heads buried in phones.","exampleZh":"走在任何一条街上，你都会看到低头盯着手机的行人。","note":"with 复合结构作伴随状语，描写画面感强。"},{"en":"screen time","basic":"","zh":"屏幕使用时间","pos":"phr.","type":"phrase","example":"Doctors advise limiting children's daily screen time to less than two hours.","exampleZh":"医生建议把儿童每天的屏幕使用时间限制在两小时以内。","note":"不可数；与 limit、reduce 搭配，健康话题常用。"},{"en":"virtual community","basic":"","zh":"虚拟社区；网络社群","pos":"phr.","type":"phrase","example":"Online forums have formed virtual communities where strangers with shared interests support each other.","exampleZh":"网络论坛形成了虚拟社区，兴趣相投的陌生人在这里互相支持。","note":"可数名词；常与 form、join 搭配。"},{"en":"social networking","basic":"","zh":"社交网络（活动）","pos":"phr.","type":"phrase","example":"Social networking sites have redefined friendship, turning distant acquaintances into daily contacts.","exampleZh":"社交网站重新定义了友谊，把远方的泛泛之交变成日常联系的对象。","note":"常作定语修饰 site、app；不可数，勿加 s。"},{"en":"face-to-face interaction","basic":"","zh":"面对面交流","pos":"phr.","type":"phrase","example":"Nothing can fully replace face-to-face interaction, in which tone and gesture carry real meaning.","exampleZh":"没有什么能完全取代面对面交流，因为语气与手势在其中传递真实含义。","note":"不可数；与 replace 搭配，论证线上社交不足。"},{"en":"interpersonal communication","basic":"","zh":"人际沟通；人际交往","pos":"phr.","type":"phrase","example":"Excessive online chatting may erode teenagers' interpersonal communication skills in real settings.","exampleZh":"过度网络聊天可能削弱青少年在真实场景中的人际沟通能力。","note":"不可数；常与 skills 连用，注意拼写。"},{"en":"privacy leakage","basic":"","zh":"隐私泄露","pos":"phr.","type":"phrase","example":"A single privacy leakage can expose millions of users' personal data to malicious hands.","exampleZh":"一次隐私泄露就可能把数百万用户的个人数据暴露给恶意者。","note":"常与 cause、risk 搭配；也作 data leakage。"},{"en":"digital divide","basic":"","zh":"数字鸿沟","pos":"phr.","type":"phrase","example":"The digital divide between urban and rural areas may further widen the gap in educational resources.","exampleZh":"城乡之间的数字鸿沟可能会进一步拉大教育资源差距。","note":"可数，常加 the；与 narrow、bridge 搭配。"},{"en":"instant access to","basic":"","zh":"即时获取…；即刻得到…","pos":"phr.","type":"phrase","example":"Smartphones give us instant access to information that once took days to find.","exampleZh":"智能手机让我们即时获取曾经需要数天才能找到的信息。","note":"give sb instant access to sth，to 为介词。"},{"en":"at one's fingertips","basic":"","zh":"近在手边；唾手可得","pos":"phr.","type":"phrase","example":"With a single tap, a world of knowledge and services lies at our fingertips.","exampleZh":"轻点一下，一个知识与服务的世界便尽在我们的指尖。","note":"以物作主语，介词只用 at，勿用 in。"},{"en":"a double-edged sword","basic":"","zh":"一把双刃剑","pos":"phr.","type":"phrase","example":"Artificial intelligence is a double-edged sword, offering efficiency while threatening millions of jobs.","exampleZh":"人工智能是一把双刃剑，带来效率的同时威胁着数百万个工作岗位。","note":"常作表语；同义 cut both ways，用于转折处。"},{"en":"be a blessing or a curse","basic":"","zh":"是福还是祸","pos":"phr.","type":"phrase","example":"Whether the Internet is a blessing or a curse depends entirely on how we use it.","exampleZh":"互联网是福是祸，完全取决于我们如何使用它。","note":"常作表语，与 whether 从句搭配，表辩证观点。"},{"en":"weigh the benefits against the drawbacks","basic":"","zh":"权衡利弊","pos":"phr.","type":"phrase","example":"Before embracing any new technology, we should weigh its benefits against its potential drawbacks.","exampleZh":"在拥抱任何新技术之前，我们都应权衡其益处与潜在弊端。","note":"动词短语，its 与主语一致，替代 good and bad。"},{"en":"make judicious use of","basic":"","zh":"明智地利用","pos":"phr.","type":"phrase","example":"Students should make judicious use of digital tools instead of surrendering to them.","exampleZh":"学生应明智地使用数字工具，而不是向它们屈服。","note":"后接名词；可替换 use properly，结尾段加分。"},{"en":"strike a balance between","basic":"","zh":"在…之间取得平衡","pos":"phr.","type":"phrase","example":"Only by striking a balance between online convenience and offline life can we stay healthy.","exampleZh":"只有在线上便利与线下生活之间取得平衡，我们才能保持健康。","note":"结构为 between A and B，结尾段提方案用。"},{"en":"put technology to good use","basic":"","zh":"善用技术","pos":"phr.","type":"phrase","example":"If put to good use, technology can narrow rather than widen social gaps.","exampleZh":"如果善加利用，技术能缩小而非拉大社会差距。","note":"固定搭配 put sth to good use，可作条件状语。"},{"en":"be overly dependent on","basic":"","zh":"过度依赖","pos":"phr.","type":"phrase","example":"Modern students are overly dependent on search engines, losing the habit of independent thinking.","exampleZh":"现代学生过度依赖搜索引擎，正在丧失独立思考的习惯。","note":"overly 比 too 书面；同义 be addicted to。"},{"en":"The Internet has permeated every facet of life, from ___ to ___.","basic":"","zh":"互联网已渗透到生活的方方面面，从…到…。","pos":"—","type":"pattern","example":"The Internet has permeated every facet of life, from the way we work to the way we relax.","exampleZh":"互联网已渗透到生活的方方面面，从我们的工作方式到休闲方式。","note":"万能开头句；facet 可换 aspect，末尾并列收尾。"},{"en":"While ___ has brought unprecedented convenience, it has also ___.","basic":"","zh":"尽管…带来了前所未有的便利，它同时也…。","pos":"—","type":"pattern","example":"While digital technology has brought unprecedented convenience, it has also eroded our privacy.","exampleZh":"尽管数字技术带来了前所未有的便利，它同时也侵蚀了我们的隐私。","note":"让步转折句式，放主体段首句，末尾接贬义词。"},{"en":"Never before have we ___.","basic":"","zh":"我们从未像现在这样…。","pos":"—","type":"pattern","example":"Never before have we enjoyed such easy access to information in human history.","exampleZh":"人类历史上，我们从未像今天这样便捷地获取信息。","note":"部分倒装，助动词提前；空处填过去分词。"},{"en":"It is not technology itself but the way we use it that ___.","basic":"","zh":"决定…的不是技术本身，而是我们使用它的方式。","pos":"—","type":"pattern","example":"It is not technology itself but the way we use it that determines its true value.","exampleZh":"决定技术真正价值的不是技术本身，而是我们使用它的方式。","note":"强调句型；that 后谓语用单数，结尾段升华。"},{"en":"So pervasive is ___ that ___.","basic":"","zh":"…如此普遍，以至于…。","pos":"—","type":"pattern","example":"So pervasive is mobile payment that many young people no longer carry cash.","exampleZh":"移动支付如此普遍，以至于许多年轻人不再带现金。","note":"so 提前引起倒装，比 very common 高级。"},{"en":"Only by ___ can we ___.","basic":"","zh":"只有通过…，我们才能…。","pos":"—","type":"pattern","example":"Only by using technology with restraint can we enjoy its benefits without being enslaved.","exampleZh":"只有克制地使用技术，我们才能享受其益处而不被其奴役。","note":"only 状语置句首时主句倒装；by 后接动名词。"},{"en":"What matters is not ___ but ___.","basic":"","zh":"重要的不是…，而是…。","pos":"—","type":"pattern","example":"What matters is not how advanced the tool is but how wisely we employ it.","exampleZh":"重要的不是工具有多先进，而是我们使用它有多明智。","note":"what 引导主语从句，谓语用单数，替代 I think。"},{"en":"Technology, if properly harnessed, can ___.","basic":"","zh":"技术若得到合理利用，能够…。","pos":"—","type":"pattern","example":"Technology, if properly harnessed, can liberate us from repetitive chores and free our creativity.","exampleZh":"技术若得到合理利用，能把我们从重复性杂务中解放出来，释放我们的创造力。","note":"插入语结构，if 后省略 it is，论证价值用。"},{"en":"With the rapid advancement of ___, ___ has become increasingly common.","basic":"","zh":"随着…的迅速发展，…已变得越来越普遍。","pos":"—","type":"pattern","example":"With the rapid advancement of artificial intelligence, remote working has become increasingly common.","exampleZh":"随着人工智能的迅速发展，远程办公已变得越来越普遍。","note":"描述趋势的开头模板，谓语用现在完成时。"},{"en":"___ is a double-edged sword: it ___ while ___.","basic":"","zh":"…是一把双刃剑：它…，同时又…。","pos":"—","type":"pattern","example":"Social media is a double-edged sword: it connects the world while isolating individuals.","exampleZh":"社交媒体是一把双刃剑：它连接世界，同时又孤立个人。","note":"冒号后并列两分句，while 表对比。"},{"en":"\"Technology is a useful servant but a dangerous master.\" — Christian Lous Lange","basic":"","zh":"“技术是有用的仆人，却是危险的主人。”——克里斯蒂安·劳斯·兰格","pos":"—","type":"proverb","example":"\"Technology is a useful servant but a dangerous master,\" a warning that rings truer than ever today.","exampleZh":"“技术是有用的仆人，却是危险的主人”，这一警告在今天比以往任何时候都更真切。","note":"谈科技利弊与合理使用；作结尾段首句。"},{"en":"\"Our technology has exceeded our humanity.\" — Albert Einstein","basic":"","zh":"“我们的技术已超越了我们的人性。”——阿尔伯特·爱因斯坦","pos":"—","type":"proverb","example":"As Einstein warned, our technology has exceeded our humanity, so our wisdom must catch up.","exampleZh":"正如爱因斯坦所警告的，我们的技术已超越了我们的人性，因此我们的智慧必须跟上。","note":"谈科技伦理与网络隐患；引用后须自己论述。"},{"en":"\"The real problem is not whether machines think but whether men do.\" — B. F. Skinner","basic":"","zh":"“真正的问题不在于机器是否会思考，而在于人是否会思考。”——B.F. 斯金纳","pos":"—","type":"proverb","example":"Skinner once observed that the real problem is not whether machines think but whether men do.","exampleZh":"斯金纳曾指出，真正的问题不在于机器是否会思考，而在于人是否会思考。","note":"谈 AI 取代人类与独立思考，结尾段引用。"}],"file":"03-technology.json"},{"id":"society","title":"社会公德与文明风尚","emoji":"🤝","group":"大作文·主题语料","desc":"汇集社会公德、文明礼仪、诚信、志愿助人与社会责任等社会风尚类作文高分表达","entries":[{"en":"civic","basic":"","zh":"公民的；市民的","pos":"adj.","type":"word","example":"Civic awareness is the foundation on which a well-ordered society ultimately rests.","exampleZh":"公民意识是一个秩序良好的社会最终赖以存在的基础。","note":"只作定语，常修饰 virtue、duty，比 public 更强调担当。"},{"en":"civility","basic":"","zh":"礼貌；文明举止","pos":"n.","type":"word","example":"Simple acts of civility, such as saying thank you, can warm an entire community.","exampleZh":"简单的文明举动，比如道一声谢谢，就能温暖整个社区。","note":"不可数；常与 show 搭配，比 politeness 书面。"},{"en":"etiquette","basic":"","zh":"礼仪；礼节","pos":"n.","type":"word","example":"Observing basic etiquette in public places reflects a person's upbringing and cultivation.","exampleZh":"在公共场所遵守基本礼仪体现了一个人的教养与修养。","note":"不可数；常与 observe、violate 搭配，无复数。"},{"en":"courtesy","basic":"","zh":"礼貌；谦恭有礼","pos":"n.","type":"word","example":"Courtesy costs nothing, yet it can defuse conflicts and win lasting respect.","exampleZh":"礼貌不费分文，却能化解冲突、赢得持久的尊重。","note":"不可数；by courtesy 意为出于礼貌，亦可用 courteous。"},{"en":"uncivilized","basic":"","zh":"不文明的；未开化的","pos":"adj.","type":"word","example":"Uncivilized conduct such as spitting in public tarnishes the image of a modern city.","exampleZh":"在公共场所随地吐痰等不文明行为损害了一座现代城市的形象。","note":"常修饰 conduct、behavior，比 bad 更具体有力。"},{"en":"litter","basic":"","zh":"乱扔垃圾；随地丢弃","pos":"v.","type":"word","example":"Tourists who litter scenic spots spoil the experience for everyone who follows.","exampleZh":"在景区乱扔垃圾的游客破坏了后来所有人的体验。","note":"及物或不及物均可；名词不可数，如 drop litter。"},{"en":"jaywalk","basic":"","zh":"乱穿马路；违章穿越","pos":"v.","type":"word","example":"Jaywalking not only endangers pedestrians' lives but also disrupts the traffic order.","exampleZh":"乱穿马路不仅危及行人生命，也扰乱交通秩序。","note":"常用动名词 jaywalking 作主语；拼写为一个词。"},{"en":"vandalism","basic":"","zh":"故意破坏公物（的行为）","pos":"n.","type":"word","example":"Vandalism in public parks forces local governments to spend heavily on repairs.","exampleZh":"公园里破坏公物的行为迫使地方政府在维修上花费巨资。","note":"不可数；常与 commit、combat 搭配，谈公物保护。"},{"en":"inconsiderate","basic":"","zh":"不体谅他人的；不替他人着想的","pos":"adj.","type":"word","example":"Playing loud music on a night train is deeply inconsiderate to fellow passengers.","exampleZh":"在夜间列车上大声放音乐，对同行乘客极为不体谅。","note":"后接 of 或 to 引出对象；反义 considerate。"},{"en":"integrity","basic":"","zh":"诚信；正直","pos":"n.","type":"word","example":"Integrity is the most valuable asset a person can possess and the hardest to regain.","exampleZh":"诚信是一个人能拥有的最宝贵资产，也是最难重新获得的。","note":"不可数；谈诚信话题的核心词，常用作主语。"},{"en":"credibility","basic":"","zh":"可信度；信誉","pos":"n.","type":"word","example":"Once a company loses credibility, no advertisement can restore customers' trust.","exampleZh":"一家公司一旦失去信誉，任何广告都无法恢复顾客的信任。","note":"不可数；常与 lose、enhance 搭配，谈失信话题。"},{"en":"empathy","basic":"","zh":"同理心；共情","pos":"n.","type":"word","example":"Empathy enables us to sense another person's pain and respond with genuine kindness.","exampleZh":"同理心使我们能感知他人的痛苦并以真诚的善意回应。","note":"不可数；搭配 empathy with sb，勿与 sympathy 混用。"},{"en":"tolerance","basic":"","zh":"宽容；容忍","pos":"n.","type":"word","example":"Tolerance of different opinions is the hallmark of a mature and open society.","exampleZh":"对不同意见的宽容是一个成熟开放社会的标志。","note":"不可数；搭配 tolerance of sth，形容词 tolerant。"},{"en":"obligation","basic":"","zh":"义务；责任","pos":"n.","type":"word","example":"Every citizen has an obligation to keep public spaces clean and safe.","exampleZh":"每个公民都有保持公共空间清洁安全的义务。","note":"可数名词，常用 an obligation to do sth。"},{"en":"ethos","basic":"","zh":"风气；精神特质","pos":"n.","type":"word","example":"A community's ethos is shaped less by written rules than by everyday behavior.","exampleZh":"一个社区的风气与其说由成文规则塑造，不如说由日常行为塑造。","note":"单数不可数；social ethos 即社会风气。"},{"en":"cohesion","basic":"","zh":"凝聚力；团结","pos":"n.","type":"word","example":"Shared public values strengthen the cohesion of a society composed of diverse groups.","exampleZh":"共同的公共价值观增强了由多元群体构成的社会凝聚力。","note":"不可数；常与 social 连用，谈团结互助话题。"},{"en":"harmonious","basic":"","zh":"和谐的；融洽的","pos":"adj.","type":"word","example":"A harmonious neighborhood does not happen by accident; it requires everyone's effort.","exampleZh":"和谐的邻里关系不是偶然形成的，它需要每个人的努力。","note":"作定语或表语，常修饰 society；勿与 harmony 重复。"},{"en":"exemplary","basic":"","zh":"模范的；堪称榜样的","pos":"adj.","type":"word","example":"Her exemplary conduct during the flood rescue inspired the whole neighborhood.","exampleZh":"她在抗洪救援中的模范行为激励了整个社区。","note":"作定语，常修饰 conduct、citizen，褒义色彩强。"},{"en":"curb","basic":"","zh":"遏制；约束","pos":"vt.","type":"word","example":"Stricter fines may help curb jaywalking, but education works far more deeply.","exampleZh":"更严厉的罚款或许有助于遏制乱穿马路，但教育的作用要深远得多。","note":"及物动词，接 littering、vandalism 等行为名词。"},{"en":"foster","basic":"","zh":"培养；营造","pos":"vt.","type":"word","example":"Schools should foster in students a genuine respect for public property.","exampleZh":"学校应培养学生对公共财物发自内心的尊重。","note":"可接 foster sth in sb；常搭配 climate。"},{"en":"cultivate","basic":"","zh":"培养；陶冶","pos":"vt.","type":"word","example":"Volunteering cultivates patience and a sense of social responsibility in young people.","exampleZh":"志愿服务培养年轻人的耐心和社会责任感。","note":"及物动词，宾语多为 habit、virtue，与 foster 近义。"},{"en":"public morality","basic":"","zh":"社会公德；公共道德","pos":"phr.","type":"phrase","example":"Public morality declines not because rules are absent, but because they are ignored.","exampleZh":"公共道德的滑坡不是因为缺乏规则，而是因为规则被无视。","note":"不可数；常与 uphold、decline 搭配，作总起表达。"},{"en":"civic virtue","basic":"","zh":"公民美德","pos":"phr.","type":"phrase","example":"Civic virtue means doing the right thing even when nobody is watching.","exampleZh":"公民美德意味着即使无人注视也做正确的事。","note":"不可数；常与 practice、cultivate 连用，比 good 正式。"},{"en":"civilized behavior","basic":"","zh":"文明行为","pos":"phr.","type":"phrase","example":"Civilized behavior in public begins with small habits like queuing and lowering one's voice.","exampleZh":"公共场所的文明行为始于排队、压低声音这样的小习惯。","note":"不可数；与 uncivilized conduct 正反对比论证。"},{"en":"good manners","basic":"","zh":"良好的举止；有教养","pos":"phr.","type":"phrase","example":"Good manners open doors that wealth and talent alone can never open.","exampleZh":"良好的举止能打开仅凭财富与才华永远打不开的门。","note":"固定用复数，不可写成 good manner；与 show 搭配。"},{"en":"queue-jumping","basic":"","zh":"插队；加塞","pos":"phr.","type":"phrase","example":"Queue-jumping annoys everyone around and reveals a lack of respect for others.","exampleZh":"插队惹恼周围的每个人，暴露出对他人的缺乏尊重。","note":"英式说法，美式为 cutting in line；主语谓语用单数。"},{"en":"break one's promise","basic":"","zh":"违背承诺；食言","pos":"phr.","type":"phrase","example":"Businesses that break their promises may save money today but lose customers tomorrow.","exampleZh":"违背承诺的企业今天或许省了钱，明天却会失去顾客。","note":"one's 须与主语一致；同义 go back on one's word。"},{"en":"lend a helping hand","basic":"","zh":"伸出援手；帮一把","pos":"phr.","type":"phrase","example":"When a stranger stumbles on the street, we should lend a helping hand without hesitation.","exampleZh":"当陌生人在街上跌倒时，我们应毫不犹豫地伸出援手。","note":"固定搭配 lend sb a helping hand，叙述图画好用。"},{"en":"voluntary work","basic":"","zh":"志愿工作；义务劳动","pos":"phr.","type":"phrase","example":"Voluntary work in nursing homes teaches teenagers compassion that textbooks never can.","exampleZh":"养老院的志愿工作教给青少年教科书永远教不会的同情心。","note":"不可数；也可说 voluntary service，与 do 搭配。"},{"en":"dedicate oneself to","basic":"","zh":"献身于；致力于","pos":"phr.","type":"phrase","example":"Many retired teachers dedicate themselves to tutoring children in remote mountain villages.","exampleZh":"许多退休教师致力于为偏远山村的孩子辅导功课。","note":"to 为介词，后接名词或动名词；亦作 dedicated to。"},{"en":"community service","basic":"","zh":"社区服务；公益服务","pos":"phr.","type":"phrase","example":"Community service not only helps those in need but also strengthens neighborhood ties.","exampleZh":"社区服务不仅帮助需要帮助的人，也加强邻里纽带。","note":"不可数；常与 do、perform 搭配，属公益话题。"},{"en":"mutual respect","basic":"","zh":"相互尊重","pos":"phr.","type":"phrase","example":"Mutual respect is the invisible thread that keeps strangers living side by side in peace.","exampleZh":"相互尊重是把比邻而居的陌生人维系在和平之中的无形纽带。","note":"不可数；常与 build、promote 搭配，作论点句。"},{"en":"be considerate of","basic":"","zh":"体谅…；为…着想","pos":"phr.","type":"phrase","example":"We should be considerate of the elderly and offer our seats on crowded buses.","exampleZh":"我们应体谅老年人，在拥挤的公交车上主动让座。","note":"介词用 of，间或可用 to；名词为 consideration。"},{"en":"put oneself in others' shoes","basic":"","zh":"设身处地；换位思考","pos":"phr.","type":"phrase","example":"Only by putting ourselves in others' shoes can we truly understand their difficulties.","exampleZh":"只有设身处地为他人着想，我们才能真正理解他们的难处。","note":"习语，shoe 须用复数；论证同理心最常用。"},{"en":"respect the elderly and care for the young","basic":"","zh":"尊老爱幼","pos":"phr.","type":"phrase","example":"Respecting the elderly and caring for the young is a tradition deeply rooted in Chinese culture.","exampleZh":"尊老爱幼是深深植根于中国文化中的传统。","note":"作主语时改为动名词，谓语用单数。"},{"en":"a sense of responsibility","basic":"","zh":"责任感","pos":"phr.","type":"phrase","example":"A strong sense of responsibility drives ordinary people to do extraordinary things.","exampleZh":"强烈的责任感驱使平凡的人做出不平凡的事。","note":"常用 a sense of 结构；搭配 shoulder one's duty。"},{"en":"shoulder one's duty","basic":"","zh":"担负起责任；承担义务","pos":"phr.","type":"phrase","example":"Young people should shoulder their duty to care for the aging generation.","exampleZh":"年轻人应担负起照顾老龄一代的责任。","note":"shoulder 作动词意为承担，常搭配 duty、burden。"},{"en":"contribute to society","basic":"","zh":"为社会作贡献","pos":"phr.","type":"phrase","example":"Everyone can contribute to society, no matter how modest his or her ability is.","exampleZh":"无论能力多么微薄，每个人都能为社会作贡献。","note":"to 是介词；亦作 make contributions to。"},{"en":"a harmonious society","basic":"","zh":"和谐社会","pos":"phr.","type":"phrase","example":"A harmonious society rests on mutual trust rather than on strict surveillance.","exampleZh":"和谐社会建立在相互信任之上，而非严密监控之上。","note":"常作主语或宾语，搭配 build a harmonious society。"},{"en":"the authorities concerned","basic":"","zh":"有关当局；相关部门","pos":"phr.","type":"phrase","example":"The authorities concerned should step up supervision over food safety in school canteens.","exampleZh":"有关当局应加强对学校食堂食品安全的监管。","note":"固定说法；concerned 必须后置，作主语提建议用。"},{"en":"enact stricter regulations","basic":"","zh":"制定更严格的法规","pos":"phr.","type":"phrase","example":"To protect personal data, the government should enact stricter regulations on its collection.","exampleZh":"为保护个人数据，政府应对数据收集制定更严格的法规。","note":"enact 用于法规；常与 impose penalties 连用。"},{"en":"take effective measures","basic":"","zh":"采取有效措施","pos":"phr.","type":"phrase","example":"To reduce littering, the city must take effective measures rather than rely on slogans.","exampleZh":"为减少乱扔垃圾，城市必须采取有效措施，而不是依赖标语。","note":"后接不定式 to do；也可用 take concrete steps。"},{"en":"It is high time that we took concrete measures to ___.","basic":"","zh":"该是我们采取具体措施去…的时候了。","pos":"—","type":"pattern","example":"It is high time that we took concrete measures to curb uncivilized conduct in public.","exampleZh":"该是我们采取具体措施遏制公共场所不文明行为的时候了。","note":"虚拟语气，从句谓语用过去式；结尾段首选。"},{"en":"A harmonious society can hardly be built without ___.","basic":"","zh":"没有…，和谐社会几乎无法建成。","pos":"—","type":"pattern","example":"A harmonious society can hardly be built without the joint efforts of every citizen.","exampleZh":"没有每个公民的共同努力，和谐社会几乎无法建成。","note":"双重否定表强调，without 后接名词或动名词。"},{"en":"___ should set a good example to others by ___.","basic":"","zh":"…应以身作则，通过…为他人树立榜样。","pos":"—","type":"pattern","example":"Public figures should set a good example to others by observing basic social etiquette.","exampleZh":"公众人物应以身作则，遵守基本的社会礼仪。","note":"by 后接动名词；也可用 take the lead in doing。"},{"en":"There is no denying that ___ has become a matter of public concern.","basic":"","zh":"不可否认，…已成为公众关注的问题。","pos":"—","type":"pattern","example":"There is no denying that the decline of public morality has become a matter of public concern.","exampleZh":"不可否认，公共道德的滑坡已成为公众关注的问题。","note":"万能开头句，从句用现在完成时，不说 I think。"},{"en":"Only when every citizen ___ can we ___.","basic":"","zh":"只有当每个公民…，我们才能…。","pos":"—","type":"pattern","example":"Only when every citizen behaves with civility can we build a truly harmonious community.","exampleZh":"只有每个公民都以礼行事，我们才能建设真正和谐的社区。","note":"only when 从句置句首时主句倒装；结尾段呼吁用。"},{"en":"It is everyone's duty to ___.","basic":"","zh":"…是每个人的责任。","pos":"—","type":"pattern","example":"It is everyone's duty to protect public facilities as if they were their own property.","exampleZh":"保护公共设施就像保护自己的财产一样，是每个人的责任。","note":"it 为形式主语，真正主语是不定式。"},{"en":"Whether we can ___ depends largely on ___.","basic":"","zh":"我们能否…，很大程度上取决于…。","pos":"—","type":"pattern","example":"Whether we can reverse this trend depends largely on the choices we make today.","exampleZh":"我们能否扭转这一趋势，很大程度上取决于我们今天所做的选择。","n
