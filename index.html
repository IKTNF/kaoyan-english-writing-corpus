ich human survival ultimately depends.","exampleZh":"保护生物多样性意味着保护人类生存最终所依赖的脆弱生命网络。","note":"不可数；配preserve/threaten；生态题高分词。"},{"en":"ecological balance","basic":"","zh":"生态平衡","pos":"n.","type":"phrase","example":"Unrestrained logging has upset the ecological balance of the region and triggered frequent floods.","exampleZh":"无节制的伐木破坏了该地区的生态平衡，并引发了频繁的洪水。","note":"动词配upset/disturb/restore；勿用break。"},{"en":"deforestation","basic":"","zh":"森林砍伐；滥伐森林","pos":"n.","type":"word","example":"Widespread deforestation not only destroys wildlife habitats but also aggravates soil erosion and desertification.","exampleZh":"大范围的森林砍伐不仅破坏野生动物栖息地，还加剧了水土流失和荒漠化。","note":"不可数；可加large-scale修饰；反义afforestation。"},{"en":"resource depletion","basic":"","zh":"资源枯竭","pos":"n.","type":"phrase","example":"Resource depletion has become a pressing concern as the world's population and consumption keep growing.","exampleZh":"随着世界人口与消费不断增长，资源枯竭已成为一个紧迫的问题。","note":"配accelerate/address resource depletion。"},{"en":"exhaust","basic":"","zh":"耗尽；用尽","pos":"vt.","type":"word","example":"If we continue to exhaust natural resources at this speed, future generations will pay a heavy price.","exampleZh":"如果我们继续以这种速度耗尽自然资源，子孙后代将付出沉重代价。","note":"及物，配exhaust resources；勿混exhausted。"},{"en":"renewable energy","basic":"","zh":"可再生能源","pos":"n.","type":"phrase","example":"Investing in renewable energy such as wind and solar power reduces our dependence on fossil fuels.","exampleZh":"投资风能、太阳能等可再生能源可以减少我们对化石燃料的依赖。","note":"配develop/promote；反义fossil fuels。"},{"en":"conserve","basic":"","zh":"节约；保护（资源）","pos":"vt.","type":"word","example":"Simple habits like turning off unused lights can conserve electricity and ease the strain on power grids.","exampleZh":"随手关灯这类简单习惯就能节约用电，缓解电网压力。","note":"conserve节约资源，preserve原样保存。"},{"en":"sustainable development","basic":"","zh":"可持续发展","pos":"n.","type":"phrase","example":"Sustainable development seeks to meet present needs without compromising the ability of future generations to meet theirs.","exampleZh":"可持续发展力求在不妨碍后代满足其需要的前提下满足当代人的需要。","note":"配promote/pursue；末段升华主题高分表达。"},{"en":"energy-efficient","basic":"","zh":"节能的；高能效的","pos":"adj.","type":"word","example":"Energy-efficient household appliances cut both electricity bills and carbon emissions in the long run.","exampleZh":"从长远看，节能家电既能减少电费，也能降低碳排放。","note":"连字符不可省，多作定语；名词energy efficiency。"},{"en":"low-carbon lifestyle","basic":"","zh":"低碳生活方式","pos":"n.","type":"phrase","example":"Adopting a low-carbon lifestyle means choosing public transport, reusing shopping bags and saving power.","exampleZh":"践行低碳生活意味着选择公共交通、重复使用购物袋以及节约用电。","note":"配adopt/lead a low-carbon lifestyle。"},{"en":"carbon footprint","basic":"","zh":"碳足迹","pos":"n.","type":"phrase","example":"Every flight we take enlarges our carbon footprint, which quietly accelerates climate change worldwide.","exampleZh":"我们每坐一次飞机都会扩大自己的碳足迹，而它在悄然加速全球气候变化。","note":"配enlarge/reduce；勿写成carbon print。"},{"en":"green commuting","basic":"","zh":"绿色出行","pos":"n.","type":"phrase","example":"Green commuting by bike or subway not only eases traffic jams but also improves urban air quality.","exampleZh":"骑自行车或乘地铁等绿色出行不仅缓解交通拥堵，还能改善城市空气质量。","note":"配green travel换用；作主语谓语用单数。"},{"en":"public transport","basic":"","zh":"公共交通","pos":"n.","type":"phrase","example":"Encouraging residents to take public transport is among the most practical ways to curb emissions.","exampleZh":"鼓励居民乘坐公共交通是抑制碳排放最切实可行的方式之一。","note":"英式不可数；配take/improve；勿加a。"},{"en":"recycle","basic":"","zh":"回收利用","pos":"v.","type":"word","example":"Households that recycle paper, glass and metal significantly reduce the volume of waste sent to landfills.","exampleZh":"回收纸张、玻璃和金属的家庭大大减少了送往垃圾填埋场的垃圾量。","note":"及物，常用be recycled；区分reuse的顺序。"},{"en":"disposable","basic":"","zh":"一次性的；可丢弃的","pos":"adj.","type":"word","example":"The convenience of disposable chopsticks and cups comes at a heavy environmental cost.","exampleZh":"一次性筷子和纸杯带来的便利是以沉重的环境代价换来的。","note":"只作定语；对照reusable；环保高频负面词。"},{"en":"plastic waste","basic":"","zh":"塑料垃圾","pos":"n.","type":"phrase","example":"Mountains of plastic waste drift in the oceans, poisoning marine life and entering the food chain.","exampleZh":"成堆的塑料垃圾漂在海洋中，毒害海洋生物并进入食物链。","note":"不可数；配reduce/ban；可具体为plastic bags。"},{"en":"cut down on","basic":"","zh":"减少；削减","pos":"phr.","type":"phrase","example":"Ordinary citizens can cut down on plastic bags by carrying a cloth bag when shopping.","exampleZh":"普通市民购物时自带布袋，就能减少塑料袋的使用。","note":"后接名词或动名词；勿与cut down混用。"},{"en":"waste sorting","basic":"","zh":"垃圾分类","pos":"n.","type":"phrase","example":"Mandatory waste sorting has turned garbage disposal into a daily routine in many Chinese cities.","exampleZh":"强制垃圾分类已使垃圾处理成为许多中国城市的日常事项。","note":"英式sorting，美式garbage classification。"},{"en":"waste disposal","basic":"","zh":"垃圾处理；废弃物处置","pos":"n.","type":"phrase","example":"Improper waste disposal contaminates soil and groundwater, yet landfill sites are running out of space.","exampleZh":"不当的垃圾处理污染土壤和地下水，而垃圾填埋场却日益饱和。","note":"不可数；配improper/safe；可与recycling并列。"},{"en":"reduce, reuse and recycle","basic":"","zh":"减量、重复使用与回收利用","pos":"phr.","type":"phrase","example":"The three R's—reduce, reuse and recycle—remain the simplest guide to greener daily consumption.","exampleZh":"减量、重复使用和回收这“三个R”，仍是更绿色的日常消费最简单的准则。","note":"常以the three R's引出；顺序不可颠倒。"},{"en":"environmental awareness","basic":"","zh":"环保意识","pos":"n.","type":"phrase","example":"Raising environmental awareness among the young is as vital as passing stricter laws.","exampleZh":"提高年轻人的环保意识与通过更严格的法律同样重要。","note":"配raise/heighten；awareness后接of或that从句。"},{"en":"eco-friendly","basic":"","zh":"环保的；对环境无害的","pos":"adj.","type":"word","example":"Eco-friendly products, though slightly pricier, are winning over consumers with a green conscience.","exampleZh":"环保产品虽略贵，却正赢得有环保良知的消费者的青睐。","note":"连字符不可省；同义environmentally friendly。"},{"en":"environmentally conscious","basic":"","zh":"有环保意识的","pos":"adj.","type":"phrase","example":"Environmentally conscious travellers prefer public transport and refuse single-use plastics on the road.","exampleZh":"有环保意识的旅行者更愿意乘坐公共交通，并在旅途中拒绝一次性塑料制品。","note":"常修饰travellers/consumers；勿漏-ly。"},{"en":"take effective measures","basic":"","zh":"采取有效措施","pos":"phr.","type":"phrase","example":"It is high time that the authorities concerned took effective measures to curb industrial pollution.","exampleZh":"该是有关部门采取有效措施遏制工业污染的时候了。","note":"配take measures to do sth；可换adopt steps。"},{"en":"tighten regulations","basic":"","zh":"收紧监管法规","pos":"phr.","type":"phrase","example":"Tightening regulations on emissions and imposing heavy fines on polluters can deter reckless factories.","exampleZh":"收紧排放法规并对污染者处以重罚，能遏制工厂的肆意行为。","note":"配tighten/enforce，反义loosen；政府责任段。"},{"en":"corporate social responsibility","basic":"","zh":"企业社会责任","pos":"n.","type":"phrase","example":"Beyond seeking profits, enterprises should honour corporate social responsibility by cutting pollution.","exampleZh":"除追求利润外，企业还应通过减少污染来履行社会责任。","note":"缩写CSR；配shoulder/shirk；企业责任段。"},{"en":"the authorities concerned","basic":"","zh":"有关部门","pos":"n.","type":"phrase","example":"The authorities concerned should step up supervision so that green rules are actually enforced.","exampleZh":"有关部门应加强监管，使绿色法规切实得到执行。","note":"concerned后置定语；谓语用复数；治理举措段。"},{"en":"make a difference","basic":"","zh":"起作用；产生影响","pos":"phr.","type":"phrase","example":"Small as our daily efforts may seem, they can make a real difference to the environment.","exampleZh":"我们日常的努力看似微小，却能对环境产生实实在在的影响。","note":"配make a difference to sth，勿漏a。"},{"en":"start with small steps","basic":"","zh":"从小事做起","pos":"phr.","type":"phrase","example":"Instead of waiting for others, we should start with small steps such as saving water at home.","exampleZh":"与其等待他人行动，我们不如从在家节水这样的细节做起。","note":"可与every little bit counts替换；倡议段。"},{"en":"leave a green legacy","basic":"","zh":"留下绿色遗产","pos":"n.","type":"phrase","example":"Planting trees today is how we leave a green legacy to those who come after us.","exampleZh":"今天种下树木，就是我们给后来者留下绿色遗产的方式。","note":"配leave sb a green legacy；结尾呼应代际责任。"},{"en":"overcrowded","basic":"","zh":"过于拥挤的","pos":"adj.","type":"word","example":"Overcrowded scenic spots during the golden week put both the environment and visitors' safety at risk.","exampleZh":"黄金周期间过度拥挤的景区，既危及环境也危及游客的安全。","note":"可作定语或be overcrowded with；旅游图高频。"},{"en":"litter","basic":"","zh":"乱扔垃圾；垃圾","pos":"v.","type":"word","example":"Tourists who litter beaches and mountain trails leave behind damage that takes years to repair.","exampleZh":"在海滩和山间步道上乱扔垃圾的游客，留下的破坏需要多年才能修复。","note":"动词乱扔，名词不可数；配drop litter。"},{"en":"damage the scenery","basic":"","zh":"破坏风景","pos":"phr.","type":"phrase","example":"Graffiti on ancient walls and careless campfires damage the scenery that once drew millions of visitors.","exampleZh":"古墙上的涂鸦和疏忽的篝火毁掉了曾经吸引数百万游客的风景。","note":"也可用spoil the scenery；旅游不文明段。"},{"en":"ecotourism","basic":"","zh":"生态旅游","pos":"n.","type":"word","example":"Ecotourism aims to let visitors enjoy nature while leaving its ecosystems largely undisturbed.","exampleZh":"生态旅游旨在让游客欣赏自然，同时基本不打扰当地的生态系统。","note":"不可数；配promote ecotourism；解决段举措。"},{"en":"responsible travel","basic":"","zh":"负责任的旅行","pos":"n.","type":"phrase","example":"Responsible travel means respecting local customs and keeping our footprints as light as possible.","exampleZh":"负责任的旅行意味着尊重当地习俗，并尽可能减少我们留下的痕迹。","note":"配practise/promote；travel此处不可数。"},{"en":"It is our shared responsibility to ___.","basic":"","zh":"……是我们共同的责任。","pos":"—","type":"pattern","example":"It is our shared responsibility to protect the environment for the generations yet to come.","exampleZh":"为子孙后代保护环境是我们共同的责任。","note":"It作形式主语；to后接动词原形；末段万能句。"},{"en":"If we fail to ___, the consequences will be ___.","basic":"","zh":"如果我们未能……，后果将会……","pos":"—","type":"pattern","example":"If we fail to curb carbon emissions, the consequences will be increasingly severe and costly.","exampleZh":"如果我们不能抑制碳排放，后果将会日益严重且代价高昂。","note":"可填disastrous/irreversible；勿用very bad。"},{"en":"Not until ___ did we realize ___.","basic":"","zh":"直到……我们才意识到……","pos":"—","type":"pattern","example":"Not until the river turned black did we realize how fragile the environment had become.","exampleZh":"直到河水变黑，我们才意识到环境已变得多么脆弱。","note":"否定词置句首，did后接原形；勿写not until...we。"},{"en":"Only by ___ can we ___.","basic":"","zh":"只有通过……，我们才能……","pos":"—","type":"pattern","example":"Only by joining hands can we build an eco-friendly society and leave a green legacy.","exampleZh":"只有携手合作，我们才能建设环保型社会并留下绿色遗产。","note":"Only加状语置句首要倒装；后接动名词。"},{"en":"So severe has ___ become that ___.","basic":"","zh":"……已变得如此严重，以至于……","pos":"—","type":"pattern","example":"So severe has environmental pollution become that no single country can tackle it alone.","exampleZh":"环境污染已变得如此严重，以至于任何国家都无法单独解决。","note":"So置句首倒装；that引导结果状语从句。"},{"en":"We do not inherit the earth from our ancestors; we borrow it from our children.","basic":"","zh":"我们并非从祖先那里继承地球，而是从子孙后代那里借来的。","pos":"—","type":"proverb","example":"As an old saying goes, we do not inherit the earth from our ancestors; we borrow it from our children.","exampleZh":"正如一句老话所说，我们并非从祖先那里继承地球，而是从子孙后代那里借来的。","note":"常归于美国原住民谚语；适合结尾引语。"},{"en":"The earth provides enough for everyone's need, but not for everyone's greed.","basic":"","zh":"地球足以满足每个人的需要，却满足不了每个人的贪欲。","pos":"—","type":"proverb","example":"Gandhi warned that the earth provides enough for everyone's need but not for everyone's greed.","exampleZh":"甘地告诫说，地球足以满足每个人的需要，却满足不了每个人的贪欲。","note":"出自甘地；用于资源浪费与过度消费题。"},{"en":"When the well is dry, we know the worth of water.","basic":"","zh":"井水干涸时，我们才知道水的价值。","pos":"—","type":"proverb","example":"As Benjamin Franklin put it, when the well is dry, we know the worth of water.","exampleZh":"正如本杰明·富兰克林所言，井水干涸时，我们才知道水的价值。","note":"出自《穷理查年鉴》；水资源短缺类适用。"}],"file":"05-environment.json"},{"id":"culture","title":"文化传承与交流","emoji":"🏮","group":"大作文·主题语料","desc":"文化遗产保护、文化自信与跨文化交流的高分表达，适用于图画作文论证与结尾升华段。","entries":[{"en":"cultural heritage","basic":"","zh":"文化遗产","pos":"n.","type":"word","example":"The ancient town stands as a living testimony to our rich cultural heritage.","exampleZh":"这座古镇是我们丰富文化遗产的鲜活见证。","note":"常与 preserve, protect, hand down 搭配；首段点题与结尾升华均适用。"},{"en":"intangible cultural heritage","basic":"","zh":"非物质文化遗产","pos":"n.","type":"word","example":"Paper-cutting was added to the UNESCO list of intangible cultural heritage in 2009.","exampleZh":"剪纸于2009年被列入联合国教科文组织非物质文化遗产名录。","note":"常与 be listed as, be inscribed on 连用；不可数，首段点题好用。"},{"en":"time-honored","basic":"","zh":"历史悠久的，久负盛名的","pos":"adj.","type":"word","example":"This time-honored craft has been handed down through more than twenty generations.","exampleZh":"这门历史悠久的技艺已传承二十多代。","note":"多作定语修饰 craft, brand, tradition；很少作表语。"},{"en":"centuries-old","basic":"","zh":"延续数百年的","pos":"adj.","type":"word","example":"The centuries-old tradition of dragon boat racing still draws huge crowds today.","exampleZh":"延续数百年的赛龙舟传统如今仍吸引着大批人群。","note":"作定语须带连字符；若指多个世纪用 centuries-old，勿写 century-old。"},{"en":"ancestral wisdom","basic":"","zh":"祖先的智慧","pos":"n.","type":"word","example":"Ancestral wisdom is embedded in every line of these ancient farming manuals.","exampleZh":"祖先的智慧蕴含在这些古代农书的字里行间。","note":"抽象不可数，前可加 the；与 draw on, inherit 连用表汲取传承。"},{"en":"legacy","basic":"","zh":"遗产，遗留的财富","pos":"n.","type":"word","example":"We have inherited a precious legacy from those who came before us.","exampleZh":"我们从先辈那里继承了一笔宝贵的遗产。","note":"常与 leave, inherit, carry on 搭配；可替换 heritage 避免重复。"},{"en":"be on the verge of extinction","basic":"","zh":"濒临消亡","pos":"phr.","type":"phrase","example":"Dozens of regional dialects are now on the verge of extinction.","exampleZh":"数十种地方方言如今濒临消亡。","note":"后接名词或动名词；verge 前定冠词 the 不可省略。"},{"en":"preserve","basic":"","zh":"保护，保存","pos":"vt.","type":"word","example":"Preserving traditional villages calls for both funding and public awareness.","exampleZh":"保护传统村落既需要资金，也需要公众意识。","note":"名词形式 preservation；常接 cultural relics, heritage 等词，用于对策段。"},{"en":"safeguard","basic":"","zh":"捍卫，保护","pos":"vt.","type":"word","example":"Stricter laws are needed to safeguard our cultural relics from destruction.","exampleZh":"需要更严格的法律来保护文物免遭破坏。","note":"比 protect 更正式，多用于法律政策语境；常用 safeguard sth from sth。"},{"en":"inherit","basic":"","zh":"继承，传承","pos":"vt.","type":"word","example":"Young people should inherit not only the skills but the spirit behind them.","exampleZh":"年轻人不仅应继承技艺，更应继承技艺背后的精神。","note":"搭配 inherit sth from sb，不可写成 inherit to sb；用于传承话题。"},{"en":"pass down from generation to generation","basic":"","zh":"世代相传","pos":"phr.","type":"phrase","example":"The folk song has been passed down from generation to generation by word of mouth.","exampleZh":"这首民歌通过口耳相传世代流传。","note":"常用被动 be passed down；也可换成 hand down 保持变化。"},{"en":"carry forward","basic":"","zh":"发扬，传承下去","pos":"phr.","type":"phrase","example":"It is our duty to carry forward the fine traditions of our nation.","exampleZh":"传承民族的优良传统是我们的责任。","note":"及物，后接 tradition, spirit, culture；段末呼吁句高频。"},{"en":"revitalize","basic":"","zh":"使复兴，使重获生机","pos":"vt.","type":"word","example":"Short videos have helped revitalize traditional opera among young audiences.","exampleZh":"短视频帮助传统戏曲在年轻观众中重获生机。","note":"名词为 revitalization；主语多为 policy, technology，突出手段与效果。"},{"en":"rejuvenate","basic":"","zh":"使焕发活力","pos":"vt.","type":"word","example":"Creative marketing has rejuvenated several long-established Chinese brands.","exampleZh":"创意营销让多个老字号中国品牌焕发活力。","note":"强调恢复青春活力，可替换 revitalize；注意重音在第二音节。"},{"en":"cultural confidence","basic":"","zh":"文化自信","pos":"n.","type":"word","example":"A nation with cultural confidence embraces foreign influences without losing itself.","exampleZh":"拥有文化自信的民族能接纳外来影响而不迷失自我。","note":"不可数；常与 build, strengthen, boost 搭配；结尾升华段好用。"},{"en":"cultural identity","basic":"","zh":"文化认同，文化身份","pos":"n.","type":"word","example":"Language lies at the very core of a nation's cultural identity.","exampleZh":"语言是一个民族文化认同的核心所在。","note":"可加 a 或物主代词；常与 preserve, strengthen, lose 连用。"},{"en":"take pride in","basic":"","zh":"为……感到自豪","pos":"phr.","type":"phrase","example":"We take pride in the remarkable achievements of our ancient civilization.","exampleZh":"我们为古代文明的卓越成就感到自豪。","note":"主语须为人；等于 be proud of 但更正式，勿写成 take pride of。"},{"en":"national pride","basic":"","zh":"民族自豪感","pos":"n.","type":"word","example":"The successful mission stirred a strong sense of national pride nationwide.","exampleZh":"这次任务的成功在全国激起了强烈的民族自豪感。","note":"常用 a sense of national pride；与 stir, awaken 搭配，用于结尾升华。"},{"en":"cultural exchange","basic":"","zh":"文化交流","pos":"n.","type":"word","example":"Cultural exchange broadens the horizons of both sides and dissolves prejudice.","exampleZh":"文化交流拓宽双方视野，并消解偏见。","note":"多作不可数；常与 promote, facilitate 搭配，可作交流类中心句。"},{"en":"cross-cultural communication","basic":"","zh":"跨文化交际","pos":"n.","type":"word","example":"Cross-cultural communication calls for tolerance, empathy and a willingness to listen.","exampleZh":"跨文化交际需要宽容、共情和倾听的意愿。","note":"不可数；形容词用 cross-cultural，勿写成 cross-culture。"},{"en":"cultural diversity","basic":"","zh":"文化多样性","pos":"n.","type":"word","example":"Cultural diversity should be celebrated as a source of vitality rather than a threat.","exampleZh":"我们应把文化多样性视为活力之源而非威胁来珍视。","note":"不可数；常与 respect, protect, appreciate 搭配；对比句好用。"},{"en":"cultural integration","basic":"","zh":"文化融合","pos":"n.","type":"word","example":"Cultural integration does not mean abandoning the roots of one's own tradition.","exampleZh":"文化融合并不意味着抛弃自身传统的根基。","note":"也可用 cultural blending；后接 of 或 with，注意与融合对象搭配。"},{"en":"mutual understanding","basic":"","zh":"相互理解","pos":"n.","type":"word","example":"Mutual understanding is the cornerstone of lasting friendship between nations.","exampleZh":"相互理解是国家间持久友谊的基石。","note":"不可数；常与 promote, foster, enhance 搭配，比 understand each other 正式。"},{"en":"bridge the gap","basic":"","zh":"弥合分歧，消除隔阂","pos":"phr.","type":"phrase","example":"Cultural festivals help bridge the gap between the East and the West.","exampleZh":"文化节能帮助弥合东西方之间的隔阂。","note":"常用结构 bridge the gap between A and B，也可用于代际之间。"},{"en":"culture shock","basic":"","zh":"文化冲击","pos":"n.","type":"word","example":"Many students experience culture shock during their first months abroad.","exampleZh":"许多学生在出国头几个月会经历文化冲击。","note":"常用 experience, get over culture shock；前一般不加冠词，作举例素材。"},{"en":"go global","basic":"","zh":"走向世界，全球化","pos":"phr.","type":"phrase","example":"More and more Chinese cultural products are going global with remarkable success.","exampleZh":"越来越多的中国文化产品正成功走向世界。","note":"不及物，后不接宾语；多用进行时或完成时。"},{"en":"soft power","basic":"","zh":"软实力","pos":"n.","type":"word","example":"Cultural soft power matters as much as economic strength in today's world.","exampleZh":"当今世界，文化软实力与经济实力同等重要。","note":"不可数；常与 enhance, build, project 搭配，常与 hard power 对照。"},{"en":"win international recognition","basic":"","zh":"赢得国际认可","pos":"phr.","type":"phrase","example":"The documentary won international recognition for its poetic portrayal of rural life.","exampleZh":"这部纪录片因诗意地描绘乡村生活而赢得国际认可。","note":"用 for 引出原因；也可换成 gain 或 earn recognition。"},{"en":"Peking Opera","basic":"","zh":"京剧","pos":"n.","type":"word","example":"Peking Opera combines singing, dancing, mime and acrobatics in one art form.","exampleZh":"京剧将唱、做、念、打融于一种艺术形式之中。","note":"传统译名用 Peking Opera，作专有名词首字母大写，前加 the。"},{"en":"calligraphy","basic":"","zh":"书法","pos":"n.","type":"word","example":"Practising calligraphy calms the mind and sharpens one's sense of beauty.","exampleZh":"练习书法能静心并提升审美感受力。","note":"不可数；英式拼写 practising；写作中可写 Chinese calligraphy 更明确。"},{"en":"martial arts","basic":"","zh":"武术","pos":"n.","type":"word","example":"Chinese martial arts embody both physical strength and moral discipline.","exampleZh":"中华武术既体现体魄之力，也体现道德修养。","note":"惯用复数；作定语可说 martial arts film 或 martial arts culture。"},{"en":"dragon boat racing","basic":"","zh":"赛龙舟","pos":"n.","type":"word","example":"Dragon boat racing is held every year to commemorate the poet Qu Yuan.","exampleZh":"每年举行赛龙舟以纪念诗人屈原。","note":"不可数，谓语用单数；常作传统节日文化的举例素材。"},{"en":"paper-cutting","basic":"","zh":"剪纸","pos":"n.","type":"word","example":"Paper-cutting turns a plain sheet of red paper into an exquisite work of art.","exampleZh":"剪纸把一张普通的红纸变成精美的艺术品。","note":"不可数；连字符不可省；常作为非遗代表作举例。"},{"en":"embroidery","basic":"","zh":"刺绣","pos":"n.","type":"word","example":"Suzhou embroidery is renowned for its delicacy and vivid coloring.","exampleZh":"苏绣以其精致细腻和色彩鲜活而闻名。","note":"不可数；be renowned for 是高分搭配，可替换 be famous for。"},{"en":"tea culture","basic":"","zh":"茶文化","pos":"n.","type":"word","example":"Chinese tea culture reflects a lasting pursuit of harmony and serenity.","exampleZh":"中国茶文化体现着对和谐与宁静的持久追求。","note":"不可数；常与 inherit, promote 搭配，可与 coffee culture 对照。"},{"en":"integrate tradition with modernity","basic":"","zh":"将传统与现代相融合","pos":"phr.","type":"phrase","example":"Good designers integrate tradition with modernity instead of copying the past.","exampleZh":"优秀的设计师将传统与现代融合，而非照搬过去。","note":"结构为 integrate A with B；也可用 blend tradition and modernity 替换，用于融合类论证。"},{"en":"inject new vitality into","basic":"","zh":"为……注入新活力","pos":"phr.","type":"phrase","example":"Digital technology has injected new vitality into museums and ancient towns.","exampleZh":"数字技术为博物馆和古镇注入了新的活力。","note":"结构为 inject sth into sth，不可写成 inject sth to sth，用于对策句。"},{"en":"keep up with the times","basic":"","zh":"与时俱进","pos":"phr.","type":"phrase","example":"Even classical art forms must keep up with the times to survive.","exampleZh":"即便是古典艺术形式也必须与时俱进才能生存。","note":"主语多为文化形式、观念或企业；比 follow the trend 更正式。"},{"en":"be well-versed in","basic":"","zh":"精通，熟知","pos":"phr.","type":"phrase","example":"A cultured person should be well-versed in both Chinese and Western classics.","exampleZh":"一个有文化修养的人应精通中西经典。","note":"介词固定用 in；程度强于 be familiar with，多用于修饰人。"},{"en":"refine one's mind","basic":"","zh":"陶冶心性","pos":"phr.","type":"phrase","example":"Reading classical poetry refines one's mind and elevates one's taste.","exampleZh":"阅读古典诗词能陶冶心性、提升品位。","note":"主语多为阅读或艺术等抽象活动；宾语常用 one's mind 或 taste。"},{"en":"enlightening","basic":"","zh":"富有启发的，令人开悟的","pos":"adj.","type":"word","example":"The documentary offers an enlightening account of ancient rituals and beliefs.","exampleZh":"这部纪录片对古代仪式与信仰作了富有启发的讲述。","note":"可作定语或表语；修饰 book, lecture, experience，常与 offer 连用。"},{"en":"Cultural heritage is not a relic of the past but a living ___ that still shapes us.","basic":"","zh":"文化遗产不是过去的遗物，而是至今仍在塑造我们的鲜活___。","pos":"—","type":"pattern","example":"Cultural heritage is not a relic of the past but a living force that still shapes us.","exampleZh":"文化遗产不是过去的遗物，而是至今仍在塑造我们的鲜活力量。","note":"用于首段或结尾升华；空缺处填 force, tradition, memory 等抽象名词。"},{"en":"It is ___ that keeps our culture alive.","basic":"","zh":"正是___让我们的文化得以延续。","pos":"—","type":"pattern","example":"It is the younger generation that keeps our culture alive.","exampleZh":"正是年轻一代让我们的文化得以延续。","note":"强调句型；空缺处填名词或动名词短语，被强调部分为复数时仍用 that。"},{"en":"Only by ___ can we pass our cultural treasures on to the next generation.","basic":"","zh":"只有通过___，我们才能把文化瑰宝传给下一代。","pos":"—","type":"pattern","example":"Only by respecting tradition can we pass our cultural treasures on to the next generation.","exampleZh":"只有尊重传统，我们才能把文化瑰宝传给下一代。","note":"Only by 后接动名词，主句须部分倒装，用 can, will 等情态动词。"},{"en":"What makes a culture enduring is not ___ but ___.","basic":"","zh":"让一种文化历久弥新的不是___，而是___。","pos":"—","type":"pattern","example":"What makes a culture enduring is not its wealth but its willingness to open up.","exampleZh":"让一种文化历久弥新的不是财富，而是它开放包容的意愿。","note":"主语从句作主语，谓语用单数 is；两个空缺处词性必须一致。"},{"en":"Exchanges between civilizations should be built on equality and mutual respect rather than ___.","basic":"","zh":"文明间的交流应建立在平等与相互尊重之上，而不是___。","pos":"—","type":"pattern","example":"Exchanges between civilizations should be built on equality and mutual respect rather than arrogance.","exampleZh":"文明间的交流应建立在平等与相互尊重之上，而不是傲慢。","note":"常用于交流类结尾；rather than 前后词性或形式须一致。"},{"en":"A people without the knowledge of their past history, origin and culture is like a tree without roots.","basic":"","zh":"一个不了解自身历史、渊源与文化的民族，就像一棵没有根的树。","pos":"—","type":"proverb","example":"A people without the knowledge of their past history, origin and culture is like a tree without roots.","exampleZh":"一个不了解自身历史、渊源与文化的民族，就像一棵没有根的树。","note":"出处：马库斯·加维；适用于文化遗产、文化自信类开头或结尾。"},{"en":"A nation's culture resides in the hearts and in the soul of its people.","basic":"","zh":"一个民族的文化存在于其人民的心灵与灵魂之中。","pos":"—","type":"proverb","example":"A nation's culture resides in the hearts and in the soul of its people.","exampleZh":"一个民族的文化存在于其人民的心灵与灵魂之中。","note":"出处：甘地；适用于文化自信、文化交流类收尾句。"},{"en":"When in Rome, do as the Romans do.","basic":"","zh":"入乡随俗。","pos":"—","type":"proverb","example":"When in Rome, do as the Romans do, and respect local customs while travelling.","exampleZh":"入乡随俗，旅行时要尊重当地风俗。","note":"英语谚语；适用于跨文化适应类，举例或总结均可。"},{"en":"Study the past if you would define the future.","basic":"","zh":"若想定义未来，就要研究过去。","pos":"—","type":"proverb","example":"Study the past if you would define the future, as tradition lights our way forward.","exampleZh":"若想定义未来，就要研究过去，因为传统照亮我们前行的路。","note":"常归于孔子；适用于文化传承类结尾，与尊重传统相呼应。"}],"file":"06-culture.json"},{"id":"health","title":"健康与生活方式","emoji":"💪","group":"大作文·主题语料","desc":"涵盖身体健康、作息睡眠、心理压力、劳逸平衡、不良习惯与健康倡导的考场表达","entries":[{"en":"physical fitness","basic":"","zh":"身体健康；体能","pos":"n.","type":"phrase","example":"Regular jogging and swimming are effective ways to build physical fitness and relieve daily tension.","exampleZh":"经常慢跑和游泳是增强体能、缓解日常紧张的有效方式。","note":"不可数；配build/maintain；与mental health对举。"},{"en":"well-being","basic":"","zh":"健康幸福；福祉","pos":"n.","type":"word","example":"A balanced diet and enough sleep contribute greatly to our physical and mental well-being.","exampleZh":"均衡饮食和充足睡眠对我们的身心健康大有裨益。","note":"不可数；配promote/undermine well-being。"},{"en":"in good shape","basic":"","zh":"身体状况良好","pos":"phr.","type":"phrase","example":"Despite his age, my grandfather stays in good shape by walking five kilometres every morning.","exampleZh":"尽管年纪不小，我祖父每天早晨步行五公里，身体保持得很好。","note":"配keep/stay in good shape；反义out of shape。"},{"en":"workout","basic":"","zh":"锻炼；健身训练","pos":"n.","type":"word","example":"A thirty-minute workout three times a week can work wonders for your energy level.","exampleZh":"每周三次、每次三十分钟的锻炼就能显著改善你的精力状况。","note":"可数，复数workouts；动词分开写work out。"},{"en":"exercise regularly","basic":"","zh":"规律锻炼","pos":"phr.","type":"phrase","example":"Those who exercise regularly are far less likely to be troubled by chronic diseases.","exampleZh":"经常锻炼的人患慢性病的可能性要小得多。","note":"副词regularly后置；可用take regular exercise。"},{"en":"sedentary","basic":"","zh":"久坐不动的","pos":"adj.","type":"word","example":"Office workers tend to be sedentary, sitting in front of screens for over eight hours daily.","exampleZh":"上班族往往久坐不动，每天在屏幕前坐上八个多小时。","note":"作表语或定语；与physically active对照。"},{"en":"sedentary lifestyle","basic":"","zh":"久坐不动的生活方式","pos":"n.","type":"phrase","example":"A sedentary lifestyle, combined with junk food, has fuelled the rise of obesity among teenagers.","exampleZh":"久坐不动的生活方式加上垃圾食品，助推了青少年肥胖率的上升。","note":"配lead a sedentary lifestyle；谓语用单数。"},{"en":"obesity","basic":"","zh":"肥胖","pos":"n.","type":"word","example":"Obesity has become a public health concern, especially among children who rarely play outdoors.","exampleZh":"肥胖已成为公众健康问题，在很少户外活动的儿童中尤为突出。","note":"不可数；配curb rising obesity；形容人用obese。"},{"en":"balanced diet","basic":"","zh":"均衡饮食","pos":"n.","type":"phrase","example":"Keeping a balanced diet means eating more vegetables and cutting down on sugary drinks.","exampleZh":"保持均衡饮食意味着多吃蔬菜、少喝含糖饮料。","note":"配keep a balanced diet；冠词a不可省。"},{"en":"nutrition","basic":"","zh":"营养","pos":"n.","type":"word","example":"Good nutrition in childhood lays the foundation for a lifetime of sound health.","exampleZh":"童年时期良好的营养为一生的健康奠定基础。","note":"不可数；配good nutrition；勿混nutrient。"},{"en":"junk food","basic":"","zh":"垃圾食品","pos":"n.","type":"phrase","example":"Addicted to junk food, many students ignore vegetables and skip proper meals altogether.","exampleZh":"许多学生沉迷垃圾食品，不吃蔬菜，甚至完全不吃正餐。","note":"不可数；配be addicted to junk food。"},{"en":"skip breakfast","basic":"","zh":"不吃早餐","pos":"phr.","type":"phrase","example":"Students who skip breakfast often find it hard to concentrate on morning classes.","exampleZh":"不吃早餐的学生常常难以在上午的课堂上集中注意力。","note":"skip意为略过；配skip meals；三单加s。"},{"en":"stay up late","basic":"","zh":"熬夜","pos":"phr.","type":"phrase","example":"Staying up late to scroll through phones ruins both our sleep quality and our mood.","exampleZh":"熬夜刷手机既损害我们的睡眠质量，也破坏我们的情绪。","note":"无被动；动名词作主语时谓语用单数。"},{"en":"burn the midnight oil","basic":"","zh":"熬夜苦干；开夜车","pos":"phr.","type":"phrase","example":"Many candidates burn the midnight oil before exams, only to feel exhausted afterwards.","exampleZh":"许多考生考前熬夜苦读，结果事后却疲惫不堪。","note":"习语，oil前用the；only to do表意外结果。"},{"en":"irregular hours","basic":"","zh":"不规律的作息时间","pos":"n.","type":"phrase","example":"Irregular hours have left many young professionals constantly tired and short of energy.","exampleZh":"作息不规律使许多年轻职场人士长期疲惫、精力不足。","note":"常用复数；配work irregular hours。"},{"en":"adequate sleep","basic":"","zh":"充足的睡眠","pos":"n.","type":"phrase","example":"Adequate sleep is not a luxury but a prerequisite for memory and clear thinking.","exampleZh":"充足的睡眠不是奢侈品，而是记忆力和清晰思维的前提。","note":"比enough书面；配get adequate sleep。"},{"en":"sleep deprivation","basic":"","zh":"睡眠不足；睡眠剥夺","pos":"n.","type":"phrase","example":"Long-term sleep deprivation impairs judgement and weakens the body's immune system.","exampleZh":"长期睡眠不足会损害判断力，并削弱人体的免疫系统。","note":"不可数；配suffer from；注意deprive sb of。"},{"en":"keep a regular routine","basic":"","zh":"保持规律作息","pos":"phr.","type":"phrase","example":"Keeping a regular routine helps us stay energetic and keeps our stress under control.","exampleZh":"保持规律的作息有助于我们保持精力充沛，并将压力控制在可控范围内。","note":"routine指作息；可换keep regular hours。"},{"en":"mental health","basic":"","zh":"心理健康","pos":"n.","type":"phrase","example":"Universities are paying more attention to students' mental health than ever before.","exampleZh":"高校比以往任何时候都更加关注学生的心理健康。","note":"不可数；配safeguard；与physical health对举。"},{"en":"psychological well-being","basic":"","zh":"心理健康状态","pos":"n.","type":"phrase","example":"Leisure activities and honest talks with friends safeguard our psychological well-being.","exampleZh":"休闲活动和与朋友的坦诚交谈能维护我们的心理健康。","note":"比mental health书面；注意拼写psychological。"},{"en":"relieve stress","basic":"","zh":"缓解压力","pos":"phr.","type":"phrase","example":"Regular exercise and hobbies are healthy ways to relieve stress after a long workday.","exampleZh":"经常锻炼和培养爱好是漫长工作日之后缓解压力的健康方式。","note":"配relieve/ease stress；名词形式stress relief。"},{"en":"unwind","basic":"","zh":"放松；缓解紧张","pos":"v.","type":"word","example":"After a week of intense study, a walk in the park helps me unwind completely.","exampleZh":"经过一周紧张的学习，在公园散步能让我彻底放松下来。","note":"不及物，无被动；比relax更生动。"},{"en":"be overwhelmed by","basic":"","zh":"被……压得喘不过气","pos":"phr.","type":"phrase","example":"Students are easily overwhelmed by academic pressure when final exams draw near.","exampleZh":"期末考试临近时，学生很容易被学业压力压得喘不过气。","note":"被动结构，介词用by；也可换with。"},{"en":"anxiety","basic":"","zh":"焦虑","pos":"n.","type":"word","example":"Excessive anxiety about grades can undermine both performance and confidence.","exampleZh":"对成绩的过度焦虑会同时损害表现和自信。","note":"泛指不可数；配suffer from anxiety。"},{"en":"depression","basic":"","zh":"抑郁；沮丧","pos":"n.","type":"word","example":"Loneliness and constant pressure may lead to depression if no one lends a hand.","exampleZh":"如果没有人伸出援手，孤独和持续的压力可能导致抑郁。","note":"不可数；配suffer from depression；慎用程度词。"},{"en":"burnout","basic":"","zh":"身心俱疲；职业倦怠","pos":"n.","type":"word","example":"Working overtime for months on end left him on the verge of burnout.","exampleZh":"连续数月加班使他濒临身心俱疲的崩溃边缘。","note":"不可数；on the verge of后接名词。"},{"en":"work-life balance","basic":"","zh":"工作与生活的平衡","pos":"n.","type":"phrase","example":"A healthy work-life balance enables employees to stay productive and content.","exampleZh":"健康的工作与生活平衡能让员工保持高效与满足。","note":"配strike a balance；作主语谓语用单数。"},{"en":"strike a balance between work and rest","basic":"","zh":"做到劳逸结合","pos":"phr.","type":"phrase","example":"Only by striking a balance between work and rest can we sustain long-term productivity.","exampleZh":"只有做到劳逸结合，我们才能保持长期的效率。","note":"介词用between...and；倒装句中用动名词。"},{"en":"leisure activities","basic":"","zh":"休闲活动","pos":"n.","type":"phrase","example":"Wholesome leisure activities recharge our batteries and broaden our horizons.","exampleZh":"有益身心的休闲活动能让我们恢复精力，也能开阔眼界。","note":"泛指用复数；配engage in leisure activities。"},{"en":"healthy lifestyle","basic":"","zh":"健康的生活方式","pos":"n.","type":"phrase","example":"Adopting a healthy lifestyle is the wisest investment we can make in ourselves.","exampleZh":"养成健康的生活方式是我们能对自己做的最明智的投资。","note":"配adopt/lead a healthy lifestyle。"},{"en":"wholesome","basic":"","zh":"有益健康的；有益身心的","pos":"adj.","type":"word","example":"Wholesome food and moderate exercise keep both body and mind in good condition.","exampleZh":"有益健康的食物和适度锻炼能让身心都处于良好状态。","note":"修饰food/activities；注意拼写勿漏w。"},{"en":"in moderation","basic":"","zh":"适度地；有节制地","pos":"phr.","type":"phrase","example":"Even nutritious food should be eaten in moderation, or it may do harm.","exampleZh":"即使是营养食品也应适量食用，否则可能有害。","note":"作状语，介词in；反义to excess。"},{"en":"excessive drinking","basic":"","zh":"过度饮酒","pos":"n.","type":"phrase","example":"Excessive drinking damages the liver and often triggers accidents on the road.","exampleZh":"过量饮酒损害肝脏，还常常引发道路事故。","note":"用excessive而非much；可并列smoking。"},{"en":"secondhand smoke","basic":"","zh":"二手烟","pos":"n.","type":"phrase","example":"Children exposed to secondhand smoke suffer more respiratory infections than their peers.","exampleZh":"暴露于二手烟中的儿童比同龄人更容易患上呼吸道感染。","note":"不可数；配be exposed to；全文写法统一。"},{"en":"screen addiction","basic":"","zh":"屏幕成瘾","pos":"n.","type":"phrase","example":"Screen addiction keeps teenagers awake at night and drains their eyesight.","exampleZh":"屏幕成瘾让青少年夜里难以入睡，也损害他们的视力。","note":"配develop/overcome screen addiction。"},{"en":"overindulgence","basic":"","zh":"过度放纵；沉迷","pos":"n.","type":"word","example":"Overindulgence in fast food and video games is eroding the health of a whole generation.","exampleZh":"对快餐和电子游戏的过度沉迷正在侵蚀整整一代人的健康。","note":"不可数，后接介词in；作主语显精准。"},{"en":"take a toll on","basic":"","zh":"对……造成损害","pos":"phr.","type":"phrase","example":"Years of staying up late have taken a heavy toll on her health.","exampleZh":"多年熬夜已经严重损害了她的健康。","note":"配take a heavy toll on sth；冠词a不可省。"},{"en":"develop a healthy habit","basic":"","zh":"养成健康习惯","pos":"phr.","type":"phrase","example":"It takes about three weeks to develop a healthy habit such as morning jogging.","exampleZh":"养成晨跑这样的健康习惯大约需要三周时间。","note":"develop意为养成；配a habit of doing。"},{"en":"moderate exercise","basic":"","zh":"适度锻炼","pos":"n.","type":"phrase","example":"Moderate exercise three times a week is enough to keep most adults fit.","exampleZh":"每周三次适度锻炼就足以让大多数成年人保持健康。","note":"泛指时不可数；配take moderate exercise。"},{"en":"boost immunity","basic":"","zh":"增强免疫力","pos":"phr.","type":"phrase","example":"Adequate sleep and a balanced diet help boost immunity against common infections.","exampleZh":"充足睡眠和均衡饮食有助于增强对常见感染的免疫力。","note":"配boost/strengthen；介词用against。"},{"en":"life expectancy","basic":"","zh":"预期寿命","pos":"n.","type":"phrase","example":"Better medical care and healthier habits have raised average life expectancy worldwide.","exampleZh":"更好的医疗条件和更健康的生活习惯提高了全球平均预期寿命。","note":"不可数；配raise life expectancy；图表题常用。"},{"en":"Nothing is more precious than ___.","basic":"","zh":"没有什么比……更宝贵。","pos":"—","type":"pattern","example":"Nothing is more precious than sound health, yet it is often taken for granted.","exampleZh":"没有什么比健康的身体更宝贵，然而人们常把它视为理所当然。","note":"否定词加比较级表最高级；than后接名词。"},{"en":"Only when we ___ can we ___.","basic":"","zh":"只有当我们……，才能……","pos":"—","type":"pattern","example":"Only when we exercise regularly can we keep both body and mind in good shape.","exampleZh":"只有当我们规律锻炼时，才能让身心都保持良好状态。","note":"Only引导状语置句首主句倒装；从句陈述语序。"},{"en":"The more ___, the more likely we are to ___.","basic":"","zh":"越……，我们就越可能……","pos":"—","type":"pattern","example":"The more we stay up late, the more likely we are to suffer from burnout.","exampleZh":"我们越是熬夜，就越有可能身心俱疲。","note":"the more...the more结构，两分句均不倒装。"},{"en":"It is high time that we ___.","basic":"","zh":"该是我们……的时候了。","pos":"—","type":"pattern","example":"It is high time that we broke the habit of skipping breakfast and staying up late.","exampleZh":"我们该改掉不吃早餐和熬夜的习惯了。","note":"that从句用过去式表虚拟；呼吁段首选。"},{"en":"There is no denying that ___ has taken a heavy toll on ___.","basic":"","zh":"不可否认，……已对……造成严重损害。","pos":"—","type":"pattern","example":"There is no denying that a sedentary lifestyle has taken a heavy toll on our health.","exampleZh":"不可否认，久坐不动的生活方式已严重损害了我们的健康。","note":"引出公认事实，适合首段；后接完成时。"},{"en":"A sound mind in a sound body.","basic":"","zh":"健全的精神寓于健康的身体。","pos":"—","type":"proverb","example":"As the old Latin saying goes, a sound mind in a sound body.","exampleZh":"正如那句古老的拉丁格言所说：健全的精神寓于健康的身体。","note":"出自Juvenal《讽刺诗》；身心并重类题目适用。"},{"en":"Health is wealth.","basic":"","zh":"健康即财富。","pos":"—","type":"proverb","example":"Those who ruin their health chasing money forget that health is wealth.","exampleZh":"那些为赚钱而毁掉健康的人忘了：健康就是财富。","note":"经典谚语；爱默生有The first wealth is health。"},{"en":"Prevention is better than cure.","basic":"","zh":"预防胜于治疗。","pos":"—","type":"proverb","example":"Doctors keep reminding us that prevention is better than cure, yet many ignore regular checkups.","exampleZh":"医生不断提醒我们预防胜于治疗，但许多人仍忽视定期体检。","note":"常与Erasmus的Adagia相关；预防类话题。"},{"en":"Early to bed and early to rise makes a man healthy, wealthy and wise.","basic":"","zh":"早睡早起使人健康、富有而明智。","pos":"—","type":"proverb","example":"Franklin's proverb—early to bed and early to rise makes a man healthy, wealthy and wise—still holds true.","exampleZh":"富兰克林的谚语——早睡早起使人健康、富有而明智——至今依然成立。","note":"出自《穷理查年鉴》；主语长，谓语用makes。"}],"file":"07-health.json"},{"id":"career","title":"经济·职业与青年现象","emoji":"💼","group":"大作文·主题语料","desc":"涵盖就业求职、职业规划、创业、毕业选择、乡村振兴、共同富裕与消费观等高频表达。","entries":[{"en":"land a decent job","basic":"","zh":"找到一份像样的工作","pos":"phr.","type":"phrase","example":"After months of painstaking preparation, she finally landed a decent job in a reputable firm.","exampleZh":"经过数月刻苦准备，她终于在一家知名企业找到了一份像样的工作。","note":"land 表“成功获得”，后接 job/offer；多用于尾段举例。"},{"en":"a saturated job market","basic":"","zh":"饱和的就业市场","pos":"phr.","type":"phrase","example":"In a saturated job market, graduates with practical skills are far more likely to be hired.","exampleZh":"在饱和的就业市场中，具备实用技能的毕业生更容易被录用。","note":"第二段析因时用；常作 in a saturated job market。"},{"en":"qualification","basic":"","zh":"资格；学历，资历","pos":"n.","type":"word","example":"Academic qualifications alone can hardly guarantee a rewarding career in today's economy.","exampleZh":"在当今经济环境下，仅有学历很难保证拥有一份有回报的职业。","note":"多用复数 qualifications；后接 for 表胜任某职位。"},{"en":"competence","basic":"","zh":"能力，胜任力","pos":"n.","type":"word","example":"Employers nowadays attach greater weight to professional competence than to paper certificates.","exampleZh":"如今雇主更看重专业能力，而不是一纸证书。","note":"不可数；搭配 professional competence，不加 -s。"},{"en":"competitive edge","basic":"","zh":"竞争优势","pos":"phr.","type":"phrase","example":"Mastering a second foreign language gives job seekers a distinct competitive edge.","exampleZh":"掌握第二外语会让求职者拥有明显的竞争优势。","note":"常搭配 give sb. a competitive edge；第二段论证用。"},{"en":"stand out from the crowd","basic":"","zh":"脱颖而出，出类拔萃","pos":"phr.","type":"phrase","example":"Only those with genuine expertise can stand out from the crowd in a crowded market.","exampleZh":"只有具备真才实学的人才能在拥挤的市场中脱颖而出。","note":"介词固定用 from；尾段号召句谓语，主语常为 graduates。"},{"en":"career planning","basic":"","zh":"职业规划","pos":"phr.","type":"phrase","example":"Sound career planning enables students to convert vague ambitions into concrete steps.","exampleZh":"合理的职业规划能让学生把模糊的抱负转化为具体步骤。","note":"不可数，前可加 sound/proper；中间段论证具体做法时作主语最合适。"},{"en":"long-term goal","basic":"","zh":"长期目标","pos":"phr.","type":"phrase","example":"Setting a long-term goal prevents young people from drifting along with the tide.","exampleZh":"设定长期目标能让年轻人不致随波逐流。","note":"与 short-term goal 对举；搭配 set/pursue。"},{"en":"prospective","basic":"","zh":"潜在的，未来的；可能的","pos":"adj.","type":"word","example":"Prospective employers tend to favor candidates who have relevant internship experience.","exampleZh":"潜在雇主往往青睐有相关实习经历的应聘者。","note":"只作定语，后接 employer；勿与 perspective 混淆。"},{"en":"pursue a career in","basic":"","zh":"从事……职业，在……领域谋求发展","pos":"phr.","type":"phrase","example":"Many graduates choose to pursue a career in education rather than in big cities.","exampleZh":"许多毕业生选择从事教育行业，而不是留在大城市。","note":"介词固定用 in + 领域；勿说 pursue a career of。"},{"en":"make an informed choice","basic":"","zh":"做出明智而有依据的选择","pos":"phr.","type":"phrase","example":"Only after weighing the pros and cons can graduates make an informed choice.","exampleZh":"只有在权衡利弊之后，毕业生才能做出明智的选择。","note":"informed 意为“有依据的”；用于毕业选择类首段。"},{"en":"start a business","basic":"","zh":"创业，开办企业","pos":"phr.","type":"phrase","example":"Encouraged by preferential policies, more graduates start a business in their hometowns.","exampleZh":"在优惠政策鼓励下，越来越多毕业生在家乡创业。","note":"近义 set up one's own business；勿漏冠词 a。"},{"en":"entrepreneur","basic":"","zh":"企业家；创业者","pos":"n.","type":"word","example":"A successful entrepreneur must be both visionary and resilient in the face of setbacks.","exampleZh":"成功的企业家必须既有远见，又能在挫折面前坚韧不拔。","note":"可数，泛指用 an entrepreneur；勿与 enterprise 混。"},{"en":"entrepreneurial spirit","basic":"","zh":"创业精神，企业家精神","pos":"phr.","type":"phrase","example":"Cultivating an entrepreneurial spirit helps students turn innovative ideas into reality.","exampleZh":"培养创业精神有助于学生把创新想法变为现实。","note":"此处 spirit 不可数；形容词是 entrepreneurial，勿写错。"},{"en":"take risks","basic":"","zh":"承担风险，冒险","pos":"phr.","type":"phrase","example":"Those unwilling to take calculated risks seldom reap the rewards of innovation.","exampleZh":"不愿承担可控风险的人，很少能收获创新的回报。","note":"risk 用复数；常用 take calculated risks，较书面。"},{"en":"career choice","basic":"","zh":"职业选择","pos":"phr.","type":"phrase","example":"Career choice should be based on personal strengths rather than on blind conformity.","exampleZh":"职业选择应基于个人优势，而非盲目从众。","note":"2013 年真题核心词；常与 be based on 搭配。"},{"en":"further study","basic":"","zh":"深造，继续学习","pos":"phr.","type":"phrase","example":"For some graduates, further study is a wiser option than immediate employment.","exampleZh":"对一些毕业生而言，继续深造比立即就业更明智。","note":"study 不可数；可换 pursue further education。"},{"en":"ambitious","basic":"","zh":"有抱负的；雄心勃勃的","pos":"adj.","type":"word","example":"Ambitious young people are more willing to embrace challenges beyond their comfort zone.","exampleZh":"有抱负的年轻人更愿意接受舒适区之外的挑战。","note":"为真题中 tame 的反义词；写作多取褒义。"},{"en":"rural revitalization","basic":"","zh":"乡村振兴","pos":"phr.","type":"phrase","example":"Rural revitalization has opened up unprecedented opportunities for college graduates.","exampleZh":"乡村振兴为大学毕业生开创了前所未有的机遇。","note":"官方固定译法，作主语时谓语用单数；中间段举例支撑论点时使用。"},{"en":"grassroots","basic":"","zh":"基层的；基层群众","pos":"adj.","type":"word","example":"Working at the grassroots level allows graduates to understand the real needs of farmers.","exampleZh":"在基层工作能让毕业生了解农民的真实需求。","note":"常用 at the grassroots level；名词形式不加 -s。"},{"en":"poverty alleviation","basic":"","zh":"扶贫，减贫","pos":"phr.","type":"phrase","example":"Poverty alleviation has lifted millions of rural households out of absolute poverty.","exampleZh":"扶贫工作使数百万农村家庭摆脱了绝对贫困。","note":"alleviation 拼写易错；动词搭配 alleviate poverty。"},{"en":"narrow the urban-rural gap","basic":"","zh":"缩小城乡差距","pos":"phr.","type":"phrase","example":"Improving rural infrastructure is an effective way to narrow the urban-rural gap.","exampleZh":"改善农村基础设施是缩小城乡差距的有效途径。","note":"narrow 作动词“缩小”；也可说 bridge the gap。"},{"en":"common prosperity","basic":"","zh":"共同富裕","pos":"phr.","type":"phrase","example":"Common prosperity calls for a more equitable distribution of social wealth.","exampleZh":"共同富裕要求对社会财富进行更公平的分配。","note":"官方术语，不可数；搭配 call for / pursue。"},{"en":"income gap","basic":"","zh":"收入差距","pos":"phr.","type":"phrase","example":"A widening income gap may undermine social stability and public confidence.","exampleZh":"不断扩大的收入差距可能损害社会稳定和公众信心。","note":"常用 a widening income gap；narrow 表缩小。"},{"en":"the underprivileged","basic":"","zh":"弱势群体，贫困阶层","pos":"phr.","type":"phrase","example":"Governments should channel more resources to the underprivileged in remote areas.","exampleZh":"政府应把更多资源投向偏远地区的弱势群体。","note":"the + adj. 表一类人，作主语时谓语可用复数；词尾永远不加 -s。"},{"en":"equitable","basic":"","zh":"公平合理的，公正的","pos":"adj.","type":"word","example":"An equitable education system gives every child a fair chance to succeed.","exampleZh":"公平的教育制度让每个孩子都有平等的成功机会。","note":"比 fair 更书面，多修饰 distribution；勿混 equality。"},{"en":"consumerism","basic":"","zh":"消费主义，消费至上","pos":"n.","type":"word","example":"Unbridled consumerism has driven many young people into heavy debt.","exampleZh":"毫无节制的消费主义使许多年轻人负债累累。","note":"不可数且多含贬义；常与 curb / resist 连用。"},{"en":"extravagant","basic":"","zh":"奢侈的，铺张的","pos":"adj.","type":"word","example":"Extravagant spending on luxury goods contradicts the virtue of thrift.","exampleZh":"在奢侈品上的铺张消费与节俭的美德相悖。","note":"常修饰 spending / lifestyle；可与 wasteful 互换。"},{"en":"spend within one's means","basic":"","zh":"量入为出","pos":"phr.","type":"phrase","example":"Prudent consumers always spend within their means instead of chasing trendy brands.","exampleZh":"理性的消费者总是量入为出，而不是追逐时髦品牌。","note":"固定搭配；反义为 live beyond one's means。"},{"en":"impulse buying","basic":"","zh":"冲动消费","pos":"phr.","type":"phrase","example":"Impulse buying is often triggered by aggressive online advertising and discount campaigns.","exampleZh":"冲动消费往往由猛烈的网络广告和打折活动引发。","note":"不可数；动词形式为 buy on impulse，第二段分析成因时使用。"},{"en":"rational consumption","basic":"","zh":"理性消费","pos":"phr.","type":"phrase","example":"Advocating rational consumption helps young people resist the lure of material temptations.","exampleZh":"倡导理性消费有助于年轻人抵制物质诱惑。","note":"常与 advocate / promote 连用；与量入为出并列。"},{"en":"rat race","basic":"","zh":"无休止的激烈竞争，内卷式生活","pos":"phr.","type":"phrase","example":"Trapped in the rat race, many young professionals sacrifice health for promotion.","exampleZh":"困于无休止的竞争中，许多年轻职场人为晋升牺牲健康。","note":"含贬义，前面加 the；常作 in the rat race。"},{"en":"cut-throat competition","basic":"","zh":"残酷的竞争","pos":"phr.","type":"phrase","example":"Facing cut-throat competition, graduates must sharpen their skills to survive.","exampleZh":"面对残酷竞争，毕业生必须磨炼技能以求立足。","note":"cut-throat 是连字符形容词，不加 -s；比 fierce 更生动。"},{"en":"lie flat","basic":"","zh":"躺平，选择不再拼命奋斗","pos":"phr.","type":"phrase","example":"Some young people choose to lie flat rather than engage in pointless competition.","exampleZh":"一些年轻人选择躺平，而不愿卷入无意义的竞争。","note":"源自中文网络热词，正式写作中宜加引号；过去式是 lay flat，易写错。"},{"en":"peer pressure","basic":"","zh":"同辈压力","pos":"phr.","type":"phrase","example":"Peer pressure often pushes students to pursue goals that they do not truly value.","exampleZh":"同辈压力常迫使学生追求他们并不真正看重的目标。","note":"不可数；常搭配 under / yield to peer pressure。"},{"en":"anxious","basic":"","zh":"焦虑的，担忧的","pos":"adj.","type":"word","example":"Many graduates feel anxious about an uncertain future and fierce workplace rivalry.","exampleZh":"许多毕业生对不确定的未来和激烈的职场竞争感到焦虑。","note":"搭配 be anxious about sth.，不用 on。"},{"en":"follow the herd","basic":"","zh":"随大流，从众","pos":"phr.","type":"phrase","example":"Rather than follow the herd, students should weigh their own interests carefully.","exampleZh":"学生不应随大流，而应仔细权衡自己的兴趣。","note":"herd 前加 the 且不加 -s；近义 follow the crowd。"},{"en":"equal opportunity","basic":"","zh":"平等机会","pos":"phr.","type":"phrase","example":"Every applicant deserves an equal opportunity regardless of gender or family background.","exampleZh":"无论性别或家庭背景，每位求职者都应得到平等机会。","note":"不可数，前用 an；谈就业公平议题时必用。"},{"en":"gender discrimination","basic":"","zh":"性别歧视","pos":"phr.","type":"phrase","example":"Gender discrimination in recruitment deprives qualified women of fair competition.","exampleZh":"招聘中的性别歧视使合格女性失去公平竞争的机会。","note":"不可数，后接 against sb.；常与 combat 连用。"},{"en":"business integrity","basic":"","zh":"商业诚信","pos":"phr.","type":"phrase","example":"Business integrity is the cornerstone of a company's long-term reputation.","exampleZh":"商业诚信是企业长期声誉的基石。","note":"不可数；可替换 honesty in business，论证企业责任。"},{"en":"credibility","basic":"","zh":"信誉，可信度","pos":"n.","type":"word","example":"Once a firm loses its credibility, regaining customers' trust becomes extremely difficult.","exampleZh":"企业一旦失去信誉，重获顾客信任就变得极其困难。","note":"不可数；搭配 lose / enhance one's credibility。"},{"en":"seize the opportunity","basic":"","zh":"抓住机会","pos":"phr.","type":"phrase","example":"Young people should seize every opportunity to broaden their horizons abroad.","exampleZh":"年轻人应抓住每一个机会到国外开阔眼界。","note":"seize 比 take 更有力；后接 to do sth.。"},{"en":"achieve upward mobility","basic":"","zh":"实现向上流动，实现阶层跃升","pos":"phr.","type":"phrase","example":"Higher education remains a vital channel for rural students to achieve upward mobility.","exampleZh":"高等教育仍是农村学生实现向上流动的重要渠道。","note":"upward mobility 为社会学固定表述；前用 achieve。"},{"en":"It is advisable that college graduates should ___ before making a final decision.","basic":"","zh":"建议大学毕业生在做出最终决定前___。","pos":"—","type":"pattern","example":"It is advisable that college graduates should weigh their strengths before making a final decision.","exampleZh":"建议大学毕业生在做出最终决定前先衡量自身优势。","note":"尾段提建议用；that 从句中用 should + 动词原形。"},{"en":"Instead of ___ing aimlessly, young people ought to ___.","basic":"","zh":"年轻人不应漫无目的地___，而应当___。","pos":"—","type":"pattern","example":"Instead of drifting aimlessly, young people ought to set a clear goal for themselves.","exampleZh":"年轻人不应漫无目的地漂浮，而应为自己设定明确目标。","note":"对比句式，用于第二段批判现象后提出正确做法；ought to 后接动词原形。"},{"en":"Faced with the choice between ___ and ___, a growing number of graduates ___.","basic":"","zh":"面对___与___之间的抉择，越来越多的毕业生___。","pos":"—","type":"pattern","example":"Faced with the choice between further study and employment, a growing number of graduates hesitate.","exampleZh":"面对深造与就业之间的抉择，越来越多的毕业生犹豫不决。","note":"毕业选择类首选句式；a growing number of 后接复数。"},{"en":"Only by ___ can fresh graduates stand out in a fiercely competitive job market.","basic":"","zh":"只有通过___，应届毕业生才能在激烈的就业市场中脱颖而出。","pos":"—","type":"pattern","example":"Only by sharpening practical skills can fresh graduates stand out in a fiercely competitive job market.","exampleZh":"只有磨炼实用技能，应届毕业生才能在激烈的就业市场中脱颖而出。","note":"Only by 置于句首引起部分倒装，助动词 can 必须提到主语之前。"},{"en":"What matters most in career planning is not ___, but ___.","basic":"","zh":"职业规划中最重要的不是___，而是___。","pos":"—","type":"pattern","example":"What matters most in career planning is not a high salary, but lasting personal growth.","exampleZh":"职业规划中最重要的不是高薪，而是长久的个人成长。","note":"主语从句作主语，谓语用单数 is；构成 not...but... 对比。"},{"en":"It is ___ that enables young people to ___.","basic":"","zh":"正是___使年轻人能够___。","pos":"—","type":"pattern","example":"It is unremitting effort that enables young people to turn dreams into reality.","exampleZh":"正是坚持不懈的努力使年轻人能够把梦想变为现实。","note":"强调句式，去掉 It is...that 后句子仍完整；强调人时也可用 who。"},{"en":"There is no denying that ___ plays an indispensable role in ___.","basic":"","zh":"不可否认，___在___中起着不可或缺的作用。","pos":"—","type":"pattern","example":"There is no denying that entrepreneurial spirit plays an indispensable role in economic vitality.","exampleZh":"不可否认，创业精神在经济活力中起着不可或缺的作用。","note":"第二段点明主题；role 前用 an，不可省略。"},{"en":"The more ___, the more likely young people are to ___.","basic":"","zh":"越___，年轻人就越可能___。","pos":"—","type":"pattern","example":"The more practical experience they accumulate, the more likely young people are to seize rare opportunities.","exampleZh":"他们积累的实践经验越多，年轻人就越可能抓住难得的机会。","note":"比较级平行结构，前后须对称；注意后句系动词 are 的位置不能提前。"},{"en":"It is high time that we ___ instead of ___.","basic":"","zh":"我们早该___，而不是___。","pos":"—","type":"pattern","example":"It is high time that we reflected on what true success means instead of following the crowd.","exampleZh":"我们早该思考真正的成功意味着什么，而不是随大流。","note":"从句用过去式或 should + 动词原形，尾段呼吁。"},{"en":"Where there is a will, there is a way.","basic":"","zh":"有志者事竟成。","pos":"—","type":"proverb","example":"Where there is a will, there is a way, and perseverance finally pays off in the job hunt.","exampleZh":"有志者事竟成，坚持不懈终会在求职中获得回报。","note":"谚语，可独立成句或作尾段首句；后接 and 分句时句首字母大写。"},{"en":"Fortune favors the prepared mind.","basic":"","zh":"机遇眷顾有准备的头脑。","pos":"—","type":"proverb","example":"Fortune favors the prepared mind, so graduates should hone their skills well in advance.","exampleZh":"机遇眷顾有准备的头脑，因此毕业生应提前磨炼技能。","note":"巴斯德名言；论证“准备与机遇”时用，英式拼写也可写作 favours。"},{"en":"Strike while the iron is hot.","basic":"","zh":"趁热打铁。","pos":"—","type":"proverb","example":"Strike while the iron is hot, and never let a golden opportunity slip away.","exampleZh":"要趁热打铁，绝不要让良机悄然溜走。","note":"祈使句；尾段号召抓住机遇时可用。"}],"file":"08-career.json"},{"id":"family","title":"家庭伦理与情感","emoji":"🏠","group":"大作文·主题语料","desc":"孝道陪伴、代际沟通、家风与过度保护的高分表达，适用于亲情类作文论证与呼吁段。","entries":[{"en":"filial piety","basic":"","zh":"孝道，孝顺","pos":"n.","type":"word","example":"Filial piety has been a cornerstone of Chinese ethics for thousands of years.","exampleZh":"孝道数千年来一直是中国伦理的基石。","note":"不可数；比 love one's parents 正式得多，常与 uphold, practise 搭配。"},{"en":"show filial respect to","basic":"","zh":"对……尽孝，尊敬","pos":"phr.","type":"phrase","example":"Young people away from home should still show filial respect to their elders.","exampleZh":"离家的年轻人仍应对长辈尽孝。","note":"介词 to 不可省略；respect 此处不可数，适合表达态度类句子。"},{"en":"take care of one's aging parents","basic":"","zh":"照顾年迈的父母","pos":"phr.","type":"phrase","example":"Grown children should take care of their aging parents rather than hire caregivers.","exampleZh":"成年子女应当照顾年迈的父母，而不是雇人代劳。","note":"aging 亦可写作 ageing；常与 shoulder the duty 连用加重语气。"},{"en":"accompany","basic":"","zh":"陪伴，陪同","pos":"vt.","type":"word","example":"Nothing can replace the comfort of accompanying one's parents on ordinary days.","exampleZh":"没有什么能替代在平常日子里陪伴父母的温暖。","note":"accompany sb 后不接 with；名词 company 表陪伴，如 keep sb company，适合陪伴类论证。"},{"en":"spend quality time with","basic":"","zh":"与……共度高质量时光","pos":"phr.","type":"phrase","example":"Busy professionals should spend quality time with their families at weekends.","exampleZh":"忙碌的职场人士应在周末与家人共度高质量的时光。","note":"quality 前不加冠词；宾语为人，不能写成 spend quality time on sb。"},{"en":"be estranged from","basic":"","zh":"与……疏远","pos":"phr.","type":"phrase","example":"He has been estranged from his father for nearly a decade.","exampleZh":"他与父亲疏远已近十年。","note":"用 be estranged from sb；强调情感疏离，而非物理距离。"},{"en":"neglect one's parents","basic":"","zh":"忽视、怠慢父母","pos":"phr.","type":"phrase","example":"Those who neglect their parents will regret it sooner or later.","exampleZh":"忽视父母的人迟早会后悔。","note":"及物动词直接接宾语；名词 negligence 指疏忽，多用于法律语境。"},{"en":"the empty-nest elderly","basic":"","zh":"空巢老人","pos":"n.","type":"word","example":"The empty-nest elderly often suffer from loneliness and a sense of uselessness.","exampleZh":"空巢老人常受孤独和无力感困扰。","note":"定冠词 the 不可省；作主语时谓语动词用复数形式。"},{"en":"family ties","basic":"","zh":"亲情纽带，家庭关系","pos":"n.","type":"word","example":"Family ties remain strong even when members live in different cities.","exampleZh":"即使家人分居不同城市，亲情纽带依然紧密。","note":"惯用复数；常与 strengthen, maintain 搭配，多用于亲情纽带论证。"},{"en":"kinship","basic":"","zh":"亲属关系，亲情","pos":"n.","type":"word","example":"Kinship is measured not by blood alone but by daily care.","exampleZh":"亲情不只以血缘衡量，更以日常关爱衡量。","note":"不可数；比 relationship 更文雅，适合开头点明主题。"},{"en":"unconditional love","basic":"","zh":"无条件的爱","pos":"n.","type":"word","example":"Parental love is usually unconditional and asks nothing in return.","exampleZh":"父母之爱通常是无条件的，不求回报。","note":"不可数；常与 give, offer 搭配；修饰 parental love 属高分表达。"},{"en":"bond","basic":"","zh":"纽带，情感联系","pos":"n.","type":"word","example":"The bond between mother and child is one of the strongest in life.","exampleZh":"母子之间的纽带是人生中最牢固的纽带之一。","note":"可数；常与 strengthen, deepen, break 搭配，后接 between，用于情感类论证。"},{"en":"cherish","basic":"","zh":"珍惜，珍爱","pos":"vt.","type":"word","example":"We should cherish every moment we are able to spend with our loved ones.","exampleZh":"我们应珍惜与所爱之人共度的每一刻。","note":"及物；比 value 更富情感色彩，常用于结尾呼吁句。"},{"en":"hold dear","basic":"","zh":"珍视，看重","pos":"phr.","type":"phrase","example":"The values my parents taught me are the ones I hold dear.","exampleZh":"父母教给我的价值观是我最珍视的。","note":"宾语常为 values, memories, traditions；多用主动语态。"},{"en":"generation gap","basic":"","zh":"代沟","pos":"n.","type":"word","example":"The generation gap often gives rise to quarrels over marriage and career.","exampleZh":"代沟常常在婚姻和职业问题上引发争吵。","note":"常用 the generation gap；常与 bridge, narrow 搭配，作引言段点题词。"},{"en":"bridge the gap","basic":"","zh":"弥合隔阂，消除分歧","pos":"phr.","type":"phrase","example":"Honest conversation can bridge the gap between parents and their children.","exampleZh":"坦诚的交流能弥合父母与子女之间的隔阂。","note":"后接 between A and B；也可用 narrow the gap 保持词汇变化。"},{"en":"mutual understanding","basic":"","zh":"相互理解","pos":"n.","type":"word","example":"Mutual understanding begins with patient listening rather than hasty judgment.","exampleZh":"相互理解始于耐心倾听，而非匆忙评判。","note":"不可数；常与 promote, foster 搭配，适用于代际沟通主题。"},{"en":"put oneself in others' shoes","basic":"","zh":"设身处地为他人着想","pos":"phr.","type":"phrase","example":"Only by putting ourselves in our parents' shoes can we grasp their worries.","exampleZh":"只有设身处地为父母着想，我们才能理解他们的担忧。","note":"变体为 put oneself in sb's position；常与 Only by 倒装连用，用于建议句。"},{"en":"family tradition","basic":"","zh":"家庭传统，家风","pos":"n.","type":"word","example":"Reading together before bedtime has become a family tradition in our home.","exampleZh":"睡前一起读书已成为我们家的家庭传统。","note":"可数；常与 establish, pass on 搭配，与 family values 并列作论据。"},{"en":"family values","basic":"","zh":"家庭价值观，家风","pos":"n.","type":"word","example":"Strong family values are widely regarded as the bedrock of a healthy society.","exampleZh":"牢固的家庭价值观被普遍视为健康社会的基石。","note":"惯用复数，谓语用 are；常与 instil, uphold, pass on 搭配。"},{"en":"upbringing","basic":"","zh":"教养，抚育","pos":"n.","type":"word","example":"A loving and disciplined upbringing shapes a child's character for life.","exampleZh":"充满关爱又讲究规矩的教养会塑造孩子一生的性格。","note":"常用单数；搭配 a strict, a sheltered upbringing，用于谈家教的影响。"},{"en":"set an example","basic":"","zh":"树立榜样","pos":"phr.","type":"phrase","example":"Parents should set an example for their children through their own conduct.","exampleZh":"父母应以身作则，用自己的行为为孩子树立榜样。","note":"介词用 for 或 to；也可说 lead by example 替换，避免重复。"},{"en":"be a role model","basic":"","zh":"成为榜样","pos":"phr.","type":"phrase","example":"A father who reads every day is a role model for his son.","exampleZh":"每天读书的父亲是儿子的榜样。","note":"后接 for 或 to；role model 可数，前面必须加 a。"},{"en":"nurture","basic":"","zh":"养育，培育","pos":"vt.","type":"word","example":"Parents nurture their children with patience, warmth and quiet encouragement.","exampleZh":"父母以耐心、温暖和无声的鼓励养育孩子。","note":"比 raise 正式；也可搭配 nurture talent 或 nurture a habit，用于论证。"},{"en":"overprotection","basic":"","zh":"过度保护","pos":"n.","type":"word","example":"Overprotection deprives children of the chance to solve problems themselves.","exampleZh":"过度保护剥夺了孩子自己解决问题的机会。","note":"不可数；动词为 overprotect；可替换 excessive care 保持变化。"},{"en":"overindulge","basic":"","zh":"过度溺爱，过分纵容","pos":"vt.","type":"word","example":"Parents who overindulge their children may raise adults who cannot cope.","exampleZh":"过度溺爱孩子的父母可能养出无法应对生活的成年人。","note":"及物动词；形容词 overindulgent 作定语修饰父母。"},{"en":"spoil","basic":"","zh":"溺爱，宠坏","pos":"vt.","type":"word","example":"Grandparents tend to spoil their grandchildren with toys and snacks.","exampleZh":"祖父母往往用玩具和零食溺爱孙辈。","note":"过去式与过去分词为 spoiled，英式亦作 spoilt。"},{"en":"doting parents","basic":"","zh":"宠爱孩子的父母","pos":"n.","type":"word","example":"Doting parents often do everything for their children out of pure love.","exampleZh":"宠爱孩子的父母常出于纯粹的爱替孩子包办一切。","note":"doting 只作定语，略带贬义；同结构可用 doting grandparents。"},{"en":"greenhouse flower","basic":"","zh":"温室里的花朵","pos":"n.","type":"word","example":"Children raised as greenhouse flowers may collapse at the first setback.","exampleZh":"被当作温室花朵养大的孩子可能一遇挫折就崩溃。","note":"多含批评意味；常与 independence, setbacks 对照使用。"},{"en":"shelter from","basic":"","zh":"保护……免受","pos":"phr.","type":"phrase","example":"Parents cannot shelter their children from every hardship in life.","exampleZh":"父母无法保护孩子免受生活中的一切艰辛。","note":"结构为 shelter sb from sth；也可用 protect sb from 替换，含反思意味。"},{"en":"independence","basic":"","zh":"独立性","pos":"n.","type":"word","example":"Cultivating independence matters far more than offering endless protection.","exampleZh":"培养独立性远比给予无休止的保护更重要。","note":"不可数；动词为 depend on；常与 foster, cultivate 搭配。"},{"en":"self-reliance","basic":"","zh":"自立，自我依靠","pos":"n.","type":"word","example":"Self-reliance is a lesson best learned in early childhood.","exampleZh":"自立是最好在童年早期学会的一课。","note":"不可数；比 independence 更强调靠自己，形容词为 self-reliant。"},{"en":"juggle work and family","basic":"","zh":"兼顾工作与家庭","pos":"phr.","type":"phrase","example":"Working mothers have to juggle work and family day after day.","exampleZh":"职场母亲不得不日复一日地兼顾工作与家庭。","note":"及物动词 juggle 后直接接两个宾语，也可接 a tight schedule。"},{"en":"strike a balance","basic":"","zh":"取得平衡","pos":"phr.","type":"phrase","example":"It is difficult but essential to strike a balance between career and family.","exampleZh":"在事业与家庭之间取得平衡很难，却十分必要。","note":"介词用 between；冠词 a 不可省，也可说 strike the right balance。"},{"en":"sacrifice","basic":"","zh":"牺牲，舍弃","pos":"vt.","type":"word","example":"Many parents sacrifice their own comfort for the sake of their children.","exampleZh":"许多父母为了孩子牺牲自己的舒适生活。","note":"结构 sacrifice sth for sth；名词搭配为 make sacrifices，用于感恩类段落。"},{"en":"communicate with","basic":"","zh":"与……交流沟通","pos":"phr.","type":"phrase","example":"Parents should communicate with their children as friends rather than superiors.","exampleZh":"父母应像朋友一样与孩子交流，而不是以长辈自居。","note":"不及物动词加 with；名词搭配为 open, two-way communication。"},{"en":"misunderstand","basic":"","zh":"误解","pos":"vt.","type":"word","example":"Teenagers often feel misunderstood by the very people who love them most.","exampleZh":"青少年常常觉得自己被最爱自己的人误解。","note":"过去分词 misunderstood 常作表语；名词 misunderstanding 可数。"},{"en":"However busy we are, we should never ___.","basic":"","zh":"无论多忙，我们都不该___。","pos":"—","type":"pattern","example":"However busy we are, we should never neglect the people who love us.","exampleZh":"无论多忙，我们都不该忽视那些爱我们的人。","note":"However 后紧跟形容词，从句不倒装；可换成 No matter how busy we are。"},{"en":"It is never too late to ___.","basic":"","zh":"做___永远都不算晚。","pos":"—","type":"pattern","example":"It is never too late to express our gratitude to our aging parents.","exampleZh":"向年迈的父母表达感激，永远都不算晚。","note":"结尾呼吁句常用；to 后接动词原形，泛指时主语可用 we 或 us。"},{"en":"What our parents need is not ___ but ___.","basic":"","zh":"父母需要的不是___，而是___。","pos":"—","type":"pattern","example":"What our parents need is not money but our company and patience.","exampleZh":"父母需要的不是金钱，而是我们的陪伴与耐心。","note":"主语从句作主语谓语用单数 is；两个空缺处词性须一致。"},{"en":"Only when we ___ can we truly understand our parents.","basic":"","zh":"只有当我们___，才能真正理解父母。","pos":"—","type":"pattern","example":"Only when we become parents ourselves can we truly understand our parents.","exampleZh":"只有当我们自己为人父母时，才能真正理解父母。","note":"Only when 置于句首时主句须部分倒装，用 can, do, will 等。"},{"en":"Charity begins at home.","basic":"","zh":"仁爱始于家庭。","pos":"—","type":"proverb","example":"Charity begins at home, so kindness should start with our own family.","exampleZh":"仁爱始于家庭，所以善意应从自己的家人开始。","note":"英语谚语，源自约翰·威克里夫；适用于家庭责任与孝道类主题。"},{"en":"Blood is thicker than water.","basic":"","zh":"血浓于水。","pos":"—","type":"proverb","example":"Blood is thicker than water, so family ties deserve our first loyalty.","exampleZh":"血浓于水，所以亲情值得我们首先忠诚以待。","note":"英语谚语；适用于亲情、家庭纽带类，可作段落中心句。"},{"en":"We never know the love of a parent till we become parents ourselves.","basic":"","zh":"直到自己为人父母，我们才懂得父母之爱。","pos":"—","type":"proverb","example":"We never know the love of a parent till we become parents ourselves.","exampleZh":"直到自己为人父母，我们才懂得父母之爱。","note":"出处：比彻（Henry Ward Beecher）；适用于代际理解与感恩类结尾。"},{"en":"The family is the first essential cell of human society.","basic":"","zh":"家庭是人类社会第一个基本细胞。","pos":"—","type":"proverb","example":"The family is the first essential cell of human society.","exampleZh":"家庭是人类社会第一个基本细胞。","note":"出处：教皇约翰二十三世；适用于家庭价值与社会和谐类主题段。"}],"file":"09-family.json"},{"id":"describe","title":"图画作文描述与首段","emoji":"🖼️","group":"大作文·通用工具箱","desc":"通用首段工具箱：引出图画、细节描写、对比反差、图表数据与点题句，句式可直接套用。","entries":[{"en":"As is vividly depicted in the picture, ___.","basic":"","zh":"正如图画中生动描绘的那样，___。","pos":"—","type":"pattern","example":"As is vividly depicted in the picture, a young man is standing at a crossroads of life.","exampleZh":"正如图中生动描绘的那样，一个年轻人正站在人生的十字路口。","note":"首段第一句万能开头；逗号后接完整句子，as is 不可写成 as it is。"},{"en":"The cartoon vividly portrays ___.","basic":"","zh":"这幅漫画生动地刻画了___。","pos":"—","type":"pattern","example":"The cartoon vividly portrays a father who is too busy with his phone to talk to his son.","exampleZh":"这幅漫画生动地刻画了一位忙于看手机而无暇与儿子交谈的父亲。","note":"首段点明画面主体；portrays 后接名词或名词短语，不能用 that 从句。"},{"en":"As is shown in the drawing, ___.","basic":"","zh":"如图所示，___。","pos":"—","type":"pattern","example":"As is shown in the drawing, two tourists are admiring the scenery on a crowded beach.","exampleZh":"如图所示，两名游客正在拥挤的海滩上欣赏风景。","note":"首段开头句，与 As is vividly depicted 同义；可用被动。"},{"en":"The drawing is simple yet thought-provoking.","basic":"","zh":"这幅画简单却发人深省。","pos":"—","type":"pattern","example":"The drawing is simple yet thought-provoking, reminding us of the value of honest labor.","exampleZh":"这幅画简单却发人深省，让我们想到诚实劳动的价值。","note":"首段第二句承上启下；thought-provoking 不可省略连字符。"},{"en":"What the picture conveys is far-reaching.","basic":"","zh":"这幅画所传达的意涵十分深远。","pos":"—","type":"pattern","example":"What the picture conveys is far-reaching and deserves our careful reflection.","exampleZh":"这幅画所传达的意涵十分深远，值得我们认真思考。","note":"首段末句引出下文；主语从句作主语，谓语用单数 is，勿写成 are。"},{"en":"The implied meaning behind the picture is that ___.","basic":"","zh":"这幅画隐含的意思是，___。","pos":"—","type":"pattern","example":"The implied meaning behind the picture is that perseverance outweighs momentary talent.","exampleZh":"这幅画隐含的意思是，坚持比一时的天赋更重要。","note":"置于首段收尾；that 后接完整句子，从句谓语用第三人称单数。"},{"en":"As the caption reads, \"___\".","basic":"","zh":"正如标题所言：“___”。","pos":"—","type":"pattern","example":"As the caption reads, \"Opportunities always favor those who are fully prepared.\"","exampleZh":"正如标题所言：“机会总是垂青于有充分准备的人。”","note":"首段引用图中文字；caption 可换成 subtitle，引号内首字母大写。"},{"en":"The caption aptly summarizes the message of the picture.","basic":"","zh":"标题恰当地概括了画面的寓意。","pos":"—","type":"pattern","example":"The caption aptly summarizes the message of the picture and arouses our deep reflection.","exampleZh":"标题恰当地概括了画面的寓意，引发我们深思。","note":"首段描述画面之后用；aptly 意为“恰当地”。"},{"en":"Simple as the picture is, the symbolic meaning it carries is profound.","basic":"","zh":"尽管画面简单，但它承载的象征意义却十分深刻。","pos":"—","type":"pattern","example":"Simple as the picture is, the symbolic meaning it carries is indeed profound.","exampleZh":"不论画面多么简单，它承载的象征意义都确实深刻。","note":"as 引导让步状语从句需部分倒装（表语提前）；首段承转句，引出深层寓意。"},{"en":"What strikes me most in the cartoon is that ___.","basic":"","zh":"这幅漫画中最触动我的是，___。","pos":"—","type":"pattern","example":"What strikes me most in the cartoon is that nobody bothers to help the fallen elderly man.","exampleZh":"这幅漫画中最触动我的是，没有人愿意去扶起摔倒的老人。","note":"首段细节聚焦句；strikes 用第三人称单数，后可接 that 从句作表语。"},{"en":"The picture presents a striking contrast between ___ and ___.","basic":"","zh":"这幅画呈现出___与___之间的鲜明对比。","pos":"—","type":"pattern","example":"The picture presents a striking contrast between a hard-working student and an idle loafer.","exampleZh":"这幅画呈现出勤奋学生与游手好闲者之间的鲜明对比。","note":"对比型图画首段核心句；between 后接并列两项。"},{"en":"The former ___, whereas the latter ___.","basic":"","zh":"前者___，而后者___。","pos":"—","type":"pattern","example":"The former devotes himself to study, whereas the latter wastes his youth on games.","exampleZh":"前者专心学习，而后者把青春浪费在游戏上。","note":"对比论证用，前段分句结构须对称；whereas 前用逗号，不可与 but 连用。"},{"en":"Those who ___ are in sharp contrast to those who ___.","basic":"","zh":"那些___的人与那些___的人形成鲜明反差。","pos":"—","type":"pattern","example":"Those who strive for excellence are in sharp contrast to those who merely follow the herd.","exampleZh":"追求卓越的人与仅仅随大流的人形成鲜明反差。","note":"第二段对比论证句；those who 后接复数谓语。"},{"en":"As can be seen from the chart, ___.","basic":"","zh":"从图表中可以看出，___。","pos":"—","type":"pattern","example":"As can be seen from the chart, the number of rural entrepreneurs has grown steadily.","exampleZh":"从图表中可以看出，农村创业者的人数稳步增长。","note":"图表作文首段开头句；the number of 后接复数名词，谓语却用单数。"},{"en":"According to the figures given in the chart, ___.","basic":"","zh":"根据图表中给出的数据，___。","pos":"—","type":"pattern","example":"According to the figures given in the chart, urban residents outnumber rural ones.","exampleZh":"根据图表中给出的数据，城市居民的人数超过农村居民。","note":"图表作文首段正式引用数据；figures 用复数。"},{"en":"The proportion of ___ rose from ___ percent to ___ percent.","basic":"","zh":"___的比例从___%上升到___%。","pos":"—","type":"pattern","example":"The proportion of graduates choosing further study rose from forty percent to sixty percent.","exampleZh":"选择继续深造的毕业生比例从四成上升到六成。","note":"中间段数据句；percent 单数不加 s，谓语用单数。"},{"en":"What stands out in the chart is that ___.","basic":"","zh":"图表中最突出的一点是，___。","pos":"—","type":"pattern","example":"What stands out in the chart is that the consumption of fresh graduates keeps climbing.","exampleZh":"图表中最突出的一点是，应届毕业生的消费持续攀升。","note":"首段末句概括核心数据；keeps 用第三人称单数。"},{"en":"There has been a marked increase in ___ over the past decade.","basic":"","zh":"过去十年间，___出现了显著增长。","pos":"—","type":"pattern","example":"There has been a marked increase in online shopping over the past decade.","exampleZh":"过去十年间，网上购物出现了显著增长。","note":"与 over the past decade 连用须用现在完成时。"},{"en":"The figures speak for themselves: ___.","basic":"","zh":"数据本身就说明了一切：___。","pos":"—","type":"pattern","example":"The figures speak for themselves: the gap between urban and rural incomes is narrowing.","exampleZh":"数据本身就说明了一切：城乡收入差距正在缩小。","note":"图表数据描述后的评论句；冒号后接完整句子，用以点明结论。"},{"en":"It can be seen from the figures that ___.","basic":"","zh":"从这些数据可以看出，___。","pos":"—","type":"pattern","example":"It can be seen from the figures that young people now favor rational consumption.","exampleZh":"从这些数据可以看出，如今年轻人更青睐理性消费。","note":"it 为形式主语，真正主语是 that 从句。"},{"en":"This seemingly trivial scene mirrors a social reality.","basic":"","zh":"这一看似微不足道的场景折射出一个社会现实。","pos":"—","type":"pattern","example":"This seemingly trivial scene mirrors a social reality that troubles many families.","exampleZh":"这一看似微不足道的场景折射出一个困扰许多家庭的社会现实。","note":"首段末尾点题句，引出第二段分析；mirrors 用第三人称单数。"},{"en":"Such a phenomenon is by no means uncommon in contemporary society.","basic":"","zh":"这种现象在当今社会绝非罕见。","pos":"—","type":"pattern","example":"Such a phenomenon is by no means uncommon in contemporary society.","exampleZh":"这种现象在当今社会绝非罕见。","note":"双重否定表强调；by no means 置于 be 之后。"},{"en":"The author intends to remind us that ___.","basic":"","zh":"作者意在提醒我们，___。","pos":"—","type":"pattern","example":"The author intends to remind us that genuine happiness cannot be bought with money.","exampleZh":"作者意在提醒我们，真正的幸福无法用金钱买到。","note":"首段末或第二段首点明寓意；remind sb. that... 后接完整从句。"},{"en":"It is evident that the cartoonist is calling on us to ___.","basic":"","zh":"显然，漫画家在呼吁我们___。","pos":"—","type":"pattern","example":"It is evident that the cartoonist is calling on us to cherish traditional virtues.","exampleZh":"显然，漫画家在呼吁我们珍惜传统美德。","note":"首段点题或尾段呼吁句；call on sb. to do sth.。"},{"en":"Behind this vivid scene lies a disturbing truth: ___.","basic":"","zh":"在这生动场景的背后，隐藏着一个令人不安的事实：___。","pos":"—","type":"pattern","example":"Behind this vivid scene lies a disturbing truth: indifference is spreading among us.","exampleZh":"在这生动场景的背后，隐藏着一个令人不安的事实：冷漠正在我们中间蔓延。","note":"完全倒装句，地点状语提前，谓语 lies 与真正主语 truth 保持一致。"},{"en":"The cartoonist subtly criticizes ___ and appeals for ___.","basic":"","zh":"漫画家含蓄地批判了___，并呼吁___。","pos":"—","type":"pattern","example":"The cartoonist subtly criticizes blind conformity and appeals for independent thinking.","exampleZh":"漫画家含蓄地批判了盲目从众，并呼吁独立思考。","note":"批判型图画首段点题句；appeal for 后接名词，不接句子。"},{"en":"in the foreground","basic":"","zh":"在前景中，在画面显著位置","pos":"phr.","type":"phrase","example":"In the foreground stands a middle-aged man who is frantically typing on his laptop.","exampleZh":"画面前景中站着一位正疯狂敲击笔记本电脑的中年男子。","note":"首段画面描写用；可置于句首引起完全倒装。"},{"en":"in the background","basic":"","zh":"在背景中","pos":"phr.","type":"phrase","example":"In the background, several children are playing happily on the green lawn.","exampleZh":"在画面背景中，几个孩子正在绿草坪上快乐地玩耍。","note":"首段由近及远描写；与 in the foreground 配对使用。"},{"en":"be absorbed in","basic":"","zh":"全神贯注于，专心于","pos":"phr.","type":"phrase","example":"The young man is completely absorbed in his smartphone, ignoring his parents nearby.","exampleZh":"那个年轻人完全沉浸在手机里，无视身旁的父母。","note":"首段描写人物状态；介词固定用 in，后接名词或动名词，不用 on。"},{"en":"with one's head buried in a smartphone","basic":"","zh":"埋头盯着智能手机","pos":"phr.","type":"phrase","example":"A student sits alone, with his head buried in a smartphone all the afternoon.","exampleZh":"一名学生独自坐着，整个下午都埋头盯着智能手机。","note":"首段细节描写高频结构；with 复合结构中 buried 为过去分词表被动。"},{"en":"be glued to the screen","basic":"","zh":"目不转睛地盯着屏幕","pos":"phr.","type":"phrase","example":"Many teenagers are glued to the screen for hours, neglecting their homework.","exampleZh":"许多青少年目不转睛地盯着屏幕数小时，忽视了作业。","note":"首段描写沉迷网络类画面；介词用 to，比喻用法，比 watch 更形象。"},{"en":"stare blankly at","basic":"","zh":"茫然地盯着","pos":"phr.","type":"phrase","example":"The jobless graduate stares blankly at the ceiling, not knowing what to do next.","exampleZh":"失业的毕业生茫然地盯着天花板，不知下一步该做什么。","note":"首段刻画人物心理；stare 后接 at，第三人称单数加 -es。"},{"en":"be lost in thought","basic":"","zh":"陷入沉思","pos":"phr.","type":"phrase","example":"Seated by the window, the girl is lost in thought about her future career.","exampleZh":"女孩坐在窗边，沉浸在对未来职业的思索中。","note":"首段描写静思型人物；in thought 前不加冠词。"},{"en":"wear a beaming smile","basic":"","zh":"面带灿烂的微笑","pos":"phr.","type":"phrase","example":"The volunteers wear beaming smiles as they help the elderly cross the street.","exampleZh":"志愿者们面带灿烂的微笑，帮助老人过马路。","note":"首段描写正面画面；smile 用复数，与 frown 对照。"},{"en":"with a frown on one's face","basic":"","zh":"眉头紧锁，面带愁容","pos":"phr.","type":"phrase","example":"The anxious mother waits outside the classroom with a frown on her face.","exampleZh":"焦虑的母亲眉头紧锁地在教室外等候。","note":"首段描写负面情绪画面；介词用 on，frown 用单数并加冠词 a。"},{"en":"bustling with activity","basic":"","zh":"熙熙攘攘，充满活力","pos":"phr.","type":"phrase","example":"The market is bustling with activity as vendors hawk their fresh vegetables.","exampleZh":"市场上熙熙攘攘，摊贩们叫卖着新鲜蔬菜。","note":"首段铺陈场景用；常用 be bustling with + 名词。"},{"en":"be crowded with","basic":"","zh":"挤满，充满","pos":"phr.","type":"phrase","example":"The subway carriage is crowded with tired commuters heading home.","exampleZh":"地铁车厢里挤满了疲惫的回家通勤者。","note":"首段描写拥挤场景；介词用 with，不用 by。"},{"en":"a scene of harmony","basic":"","zh":"和谐的景象","pos":"phr.","type":"phrase","example":"The picture unfolds before us a scene of harmony between man and nature.","exampleZh":"这幅画在我们面前展现出一幅人与自然和谐相处的景象。","note":"首段总结画面基调；搭配 between A and B。"},{"en":"be bathed in sunlight","basic":"","zh":"沐浴在阳光中","pos":"phr.","type":"phrase","example":"The campus is bathed in warm sunlight, and students are reading on the lawn.","exampleZh":"校园沐浴在温暖的阳光中，学生们在草坪上读书。","note":"首段营造积极氛围；介词用 in，为下文赞扬或褒扬主题做铺垫。"},{"en":"elbow to elbow","basic":"","zh":"摩肩接踵，十分拥挤","pos":"phr.","type":"phrase","example":"Passengers stand elbow to elbow in the packed bus during the morning rush.","exampleZh":"早高峰时乘客在拥挤的公交车上摩肩接踵。","note":"首段描述拥挤画面；固定结构 elbow to elbow，名词前不加冠词。"},{"en":"witness a steady rise","basic":"","zh":"出现稳步上升","pos":"phr.","type":"phrase","example":"The past decade has witnessed a steady rise in the number of rural entrepreneurs.","exampleZh":"过去十年间，农村创业者的人数稳步上升。","note":"图表作文首段总述趋势；witness 常以时间作主语。"},{"en":"witness a sharp rise","basic":"","zh":"出现急剧上升","pos":"phr.","type":"phrase","example":"The chart shows that online courses witnessed a sharp rise after the outbreak.","exampleZh":"图表显示，疫情暴发后网络课程出现了急剧增长。","note":"图表作文中间段描写突变数据；sharp 强调幅度大，可与 soar 替换。"},{"en":"remain relatively stable","basic":"","zh":"保持相对稳定","pos":"phr.","type":"phrase","example":"The employment rate remained relatively stable throughout the decade under review.","exampleZh":"在所述及的十年间，就业率始终保持相对稳定。","note":"图表作文描述平稳段数据；后接 throughout/during + 时间段。"},{"en":"fluctuate","basic":"","zh":"波动，起伏","pos":"v.","type":"word","example":"The price of agricultural products fluctuated between twenty and thirty yuan.","exampleZh":"农产品价格在二十到三十元之间波动。","note":"图表作文描述波动数据；常用 fluctuate between A and B。"},{"en":"account for","basic":"","zh":"占（比例）；解释","pos":"v.","type":"phrase","example":"Graduates in science and engineering account for nearly half of the total.","exampleZh":"理工科毕业生几乎占到总数的一半。","note":"图表作文描述占比；主语为复数时 account 不加 -s，后接百分数或比例。"},{"en":"peak at","basic":"","zh":"达到峰值，最高达到","pos":"v.","type":"phrase","example":"The figure peaked at sixty percent in 2020 and fell afterwards.","exampleZh":"该数据在2020年达到六成的峰值，此后回落。","note":"图表作文描写最高点专用；peak 作动词，后接 at + 具体数值。"},{"en":"bottom out","basic":"","zh":"降至最低点，触底","pos":"v.","type":"phrase","example":"Sales bottomed out at two million units before recovering the following year.","exampleZh":"销量在触底两百万件后于次年回升。","note":"图表作文描写最低点；与 peak at 相对，过去式 bottomed。"},{"en":"a threefold increase","basic":"","zh":"三倍的增长","pos":"phr.","type":"phrase","example":"The chart reveals a threefold increase in online sales over five years.","exampleZh":"图表显示，五年间网上销售额增长了三倍。","note":"图表作文倍数表述；increase 后接 in + 领域。"},{"en":"in stark contrast to","basic":"","zh":"与……形成鲜明对比","pos":"phr.","type":"phrase","example":"In stark contrast to his classmates, Tom spends every evening reading in the library.","exampleZh":"与同学形成鲜明对比的是，汤姆每晚都在图书馆读书。","note":"首段对比描写，置于句首作状语；介词用 to，也可用 with。"},{"en":"pale in comparison with","basic":"","zh":"与……相比相形见绌","pos":"phr.","type":"phrase","example":"Material comforts pale in comparison with the warmth of a harmonious family.","exampleZh":"与和谐家庭的温暖相比，物质享受相形见绌。","note":"第二段价值判断或尾段升华用；pale 作动词表“失色”，无被动语态。"}],"file":"10-describe.json"},{"id":"argue","title":"论证逻辑与衔接过渡","emoji":"🔗","group":"大作文·通用工具箱","desc":"覆盖大作文从引入观点、分析原因到收束建议的全部逻辑衔接句式与过渡表达。","entries":[{"en":"It is widely acknowledged that ___","basic":"","zh":"人们普遍认为……","pos":"—","type":"pattern","example":"It is widely acknowledged that diligence plays a decisive role in academic success.","exampleZh":"人们普遍认为，勤奋在学业成功中起着决定性作用。","note":"首段引出普遍观点的万能句，acknowledged 可换 recognized，后面必须接完整句子。"},{"en":"There is a growing awareness that ___","basic":"","zh":"人们日益意识到……","pos":"—","type":"pattern","example":"There is a growing awareness that regular exercise contributes to both physical and mental well-being.","exampleZh":"人们日益意识到，规律锻炼有益于身心健康。","note":"用于首段引入社会共识，后接完整从句，可替换 growing 为 increasing。"},{"en":"Recent years have witnessed ___","basic":"","zh":"近年来见证了……","pos":"—","type":"pattern","example":"Recent years have witnessed a sharp rise in the number of students pursuing overseas education.","exampleZh":"近年来，出国留学的学生数量急剧上升。","note":"图表作文首段描述趋势，宾语多为 rise/decline 等变化类名词，时态用现在完成时。"},{"en":"In contemporary society, ___ has become a matter of public concern.","basic":"","zh":"在当今社会，……已成为公众关注的问题。","pos":"—","type":"pattern","example":"In contemporary society, the widening gap between urban and rural education has become a matter of public concern.","exampleZh":"在当今社会，城乡教育差距的扩大已成为公众关注的问题。","note":"图画作文首段点题句，空格处填名词短语，勿填句子，concern 可用 attention 替换。"},{"en":"When it comes to ___, opinions vary from person to person.","basic":"","zh":"谈到……，人们的看
